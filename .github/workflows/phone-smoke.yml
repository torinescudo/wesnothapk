name: Test latest emulator APK
on:
  push:
    branches: [main]
    paths: ['smoke-test.py', '.github/workflows/phone-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: phone-smoke-only
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/github-script@v8
        id: apk
        with:
          script: |
            const {data} = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'emulator-apk', per_page: 10
            });
            const artifact = data.artifacts.find(a => !a.expired);
            if (!artifact) throw new Error('Build an emulator APK first');
            core.setOutput('run_id', artifact.workflow_run.id);
            core.info('Testing APK from ' + artifact.workflow_run.head_sha);
      - uses: actions/download-artifact@v8
        with:
          name: emulator-apk
          path: apk
          run-id: ${{ steps.apk.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8G
          script: python3 smoke-test.py apk/app-x86_64-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone-screenshots-and-logs
          path: smoke-results/

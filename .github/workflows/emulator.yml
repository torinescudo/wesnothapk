name: Android emulator gameplay checks
on:
  push:
    branches: [main]
    paths: ['overlay/**', 'prepare-source.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phone-emulator-check
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    container: wesnoth/wesnoth:android
    timeout-minutes: 180
    env:
      API: '23'
      ARCHS: x86_64
      PREFIXDIR: ${{ github.workspace }}/source/packaging/android/prefix
      DOWNLOADDIR: ${{ github.workspace }}/source/packaging/android/download
      BUILDDIR: ${{ github.workspace }}/source/packaging/android/build-deps
      BUILDDIR_PREFIX: ${{ github.workspace }}/source/packaging/android/build-native
    steps:
      - uses: actions/checkout@v6
      - run: python3 prepare-source.py
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - uses: actions/cache/restore@v5
        id: deps
        with:
          path: source/packaging/android/prefix
          key: phone-x86_64-deps-v1-${{ hashFiles('source/packaging/android/build-android-dependencies/*') }}
      - name: Compile emulator dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        working-directory: source/packaging/android
        run: bash ./gradlew buildCppDepends --console=plain
      - uses: actions/cache/save@v5
        if: steps.deps.outputs.cache-hit != 'true'
        with:
          path: source/packaging/android/prefix
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - uses: actions/cache@v5
        with:
          path: source/packaging/android/build-native
          key: phone-x86_64-native-v1-${{ hashFiles('prepare-source.py', 'overlay/src/**') }}
          restore-keys: phone-x86_64-native-v1-
      - name: Build native game
        working-directory: source/packaging/android
        run: bash ./gradlew buildCppSource -PphoneAbis=x86_64 --console=plain
      - name: Package and assemble
        working-directory: source/packaging/android
        run: |
          python3 package-phone-data.py
          mkdir -p app/src/main/assets
          cp dist/wesnoth-phone-data.zip app/src/main/assets/gamedata.zip
          cp dist/wesnoth-phone-data.zip.sha256 app/src/main/assets/gamedata.zip.sha256
          bash ./gradlew :app:assembleDebug -PphoneAbis=x86_64 --console=plain
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-apk
          compression-level: 0
          retention-days: 7
          path: source/packaging/android/app/build/outputs/apk/debug/app-x86_64-debug.apk
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: emulator-apk
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disk-size: 8G
          script: python3 smoke-test.py apk/app-x86_64-debug.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone-screenshots-and-logs
          path: smoke-results/

# Original Spanish campaigns; names are unrelated to real-world Spain.
[campaign]
    id="CBM_alba"
    rank="1"
    name="La última luz de Valdara"
    abbrev="CBM"
    define="CAMPAIGN_CBM_ALBA"
    first_scenario="CBM_alba_01"
    icon="data/campaigns/Brasa_y_Marea/images/cbm/units/hero-alba.png~SCALE(72,72)"
    description="Alba mantiene el faro de una ciudad que ya no figura en los mapas. Cuando llegan barcos sin tripulación, deberá elegir qué significa salvar su hogar: conservar sus muros o proteger a quienes viven en él.

Breve · 3 escenarios · 1–2 horas
Duración orientativa. Textos originales en español."
    end_text="Fin de «La última luz de Valdara»"
    [difficulty]
        define="CBM_NORMAL"
        label="Viaje"
        description="Dificultad estándar"
        default="yes"
        image="data/campaigns/Brasa_y_Marea/images/cbm/units/hero-alba.png~SCALE(72,72)"
    [/difficulty]
    [about]
        title="Historia, diseño y recursos originales"
        [entry]
            name="Crónicas de la Brasa y la Marea · Wesnoth Phone"
        [/entry]
    [/about]
[/campaign]


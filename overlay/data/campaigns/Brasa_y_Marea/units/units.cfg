[race]
    id="cbm_litario"
    male_name="Litario"
    female_name="Litaria"
    plural_name="Litarios"
    num_traits="2"
    markov_chain_size="2"
    male_names="Sira,Tarek,Onet,Vesh,Kora,Emet,Naru,Tessa"
    female_names="Sira,Tarek,Onet,Vesh,Kora,Emet,Naru,Tessa"
    description="Seres de basalto vivo atravesados por vetas luminosas. Nacen en cámaras donde la montaña conserva recuerdos. Resisten cortes y perforaciones, pero el frío vuelve frágiles sus vetas. Sus tejedores restauran piedra viva y sus resonadores combaten a distancia."
[/race]
[race]
    id="cbm_velario"
    male_name="Velario"
    female_name="Velaria"
    plural_name="Velarios"
    num_traits="2"
    markov_chain_size="2"
    male_names="Esh,Thess,Oth,Veyth,Uru,Neth,Sesher,Yss"
    female_names="Esh,Thess,Oth,Veyth,Uru,Neth,Sesher,Yss"
    description="Pueblo alado de quitina nacarada y cuatro brazos. Almacenan luz en cristales y antiguamente sostenían ciudades en el cielo. Vuelan sobre agua y montañas; sus cuerpos ligeros son vulnerables a lanzas y fuego. Sus cantores curan con luz almacenada."
[/race]

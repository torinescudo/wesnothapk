[scenario]
    id="CBM_nerea_08"
    name="Las compuertas del olvido"
    next_scenario="CBM_nerea_09"
    map_file="nerea_08.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Las tres compuertas distribuían la memoria robada. Abrirlas a la vez devolvería parte de ella, pero también liberaría a los centinelas que la máquina alimentaba. Están talladas en la roca y se abren con palancas de hueso. La primera guarda los nombres de los vivos, la segunda los de los muertos recientes y la tercera los que nadie reclamó. Los centinelas no atacan por orden: atacan porque la máquina los alimenta con lo que las compuertas sueltan. La primera palanca está al alcance de una mano; la tercera se abre desde el fondo de un pozo que se llena con la marea. Luar lleva el cordel todavía liso, sin un nudo puesto, y copiar los nombres cuesta tiempo de marea: abrir sin copiar cuesta perderlos todos, mezclados."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de caverna. Al frente: Guardián de la Sal."
            background="cbm/story/nerea_08_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/nerea_08_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="214"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Guardián de la Sal"
        type="Naga Warrior"
        id="CBM_nerea_08_enemy"
        name="Guardián de la Sal"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="148"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_08_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="No pierdas más de 5 unidades."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="15"
            y="6"
            image="items/brazier.png"
        [/item]
        [label]
            x="15"
            y="6"
            text="Punto 1"
        [/label]
        [item]
            x="28"
            y="26"
            image="items/brazier.png"
        [/item]
        [label]
            x="28"
            y="26"
            text="Punto 2"
        [/label]
        [item]
            x="8"
            y="18"
            image="items/brazier.png"
        [/item]
        [label]
            x="8"
            y="18"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="fighter"
                    x,y="46,31"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="die"
        [filter]
            side="1"
        [/filter]
        {VARIABLE_OP cbm_losses add 1}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="3"
            y="7"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="3"
                    y="7"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="3"
            y="6"
        [/scroll_to]
        [message]
            message="Objetivo: abre las tres compuertas llevando una unidad a cada palanca."
            speaker="narrator"
        [/message]
        [message]
            message="Si escuchas a tu madre, no sigas su voz. Será un recuerdo buscando salida."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="La escucharé. Y seguiré andando."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Estas compuertas no se cierran para castigar. Se cierran para que el mar no se lleve todo de golpe."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="¿Y quién decide cuánto se lleva?"
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La ley de la sal: lo que se suelta vuelve mezclado. Nadie recupera un nombre limpio."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="Entonces los devolveremos despacio, uno por uno, con su dueño delante."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Nadie tiene tiempo para eso. Tenéis una marea."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="En las paredes hay listas de nombres escritos con sal. Algunos están borrados con el pulgar."
            speaker="narrator"
        [/message]
        [message]
            message="Aquí abajo hay cordeles colgados. Manos que aprendieron a hacer nudos antes que a escribir."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Un cordel, un nombre. Si abrimos las compuertas, el agua se los lleva."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Por eso no las abro yo. También son mi archivo."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="Copiamos los nudos antes de abrir. Dos unidades por palanca y una copiando. Ese es el plan."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Detrás de estas compuertas no hay tesoros: hay nombres que nadie reclamó. Yo soy el último que los recuerda sin cuerda y sin nudos."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="La cueva se inunda por el túnel de entrada y las tres palancas están en salas distintas; los centinelas saldrán con la primera compuerta. Decide si mandas una unidad por palanca o abres camino con todo el grupo."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los centinelas empujan hacia el túnel que se inunda y el agua salada ya moja las listas de la pared. Decide si copias antes de abrir o abres antes de que suba."
            speaker="narrator"
        [/message]
        [message]
            message="Abrir las tres de golpe devuelve los nombres mezclados, y un nombre mezclado es como no tenerlo. Prefiero guardarlos mojados y a salvo a devolverlos perdidos."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="Los mezclados los ordenamos juntos. Primero los tuyos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Vuestra madre bajó aquí tres veces. La última traía un cuaderno y una cuerda."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="Entonces sabía lo que hacía. Nosotros también."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="La marea entra por el túnel. Queda una ronda antes de que el agua cubra las palancas."
            speaker="narrator"
        [/message]
        [message]
            message="Las compuertas aguantan abiertas. Salgamos por donde bajamos."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="15"
            y="6"
        [/filter]
        [remove_item]
            x="15"
            y="6"
        [/remove_item]
        [item]
            x="15"
            y="6"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="15"
            y="6"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La primera compuerta cede. El agua sube un palmo y arrastra una lista escrita con sal."
            speaker="narrator"
        [/message]
        [message]
            message="Esa era la lista de los vivos. Ahora está en el suelo."
            speaker="CBM_nerea_companion"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="28"
            y="26"
        [/filter]
        [remove_item]
            x="28"
            y="26"
        [/remove_item]
        [item]
            x="28"
            y="26"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="28"
            y="26"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Se me ha deshecho un nudo en la mano. Solo queda la cuerda lisa."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Anota cuántos has copiado. Los que falten los preguntaremos en tierra."
            speaker="CBM_nerea_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="8"
            y="18"
        [/filter]
        [remove_item]
            x="8"
            y="18"
        [/remove_item]
        [item]
            x="8"
            y="18"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="8"
            y="18"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La tercera compuerta se abre y miles de nombres salen con el agua hacia el túnel."
            speaker="narrator"
        [/message]
        [message]
            message="Ya no puedo cerrarlas. Ahora decide el mar."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [variable]
                        name="cbm_losses"
                        numerical_greater_than="5"
                    [/variable]
                    [then]
                        [message]
                            message="No pierdas más de 5 unidades. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_08_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="45"
                    y="29"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_08_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="45"
                    y="29"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="He copiado noventa y cuatro nudos. El resto se han deshecho en mi mano."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Noventa y cuatro más de los que teníamos esta mañana."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Habéis abierto mi archivo y no habéis robado nada. Eso no lo había visto nunca."
            speaker="narrator"
            caption="Guardián de la Sal"
            image="cbm/portraits/guardian-de-la-sal.png"
        [/message]
        [message]
            message="Volveremos con cuerdas nuevas. Guárdanos los nombres que puedas."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Miles de nombres salieron con el agua y el túnel quedó en silencio por primera vez en cuarenta años."
            speaker="narrator"
        [/message]
        [message]
            message="Miles de nombres salieron con el agua. Nerea recordó unas manos enseñándole a hacer un nudo. Las manos estaban bajo la superficie y el nudo era el mismo que llevaba el cuaderno. Comprendió que su madre había bajado hasta allí más de una vez y que había dejado cordeles en las paredes para que alguien, algún día, pudiera deshacerlos. Arriba, sobre esa misma agua que ya devolvía nombres, Serkos amarraba los barcos que el mundo daba por perdidos. La única bandera que decía algo en todo el estrecho era la suya, y navegaba hacia el paso antes de que la marea cambiara."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

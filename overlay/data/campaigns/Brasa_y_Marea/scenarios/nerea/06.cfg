[scenario]
    id="CBM_nerea_06"
    name="Quienes pagan la calma"
    next_scenario="CBM_nerea_07"
    map_file="nerea_06.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los custodios naga exigieron entregar el cuaderno. Cada noche que la máquina mantenía tranquilas las aguas borraba un recuerdo de las islas periféricas. La madre de Nerea había intentado detenerla. Uss viene a cobrar en nombre del arrecife: el cuaderno es la prueba de la deuda. En las islas del borde los pescadores ya salen a la mar sin recordar su cala y vuelven guiándose por las estrellas. La aldea tiene hasta el alba para embarcar a todos."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de archipiélago. Al frente: Primera Lanza Uss."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="198"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Primera Lanza Uss"
        type="Naga Warrior"
        id="CBM_nerea_06_enemy"
        name="Primera Lanza Uss"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="136"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="7"
            y="20"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="7"
                    y="20"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="7"
            y="19"
        [/scroll_to]
        [message]
            message="Objetivo: mantén a Nerea con vida hasta el comienzo del turno doce. A esa hora las barcas estarán cargadas."
            speaker="narrator"
        [/message]
        [message]
            message="La calma de vuestro puerto nos ha costado generaciones enteras."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="No pediré que nos perdonéis. Dame esta noche para sacar a la gente de su alcance."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La ley del arrecife exige que quien rompe un pacto pague con lo que más guarda. Vosotros guardáis nombres."
            speaker="narrator"
            caption="Primera Lanza Uss"
        [/message]
        [message]
            message="Guardamos gente. Los nombres van con ellos."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Entregad el cuaderno y la marea queda quieta una luna más. Es un buen precio."
            speaker="narrator"
            caption="Primera Lanza Uss"
        [/message]
        [message]
            message="Es un precio de mercado. El mismo que cobra vuestro enemigo."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Mi enemigo construyó la máquina. Yo solo cobro lo que él dejó firmado. Un custodio también obedece."
            speaker="narrator"
            caption="Primera Lanza Uss"
        [/message]
        [message]
            message="Las barcas cargan de una en una. Cada turno que pasa, una familia sube a bordo."
            speaker="narrator"
        [/message]
        [message]
            message="En la cala del este hay una mujer que repite la canción de su aldea para no perderla."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Pon a la hija a cantar la respuesta. Así la canción tendrá dos voces y no se borrará."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Puedo esperar. Tengo más paciencia que vuestras barcas."
            speaker="narrator"
            caption="Primera Lanza Uss"
        [/message]
        [message]
            message="Uss atacará por el muelle y por el agua. Deja dos unidades en el embarcadero."
            speaker="narrator"
        [/message]
        [message]
            message="Esta noche nadie duerme. El que no rema, vigila."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Tres familias a bordo y la cala ya huele a humo. Uss ha cortado las redes del muelle."
            speaker="narrator"
        [/message]
        [message]
            message="Sin redes no hay excusa para quedarse. Empujad las barcas."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="La mujer de la canción lleva en la mano un caracol con muescas. Una está borrada."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Una muesca es una casa. Que su hija la vuelva a marcar con un clavo."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Queda una barca en el muelle. La mía también tiene nombre, aunque nadie lo recuerde."
            speaker="narrator"
            caption="Primera Lanza Uss"
        [/message]
        [message]
            message="Entonces dilo tú, y lo apuntamos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Última barca. Si cedéis el muelle, se llevan a quien no sabe nadar."
            speaker="narrator"
        [/message]
        [message]
            message="Los viejos van dentro y los jóvenes al agua. Yo cierro la fila."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="37"
                    y="3"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="37"
                    y="3"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Todas las barcas están fuera de la rompiente."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Contad cabezas otra vez. Quiero el número exacto."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Habéis salvado a los vuestros. Nosotros no tenemos barcas."
            speaker="narrator"
            caption="Primera Lanza Uss"
        [/message]
        [message]
            message="Por eso os dejo el muelle, el agua dulce y una copia del cuaderno. Nada más."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Uss se quedó en el embarcadero contando las barcas que se alejaban hasta que la niebla tapó la última."
            speaker="narrator"
        [/message]
        [message]
            message="Los isleños huyeron con canciones repetidas en voz alta para no olvidar a quienes viajaban en la barca de al lado. Uss apuntó en el brazo la lista de los que se quedaban y se ató un nudo por cada uno. Llevaba cinco nudos cuando amaneció, y ninguno tenía nombre, porque ya nadie recordaba cómo se llamaba la cala."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

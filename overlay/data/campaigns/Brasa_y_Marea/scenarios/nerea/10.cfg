[scenario]
    id="CBM_nerea_10"
    name="Un camino para los naga"
    next_scenario="CBM_nerea_11"
    map_file="nerea_10.map"
    turns="30"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Una emisaria naga aceptó guiar a los isleños hasta el núcleo. Eshka, defensora de la vieja ley, prefería hundir los pasos antes que permitir que manos extranjeras los cruzaran. En el fondo del canal hay escalones tallados por manos naga hace siglos, y cada escalón tiene un nombre raspado y otro escrito encima. Issa habla por las comunidades que ya aceptaron apagar la máquina; Eshka responde por las que aún confían en ella. La llave de conchas abre la puerta del núcleo con dos vueltas y catorce comunidades a la espalda. Cruzar cuesta la vuelta, porque Eshka ha jurado hundir los escalones antes que verlos pisados por manos extranjeras; no cruzar cuesta a Issa las pocas aldeas que aún la escuchan. Al otro lado de los escalones espera la puerta del núcleo, y Eshka corre para llegar a ella antes que la fila."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de archipiélago. Al frente: Custodia Eshka."
            background="cbm/story/nerea_10_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 30."
            background="cbm/story/nerea_10_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="230"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Custodia Eshka"
        type="Naga Warrior"
        id="CBM_nerea_10_enemy"
        name="Custodia Eshka"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="160"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_10_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="24"
            y="14"
            image="items/gohere.png"
        [/item]
        [label]
            x="24"
            y="14"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 15
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Merman Fighter"
                    x,y="38,5"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="5"
            y="18"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="5"
                    y="18"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Naga Fighter"
            id="CBM_nerea_10_protected"
            name="Issa, emisaria del arrecife"
            side="1"
            x="6"
            y="17"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="5"
            y="17"
        [/scroll_to]
        [message]
            message="Objetivo: escolta a Issa hasta la bandera del núcleo. Si cae, el paso queda cerrado."
            speaker="narrator"
        [/message]
        [message]
            message="La emisaria ha perdido más nombres que nosotros. Y aun así recuerda cómo confiar."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="No caminaremos delante de ella como conquistadores. Le cubriremos la espalda."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Mi gente guarda los pasos desde antes de que existieran los barcos. Es un oficio, no un trono."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="Issa, has vendido el arrecife por un puñado de nombres extranjeros."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="He traído a quien puede apagar la máquina. Eso no es vender, es terminar un contrato."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="La ley dice que un paso se cierra desde dentro. Y yo estoy dentro."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="También están dentro vuestras crías, en las pozas del norte, con los nombres ya borrados."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Eso lo sé mejor que tú. Los primeros borrados fuimos nosotros."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="Entonces caminemos juntos, y que nadie más elija entre su ley y su familia."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="Hay dos pasos: los escalones y el canal profundo. El canal es más rápido y más oscuro."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Vamos por los escalones. Issa marca el ritmo y nosotros cerramos la fila."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="No os atacaré en los escalones. Os atacaré donde la ley me obligue: en la puerta."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="Esa puerta la conozco. Tiene un cerrojo de conchas y una sola llave."
            speaker="CBM_nerea_10_protected"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Quien nombra un paso lo posee, y este lo nombraron las mías cuando aún no había barcos. Vosotros lo cruzáis prestado, y lo prestado se devuelve o se paga."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="El canal tiene dos vías: los escalones tallados, abiertos y estrechos, y la zanja honda, oscura pero sin vigías. Eshka guarda la puerta final y no el camino: decide quién marca el ritmo, Issa por los escalones o Luar por la zanja."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="En el escalón sexto hay un nombre raspado y otro escrito encima con una concha."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="Lo copio con un nudo. Si el agua sube, al menos queda la cuenta."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_nerea_10_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Me han dado en la aleta. Seguid, yo cierro la fila."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="Nadie cierra nada. Luar, cógela del brazo y sube con ella."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Con cada marea los escalones se cubren y aprietan la fila. Decide si subes a Issa a hombros, que gana un turno, o la dejas marcar el paso con su aleta."
            speaker="narrator"
        [/message]
        [message]
            message="Las aldeas que me siguen viven de la calma que la máquina todavía les paga. Si la apagáis, seré yo quien tenga que explicarles el hambre, y empezaré explicándoselo a la que la trajo."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="Se lo explicarás a todos. A ella la cubro yo."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="La puerta tiene dos lados. Al que la cruce primero lo llamarán traidor."
            speaker="narrator"
            caption="Custodia Eshka"
            image="cbm/portraits/custodia-eshka.png"
        [/message]
        [message]
            message="Entonces cruzo yo primero. La traición es un nombre que ya llevo puesto."
            speaker="CBM_nerea_10_protected"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la poza del norte las crías naga nadan en círculo alrededor de una piedra sin inscripción."
            speaker="narrator"
        [/message]
        [message]
            message="Esa piedra tenía un nombre. Lo escribiremos antes de irnos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 28"
        [message]
            message="La corriente cambia en el canal. Queda una ronda para cruzar la puerta."
            speaker="narrator"
        [/message]
        [message]
            message="Issa está cerca. Nadie la suelta ahora."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_10_protected"
            x="24"
            y="14"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [have_unit]
                id="CBM_nerea_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_10_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="37"
                    y="3"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_10_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="37"
                    y="3"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 15"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_nerea_10_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La llave tiene catorce conchas. Cada una es una comunidad que dijo sí."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="¿Y la que falta?"
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Falta la de mi propia aldea. La añadiré cuando volvamos con la máquina apagada."
            speaker="CBM_nerea_10_protected"
        [/message]
        [message]
            message="Eshka se ha quedado en la puerta. No ha cruzado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="La emisaria entregó la llave y pidió que la primera vuelta la diera un humano, para que la ley quedara cumplida por las dos partes."
            speaker="narrator"
        [/message]
        [message]
            message="Al llegar, la emisaria entregó una llave hecha de conchas. Cada concha representaba una comunidad que había aceptado apagar la máquina. Nerea la pesó en la mano y la encontró ligera; Issa le explicó que las llaves naga no pesan por lo que abren, sino por lo que prometen. Añadieron su concha al final, con el nombre de la aldea escrito por dentro. La cerradura dio dos vueltas y la puerta del núcleo cedió hacia una sala de bronce. Dentro, algo repetía una orden grabada y esperaba a que alguien la firmara de nuevo."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_nerea_10_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

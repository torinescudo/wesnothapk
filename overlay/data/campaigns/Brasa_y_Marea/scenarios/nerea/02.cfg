[scenario]
    id="CBM_nerea_02"
    name="Los dientes del arrecife"
    next_scenario="CBM_nerea_03"
    map_file="nerea_02.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El paso exterior estaba custodiado por guerreros naga. Sus lanzas señalaban hacia el puerto, como si quisieran impedir que algo saliera de él. Kess no grita órdenes: golpea un caracol tres veces y las filas se cierran. En el cordel de cada lanza hay nudos atados por manos que ya no recuerdan a quién los ataron. La corriente que buscamos pasa por debajo de esas líneas. Solo hay una salida y está al otro lado, marcada con una bandera. El hueco entre las dos filas se abre con la resaca y se cierra cuando el agua se calma, y esta resaca dura lo que dura la luz. Cada paso que Nerea abre por una corriente sin nombre le borra una letra de su carta; quedarse en la orilla le borra el paso entero."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Naga Kess."
            background="cbm/story/nerea_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/nerea_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="166"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Naga Kess"
        type="Naga Warrior"
        id="CBM_nerea_02_enemy"
        name="Naga Kess"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_02_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="3"
            y="16"
            image="items/gohere.png"
        [/item]
        [label]
            x="3"
            y="16"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Merman Fighter"
                    x,y="35,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="4"
            y="22"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="4"
                    y="22"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="21"
        [/scroll_to]
        [message]
            message="Objetivo: cruza el arrecife y alcanza la bandera del paso exterior antes de que cierre la marea."
            speaker="narrator"
        [/message]
        [message]
            message="No protegen un tesoro. Están cerrando una herida."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Crucemos sin quedarnos atrapados entre sus lanzas y la marea."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Ley del arrecife: quien nombra una cosa la posee. Nosotros no poseemos nada, solo guardamos."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="¿Y qué guardáis aquí?"
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El paso que vuestros barcos usaron para pescar hasta el último banco. Ahora está en cuarentena."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="El cordel de su lanza lleva siete nudos y el séptimo está deshecho."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Era de mi hermana. La máquina la tomó la primera. Los primeros borrados siempre somos nosotros."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="Entonces no luchamos contra vosotros. Luchamos contra la corriente."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La corriente no se lucha, se atraviesa. Y se paga."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="Hay dos filas de lanzas y un hueco en el centro. Con la resaca el hueco se ensancha."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Pasamos por el hueco, no por las lanzas. Nadie tiene que morir por una bandera."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Los nagas retroceden con la marea. Alcanza la bandera y no te entretengas en la orilla."
            speaker="narrator"
        [/message]
        [message]
            message="Si llegáis al agua dulce, decid que el arrecife sigue abierto. Es lo único que aún podemos ofrecer."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Nuestra ley dice que quien nombra una cosa la posee. Vosotros nombráis bancos y calas y por eso os parece que el mar os debe algo."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="Dos filas de lanzas flanquean el hueco del arrecife y la resaca lo ensancha a cada ronda. Kess lo cierra en cuanto se calma el agua: decide si pasas ahora por el centro o rodeas por la poza honda, que cuesta dos turnos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Sus lanzas se mueven con la resaca, no contra ella. Están dejando pasar el agua."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Aprovecha el hueco. Cuenta hasta tres y corre."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la cala hay una pizarra de pescadores con seis nombres y un séptimo borrado a mano."
            speaker="narrator"
        [/message]
        [message]
            message="El séptimo nudo. Aquí también les falta alguien."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Cuando baje la resaca, las filas cerrarán el hueco como una boca. Decide si empujas por el centro con todos o mandas delante a los rápidos para que marquen el paso desde el otro lado."
            speaker="narrator"
        [/message]
        [message]
            message="Yo no poseo este paso, solo lo guardo, y mañana volveré a custodiarlo entero. Para eso estamos las de siempre: las primeras borradas."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="Entonces lo cruzamos con nombre. Le pondremos el de tu hermana, si me lo dices."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Mi ley dice que un nombre robado vuelve al agua con quien lo robó."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="Pues devolvamos el agua que falta y quedémonos con la ley."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="La resaca baja. El hueco entre las filas se cierra a cada ronda."
            speaker="narrator"
        [/message]
        [message]
            message="Si esperamos una marea más, tendremos que abrirnos paso."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No os he detenido. Tampoco os he dejado pasar. Recordad la diferencia."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_hero"
            x="3"
            y="16"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [have_unit]
                id="CBM_nerea_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="34"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="34"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Han dejado pasar a los nuestros antes que a los suyos. Entre naga, eso es una deuda."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="La anotamos. Sin precio."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Guardaos la lanza pequeña del paso. Es vuestra, y con ella la obligación de devolverla."
            speaker="narrator"
            caption="Naga Kess"
            image="cbm/portraits/naga-kess.png"
        [/message]
        [message]
            message="Volveremos a traerla cuando el paso vuelva a tener nombre."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Detrás de las filas, el fondo del mar estaba sembrado de anclas sin barco."
            speaker="narrator"
        [/message]
        [message]
            message="Al otro lado del arrecife, el mar tenía el sabor del agua de lluvia. Luar nadó hasta una roca y ató en su cordel un nudo nuevo con el nombre del paso que acababan de cruzar. Kess lo vio desde lejos y no lo deshizo: era la primera vez en veinte años que alguien ataba un nombre en lugar de cortarlo. Aquel sabor venía de tres fuentes que manaban bajo la mar, y cada chorro bajaba con un nombre menos para las islas del borde. Nerea guardó el rumbo de las luces que las señalaban, sabiendo que encenderlas costaba apellidos ajenos."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

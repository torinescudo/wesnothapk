[scenario]
    id="CBM_nerea_07"
    name="El mercado de los nombres"
    next_scenario="CBM_nerea_08"
    map_file="nerea_07.map"
    turns="30"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Dorven comerciaba con tablillas capaces de conservar recuerdos. Una buceadora cautiva conocía la entrada de la máquina; el mercader la vendía junto con el nombre de su familia. Las tablillas guardan un recuerdo durante un año y un nombre durante tres, y se pagan en objetos: una carta náutica, un diente de ballena, la letra de una canción. El puesto ocupa el muelle viejo, entre cajas de sal y unos grilletes que él llama fianzas. Yara lleva seis años pagando una fianza que nadie firmó, y Dorven conserva su apellido como garantía. Llevarse la buceadora sin pagar cuesta la carta de navegación que el mercader ya ha pedido ver; pagarla cuesta firmar que hasta un apellido tiene precio. Con el alba, Dorven cierra trato y la jaula cambia de puerto."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Mercader Dorven."
            background="cbm/story/nerea_07_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 30."
            background="cbm/story/nerea_07_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="206"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Mercader Dorven"
        type="Naga Warrior"
        id="CBM_nerea_07_enemy"
        name="Mercader Dorven"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="142"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_07_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 26."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="6"
            y="23"
            image="items/gohere.png"
        [/item]
        [label]
            x="6"
            y="23"
            text="Destino"
        [/label]
        [item]
            x="21"
            y="9"
            image="items/cage.png"
        [/item]
        [label]
            x="21"
            y="9"
            text="Prisión"
        [/label]
        [if]
            [variable]
                name="cbm_decide_nerea_06_1"
                equals="nombres-al-mar"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Viniste de harbor apostando por Devolviste los nombres al mar y las islas se quedaron mudas. El agua ahora sabe cosas que la tierra olvidó.. Lo que dejaste atrás sigue donde lo dejaste, y pesa."
                [/message]
                [story]
                    [part]
                        [story]
                            text="Por Devolviste los nombres al mar y las islas se quedaron mudas. El agua ahora sabe cosas que la tierra olvidó. llegaste tarde a lo otro. Aun así, lo que elegiste sostiene esta jornada."
                        [/story]
                    [/part]
                [/story]
                [gold]
                    side="1"
                    amount="-20"
                [/gold]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="Viniste de harbor apostando por Repartiste los nombres por las islas y el mar se quedó sin nadie a quien llamar.. Lo otro quedó sin quien lo defendiera."
                [/message]
                [story]
                    [part]
                        [story]
                            text="Por Repartiste los nombres por las islas y el mar se quedó sin nadie a quien llamar. ganaste terreno y perdiste lo otro. Aquí se empieza a notar."
                        [/story]
                    [/part]
                [/story]
                [gold]
                    side="1"
                    amount="60"
                [/gold]
            [/else]
        [/if]
    [/event]
    [event]
        name=turn 15
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="scout"
                    x,y="21,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="18"
            y="23"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="18"
                    y="23"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="18"
            y="22"
        [/scroll_to]
        [message]
            message="Objetivo: llega a la jaula del muelle, libera a la buceadora y escóltala hasta la bandera."
            speaker="narrator"
        [/message]
        [message]
            message="Podemos pagar. Llevas oro suficiente."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Y mañana venderá a otra. Hoy se termina su negocio."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El precio de la buceadora ya está puesto. Lo que no tiene precio es su apellido."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="Pues lo compro yo, y después lo rompo."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Podéis romper la tablilla. El recuerdo ya está copiado. De eso vive el negocio."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="En la tablilla de al lado hay un precio grabado encima de otro. Tres nombres raspados para hacer sitio a las cifras."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Los nombres ocupan sitio. Las cifras caben todas."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="La buceadora conoce las cámaras inundadas. La necesitamos viva y con memoria."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La jaula tiene fondo de rejilla y debajo pasa un canal de dos palmos."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Entra por el canal y yo distraigo al mercader con una compra."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Dorven tiene dos guardias y un perro. La jaula es de hierro, pero el fondo da al agua."
            speaker="narrator"
        [/message]
        [message]
            message="Si os lleváis a la buceadora os llevaréis su deuda. La firmé con el puerto."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="Enséñame esa firma. Si es del puerto, la pagará el puerto."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Una tablilla guarda un recuerdo un año y un nombre tres. Yo no robo nada: lo cuido hasta que alguien paga lo que vale cuidarlo."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="La jaula de Yara da al canal por un fondo de rejilla, y Dorven ha dejado al perro en el muelle seco. Decide si entras por el agua con una unidad o lo distraes fingiendo una compra en el puesto."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El precio ha subido. Ahora quiero también la carta de navegación que lleváis."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="La carta es nuestra. Sube lo que quieras, pero no te la voy a enseñar."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En las cajas de sal hay tablillas envueltas en tela. Cada una lleva escrito un precio en el canto."
            speaker="narrator"
        [/message]
        [message]
            message="Ninguna lleva nombre. Eso quiere decir que ya está borrado."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_nerea_07_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="No puedo correr. Dadme la mano y salimos juntas."
            speaker="CBM_nerea_07_protected"
        [/message]
        [message]
            message="La mano y el hombro. Tú marca el paso."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los cajones de sal estrechan el paso hasta la larga de una lanza, y el perro huele el canal por dentro. Decide si abres la jaula por la rejilla o la rompes por el canto con el perro encima."
            speaker="narrator"
        [/message]
        [message]
            message="La familia de la buceadora lleva seis años pagando una fianza que nadie firmó. Si os la lleváis sin pagar, esos seis años valen nada, y mañana media ciudad vendrá a por lo suyo."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="Mañana media ciudad tendrá lo suyo. Ese es el trato."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="El perro no ladra a quien huele a sal. Eso nos deja una puerta abierta."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Úsala. Y si vuelve el mercader, dile que estoy comprando."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Sin tablillas no hay recuerdos. Ahora tendréis que acordaros de todo vosotros solos."
            speaker="narrator"
            caption="Mercader Dorven"
            image="cbm/portraits/mercader-dorven.png"
        [/message]
        [message]
            message="Es lo que hacíamos antes de conocerte."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="21"
            y="9"
        [/filter]
        [remove_item]
            x="21"
            y="9"
        [/remove_item]
        [unit]
            type="Mermaid Initiate"
            id="CBM_nerea_07_protected"
            name="Yara, buceadora"
            side="1"
            x="21"
            y="10"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_nerea_07_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_07_protected"
            x="6"
            y="23"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [variable]
                name="turn_number"
                numerical_greater_than="26"
            [/variable]
            [then]
                [message]
                    message="Cumple el objetivo antes del turno 26. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="20"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="20"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 15"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_nerea_07_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Mi nombre está en la tercera tablilla. La pagó un hombre que no me conoce."
            speaker="CBM_nerea_07_protected"
        [/message]
        [message]
            message="Dámela. La leo en voz alta una vez y la quemo."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Las demás tablillas son de gente que aún duerme en el puerto. Las devolvemos mañana."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Mi familia paga la fianza desde hace seis años. Solo habían comprado el nombre, no la deuda."
            speaker="CBM_nerea_07_protected"
        [/message]
        [message]
            message="El puesto quedó cerrado con las tablillas dentro, y el perro se fue con la buceadora."
            speaker="narrator"
        [/message]
        [message]
            message="La buceadora enseñó a Luar una ruta por las cámaras inundadas. A cambio pidió que nadie volviera a escribir un precio junto a su nombre. Antes de bajar marcó con brea la entrada del canal en la pared del muelle y escribió debajo una sola palabra: libre. La palabra duró hasta la siguiente pleamar. La ruta de Yara terminaba bajo la roca, ante tres compuertas que repartían la memoria robada del mar. Detrás de ellas aguardaban los centinelas que la máquina alimentaba, y abrirlas devolvería los nombres mezclados como sal."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_nerea_07_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

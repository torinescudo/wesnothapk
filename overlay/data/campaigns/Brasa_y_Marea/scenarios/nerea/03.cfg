[scenario]
    id="CBM_nerea_03"
    name="Agua dulce en mar abierto"
    next_scenario="CBM_nerea_04"
    map_file="nerea_03.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Tres fuentes sumergidas vertían agua dulce desde una isla invisible. Activar sus balizas antiguas mostraría el camino, pero Issar había prohibido tocar los mecanismos. El custodio no defiende un secreto: administra una deuda. Cada chorro que mana descuenta años de memoria a las islas del borde, y él lleva la cuenta en tres piedras. Los nombres grabados en la calzada están tachados con sal, no con tinta, y alguno tiene la marca de un pulgar reciente."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de archipiélago. Al frente: Custodio Issar."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 32."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Custodio Issar"
        type="Naga Warrior"
        id="CBM_nerea_03_enemy"
        name="Custodio Issar"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="35"
            y="28"
            image="items/brazier.png"
        [/item]
        [label]
            x="35"
            y="28"
            text="Punto 1"
        [/label]
        [item]
            x="13"
            y="19"
            image="items/brazier.png"
        [/item]
        [label]
            x="13"
            y="19"
            text="Punto 2"
        [/label]
        [item]
            x="27"
            y="22"
            image="items/brazier.png"
        [/item]
        [label]
            x="27"
            y="22"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="23"
            y="30"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="23"
                    y="30"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="23"
            y="29"
        [/scroll_to]
        [message]
            message="Objetivo: activa las tres balizas sumergidas llevando una unidad a cada una."
            speaker="narrator"
        [/message]
        [message]
            message="Mi abuela hablaba de manantiales que pagaban su caudal con recuerdos."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Hoy solo les pediremos una dirección."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Por cada baliza que encendéis, una familia del norte pierde su apellido. Elegid cuál."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="Ninguna. Enciendo la baliza y devuelvo el nombre por donde vino."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La máquina no funciona así. Recibe y devuelve. Ahora mismo está recibiendo."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="En las piedras hay nombres raspados. Alguien quitó la sal con la mano antes que nosotros."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Los custodios raspamos para poder leer. Es nuestra ley: un nombre raspado sigue siendo un nombre."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="La calzada está a media agua. Las balizas marcan su trazado y solo una unidad puede activar cada una."
            speaker="narrator"
        [/message]
        [message]
            message="Los peces evitan el agua dulce. No está sucia, está nueva."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Subimos por la calzada y encendemos las tres. Si Issar quiere cobrar, que cobre en preguntas."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Mi gente bebió aquí primero. También fuimos los primeros en ser borrados."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="Entonces grabaremos los vuestros antes que los nuestros."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Un bote sin remos aparece a la deriva con dos isleños dentro y ninguna carta a bordo."
            speaker="narrator"
        [/message]
        [message]
            message="Súbelos al bote y que nos sigan. Ya preguntaremos cómo se llaman."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="El mar no espera a los que dudan. Yo tampoco."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="La calzada se está cubriendo. Nos queda una marea de luz."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="35"
            y="28"
        [/filter]
        [remove_item]
            x="35"
            y="28"
        [/remove_item]
        [item]
            x="35"
            y="28"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="35"
            y="28"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primera baliza encendida. El agua dulce se enturbia un instante y vuelve a estar clara."
            speaker="narrator"
        [/message]
        [message]
            message="Ha pasado algo por debajo. No era un pez."
            speaker="CBM_nerea_companion"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="13"
            y="19"
        [/filter]
        [remove_item]
            x="13"
            y="19"
        [/remove_item]
        [item]
            x="13"
            y="19"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="13"
            y="19"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Dos luces. En el norte ya hay una aldea que no recuerda cómo llamaba a su cala."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="Anota la aldea. La escribiremos otra vez cuando volvamos."
            speaker="CBM_nerea_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="27"
            y="22"
        [/filter]
        [remove_item]
            x="27"
            y="22"
        [/remove_item]
        [item]
            x="27"
            y="22"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="27"
            y="22"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La tercera baliza abre la calzada. En el centro hay una piedra con un nombre a medio raspar."
            speaker="narrator"
        [/message]
        [message]
            message="Está empezado por la mitad. Alguien se arrepintió."
            speaker="CBM_nerea_companion"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las tres luces ya no apuntan al norte. Apuntan a la isla que falta."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Escribe el rumbo. Pondremos el nombre cuando lleguemos."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Habéis pagado con vuestro tiempo lo que otros pagan con su casa. No os lo agradeceré."
            speaker="narrator"
            caption="Custodio Issar"
        [/message]
        [message]
            message="No te lo he pedido."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El agua dulce se mezcló con la sal y nadie perdió nada esa noche."
            speaker="narrator"
        [/message]
        [message]
            message="Las balizas revelaron una calzada bajo la superficie. Sobre sus piedras estaban grabados nombres tachados. Nerea raspó la sal con la uña en uno de ellos y encontró una letra debajo. Luar la copió en su cordel con un nudo, antes de que la marea volviera a cubrirla; Issar lo miró hacerlo y no lo impidió."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

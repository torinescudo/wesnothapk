[scenario]
    id="CBM_nerea_05"
    name="El cuaderno de otra vida"
    next_scenario="CBM_nerea_06"
    map_file="nerea_05.map"
    turns="30"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La niña conservaba un cuaderno escrito por la madre de Nerea. Debían llevarlo a la casa de mareas, donde una lectora ciega podía descifrar la tinta que solo aparecía al anochecer. Olss rastrea por el olor del papel mojado y ha marcado los árboles del camino con brea. Cada vez que el cuaderno se abre, alguien de la comarca pierde el nombre de un árbol. Talia lo lleva en una bolsa de cuero atada con un nudo que no sabe deshacer. Para Nerea, abrir el cuaderno cuesta a la comarca un nombre; no abrirlo, no volver a leer a su madre. El anochecer cae dentro de dos jornadas, y la bolsa de Talia no puede caerse ni una vez por el camino."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Rastreadora Olss."
            background="cbm/story/nerea_05_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 30."
            background="cbm/story/nerea_05_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="190"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Rastreadora Olss"
        type="Naga Warrior"
        id="CBM_nerea_05_enemy"
        name="Rastreadora Olss"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="130"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_05_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="3"
            y="3"
            image="items/gohere.png"
        [/item]
        [label]
            x="3"
            y="3"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 15
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Merman Fighter"
                    x,y="38,16"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="4"
            y="17"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="4"
                    y="17"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Peasant"
            id="CBM_nerea_05_protected"
            name="Talia"
            side="1"
            x="5"
            y="16"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="16"
        [/scroll_to]
        [message]
            message="Objetivo: escolta a Talia y el cuaderno hasta la bandera, al final del bosque."
            speaker="narrator"
        [/message]
        [message]
            message="Puedes abrirlo ahora. Nadie te culparía."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Si la tinta se borra al sol, mi impaciencia volverá a dejarla sin voz."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Mi abuela me enseñó este nudo. Dice que mientras esté atado, el cuaderno es de casa."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="Devolved el cuaderno y os doy una jornada de ventaja. La máquina paga bien por lo que no debe leerse."
            speaker="narrator"
            caption="Rastreadora Olss"
            image="cbm/portraits/rastreadora-olss.png"
        [/message]
        [message]
            message="¿Cuánto paga por un nombre raspado? Porque eso es todo lo que llevas contando."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Paga por el orden. Sin nombres no hay deudas, y sin deudas no hay deudores."
            speaker="narrator"
            caption="Rastreadora Olss"
            image="cbm/portraits/rastreadora-olss.png"
        [/message]
        [message]
            message="Y sin deudores tampoco hay acreedores. Diles que vas a quedarte sin oficio."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Huele a resina quemada. Ha señalado los árboles con brea para que no salgamos del camino."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Los árboles tienen nombre. Al de la derecha lo llamo alto, y al otro también. Los llamo así desde pequeña."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="Entonces no vamos por el camino. Vamos por el arroyo."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El camino tiene dos puestos de brea y una ciénaga. La ciénaga es lenta, pero no está vigilada."
            speaker="narrator"
        [/message]
        [message]
            message="En esta comarca ya nadie recuerda cómo se llamaba el río. Yo tampoco. Eso es lo que llevo en la mano."
            speaker="narrator"
            caption="Rastreadora Olss"
            image="cbm/portraits/rastreadora-olss.png"
        [/message]
        [message]
            message="Se llamaba Sombra. Mi madre lo decía así."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="Escríbelo en la bolsa con carbón. Antes de que se nos olvide a los dos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="No persigo a la niña: persigo el papel. Un papel que solo se lee al anochecer ya ha borrado a más gente que yo, y alguien tiene que cerrarlo."
            speaker="narrator"
            caption="Rastreadora Olss"
            image="cbm/portraits/rastreadora-olss.png"
        [/message]
        [message]
            message="Olss ha marcado los árboles con brea para que el camino se estreche a cada tramo. Decide si sigues el arroyo, más lento pero sin marcas, o cortas por el soto y aguantas la emboscada."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El nudo de la bolsa sigue apretado. Si se afloja, avisadme."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="Yo llevo el extremo de la cuerda. Si tiras, lo noto."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_nerea_05_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="La bolsa sigue cerrada. El nudo aguanta."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="Tú también vas a aguantar. Luar, cárgala del lado bueno y sigue andando."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la carbonera hay una pizarra con los nombres de los árboles del término. Dos están borrados."
            speaker="narrator"
        [/message]
        [message]
            message="El del sauce está borrado. Yo lo recuerdo: sauce."
            speaker="CBM_nerea_05_protected"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="La ciénaga frena a quien carga peso y derriba a quien corre, y Olss ataca justo donde carga el peso. Decide quién abre paso y quién cierra la fila con Talia."
            speaker="narrator"
        [/message]
        [message]
            message="Detrás de mí hay una comarca que duerme sin nombres, y esa calma también es orden. Si antes de la noche no soltáis el papel, quemaré el soto entero."
            speaker="narrator"
            caption="Rastreadora Olss"
            image="cbm/portraits/rastreadora-olss.png"
        [/message]
        [message]
            message="Luego el soto se quedará sin árboles y tú sin encargo. Escoge."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Habéis llegado lejos para gente que no lleva mapa."
            speaker="narrator"
            caption="Rastreadora Olss"
            image="cbm/portraits/rastreadora-olss.png"
        [/message]
        [message]
            message="Llevamos dos. Uno escrito y otro en la cabeza de la niña."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 28"
        [message]
            message="La casa de mareas está al final del arroyo. Queda una ronda de luz."
            speaker="narrator"
        [/message]
        [message]
            message="Talia delante, el cuaderno en medio y nadie se para a discutir."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_05_protected"
            x="3"
            y="3"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="37"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="37"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 15"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_nerea_05_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El nudo sigue atado. Podéis abrirlo cuando ella lo abra."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="La lectora vive detrás de esa puerta. Nadie ha entrado en veinte años sin traerle agua."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Llevamos cuaderno y agua."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La tinta del cuaderno solo aparece al anochecer. La lectora lo leyó con los dedos, despacio, dos veces."
            speaker="narrator"
        [/message]
        [message]
            message="Dice que la letra es de una mujer que firmaba con dos nombres. Uno de ellos es el tuyo."
            speaker="CBM_nerea_05_protected"
        [/message]
        [message]
            message="La lectora encontró una orden de emergencia: la madre de Nerea había borrado una ruta para detener una invasión. Debajo de la orden había una cuenta de lo que la máquina cobraba por cada isla, un año de memoria por cada marea tranquila. En la última página, Aldara Vado había repetido su propio nombre siete veces, como si temiera perderlo antes de terminar de escribir. Antes del alba apareció en la puerta un caracol con muescas, una de ellas borrada: el arrecife venía a cobrar el cuaderno en nombre de todos los que faltaban. Y con el caracol llegaba la primera lanza, que no venía a discutir el precio, sino a fijarlo."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_nerea_05_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

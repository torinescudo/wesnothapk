[scenario]
    id="CBM_nerea_01"
    name="El puerto sin cartas"
    next_scenario="CBM_nerea_02"
    map_file="nerea_01.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Todos los nombres desaparecieron de las cartas del puerto. Nerea Vado es capitana de puerto libre: gana la vida metiendo barcos dentro del paso cuando la marea los deja a media mar, y quiere una sola cosa hoy: firmar el registro de salida con el nombre de su calle todavía escrito. Vaska arrestó al único piloto que aún recordaba la salida y vendió permisos de navegación imposibles de usar. En el registro de la aduana cada isla figura como «sin designar» y cada barco como carga de valor variable. Ciro está en la celda del muelle con las manos atadas y una tablilla de precios colgada del cuello, sin una sola letra de su calle. Desde la torre, la marea sube con una calma que no le corresponde. La barca de Nerea también está en ese libro, tasada por lo que rinde, y a cada marea tranquila se le caen letras de la carta de navegación. Zarpar sin permiso sellado significa dejar la barca en prenda, y sin barca se le acaba el oficio."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Recaudadora Vaska."
            background="cbm/story/nerea_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 22."
            background="cbm/story/nerea_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recaudadora Vaska"
        type="Naga Warrior"
        id="CBM_nerea_01_enemy"
        name="Recaudadora Vaska"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_01_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="28"
            y="9"
            image="items/gohere.png"
        [/item]
        [label]
            x="28"
            y="9"
            text="Destino"
        [/label]
        [item]
            x="16"
            y="11"
            image="items/cage.png"
        [/item]
        [label]
            x="16"
            y="11"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="Merman Hunter"
            id="CBM_nerea_companion"
            name="Luar"
            side="1"
            x="3"
            y="14"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="3"
            y="13"
        [/scroll_to]
        [message]
            message="Objetivo: llega a la prisión del muelle, saca al piloto y llévalo hasta la bandera antes de la pleamar."
            speaker="narrator"
        [/message]
        [message]
            message="La corriente recuerda rutas que vuestra tinta ha olvidado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Entonces llevaremos al piloto hasta tu corriente y cobraremos la ayuda en respuestas."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Nadie navega sin permiso sellado. Yo firmo los permisos, y hoy no firmo nada."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
        [message]
            message="Los permisos se venden. Los nombres no deberían."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El nombre es la parte cara del permiso. El resto lo pongo yo."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
        [message]
            message="En el libro de Vaska hay una etiqueta con un precio junto a cada renglón. Ninguna etiqueta lleva nombre."
            speaker="narrator"
        [/message]
        [message]
            message="A Ciro le colgaron la tablilla con la letra de su calle ya tachada. Lleva tres días con ella al cuello."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Cortamos la cuerda y la tablilla cae al agua con su precio. Sin nombre no vale nada."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La puerta de servicio baja directa al canal. Si entramos por el agua, salimos por la misma escalera."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Yo abro, tú llevas al piloto. Nadie se queda atrás discutiendo precios."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Vaska ha puesto dos hombres en la puerta principal y uno solo en la escalera de servicio."
            speaker="narrator"
        [/message]
        [message]
            message="Si rompéis esa puerta, cada tablón lo pagará la familia que espera detrás."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
        [message]
            message="Entonces no rompemos nada. Entramos por donde el agua ya entró."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Sin mi libro, este puerto es una fila de barcos que nadie sabe cobrar. Firmad el precio y os firmo la salida antes de que cierre la pleamar."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
        [message]
            message="La aduana da a un canal de una sola boca y Vaska ha tendido una cadena al ras del agua para que la pleamar haga de carcelero. Decide si cortas la cadena por dentro o sacas a Ciro por el tejado."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El agua cubre el primer escalón de la celda. Alguien ha abierto las compuertas del arrecife."
            speaker="narrator"
        [/message]
        [message]
            message="No he sido yo. La máquina mantiene el mar quieto y cobra lo que nadie usa."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_nerea_01_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="No puedo correr. Dejadme con la tablilla y salid vosotros."
            speaker="CBM_nerea_01_protected"
        [/message]
        [message]
            message="La tablilla pesa menos que tú. Camina y no discutas con quien te saca de una celda."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Vaska solo tiene que esperar: en un turno la escalera de servicio queda inundada y solo quedará la puerta encadenada. Decide el paso ahora, que el agua sube más rápido que tus hombres."
            speaker="narrator"
        [/message]
        [message]
            message="Detrás de cada precio hay un nombre guardado. Quitadme el libro y esos nombres se los come el canal, no yo."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
        [message]
            message="Los nombres viven en las calles, no en tus renglones."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="La máquina solo pide nombres viejos. Los guardo en el libro para que no se pierdan."
            speaker="narrator"
            caption="Recaudadora Vaska"
            image="cbm/portraits/recaudadora-vaska.png"
        [/message]
        [message]
            message="Quien decide qué nombre está viejo eres tú. Eso no es una máquina, es una aduana."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El libro de cuentas queda abierto en el suelo mojado del muelle."
            speaker="narrator"
        [/message]
        [message]
            message="Mirad el último renglón. El precio está escrito y el nombre está raspado."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="16"
            y="11"
        [/filter]
        [remove_item]
            x="16"
            y="11"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_nerea_01_protected"
            name="Ciro, piloto del puerto"
            side="1"
            x="16"
            y="12"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_nerea_01_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_01_protected"
            x="28"
            y="9"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="31"
                    y="10"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="31"
                    y="10"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_nerea_01_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La marea entró por el canal mientras Vaska contaba tablones."
            speaker="CBM_nerea_01_protected"
        [/message]
        [message]
            message="Ese hombre vende lo que no construyó. Ahora sabe cuánto pesa un permiso mojado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Ciro, marca la ruta sobre el agua. Ya la escribiremos con calma."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Necesito ver la salida desde la torre. Dadme un remo y os la dibujo."
            speaker="CBM_nerea_01_protected"
        [/message]
        [message]
            message="La tablilla del precio se quedó flotando en el canal, sin cuello al que colgarse."
            speaker="narrator"
        [/message]
        [message]
            message="El piloto recordó una isla que había desaparecido de los registros tres años antes de hundirse. La dibujó con brea en la puerta de la aduana y escribió debajo el nombre de su calle, que nadie le había devuelto. Vaska pagó la multa de su propio libro y se marchó del puerto sin que nadie le pidiera el permiso. Nerea firmó el registro con el nombre de su calle, y la marea le devolvió dos letras de su carta. Al amanecer, la corriente sin nombre tiraba hacia el paso exterior, donde dos filas de lanzas guardaban la única salida del archipiélago."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_nerea_01_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

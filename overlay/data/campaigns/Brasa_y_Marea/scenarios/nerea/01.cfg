[scenario]
    id="CBM_nerea_01"
    name="El puerto sin cartas"
    next_scenario="CBM_nerea_02"
    map_file="nerea_01.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Todos los nombres desaparecieron de las cartas del puerto. Vaska arrestó al único piloto que aún recordaba la salida y vendió permisos de navegación imposibles de usar. En el registro de la aduana cada isla figura como «sin designar» y cada barco como carga de valor variable. Ciro está en la celda del muelle con las manos atadas y una tablilla de precios colgada del cuello, sin una sola letra de su calle. Desde la torre, la marea sube con una calma que no le corresponde."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Recaudadora Vaska."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 32."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recaudadora Vaska"
        type="Naga Warrior"
        id="CBM_nerea_01_enemy"
        name="Recaudadora Vaska"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="3"
            y="7"
            image="items/gohere.png"
        [/item]
        [label]
            x="3"
            y="7"
            text="Destino"
        [/label]
        [item]
            x="24"
            y="10"
            image="items/cage.png"
        [/item]
        [label]
            x="24"
            y="10"
            text="Prision"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="Merman Hunter"
            id="CBM_nerea_companion"
            name="Luar"
            side="1"
            x="4"
            y="17"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="16"
        [/scroll_to]
        [message]
            message="Objetivo: llega a la prisión del muelle, saca al piloto y llévalo hasta la bandera antes de la pleamar."
            speaker="narrator"
        [/message]
        [message]
            message="La corriente recuerda rutas que vuestra tinta ha olvidado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Entonces llevaremos al piloto hasta tu corriente y cobraremos la ayuda en respuestas."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Nadie navega sin permiso sellado. Yo firmo los permisos, y hoy no firmo nada."
            speaker="narrator"
            caption="Recaudadora Vaska"
        [/message]
        [message]
            message="Los permisos se venden. Los nombres no deberían."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El nombre es la parte cara del permiso. El resto lo pongo yo."
            speaker="narrator"
            caption="Recaudadora Vaska"
        [/message]
        [message]
            message="En el libro de Vaska hay una etiqueta con un precio junto a cada renglón. Ninguna etiqueta lleva nombre."
            speaker="narrator"
        [/message]
        [message]
            message="A Ciro le colgaron la tablilla con la letra de su calle ya tachada. Lleva tres días con ella al cuello."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Cortamos la cuerda y la tablilla cae al agua con su precio. Sin nombre no vale nada."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La puerta de servicio baja directa al canal. Si entramos por el agua, salimos por la misma escalera."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Yo abro, tú llevas al piloto. Nadie se queda atrás discutiendo precios."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Vaska ha puesto dos hombres en la puerta principal y uno solo en la escalera de servicio."
            speaker="narrator"
        [/message]
        [message]
            message="Si rompéis esa puerta, cada tablón lo pagará la familia que espera detrás."
            speaker="narrator"
            caption="Recaudadora Vaska"
        [/message]
        [message]
            message="Entonces no rompemos nada. Entramos por donde el agua ya entró."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El agua cubre el primer escalón de la celda. Vaska ha abierto las compuertas del arrecife."
            speaker="narrator"
        [/message]
        [message]
            message="No he sido yo. La máquina mantiene el mar quieto y cobra lo que nadie usa."
            speaker="narrator"
            caption="Recaudadora Vaska"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_nerea_01_protected"
            hitpoints_percentage_less="50"
        [/filter]
        [message]
            message="No puedo correr. Dejadme con la tablilla y salid vosotros."
            speaker="CBM_nerea_01_protected"
        [/message]
        [message]
            message="La tablilla pesa menos que tú. Camina y no discutas con quien te saca de una celda."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="La máquina solo pide nombres viejos. Los guardo en el libro para que no se pierdan."
            speaker="narrator"
            caption="Recaudadora Vaska"
        [/message]
        [message]
            message="Quien decide qué nombre está viejo eres tú. Eso no es una máquina, es una aduana."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El libro de cuentas queda abierto en el suelo mojado del muelle."
            speaker="narrator"
        [/message]
        [message]
            message="Mirad el último renglón. El precio está escrito y el nombre está raspado."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="24"
            y="10"
        [/filter]
        [remove_item]
            x="24"
            y="10"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_nerea_01_protected"
            name="Ciro, piloto del puerto"
            side="1"
            x="24"
            y="11"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta esta abierta. Acompanadme hasta la bandera; no podre llegar sin ayuda."
            speaker="CBM_nerea_01_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_01_protected"
            x="3"
            y="7"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="35"
                    y="13"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="35"
                    y="13"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_nerea_01_protected"
        [/filter]
        [message]
            message="La persona que debias proteger ha muerto. La mision ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La marea entró por el canal mientras Vaska contaba tablones."
            speaker="CBM_nerea_01_protected"
        [/message]
        [message]
            message="Ese hombre vende lo que no construyó. Ahora sabe cuánto pesa un permiso mojado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Ciro, marca la ruta sobre el agua. Ya la escribiremos con calma."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Necesito ver la salida desde la torre. Dadme un remo y os la dibujo."
            speaker="CBM_nerea_01_protected"
        [/message]
        [message]
            message="La tablilla del precio se quedó flotando en el canal, sin cuello al que colgarse."
            speaker="narrator"
        [/message]
        [message]
            message="El piloto recordó una isla que había desaparecido de los registros tres años antes de hundirse. La dibujó con brea en la puerta de la aduana y escribió debajo el nombre de su calle, que nadie le había devuelto. Vaska pagó la multa de su propio libro y se marchó del puerto sin que nadie le pidiera el permiso."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_nerea_01_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

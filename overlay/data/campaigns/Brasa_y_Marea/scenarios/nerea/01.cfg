[scenario]
    id="CBM_nerea_01"
    name="El puerto sin cartas"
    next_scenario="CBM_nerea_02"
    map_file="nerea_01.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Todos los nombres desaparecieron de las cartas del puerto. Vaska arrestó al único piloto que aún recordaba la salida y vendió permisos de navegación imposibles de usar."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recaudadora Vaska"
        type="Naga Warrior"
        id="CBM_nerea_01_enemy"
        name="Recaudadora Vaska"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="22"
            y="14"
            image="items/gohere.png"
        [/item]
        [label]
            x="22"
            y="14"
            text="Destino"
        [/label]
        [item]
            x="12"
            y="4"
            image="items/cage.png"
        [/item]
        [label]
            x="12"
            y="4"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="Merman Hunter"
            id="CBM_nerea_companion"
            name="Luar"
            side="1"
            x="3"
            y="10"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [message]
            speaker="CBM_nerea_companion"
            message="La corriente recuerda rutas que vuestra tinta ha olvidado."
        [/message]
        [message]
            speaker="CBM_nerea_hero"
            message="Entonces llevaremos al piloto hasta tu corriente y cobraremos la ayuda en respuestas."
        [/message]
        [message]
            speaker="narrator"
            message="Crónicas de la Brasa y la Marea. Historia original en español. Las decisiones tácticas, las bajas y la experiencia se conservan entre escenarios. Puedes guardar la partida en cualquier turno."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="12"
            y="4"
        [/filter]
        [remove_item]
            x="12"
            y="4"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_nerea_01_protected"
            name="Ciro, piloto del puerto"
            side="1"
            x="12"
            y="5"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [message]
            speaker="CBM_nerea_01_protected"
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_01_protected"
            x="22"
            y="14"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_nerea_01_protected"
        [/filter]
        [message]
            speaker="narrator"
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="El piloto recordó una isla que había desaparecido de los registros tres años antes de hundirse."
        [/message]
        [kill]
            id="CBM_nerea_01_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

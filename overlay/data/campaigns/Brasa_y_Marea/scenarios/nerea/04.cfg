[scenario]
    id="CBM_nerea_04"
    name="La isla borrada"
    next_scenario="CBM_nerea_05"
    map_file="nerea_04.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Serkos utilizaba la isla sin nombre para ocultar barcos confiscados. Entre sus prisioneros había familias que el resto del mundo había olvidado por completo. No esconde la isla: la ha sacado de todos los mapas para que nadie reclame a los suyos. En los almacenes hay baúles con etiqueta de destino y sin remitente, y en la pared del faro alguien escribió el nombre de cada preso y raspó el suyo propio hasta levantar la cal. La marea entra por la calzada del este dos veces al día y deja el almacén aislado un rato: es el único momento en que sus guardias no se oyen entre sí. Nerea ataca esa franja sabiendo que cada hora de asalto es un flete que no cobrará nunca, porque las islas sin nombre no pagan rescates."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Almirante Serkos."
            background="cbm/story/nerea_04_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 22."
            background="cbm/story/nerea_04_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="182"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Almirante Serkos"
        type="Naga Warrior"
        id="CBM_nerea_04_enemy"
        name="Almirante Serkos"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard"
        gold="124"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_04_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="No pierdas más de 4 unidades."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name="die"
        [filter]
            side="1"
        [/filter]
        {VARIABLE_OP cbm_losses add 1}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Objetivo: derrota al almirante Serkos y abre los almacenes del fuerte."
            speaker="narrator"
        [/message]
        [message]
            message="Si regresan y nadie los reconoce, ¿adónde podrán ir?"
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Primero abrimos las puertas. Luego haremos sitio."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Esta isla no figura en ningún registro. Por eso nadie vendrá a quitármela."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="Eso lo decidirán quienes están dentro."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Están dentro precisamente porque nadie los busca. Aquí comen todos los días."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="Sus baúles llevan destino y no llevan dueño. Igual que sus presos."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Abrimos los baúles y devolvemos el nombre a quien lo reclame."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El fuerte tiene dos puertas y una torre. Dos unidades por puerta fijan a sus hombres."
            speaker="narrator"
        [/message]
        [message]
            message="La máquina me paga por guardar gente que el mar ya no recuerda. Yo solo cobro."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="Cobras por guardar lo que tú mismo borraste de las cartas."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Sobre la puerta hay una lista. El último renglón está raspado y reescrito tres veces."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Averigua de quién es. Yo voy a por el almirante."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Mi nombre también está en esa lista. El renglón raspado lo borré yo: sin nombre escrito no hay isla que reclamar."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Cada preso que guardo come y duerme. Fuera, nadie los buscaba ni para enterrarlos: aquí tienen lista, tejado y número de baúl."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="El fuerte tiene dos puertas y una torre entre las dos. Serkos refuerza la torre a cada turno: decide si cierras las puertas a la vez o la primera se te llena de heridos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Refuerzos por el embarcadero. Serkos ha mandado abrir el almacén de armas."
            speaker="narrator"
        [/message]
        [message]
            message="Dos barcas con gente armada. Cuento veinte remos."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la caseta del muelle hay una etiqueta de equipaje con un precio y ninguna letra de nombre."
            speaker="narrator"
        [/message]
        [message]
            message="La guardamos. Servirá de prueba cuando alguien pregunte por los baúles."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Al caer la tarde el agua cubre la calzada del este y corta la retirada, y Serkos juntará sus hombres en la torre. Decide qué puerta cierras antes: la del almacén de armas o la de la torre."
            speaker="narrator"
        [/message]
        [message]
            message="No borré esta isla para quedármela: la borré para que no vinieran a repartirla. Mañana firmaré su nombre de nuevo, y será el que yo elija."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="Mañana firmará quien la habite. Y ya somos demasiados para tu firma."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Podéis llevaros a los presos. Los barcos os los quedaréis también. Solo quiero la isla sin nombre."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="La isla tiene el nombre que le dieron sus vecinos. Pregúntales a ellos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="La marea cubre la calzada del fuerte. Queda una ronda para cruzar."
            speaker="narrator"
        [/message]
        [message]
            message="Los almacenes están abiertos. Falta desalojarlos antes del agua."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Guardadme en la lista. Con nombre. Es lo único que os pido."
            speaker="narrator"
            caption="Almirante Serkos"
            image="cbm/portraits/almirante-serkos.png"
        [/message]
        [message]
            message="Ya estás. Con tu nombre y con el de la isla."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="cbm_losses"
                numerical_greater_than="4"
            [/variable]
            [then]
                [message]
                    message="No pierdas más de 4 unidades. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="33"
                    y="19"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Fighter"
                    side="2"
                    x="33"
                    y="19"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La lista de la puerta tenía cuarenta y un renglones. El raspado era el nombre de la isla."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Pues la isla se llama así, como estaba escrito antes de que él lo borrara."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Los baúles vuelven a sus dueños. Cuarenta y uno, y falta uno por abrir."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Ese lo abrimos en el puerto, delante de testigos."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Al alba, la isla volvió a los mapas con el nombre que una niña dijo en voz alta."
            speaker="narrator"
        [/message]
        [message]
            message="Una niña reconoció a Nerea en un retrato viejo. La capitana no recordaba haber visitado aquella isla. En la imagen salía junto a su madre, con un cuaderno bajo el brazo, delante del mismo almacén que acababa de cruzar. La niña le preguntó si el cuaderno seguía existiendo; Nerea tardó en contestar. La niña llevaba atada a la cintura una bolsa de cuero con un nudo que nadie sabía deshacer. Dentro esperaba un cuaderno escrito por su madre, y con él el camino hasta la única lectora que aún descifraba la tinta que aparece al anochecer."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_nerea_12"
    name="Nombres sobre el agua"
    next_scenario="null"
    map_file="nerea_12.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Las galerías se inundaron cuando regresó la marea natural. El último custodio quiso retener a Nerea para reiniciar el mecanismo. Las barcas aguardaban más allá de los muelles partidos. No viene a matar: viene a buscar la mano de quien conoce la firma, porque cree que Nerea es la única que puede volver a darla. El agua sube a la altura de la rodilla y el tablero de nombres del puerto aún cuelga de dos clavos. El custodio no empuña una lanza siquiera: busca la mano que sabe la firma y cree que sin ella el mar se quedará huérfano de calma. Salir cuesta dejar el puerto sin nadie que sepa volver a arrancar la máquina; quedarse cuesta firmar por su madre una segunda vez. Las barcas sueltan amarras con la marea, y los dos clavos del tablero no durarán otra."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Último Custodio."
            background="cbm/story/nerea_12_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/nerea_12_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="246"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Último Custodio"
        type="Naga Warrior"
        id="CBM_nerea_12_enemy"
        name="Último Custodio"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="172"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_nerea_12_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_nerea_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="No pierdas más de 3 unidades."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="21"
            y="16"
            image="items/gohere.png"
        [/item]
        [label]
            x="21"
            y="16"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 2
        [message]
            speaker=narrator
            message="¿Dejar la máquina apagada o desmontarla?"
    [option]
        message="maquina apagada"
        [command]
            {VARIABLE cbm_decide_nerea_12_1 "maquina-apagada"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="maquina desmontada"
        [command]
            {VARIABLE cbm_decide_nerea_12_1 "maquina-desmontada"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Merman Fighter"
                    x,y="27,17"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="die"
        [filter]
            side="1"
        [/filter]
        {VARIABLE_OP cbm_losses add 1}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Tu madre dejó una salida en los planos. La dibujó incluso cuando pensaba quedarse."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Entonces la usaremos. Su historia no tiene que terminar dos veces igual."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Objetivo: lleva a Nerea hasta la bandera del muelle alto. Después de esa bandera solo queda mar abierto."
            speaker="narrator"
        [/message]
        [message]
            message="Tu madre firmó el arranque y nadie volvió a firmar. Solo falta tu mano."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Mi mano escribe nombres, no contratos."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Sin contrato no hay calma. Vuestras islas vivirán con miedo al agua."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Con miedo y con nombres. Prefiero eso."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Que cada isla decida. Nosotros solo abrimos la puerta."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Las galerías se inundan en dos rondas. La salida está en el muelle alto y el agua ya cubre los primeros escalones."
            speaker="narrator"
        [/message]
        [message]
            message="Hay dos pasos: el de los planos y el del desagüe. El de los planos está vigilado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Vamos por el de los planos. Quiero que vea lo que dibujó mi madre."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El cuaderno no os salvará. Ya no queda nadie que sepa leer esa tinta."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Quedan dos. Y una de ellas va a salir de aquí."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="En el muelle hay barcas cargadas. No te detengas a discutir con nadie."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Esa mano vale más escribiendo la firma que nadando hacia las barcas. La calma que vuestras islas van a echar de menos solo sale de ella."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Las galerías se inundan por los dos extremos y el paso de los planos está vigilado arriba. Decide si aguantas la subida por los planos, donde te verán venir, o bajas por el desagüe, que se llena en dos rondas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El agua sube un escalón más. El tablero de nombres del puerto queda a la altura de los ojos."
            speaker="narrator"
        [/message]
        [message]
            message="Las letras están rascadas. Alguien quitó su nombre con una piedra."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="El custodio empuja el tablero para cortar el pasillo, y el tablero se desprende de un clavo a cada ronda. Decide si lo aguantas con una unidad o corres por debajo mientras aún cuelga."
            speaker="narrator"
        [/message]
        [message]
            message="He guardado veinte años este puerto vacío porque alguien tenía que quedarse cuando todos se marchaban. Ahora me quedo sin orden y sin nombre: dejadme al menos la copia del cuaderno."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="La copia se queda donde cualquiera pueda leerla. Ni un paso más."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Vuestra madre me pidió que la detuviera si volvía. Estoy cumpliendo su palabra."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Cumpliste. Yo también cumplo la mía, y la mía dice que salgamos todos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la caseta del práctico hay un cuaderno de bitácora con las últimas páginas arrancadas."
            speaker="narrator"
        [/message]
        [message]
            message="Las arrancó alguien que quería olvidar. Nosotros escribiremos encima."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Las barcas sueltan amarras. Última llamada desde el muelle alto."
            speaker="narrator"
        [/message]
        [message]
            message="Falta la tuya. Suelta el cabo y salta."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Dejadme una copia del cuaderno. Alguien tendrá que detener lo que venga después."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Te dejo la copia con los nombres escritos. Ese es el cambio."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_hero"
            x="21"
            y="16"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [variable]
                name="cbm_losses"
                numerical_greater_than="3"
            [/variable]
            [then]
                [message]
                    message="No pierdas más de 3 unidades. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="26"
                    y="15"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="26"
                    y="15"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las barcas están fuera de la dársena. Falta la tuya."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Sube tú. Yo suelto el amarre."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Guardad el cuaderno donde se pueda leer. Aunque nadie sepa la tinta."
            speaker="narrator"
            caption="Último Custodio"
            image="cbm/portraits/ultimo-custodio.png"
        [/message]
        [message]
            message="Aprenderán. Eso también se enseña."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Nadie se queda atrás con una vela sin izar."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Nerea subió a la última barca y el muelle alto se hundió detrás de ella sin hacer ruido."
            speaker="narrator"
        [/message]
        [message]
            message="Nerea salió a un mar difícil y libre. En el cuaderno escribió el nombre de cada persona que había vuelto con ella, y después añadió los de quienes no volvieron y el de su madre al final, con letra clara para que nadie tuviera que adivinar. El cuaderno se mojó en la primera página, y esa fue la única tinta que se perdió. Delante de las barcas, las islas iban diciendo sus nombres en voz alta, unos por otros, hasta que el mar los devolvió escritos. Nerea los apuntó todos en el margen: un nombre nombrado a tiempo ya no lo borra ninguna marea."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="cbm_decide_nerea_12_1"
                equals="maquina-desmontada"
            [/variable]
            [then]
                [message]
                    message="Los nombres volvieron al mar y las islas se quedaron mudas. Nerea zarpó sin el cuaderno, porque un nombre que se devuelve no se puede contar dos veces."
                    speaker="narrator"
                [/message]
            [/then]
            [else]
                [message]
                    message="Las islas recuperaron nombres elegidos por sus habitantes. Nerea fundó una escuela de navegación donde el primer mapa se dibujaba escuchando a otro. Luar escribió el suyo bajo el agua, para que nadie pudiera llevárselo sin aprender a bucear."
                    speaker="narrator"
                [/message]
            [/else]
        [/if]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

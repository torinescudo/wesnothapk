[scenario]
    id="CBM_nerea_12"
    name="Nombres sobre el agua"
    next_scenario="null"
    map_file="nerea_12.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Las galerías se inundaron cuando regresó la marea natural. El último custodio quiso retener a Nerea para reiniciar el mecanismo. Las barcas aguardaban más allá de los muelles partidos. No viene a matar: viene a buscar la mano de quien conoce la firma, porque cree que Nerea es la única que puede volver a darla. El agua sube a la altura de la rodilla y el tablero de nombres del puerto aún cuelga de dos clavos."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Último Custodio."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 32."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="246"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Último Custodio"
        type="Naga Warrior"
        id="CBM_nerea_12_enemy"
        name="Último Custodio"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="172"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="4"
            y="19"
            image="items/gohere.png"
        [/item]
        [label]
            x="4"
            y="19"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Tu madre dejó una salida en los planos. La dibujó incluso cuando pensaba quedarse."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Entonces la usaremos. Su historia no tiene que terminar dos veces igual."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Objetivo: lleva a Nerea hasta la bandera del muelle alto. Después de esa bandera solo queda mar abierto."
            speaker="narrator"
        [/message]
        [message]
            message="Tu madre firmó el arranque y nadie volvió a firmar. Solo falta tu mano."
            speaker="narrator"
            caption="Último Custodio"
        [/message]
        [message]
            message="Mi mano escribe nombres, no contratos."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Sin contrato no hay calma. Vuestras islas vivirán con miedo al agua."
            speaker="narrator"
            caption="Último Custodio"
        [/message]
        [message]
            message="Con miedo y con nombres. Prefiero eso."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Que cada isla decida. Nosotros solo abrimos la puerta."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Las galerías se inundan en dos rondas. La salida está en el muelle alto y el agua ya cubre los primeros escalones."
            speaker="narrator"
        [/message]
        [message]
            message="Hay dos pasos: el de los planos y el del desagüe. El de los planos está vigilado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Vamos por el de los planos. Quiero que vea lo que dibujó mi madre."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="El cuaderno no os salvará. Ya no queda nadie que sepa leer esa tinta."
            speaker="narrator"
            caption="Último Custodio"
        [/message]
        [message]
            message="Quedan dos. Y una de ellas va a salir de aquí."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="En el muelle hay barcas cargadas. No te detengas a discutir con nadie."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El agua sube un escalón más. El tablero de nombres del puerto queda a la altura de los ojos."
            speaker="narrator"
        [/message]
        [message]
            message="Las letras están rascadas. Alguien quitó su nombre con una piedra."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Vuestra madre me pidió que la detuviera si volvía. Estoy cumpliendo su palabra."
            speaker="narrator"
            caption="Último Custodio"
        [/message]
        [message]
            message="Cumpliste. Yo también cumplo la mía, y la mía dice que salgamos todos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la caseta del práctico hay un cuaderno de bitácora con las últimas páginas arrancadas."
            speaker="narrator"
        [/message]
        [message]
            message="Las arrancó alguien que quería olvidar. Nosotros escribiremos encima."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Las barcas sueltan amarras. Última llamada desde el muelle alto."
            speaker="narrator"
        [/message]
        [message]
            message="Falta la tuya. Suelta el cabo y salta."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Dejadme una copia del cuaderno. Alguien tendrá que detener lo que venga después."
            speaker="narrator"
            caption="Último Custodio"
        [/message]
        [message]
            message="Te dejo la copia con los nombres escritos. Ese es el cambio."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_nerea_hero"
            x="4"
            y="19"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="25"
                    y="15"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="25"
                    y="15"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las barcas están fuera de la dársena. Falta la tuya."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Sube tú. Yo suelto el amarre."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Guardad el cuaderno donde se pueda leer. Aunque nadie sepa la tinta."
            speaker="narrator"
            caption="Último Custodio"
        [/message]
        [message]
            message="Aprenderán. Eso también se enseña."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Nadie se queda atrás con una vela sin izar."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Nerea subió a la última barca y el muelle alto se hundió detrás de ella sin hacer ruido."
            speaker="narrator"
        [/message]
        [message]
            message="Nerea salió a un mar difícil y libre. En el cuaderno escribió el nombre de cada persona que había vuelto con ella, y después añadió los de quienes no volvieron y el de su madre al final, con letra clara para que nadie tuviera que adivinar. El cuaderno se mojó en la primera página, y esa fue la única tinta que se perdió."
            speaker="narrator"
        [/message]
        [message]
            message="Las islas recuperaron nombres elegidos por sus habitantes. Nerea fundó una escuela de navegación donde el primer mapa se dibujaba escuchando a otro. Luar escribió el suyo bajo el agua, para que nadie pudiera llevárselo sin aprender a bucear."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

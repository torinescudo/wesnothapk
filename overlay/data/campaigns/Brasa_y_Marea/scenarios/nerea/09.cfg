[scenario]
    id="CBM_nerea_09"
    name="La flota de nadie"
    next_scenario="CBM_nerea_10"
    map_file="nerea_09.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Serkos reunió los barcos abandonados para apoderarse del mecanismo. Prometía mares tranquilos a quienes aceptaran olvidar la guerra que él mismo había iniciado. En cada casco ha mandado rascar el nombre y pintar encima una promesa: agua quieta, marea obediente, ninguna pérdida que recordar. Sus capitanes aceptan porque están cansados, no porque le crean, y la única bandera que aún dice algo en toda la flota es la suya."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Serkos, sin bandera."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 32."
            background="cbm/portraits/nerea.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="222"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Serkos, sin bandera"
        type="Naga Warrior"
        id="CBM_nerea_09_enemy"
        name="Serkos, sin bandera"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="4"
            y="17"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="4"
                    y="17"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="16"
        [/scroll_to]
        [message]
            message="Objetivo: derrota a Serkos y deshaz su flota antes de que cruce el estrecho."
            speaker="narrator"
        [/message]
        [message]
            message="Hay capitanes dispuestos a creerle. Están cansados."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Les ofreceremos un puerto al que volver sin entregar su pasado."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Os di el mar en calma y me llamasteis ladrón. Ahora vengo a cobrarlo con barcos."
            speaker="narrator"
            caption="Serkos, sin bandera"
        [/message]
        [message]
            message="Un mar en calma que borra a su gente no es un mar. Es una bodega."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="En mi flota nadie pregunta quién eras. Eso es libertad."
            speaker="narrator"
            caption="Serkos, sin bandera"
        [/message]
        [message]
            message="En los cascos habéis raspado los nombres. El nuestro sigue escrito, y por eso nos encontráis."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Ofreced a cada capitán un nombre para su barco. Es lo único que quieren."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Les ofrezco no perder a nadie más. Vosotros no podéis ofrecer eso."
            speaker="narrator"
            caption="Serkos, sin bandera"
        [/message]
        [message]
            message="Podemos ofrecer recordar a quien se pierda. Es distinto y es más."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="La flota avanza en dos líneas: delante los barcos sin nombre, detrás los que aún recuerdan."
            speaker="narrator"
        [/message]
        [message]
            message="Atacamos la segunda línea. Si los que recuerdan se rinden, los viejos no tendrán a quién seguir."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Mirad bien esa bandera. Es la única de la flota que dice algo, y dice mi nombre."
            speaker="narrator"
            caption="Serkos, sin bandera"
        [/message]
        [message]
            message="Entonces arriarla será lo primero que caiga."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="En la campana del barco viejos han limado el nombre. La campana sigue sonando igual."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Que la toquen ellos cuando quieran rendirse. Así la oímos todos."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Mis capitanes no luchan por mí. Luchan por no acordarse."
            speaker="narrator"
            caption="Serkos, sin bandera"
        [/message]
        [message]
            message="Pues dales algo mejor que el olvido. Un puerto y un nombre en el registro."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="En la casa del práctico hay una tablilla con los nombres de los barcos del puerto. Cinco están raspados."
            speaker="narrator"
        [/message]
        [message]
            message="Los apuntamos todos. Alguno volverá a flotar con su nombre puesto."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="La segunda línea se repliega hacia el estrecho. Queda una ronda para cortarle el paso."
            speaker="narrator"
        [/message]
        [message]
            message="Todas las velas al centro. No dejamos que cruce."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Sin bandera no hay almirante. Sin almirante no hay flota. Lo habéis entendido, ¿verdad?"
            speaker="narrator"
            caption="Serkos, sin bandera"
        [/message]
        [message]
            message="Lo hemos entendido. Y aun así te dejamos la bandera."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposicion se ha roto."
            speaker="narrator"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="37"
                    y="13"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="37"
                    y="13"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los barcos de la segunda línea han arriado velas."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Que cada capitán escriba el nombre de su barco antes de atracar."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Un capitán tardó una hora en recordar el suyo. Los demás le esperaron sin decir nada."
            speaker="narrator"
        [/message]
        [message]
            message="Serkos está en la cubierta del barco sin nombre. Pide hablar contigo."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Que suba. Y que traiga la bandera, para devolvérsela a quien la cosió."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La flota se rindió cuando sus tripulantes recordaron quién había confiscado sus barcos. Serkos entregó su bandera sin discutir y pidió que se la devolvieran a la sastra del puerto, que la había cosido veinte años atrás. Nerea la hizo colgar en la escuela de navegación con el nombre del barco debajo, para que nadie tuviera que preguntar de quién era."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_nerea_09"
    name="La flota de nadie"
    next_scenario="CBM_nerea_10"
    map_file="nerea_09.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Serkos reunió los barcos abandonados para apoderarse del mecanismo. Prometía mares tranquilos a quienes aceptaran olvidar la guerra que él mismo había iniciado."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="222"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Serkos, sin bandera"
        type="Naga Warrior"
        id="CBM_nerea_09_enemy"
        name="Serkos, sin bandera"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="3"
            y="9"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="3"
                    y="9"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_nerea_companion"
            message="Hay capitanes dispuestos a creerle. Están cansados."
        [/message]
        [message]
            speaker="CBM_nerea_hero"
            message="Les ofreceremos un puerto al que volver sin entregar su pasado."
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="20"
                    y="6"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="20"
                    y="6"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="La flota se rindió cuando sus tripulantes recordaron quién había confiscado sus barcos."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

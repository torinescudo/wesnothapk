[scenario]
    id="CBM_nerea_11"
    name="El último mar en calma"
    next_scenario="CBM_nerea_12"
    map_file="nerea_11.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/nerea-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/nerea-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Apagar el núcleo exigía mantener sus válvulas abiertas durante un ciclo completo. Los centinelas interpretaron la maniobra como una avería y atacaron a quienes la ejecutaban. El que guarda la sala no tiene nombre ni ley: repite una orden grabada en bronce. En la placa de los constructores el último renglón está raspado y vuelto a raspar con una uña, y debajo se adivina una fecha: el año en que empezaron las mareas quietas."
            background="cbm/portraits/nerea.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Centinela del Núcleo."
            background="cbm/story/nerea_11_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/nerea_11_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Nerea Vado"
        id="CBM_nerea_hero"
        name="Nerea Vado"
        type="CBM Hero nerea"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        gold="238"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_nerea_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Centinela del Núcleo"
        type="Naga Warrior"
        id="CBM_nerea_11_enemy"
        name="Centinela del Núcleo"
        canrecruit="yes"
        recruit="Naga Fighter,Naga Guard,Naga Warrior"
        gold="166"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Nerea Vado"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Luar"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Merman Fighter,Merman Hunter,Mermaid Initiate,Footpad,Bowman,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_nerea_companion"
            x="19"
            y="31"
        [/recall]
        [if]
            [have_unit]
                id="CBM_nerea_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Hunter"
                    id="CBM_nerea_companion"
                    name="Luar"
                    side="1"
                    x="19"
                    y="31"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="19"
            y="30"
        [/scroll_to]
        [message]
            message="Objetivo: mantén a Nerea con vida hasta el comienzo del turno doce. Las válvulas deben seguir abiertas."
            speaker="narrator"
        [/message]
        [message]
            message="Después habrá tormentas. No podremos prometer que todos regresen de cada viaje."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Podremos prometer que los recordaremos."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Orden: mantener el mar en calma. No consta ninguna excepción."
            speaker="narrator"
            caption="Centinela del Núcleo"
            image="cbm/portraits/centinela-del-nucleo.png"
        [/message]
        [message]
            message="La excepción está escrita en tu propia placa. Mírala."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="La placa está incompleta. La orden no lo está."
            speaker="narrator"
            caption="Centinela del Núcleo"
            image="cbm/portraits/centinela-del-nucleo.png"
        [/message]
        [message]
            message="El renglón raspado llevaba un nombre. Debajo hay una fecha, y la fecha es el año en que el mar se quedó quieto."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Ese nombre es el de mi madre. Firmó la máquina y luego intentó pararla. Las dos cosas caben en la placa."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Las válvulas están en tres salas. Una unidad por válvula y el grupo de Nerea aguantando el centro."
            speaker="narrator"
        [/message]
        [message]
            message="Los centinelas no se cansan. Nosotros sí. Relevad a la gente cada cuatro turnos."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Los heridos al pasillo del agua dulce. Hasta allí no llegan."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Habéis venido a apagar lo que dio de comer a estas islas. Contadlo también."
            speaker="narrator"
            caption="Centinela del Núcleo"
            image="cbm/portraits/centinela-del-nucleo.png"
        [/message]
        [message]
            message="Lo contaremos todo. Empezando por lo que costó."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Si las válvulas se cierran, el núcleo vuelve a arrancar. No cedáis el centro."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="En la placa de bronce hay cuatro nombres de constructores y un quinto raspado."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Adivino cuál es. Sigue leyendo, que yo cubro la puerta."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Vuestra madre raspó su nombre para que la máquina no la reclamara. Sigue reclamándola."
            speaker="narrator"
            caption="Centinela del Núcleo"
            image="cbm/portraits/centinela-del-nucleo.png"
        [/message]
        [message]
            message="Entonces volveré a escribirlo, y que reclame lo que quiera."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Los centinelas han tomado el pasillo oeste. El centro de la sala queda expuesto."
            speaker="narrator"
        [/message]
        [message]
            message="Dos heridos fuera y una válvula sin relevo. Aguanta tres turnos más."
            speaker="CBM_nerea_companion"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Última ronda. Las válvulas siguen abiertas y el núcleo aún no ha vuelto a arrancar."
            speaker="narrator"
        [/message]
        [message]
            message="Nadie se mueve del centro. Ni un paso."
            speaker="CBM_nerea_hero"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_nerea_11_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Guard"
                    side="2"
                    x="18"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_nerea_11_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Naga Warrior"
                    side="2"
                    x="18"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_nerea_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_nerea_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_nerea_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El núcleo se ha enfriado. No ha hecho ruido al morir."
            speaker="CBM_nerea_companion"
        [/message]
        [message]
            message="Mi madre raspó su nombre aquí. Deberíamos volver a escribirlo."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Sin orden no tengo función. ¿Qué se hace cuando el mar deja de obedecer?"
            speaker="narrator"
            caption="Centinela del Núcleo"
            image="cbm/portraits/centinela-del-nucleo.png"
        [/message]
        [message]
            message="Se aprende a nadar."
            speaker="CBM_nerea_hero"
        [/message]
        [message]
            message="Por primera vez en décadas, una ola rompió sin obedecer a una máquina."
            speaker="narrator"
        [/message]
        [message]
            message="El núcleo se enfrió. Por primera vez en décadas, una ola rompió sin obedecer a una máquina. Nerea raspó la sal de la placa hasta encontrar el renglón borrado y escribió encima el nombre de su madre, Aldara Vado, con la punta de un cuchillo. Luar añadió la fecha. El centinela miró hacerlo y no dijo nada, porque ya no tenía orden que recitar."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_iria_01"
    name="Un mediodía negro"
    next_scenario="CBM_iria_02"
    map_file="iria_01.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Iria descubrió que la tinta de su mapa se secaba antes que el trigo. Una estructura alada tapaba el sol y guerreros de cuatro brazos descendían a buscar los cristales de los molinos."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recolectora Thess"
        type="CBM Velario Arconte"
        id="CBM_iria_01_enemy"
        name="Recolectora Thess"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [unit]
            type="Elvish Shaman"
            id="CBM_iria_companion"
            name="Belis"
            side="1"
            x="3"
            y="10"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [message]
            speaker="CBM_iria_companion"
            message="Las raíces sienten frío. No es una nube: alguien está llevándose el día."
        [/message]
        [message]
            speaker="CBM_iria_hero"
            message="Resistiremos hasta evacuar a los segadores. Luego dibujaré de dónde viene esa sombra."
        [/message]
        [message]
            speaker="narrator"
            message="Crónicas de la Brasa y la Marea. Historia original en español. Las decisiones tácticas, las bajas y la experiencia se conservan entre escenarios. Puedes guardar la partida en cualquier turno."
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            speaker="CBM_iria_hero"
            message="¡Se ha cumplido el plazo! Podemos completar la retirada."
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Una lanza rota conservaba luz en su interior. Belis oyó un corazón al acercarla a una semilla."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

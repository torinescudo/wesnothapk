[scenario]
    id="CBM_iria_01"
    name="Un mediodía negro"
    next_scenario="CBM_iria_02"
    map_file="iria_01.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Iria descubrió que la tinta de su mapa se secaba antes que el trigo. Era cartógrafa de oficio: medía tierras por encargo y cobraba por los nombres bien puestos, y llevaba cinco años intentando entregar la carta de la comarca antes del otoño. Una estructura alada tapaba el sol y guerreros de cuatro brazos descendían a buscar los cristales de los molinos. La sombra no viajaba como una nube: avanzaba en línea recta y se detenía donde terminaban las eras, y en cuanto se detenía, los campos perdían color y los nombres de los pagos se borraban con la tinta todavía fresca. Iria ató una piedra a su cuerda de medir y comprobó que la mancha crecía cada vez que un velario tocaba el prisma del molino. Cada salida a medirla le costaba su única garrafa de tinta buena y una jornada de encargos que nadie iba a pagarle. A la una midió la sombra y a las dos volvió a medirla: otro palmo de trigal borrado, siempre en dirección al río, y los segadores aún esperando su turno de cruzar. La carta de la comarca ya no era solo su trabajo: era lo único que quedaba escrito de aquella tierra, y para defenderla primero tendría que dejar los tres molinos del llano sin un solo prisma encendido."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Recolectora Thess."
            background="cbm/story/iria_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/iria_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recolectora Thess"
        type="CBM Velario Arconte"
        id="CBM_iria_01_enemy"
        name="Recolectora Thess"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [unit]
            type="Elvish Shaman"
            id="CBM_iria_companion"
            name="Belis"
            side="1"
            x="4"
            y="14"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="13"
        [/scroll_to]
        [message]
            message="Las raíces sienten frío. No es una nube: alguien está llevándose el día."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Resistiremos hasta evacuar a los segadores. Luego dibujaré de dónde viene esa sombra."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Los segadores cruzan el río en tres tandas. Aguantad los doce turnos que tardan en pasar y nadie quedará bajo la sombra."
            speaker="narrator"
        [/message]
        [message]
            message="Traemos la cuota del distrito alto. Cada vela de esta nave da de beber a un barrio entero; no venimos a matar, venimos a cobrar."
            speaker="CBM_iria_01_enemy"
        [/message]
        [message]
            message="Enséñame esa cuenta. Los molinos también riegan los campos de aquí abajo, y esos campos no vuelan."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="La cuenta es simple: doscientos cristales por nave, treinta naves al mes. Si no la lleno, me la quitan a mí y la llena otro que no pregunta."
            speaker="CBM_iria_01_enemy"
        [/message]
        [message]
            message="Hay algo vivo dentro del cristal. Late, como una semilla al sol."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="La sombra tarda seis turnos en girar. Mientras gire, la aldea no recibe luz ni agua de la acequia."
            speaker="narrator"
        [/message]
        [message]
            message="Belis, marca los prismas de cada molino. Quiero saber cuál se apaga primero."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El del norte. Ya pierde color por la junta."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Cuando una ciudad del cielo desciende, no baja vacía: apiña tres mil vecinos en caminos que ya tienen dueño y seca el acueducto que comparte con los pueblos."
            speaker="narrator"
        [/message]
        [message]
            message="Por eso dibujo los caminos antes que las batallas. Un mapa cuenta cuánta agua hay para todos."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="No me hables de mapas. El mío dice que si no subo la cuota, el consejo suelta lastre, y el lastre son personas."
            speaker="CBM_iria_01_enemy"
        [/message]
        [message]
            message="Entonces sube la cuota de otra parte. Aquí abajo solo hay trigo y gente."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Thess tiene razón en una cosa: si su nave se apaga, alguien pagará por ello. Solo que no elegiremos nosotros a quién."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Que sea ella la primera que mire a los ojos de los que paga."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="El robledal parte la sombra en parches: entre troncos aún cae luz, pero las eras del camino quedan cubiertas enteras. Thess estira la mancha hacia el vado para que los segadores no crucen."
            speaker="narrator"
        [/message]
        [message]
            message="Cubrir el vado deja la aldea a oscuras; cubrir la aldea cierra el vado con la tercera tanda fuera. Elegid una antes de que la nave termine de girar."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 3"
        [message]
            message="La sombra gira sobre el molino del norte. El cristal pierde color por la junta."
            speaker="narrator"
        [/message]
        [message]
            message="Si me lo entregáis entero, prometo dejar la aldea fuera de la próxima cuenta."
            speaker="CBM_iria_01_enemy"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Quitad los prismas del molino y ponedlos a la sombra. Que la luz vuelva al canal."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El agua vuelve a la acequia; los segadores pueden beber mientras cruzan."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="La nave está inclinándose. Si sigue así, soltará lastre sobre los campos."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Que suelten. Nosotros ya tenemos los molinos mapeados y ellos no tienen el río."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Contad la luz que os queda antes de jugárosla: treinta naves esperan su cuota y el consejo cobra doble lo que se entrega tarde. Si me rendís los prismas hoy, la aldea sale del recuento un año entero."
            speaker="CBM_iria_01_enemy"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Última tanda de segadores en el vado. Queda un turno para que la sombra llegue al río."
            speaker="narrator"
        [/message]
        [message]
            message="Todos al agua. Dejamos las lanzas si hace falta, pero no a nadie atrás."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No era la guerra. Era la cuota del distrito alto, y ahora no la cobra nadie."
            speaker="CBM_iria_01_enemy"
        [/message]
        [message]
            message="Que la cobre quien sepa cuánta agua hay. Yo te dejo la cuenta abierta."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los segadores han cruzado. Nadie ha quedado bajo la sombra."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="He dibujado el giro de la nave. Tres veces al día, siempre sobre el mismo punto."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="En el cielo, la ciudad de Thess ya recorta su cuota en otro valle. En el suelo, la acequia vuelve a llenarse."
            speaker="narrator"
        [/message]
        [message]
            message="La lanza rota aún guarda luz. Puedo oírla latir."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Guárdala. La primera estrella de un mapa se planta donde menos se espera."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Una lanza rota conservaba luz en su interior. Belis oyó un corazón al acercarla a una semilla. Iria añadió al mapa la primera línea honesta: la ruta de la sombra, con horas y con nombres. Alguien del cielo la leería algún día, y no le gustaría. Clavó la lanza junto al molino del norte y toda la noche la junta herida del cristal latió despacio, en compás con la semilla. Al amanecer dibujó los tres molinos del llano y escribió al lado el orden de los prismas: sur, centro, norte, uno por noche. Sabía que cada prisma apagado era un barrio que bajaría buscando agua, y firmó la lista sin tachar nada."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

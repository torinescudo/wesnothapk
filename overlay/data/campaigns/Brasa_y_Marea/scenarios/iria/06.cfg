[scenario]
    id="CBM_iria_06"
    name="La torre de los acreedores"
    next_scenario="CBM_iria_07"
    map_file="iria_06.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Sesher exigió otro invierno de oscuridad a cambio de negociar. Iria reunió a quienes habían trabajado en los anclajes para tomar su torre y abrir los registros de consumo."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="198"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Arconte Sesher"
        type="CBM Velario Arconte"
        id="CBM_iria_06_enemy"
        name="Arconte Sesher"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor,CBM Velario Prisma"
        gold="136"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="3"
            y="13"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="3"
                    y="13"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_iria_companion"
            message="Dirá que el cielo le pertenece porque sus antepasados lo levantaron."
        [/message]
        [message]
            speaker="CBM_iria_hero"
            message="Entonces leerá cuántos inviernos llevan pagándolo los nuestros."
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Prisma"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Cantor"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Los registros mostraron que el palacio gastaba más luz que seis barrios. La guardia de Sesher abandonó sus puestos al conocer los números."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

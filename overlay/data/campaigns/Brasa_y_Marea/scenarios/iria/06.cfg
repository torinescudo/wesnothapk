[scenario]
    id="CBM_iria_06"
    name="La torre de los acreedores"
    next_scenario="CBM_iria_07"
    map_file="iria_06.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Sesher exigió otro invierno de oscuridad a cambio de negociar. Iria reunió a quienes habían trabajado en los anclajes para tomar su torre y abrir los registros de consumo. La torre tenía tres patios y una sola puerta, y en la puerta un escriba anotaba cada nombre que entraba. Iria se detuvo a leer la lista y reconoció tres apellidos de su propio pueblo. El escriba escribía despacio, con tinta comprada a plazos, y junto a cada nombre iban la fecha y la deuda: para Iria, que había ganado la vida poniendo linderos en un papel, aquello era un mapa al revés. Arriba, el libro de consumo guardaba cuatro columnas de cifras que nadie había cruzado nunca. Si las cruzaban aquella noche, la palabra «oscuridad» dejaría de ser un castigo para convertirse en una cuenta con deudor y todo."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Arconte Sesher."
            background="cbm/story/iria_06_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 38."
            background="cbm/story/iria_06_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="198"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Arconte Sesher"
        type="CBM Velario Arconte"
        id="CBM_iria_06_enemy"
        name="Arconte Sesher"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor,CBM Velario Prisma"
        gold="136"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.8"
            caution="0.25"
            attack_depth="4"
            leader_value="6"
            village_value="3"
            recruitment_pattern="fighter,archer,fighter,scout"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_iria_06_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_iria_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="fighter"
                    x,y="47,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="4"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="4"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="31"
        [/scroll_to]
        [message]
            message="Dirá que el cielo le pertenece porque sus antepasados lo levantaron."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Entonces leerá cuántos inviernos llevan pagándolo los nuestros."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Tomad la torre y abrid la cámara de registros. El libro de consumo está en la sala alta; sin él no hay prueba."
            speaker="narrator"
        [/message]
        [message]
            message="Los antepasados que levantaron esta ciudad pagaron con sus pulmones cada codo de altura. ¿Y ahora queréis que baje porque a vosotros os da sombra?"
            speaker="CBM_iria_06_enemy"
        [/message]
        [message]
            message="Quiero que baje donde haya agua. Tu legado no riega ningún campo."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El legado no se riega. Se hereda. Vosotros no heredasteis nada porque nunca construisteis nada alto."
            speaker="CBM_iria_06_enemy"
        [/message]
        [message]
            message="Su voz tiembla al decir alto. No es orgullo: es vértigo."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Vértigo cuesta arriba o cuesta abajo, da igual. Los libros dirán cuál de los dos le pagó sus torres."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="La guardia de Sesher defiende los tres patios. Ninguno ha visto los registros que guarda."
            speaker="narrator"
        [/message]
        [message]
            message="Belis, abre la puerta de la cámara y no la cierres. Quiero testigos, no secretos."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Hay cuentas que sostienen una ciudad. Si las sacáis a la luz, se rompe la confianza y con ella el techo."
            speaker="CBM_iria_06_enemy"
        [/message]
        [message]
            message="Cuando una ciudad del cielo se asienta sin planificar, sus vecinos se apilan en los graneros, el agua se compra por turnos y el acueducto del pueblo revienta antes del verano."
            speaker="narrator"
        [/message]
        [message]
            message="Por eso quiero los registros: para saber cuánta agua cabe antes de bajar a nadie."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Y para saber quién bebió de la que no le tocaba."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Eso lo dirá el libro. Yo solo paso las páginas."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="La torre tiene tres patios y una sola puerta: quien controla la puerta manda en los tres, pero en ella también se amontonan. La sala alta se ve desde el patio segundo."
            speaker="narrator"
        [/message]
        [message]
            message="Podemos tomar los patios uno a uno y llegar con el libro intacto, o ir derechos a la sala y dejar la espalda abierta. Elegid: hoy el libro vale más que la torre."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Un patio tomado. La cámara de registros está en el siguiente."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="Alto a mis hombres: nadie sube a la sala alta. Prefiero quemar el libro antes que verlo en vuestras manos."
            speaker="CBM_iria_06_enemy"
        [/message]
        [message]
            message="Entonces el libro vale más de lo que dice. Subid, y subid rápido."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Los guardias oyen las cifras desde el patio: seis barrios gastan menos luz que el palacio de Sesher."
            speaker="narrator"
        [/message]
        [message]
            message="Ese libro sostiene la confianza de cuarenta mil personas. Pesad bien lo que vale una página: si sale de la torre, la ciudad baja sola y el hambre os cobra el papel."
            speaker="CBM_iria_06_enemy"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="La sala alta se atranca. Queda un turno para abrir el libro antes de que lo quemen."
            speaker="narrator"
        [/message]
        [message]
            message="Que quemen las tapas. Las cifras ya las he copiado en el brazo."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No he robado. He administrado. La ciudad vive porque alguien decide quién sobra."
            speaker="CBM_iria_06_enemy"
        [/message]
        [message]
            message="Tu libro decide muy bien quién sobra. Empieza siempre por los que no firman."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [have_unit]
                id="CBM_iria_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Prisma"
                    side="2"
                    x="46"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Cantor"
                    side="2"
                    x="46"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El libro está abierto en la mesa y la guardia lo está leyendo."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Un guardia señaló una línea con el dedo: el palacio consumía más luz que seis barrios juntos."
            speaker="narrator"
        [/message]
        [message]
            message="Copiad esa página. Es el único mapa que nos faltaba: el de quién paga."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Los guardias han dejado las lanzas en el suelo. No han dicho nada, y eso dice mucho."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Dejadlas donde están. Ya no hacen falta para leer."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Los registros mostraron que el palacio gastaba más luz que seis barrios. La guardia de Sesher abandonó sus puestos al conocer los números. Iria copió las cuatro columnas del libro en una sola tabla y la clavó en la puerta de la torre, para que el siguiente que entrara supiera de antemano cuánto le iban a cobrar. Los guardias se llevaron copias dobladas dentro del casco, y esa fue toda la ceremonia. Pero en el puerto quedaban tres cabrestantes viejos bajo la misma facción que juraba no bajar nunca, y en los muelles las familias velarias esperaban sobre plataformas que crujían. Iria afiló el lápiz de la tabla: la última resta se llamaría «muelle» y se firmaría con el agua a la vista de todos."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

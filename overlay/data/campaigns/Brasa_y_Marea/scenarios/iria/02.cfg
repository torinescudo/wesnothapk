[scenario]
    id="CBM_iria_02"
    name="Los molinos sin sombra"
    next_scenario="CBM_iria_03"
    map_file="iria_02.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Tres molinos concentraban la cosecha de luz. Iria decidió desconectar sus prismas antes de atacar la estructura suspendida. Los velarios defendían cada eje como si fuera una cuna. Cada molino alimentaba una ciudad distinta, y las tres ciudades, juntas, sumaban dos millones de alas. Iria escribió en el margen los nombres de las aldeas que bebían del mismo acueducto y comprobó que ninguna figuraba en los mapas velarios. Al mediodía pesó un prisma suelto en la palma: caliente, con algo latiendo dentro y una marca de sello en la base que solo se veía al trasluz. Iria ordenó los depósitos de sur a norte y se repitió la regla en voz alta: apagar sin romper, porque un depósito roto no vuelve a encenderse. Aceptó de antemano lo que costaba: cada depósito apagado era una ciudad que perdía altura, y dos millones de alas aprenderían a leer su nombre en el registro del hambre."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de llanura. Al frente: Custodio Oth."
            background="cbm/story/iria_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 22."
            background="cbm/story/iria_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="166"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Custodio Oth"
        type="CBM Velario Arconte"
        id="CBM_iria_02_enemy"
        name="Custodio Oth"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_iria_02_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_iria_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="9"
            y="21"
            image="items/brazier.png"
        [/item]
        [label]
            x="9"
            y="21"
            text="Punto 1"
        [/label]
        [item]
            x="22"
            y="20"
            image="items/brazier.png"
        [/item]
        [label]
            x="22"
            y="20"
            text="Punto 2"
        [/label]
        [item]
            x="14"
            y="13"
            image="items/brazier.png"
        [/item]
        [label]
            x="14"
            y="13"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="4"
            y="22"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="4"
                    y="22"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="21"
        [/scroll_to]
        [message]
            message="Hay voces dentro de los cristales. Están manteniendo algo vivo."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Desconectaremos los molinos sin romper los depósitos. Necesitamos respuestas, no ruinas."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Encended los tres depósitos en orden, de sur a norte, antes de que Oth reciba refuerzos. Cada depósito apagado es una ciudad que pierde altura."
            speaker="narrator"
        [/message]
        [message]
            message="Los tres haces sostienen cuarenta mil personas. No es una amenaza: es una resta. Si me quitáis un molino, caen catorce mil."
            speaker="CBM_iria_02_enemy"
        [/message]
        [message]
            message="Y si te dejo los tres, se mueren de sed dos valles. Enséñame el número que falta en esa resta."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El número que falta sois vosotros. Vuestra cosecha, vuestro río, vuestra agua. Lo demás son decimales."
            speaker="CBM_iria_02_enemy"
        [/message]
        [message]
            message="Los cristales no guardan luz: guardan años. Cada uno es un verano que no volverá a estos campos."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="La estructura suspendida pierde un codo de altura por cada molino que deja de girar. Oth lo repite a sus hombres como una plegaria."
            speaker="narrator"
        [/message]
        [message]
            message="Belis, no me interesa su miedo. Me interesa su aritmética: quiero los tres depósitos encendidos y las dos aldeas enteras."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El del sur está minado. Si lo forzamos, el depósito revienta y con él el canal."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Cuando una ciudad del cielo baja por falta de luz, sus barrios se apiñan en los rellanos, las fuentes se racionan por horas y el acueducto que compartía con el pueblo sirve a dos ciudades a la vez."
            speaker="narrator"
        [/message]
        [message]
            message="Eso quiero ver escrito abajo: cuánta agua se reparte, no cuánta se roba."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Escribiréis mi derrota y la llamaréis justicia. Arriba se llamará hambre, y el hambre tiene la memoria larga."
            speaker="CBM_iria_02_enemy"
        [/message]
        [message]
            message="Entonces que la memoria sea de los dos lados. Yo firmo mis mapas; firma tú los tuyos."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Oth no firma nada. Los custodios no escriben: solo impiden que otros escriban."
            speaker="CBM_iria_companion"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="El llano no da sombra: los tres depósitos se ven desde la estructura suspendida y Oth puede apuntar a cualquiera. El canal del sur está minado y revienta junto a su depósito."
            speaker="narrator"
        [/message]
        [message]
            message="Ir todos juntos de sur a norte deja el llano a la vista pero corta el agua de Oth al final; con media guardia en el sur cubrimos los dos frentes y llegamos tarde al norte. Elegid antes del primer depósito."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Asegurad el pozo. Si la ciudad baja aquí, este pozo es lo primero que habrá que compartir."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="He cortado el canal para que no bebáis mientras me quitáis la luz. Ahora pagamos los dos."
            speaker="CBM_iria_02_enemy"
        [/message]
        [message]
            message="Abre ese canal y te prometo que tus depósitos no se rompen."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No he defendido una fortaleza. He defendido una resta que no me dejaba ganar."
            speaker="CBM_iria_02_enemy"
        [/message]
        [message]
            message="Nadie te pidió que ganaras. Te pedí que contaras bien."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="9"
            y="21"
        [/filter]
        [remove_item]
            x="9"
            y="21"
        [/remove_item]
        [item]
            x="9"
            y="21"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="9"
            y="21"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primer depósito encendido. La estructura suspendida baja un codo y se oye un rumor de correas tensándose."
            speaker="narrator"
        [/message]
        [message]
            message="Ese rumor son cuarenta mil personas agarrándose a una barandilla. Contádselo a vuestro mapa."
            speaker="CBM_iria_02_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="22"
            y="20"
        [/filter]
        [remove_item]
            x="22"
            y="20"
        [/remove_item]
        [item]
            x="22"
            y="20"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="22"
            y="20"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Segundo depósito. Los barrios del cielo se mueven: los veo apiñarse en los rellanos."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Dos de tres. Queda el del norte, y es el que alimenta el acueducto de las Dos Villas."
            speaker="CBM_iria_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="14"
            y="13"
        [/filter]
        [remove_item]
            x="14"
            y="13"
        [/remove_item]
        [item]
            x="14"
            y="13"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="14"
            y="13"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [have_unit]
                        id="CBM_iria_hero"
                        formula="hitpoints * 2 < max_hitpoints"
                    [/have_unit]
                    [then]
                        [message]
                            message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="34"
                    y="3"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="34"
                    y="3"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los tres depósitos giran otra vez. El agua vuelve a las Dos Villas."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Desde abajo, la estructura suspendida recupera altura, pero más despacio que antes."
            speaker="narrator"
        [/message]
        [message]
            message="He medido la subida con la cuerda: once codos en una noche. Con esa cifra se puede negociar."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Me llamo Esh. Traigo una cría que no sabe plegar las alas; no he venido a pelear, he venido a que alguien cuente lo que acabáis de apagar."
            speaker="narrator"
            caption="Esh"
            image="cbm/portraits/esh.png"
        [/message]
        [message]
            message="Entonces siéntate donde pueda verte. Tengo preguntas y tú tienes cifras."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Al volver el flujo, un velario aterrizó sin armas. Se llamaba Esh y llevaba una cría demasiado débil para plegar las alas. Iria le dio el sitio seco junto al fuego y le pidió que repitiera, despacio, cuánta luz consumía una ciudad en un año. Esh la dijo tres veces, con las cifras exactas, y la cría repetía el último número como si fuera una canción. Fuera, la estructura suspendida recuperaba altura palmo a palmo mientras los depósitos volvían a girar. Iria escribió la cifra en el margen del mapa y tachó «consumía» para poner «debe»: nadie gasta un año de luz de dos valles sin deberlo. Y una cifra dicha en voz alta junto a un fuego cualquiera empezó a parecerse demasiado a una fecha de juicio."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

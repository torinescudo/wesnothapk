[scenario]
    id="CBM_iria_03"
    name="El prisionero del viento"
    next_scenario="CBM_iria_04"
    map_file="iria_03.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Esh fue capturado por quienes prohibían hablar con los habitantes del suelo. En su juicio no lo acusaron de traición, sino de haber revelado que las ciudades del cielo estaban muriendo."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Jueza Veyth"
        type="CBM Velario Arconte"
        id="CBM_iria_03_enemy"
        name="Jueza Veyth"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="25"
            y="2"
            image="items/gohere.png"
        [/item]
        [label]
            x="25"
            y="2"
            text="Destino"
        [/label]
        [item]
            x="9"
            y="4"
            image="items/cage.png"
        [/item]
        [label]
            x="9"
            y="4"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="14"
            y="14"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="14"
                    y="14"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_iria_companion"
            message="Si lo liberamos, también tendremos que escuchar lo que no queremos oír."
        [/message]
        [message]
            speaker="CBM_iria_hero"
            message="Un mapa que oculta la mitad del terreno solo sirve para perderse."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="9"
            y="4"
        [/filter]
        [remove_item]
            x="9"
            y="4"
        [/remove_item]
        [unit]
            type="CBM Velario Vigia"
            id="CBM_iria_03_protected"
            name="Esh"
            side="1"
            x="9"
            y="5"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [message]
            speaker="CBM_iria_03_protected"
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_iria_03_protected"
            x="25"
            y="2"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_iria_03_protected"
        [/filter]
        [message]
            speaker="narrator"
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Esh contó que los velarios habían gastado sus reservas durante una guerra lejana. El consejo prefería robar estaciones enteras antes que admitir que debían aterrizar."
        [/message]
        [kill]
            id="CBM_iria_03_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

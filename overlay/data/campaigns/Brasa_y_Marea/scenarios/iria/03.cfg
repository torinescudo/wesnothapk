[scenario]
    id="CBM_iria_03"
    name="El prisionero del viento"
    next_scenario="CBM_iria_04"
    map_file="iria_03.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Esh fue capturado por quienes prohibían hablar con los habitantes del suelo. En su juicio no lo acusaron de traición, sino de haber revelado que las ciudades del cielo estaban muriendo. La sala del tribunal era una nave vacía con las vigas a la vista, y cada viga llevaba grabado el nombre de un barrio. Iria contó once nombres y ninguno se repetía."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Jueza Veyth."
            background="cbm/portraits/iria.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 32."
            background="cbm/portraits/iria.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Jueza Veyth"
        type="CBM Velario Arconte"
        id="CBM_iria_03_enemy"
        name="Jueza Veyth"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="31"
            y="31"
            image="items/gohere.png"
        [/item]
        [label]
            x="31"
            y="31"
            text="Destino"
        [/label]
        [item]
            x="15"
            y="22"
            image="items/cage.png"
        [/item]
        [label]
            x="15"
            y="22"
            text="Prision"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="23"
            y="31"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="23"
                    y="31"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="23"
            y="30"
        [/scroll_to]
        [message]
            message="Si lo liberamos, también tendremos que escuchar lo que no queremos oír."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Un mapa que oculta la mitad del terreno solo sirve para perderse."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El tribunal dicta sentencia al amanecer. Sacad a Esh de la sala y llevadlo al portón agrietado antes del fallo."
            speaker="narrator"
        [/message]
        [message]
            message="No juzgo a un traidor. Juzgo a un velario que dijo en voz alta que el cielo pesa menos cada año."
            speaker="CBM_iria_03_enemy"
        [/message]
        [message]
            message="Y por decirlo, ¿qué pena? ¿Que el resto se entere?"
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Que el resto se tire por un balcón. Lo he visto pasar una vez y no pienso verlo dos."
            speaker="CBM_iria_03_enemy"
        [/message]
        [message]
            message="La jueza no miente. Su miedo tiene fecha y nombre."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Entonces no discutiremos su miedo. Le enseñaremos la salida y que se atreva a mirarla."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="La ciudad no baja porque no sepamos hacerlo. Baja porque nadie quiere ser el que lo anuncie."
            speaker="CBM_iria_03_enemy"
        [/message]
        [message]
            message="Anúncialo tú. Yo lo dibujo y tú lo anuncias. Repartimos el oficio."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Esh está en la celda de las vigas, con las alas plegadas. Tiene fiebre y no podrá volar en dos días."
            speaker="narrator"
        [/message]
        [message]
            message="Puedo andar. Solo no puedo volar. No me llevéis por el aire, que me caigo del mapa."
            speaker="CBM_iria_03_protected"
        [/message]
        [message]
            message="Cuando una ciudad del cielo se asienta junto a un pueblo, sus familias se apilan en las eras, las fuentes se cuentan por cubos y el acueducto viejo revienta en la primera sequía."
            speaker="narrator"
        [/message]
        [message]
            message="Por eso se mide el agua antes de bajar a nadie. Belis, cuenta los aljibes del pueblo y guárdame el número."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Cuarenta y dos. Con la ciudad encima, caben veinte."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Ese número es mi mapa. Ahora hay que hacer que la jueza lo vea."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_iria_03_protected"
            hitpoints_percentage_less="50"
        [/filter]
        [message]
            message="No puedo correr. Dejadme y llevad los planos del anclaje."
            speaker="CBM_iria_03_protected"
        [/message]
        [message]
            message="Los planos se copian. Tú no. Sigue andando."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He cerrado el portón agrietado. Si lo rompéis, la sala se derrumba con el acusado dentro."
            speaker="CBM_iria_03_enemy"
        [/message]
        [message]
            message="La sentencia se lee en dos turnos. El portón tarda uno en abrirse con la palanca."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Un aljibe asegurado. Con veinte más, el pueblo aguanta la ciudad encima."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Leed mi sentencia y llamadla miedo. Llevará vuestro nombre y será el nombre correcto."
            speaker="CBM_iria_03_enemy"
        [/message]
        [message]
            message="Que se lea entera. También la parte donde dice que la ciudad baja sola."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Suena la campana de la sentencia. Queda un turno para sacar a Esh por el portón."
            speaker="narrator"
        [/message]
        [message]
            message="Todos al portón. Si no cabe, salgo yo el último y ya está."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="15"
            y="22"
        [/filter]
        [remove_item]
            x="15"
            y="22"
        [/remove_item]
        [unit]
            type="CBM Velario Vigia"
            id="CBM_iria_03_protected"
            name="Esh"
            side="1"
            x="15"
            y="23"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta esta abierta. Acompanadme hasta la bandera; no podre llegar sin ayuda."
            speaker="CBM_iria_03_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_iria_03_protected"
            x="31"
            y="31"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="22"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Lancero"
                    side="2"
                    x="22"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_iria_03_protected"
        [/filter]
        [message]
            message="La persona que debias proteger ha muerto. La mision ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El portón era el único sitio bajo. Lo sabíais. Gracias."
            speaker="CBM_iria_03_protected"
        [/message]
        [message]
            message="La jueza no ha huido. Está mirando cómo salimos."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Que mire. En dos días podrá volar y le contaremos lo que vimos desde el muro."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Esh pronunció por primera vez una palabra del suelo: aljibe. La repitió hasta aprendérsela."
            speaker="narrator"
        [/message]
        [message]
            message="Y yo aprendí la vuestra: lastre. Ninguna de las dos es bonita."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Esh contó que los velarios habían gastado sus reservas durante una guerra lejana. El consejo prefería robar estaciones enteras antes que admitir que debían aterrizar. Iria anotó la fecha de la guerra en el borde del mapa: era la misma que la del primer verano sin cosecha en su pueblo."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_iria_03_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_iria_07"
    name="Donde termina la sombra"
    next_scenario="null"
    map_file="iria_07.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La facción que rechazaba el descenso bloqueó los tres anclajes del puerto. Iria y Belis debían sincronizarlos mientras las familias velarias esperaban sobre plataformas que crujían."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="206"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Vigía de la Última Altura"
        type="CBM Velario Arconte"
        id="CBM_iria_07_enemy"
        name="Vigía de la Última Altura"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor,CBM Velario Prisma"
        gold="142"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="9"
            y="4"
            image="items/brazier.png"
        [/item]
        [label]
            x="9"
            y="4"
            text="Punto 1"
        [/label]
        [item]
            x="23"
            y="9"
            image="items/brazier.png"
        [/item]
        [label]
            x="23"
            y="9"
            text="Punto 2"
        [/label]
        [item]
            x="5"
            y="9"
            image="items/brazier.png"
        [/item]
        [label]
            x="5"
            y="9"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="14"
            y="16"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="14"
                    y="16"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_iria_companion"
            message="Cuando aterricen, habrá menos cielo y mucha más gente en nuestros caminos."
        [/message]
        [message]
            speaker="CBM_iria_hero"
            message="Habrá vecinos. Los mapas sirven para encontrarles sitio."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="9"
            y="4"
        [/filter]
        [remove_item]
            x="9"
            y="4"
        [/remove_item]
        [item]
            x="9"
            y="4"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="23"
            y="9"
        [/filter]
        [remove_item]
            x="23"
            y="9"
        [/remove_item]
        [item]
            x="23"
            y="9"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="5"
            y="9"
        [/filter]
        [remove_item]
            x="5"
            y="9"
        [/remove_item]
        [item]
            x="5"
            y="9"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Prisma"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Cantor"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Las ciudades tocaron tierra al atardecer. Nadie aplaudió al principio: todos estaban escuchando un silencio sin motores."
        [/message]
        [message]
            speaker="narrator"
            message="Los velarios desmontaron sus ciudades antes de que cayeran. Iria dibujó caminos entre pueblos que hasta entonces solo se habían conocido como sombras. En el margen dejó espacio para los nombres que aún faltaban."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

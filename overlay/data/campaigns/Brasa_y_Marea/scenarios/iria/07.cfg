[scenario]
    id="CBM_iria_07"
    name="Donde termina la sombra"
    next_scenario="null"
    map_file="iria_07.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La facción que rechazaba el descenso bloqueó los tres anclajes del puerto. Iria y Belis debían sincronizarlos mientras las familias velarias esperaban sobre plataformas que crujían. Los tres anclajes eran antiguos cabrestantes de barco, y ninguno estaba calculado para el peso de una ciudad. Iria midió la sombra que proyectaban sobre el agua y supo que la ciudad bajaría justo sobre los muelles."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Vigía de la Última Altura."
            background="cbm/story/iria_07_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/iria_07_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="206"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Vigía de la Última Altura"
        type="CBM Velario Arconte"
        id="CBM_iria_07_enemy"
        name="Vigía de la Última Altura"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor,CBM Velario Prisma"
        gold="142"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="30"
            y="11"
            image="items/brazier.png"
        [/item]
        [label]
            x="30"
            y="11"
            text="Punto 1"
        [/label]
        [item]
            x="21"
            y="11"
            image="items/brazier.png"
        [/item]
        [label]
            x="21"
            y="11"
            text="Punto 2"
        [/label]
        [item]
            x="6"
            y="10"
            image="items/brazier.png"
        [/item]
        [label]
            x="6"
            y="10"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="20"
            y="29"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="20"
                    y="29"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="20"
            y="28"
        [/scroll_to]
        [message]
            message="Cuando aterricen, habrá menos cielo y mucha más gente en nuestros caminos."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Habrá vecinos. Los mapas sirven para encontrarles sitio."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Sincronizad los tres anclajes del puerto. Los tres a la vez, o la ciudad se parte al tocar tierra."
            speaker="narrator"
        [/message]
        [message]
            message="He visto bajar una ciudad mal. Se abrió como una nuez y cuatro mil personas cayeron con ella."
            speaker="CBM_iria_07_enemy"
        [/message]
        [message]
            message="Y yo he visto secarse un pueblo por falta de agua. También se abre, solo que despacio."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Por eso no bajo ninguna. Prefiero que caiga sola a que la parta yo."
            speaker="CBM_iria_07_enemy"
        [/message]
        [message]
            message="Su miedo es un mapa cerrado. No ha medido nada desde hace años."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Entonces le llevo mis medidas. Que compare."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Los anclajes del puerto están pensados para barcos, no para ciudades. Cada uno aguanta la mitad del peso calculado."
            speaker="narrator"
        [/message]
        [message]
            message="Belis, sincroniza el del faro y yo el del dique. El tercero lo dejamos para el último, que es el que está minado."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El del dique lo miné yo. Si alguien lo enciende, el agua entra en los barrios bajos."
            speaker="CBM_iria_07_enemy"
        [/message]
        [message]
            message="Cuando la ciudad aterrice, sus familias acamparán en los muelles, el pozo del puerto se racionará y el acueducto tendrá que servir a dos ciudades de golpe."
            speaker="narrator"
        [/message]
        [message]
            message="Dibuja eso, Belis: el acueducto soporta dos ciudades once días. Después, obra nueva."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Y en esos once días, ¿quién bebe?"
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Los dos. Mitad y mitad, y quien firme el reparto lo firma en público."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Muelles asegurados. El agua del puerto es lo primero que vamos a compartir."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="Última marea de la noche. Si el tercer anclaje no enciende ahora, la ciudad toca el agua."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No quería que cayeran. Quería que cayeran por su propio peso, no por mi mano."
            speaker="CBM_iria_07_enemy"
        [/message]
        [message]
            message="Da igual la mano. Lo que cuenta es cuánta agua hay después."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="30"
            y="11"
        [/filter]
        [remove_item]
            x="30"
            y="11"
        [/remove_item]
        [item]
            x="30"
            y="11"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="30"
            y="11"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primer anclaje encendido. La ciudad se endereza un grado y el muelle cruje entero."
            speaker="narrator"
        [/message]
        [message]
            message="Un grado. Cuatro mil personas han notado ese grado."
            speaker="CBM_iria_07_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="21"
            y="11"
        [/filter]
        [remove_item]
            x="21"
            y="11"
        [/remove_item]
        [item]
            x="21"
            y="11"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="21"
            y="11"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Segundo anclaje. Las familias de las plataformas se sientan, ya no pueden quedarse de pie."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Queda el del dique. Decidme cuántos turnos aguanta el faro."
            speaker="CBM_iria_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="6"
            y="10"
        [/filter]
        [remove_item]
            x="6"
            y="10"
        [/remove_item]
        [item]
            x="6"
            y="10"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="6"
            y="10"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Prisma"
                    side="2"
                    x="23"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Cantor"
                    side="2"
                    x="23"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los tres anclajes ardieron juntos. La ciudad se desmontó despacio, como una vela que se recoge."
            speaker="narrator"
        [/message]
        [message]
            message="Nadie ha caído. Ni del cielo ni del muelle."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Once días de agua hay en el acueducto. Después habrá que cavar más pozos."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El tercer anclaje lo encendisteis mal. Se habría partido si soplara viento."
            speaker="CBM_iria_07_enemy"
        [/message]
        [message]
            message="Tienes razón. Ven a corregir el siguiente y firmamos los dos."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Al atardecer, los velarios desmontaron las ciudades y las piezas bajaron una a una. Nadie aplaudió al principio: todos estaban escuchando un silencio sin motores. Iria abrió el mapa en el suelo del muelle y señaló el primer pozo que habría que cavar, con la fecha escrita al lado y el nombre del pueblo que lo bebería."
            speaker="narrator"
        [/message]
        [message]
            message="Los velarios desmontaron sus ciudades antes de que cayeran. Iria dibujó caminos entre pueblos que hasta entonces solo se habían conocido como sombras. En el margen dejó espacio para los nombres que aún faltaban."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

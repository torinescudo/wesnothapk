[scenario]
    id="CBM_iria_04"
    name="La garganta de las alas"
    next_scenario="CBM_iria_05"
    map_file="iria_04.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Las patrullas aladas cerraron la garganta. Iria llevaba los planos de los anclajes solares y la promesa de Esh: si lograban llegar al observatorio, podrían bajar las ciudades lentamente. El desfiladero tenía dos salidas y Uru vigilaba una; la otra era una cornisa que solo aparecía en los mapas viejos. Iria había copiado esa cornisa de un mapa que nadie más conservaba. La niebla bajaba del nevero a ciertas horas y borraba la cornisa incluso de su propio mapa. Uru volaba en círculos que se cerraban un poco más cada tarde, y cada círculo costaba a su barrio un cubo que él no pensaba pagar. Cruzar era la última vez que el mapa valdría más que unas alas: si el observatorio confirmaba lo que Esh había prometido, la caída dejaría de ser una catástrofe para convertirse en una obra medida."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de montaña. Al frente: Acechante Uru."
            background="cbm/story/iria_04_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/iria_04_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="182"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Acechante Uru"
        type="CBM Velario Arconte"
        id="CBM_iria_04_enemy"
        name="Acechante Uru"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor,CBM Velario Prisma"
        gold="124"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_iria_04_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_iria_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="No pierdas más de 4 unidades."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="3"
            y="9"
            image="items/gohere.png"
        [/item]
        [label]
            x="3"
            y="9"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Elvish Fighter"
                    x,y="42,27"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="die"
        [filter]
            side="1"
        [/filter]
        {VARIABLE_OP cbm_losses add 1}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Por el aire nos ven. Por el fondo del paso no podremos correr."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="No hace falta correr más que sus alas. Hace falta llegar donde sus alas no quepan."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El observatorio está al otro lado de la garganta. Cruzad el desfiladero antes de que Uru cierre los dos extremos."
            speaker="narrator"
        [/message]
        [message]
            message="No persigo por gusto. Cada fugitivo que baja es una boca más que reclama agua en los barrios altos."
            speaker="CBM_iria_04_enemy"
        [/message]
        [message]
            message="Y cada boca que baja es un par de manos para el acueducto. Tu resta tiene dos columnas y solo miras una."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Miro la que se desborda. Arriba ya hay dos familias por habitación y el pozo se raciona desde el equinoccio."
            speaker="CBM_iria_04_enemy"
        [/message]
        [message]
            message="Uru caza por el paso. Conoce cada repisa y cada eco."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Conozco cada curva del paso porque la dibujé. Ese es mi mapa y su ruina."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Uru vuela en círculos cerrados. Se cansa antes que un caminante, pero ve tres veces más lejos."
            speaker="narrator"
        [/message]
        [message]
            message="Belis, guíame por la cornisa baja. Si nos ven, que nos vean donde el aire es estrecho."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="En el estrecho sus alas no caben. Tendrán que posarse, y en el suelo somos más."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Si la ciudad que vigila Uru desciende aquí, sus tres mil vecinos vivirán hacinados entre las rocas, beberán de un manantial racionado y el acueducto de la garganta no dará para todos."
            speaker="narrator"
        [/message]
        [message]
            message="Ese es el cálculo que quiero enseñarle: no cuántos bajan, sino cuánta agua hay cuando lleguen."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El consejo ya hizo ese cálculo. Decidió que era más barato no hacerlo."
            speaker="CBM_iria_04_enemy"
        [/message]
        [message]
            message="Entonces el consejo está mal de aritmética, y tú de jefe."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="En el fondo del paso sus alas no caben: los velarios tienen que posarse y en tierra valen uno por uno. La niebla del nevero tapa la cornisa a ratos, y Uru la conoce mejor que nosotros."
            speaker="narrator"
        [/message]
        [message]
            message="La cornisa baja es larga y el ancho, corto: por abajo llegamos tarde pero peleamos a su medida; por arriba llegamos en dos turnos y nos cogen en el aire. Elegid la llegada que queréis."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Una repisa asegurada. Desde aquí veo el observatorio y su puerta cerrada."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="He mandado tapiar el observatorio. Sus ventanas dan al paso y ahí no entra nadie sin mi permiso."
            speaker="CBM_iria_04_enemy"
        [/message]
        [message]
            message="Sus ventanas dan al este. Nadie ha mirado nunca el mapa al revés."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="La niebla baja del nevero y el paso se estrecha. La cornisa se ve a ratos."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="A ratos me basta. Yo dibujo lo que veo y lo que recuerdo."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Uru cierra el paso por el sur en dos turnos. La salida es la cornisa baja del este."
            speaker="narrator"
        [/message]
        [message]
            message="Contad las bocas que sacáis de la garganta: cada una dormirá esta noche en un rellano de mi barrio, donde el pozo ya se raciona por turnos. No os persigo por crueldad: persigo el agua que me quitáis al bajar."
            speaker="CBM_iria_04_enemy"
        [/message]
        [message]
            message="La marea de alas sube detrás de nosotros. Se oye el viento en las juntas."
            speaker="CBM_iria_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Contaba bocas. Nunca conté manos."
            speaker="CBM_iria_04_enemy"
        [/message]
        [message]
            message="Pues empieza ahora. Baja y cuenta las que te van a ayudar."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_iria_hero"
            x="3"
            y="9"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [variable]
                name="cbm_losses"
                numerical_greater_than="4"
            [/variable]
            [then]
                [message]
                    message="No pierdas más de 4 unidades. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Prisma"
                    side="2"
                    x="41"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Cantor"
                    side="2"
                    x="41"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El observatorio está abierto y su telescopio apunta al suelo, no al cielo."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Es el primer mapa honesto que veo en un año. Aquí abajo está dibujado cada pozo de la región."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Iria copió los pozos, los aljibes y los canales en su cuaderno, y por primera vez su mapa y el de los velarios coincidieron."
            speaker="narrator"
        [/message]
        [message]
            message="Con esto puedo bajar una ciudad sin secar un pueblo. Solo hay que elegir dónde."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Y ese dónde se llama ahora. Elige bien, que una ciudad no se desdice."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Desde el observatorio, Iria vio que una ciudad ya se inclinaba. Bajo ella estaba el pueblo donde había aprendido a escribir. Marcó la inclinación con dos trazos y calculó, por primera vez sin equivocarse, cuántos días quedaban antes de que la sombra tocara los tejados. El telescopio, girado hacia el suelo, señalaba cada pozo de la región y lo que quedaba dentro: doce días de margen, ni uno más. Entre dos fardos de paja del almacén, Belis encontró un cristal de anclaje de repuesto y se puso a calcular cuánto pesaba. Abajo, el pueblo seguía abriendo la acequia al amanecer sin mirar hacia arriba."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_iria_05"
    name="El pueblo que sostuvo el cielo"
    next_scenario="CBM_iria_06"
    map_file="iria_05.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/iria-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/iria-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Belis encontró un cristal capaz de estabilizar la ciudad inclinada. Un transportista lo llevaría hasta el anclaje, mientras los recolectores intentaban recuperarlo para sus propios barrios. El cristal pesaba lo que un niño y latía como un pájaro. Iria trazó el camino más corto entre la acequia y el anclaje, y en el mapa marcó con tinta roja los tres vados que lo cortaban."
            background="cbm/portraits/iria.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de llanura. Al frente: Recolectora Neth."
            background="cbm/story/iria_05_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 32."
            background="cbm/story/iria_05_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Iria Salcedo"
        id="CBM_iria_hero"
        name="Iria Salcedo"
        type="CBM Hero iria"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        gold="190"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_iria_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recolectora Neth"
        type="CBM Velario Arconte"
        id="CBM_iria_05_enemy"
        name="Recolectora Neth"
        canrecruit="yes"
        recruit="CBM Velario Lancero,CBM Velario Cosechador,CBM Velario Vigia,CBM Velario Cantor,CBM Velario Prisma"
        gold="130"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Iria Salcedo"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Belis"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Elvish Fighter,Elvish Archer,Elvish Shaman,Elvish Scout,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="36"
            y="5"
            image="items/gohere.png"
        [/item]
        [label]
            x="36"
            y="5"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_iria_companion"
            x="4"
            y="15"
        [/recall]
        [if]
            [have_unit]
                id="CBM_iria_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Elvish Shaman"
                    id="CBM_iria_companion"
                    name="Belis"
                    side="1"
                    x="4"
                    y="15"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Peasant"
            id="CBM_iria_05_protected"
            name="Barun, portador del cristal"
            side="1"
            x="5"
            y="14"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="14"
        [/scroll_to]
        [message]
            message="Cada calle que salvemos arriba puede costarnos una cosecha abajo."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Hoy evitamos la caída. Mañana obligaremos a sus jefes a compartir esa cuenta."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Escoltad a Barun con el cristal hasta el anclaje del oeste. Si muere, la ciudad inclinada no vuelve a enderezarse."
            speaker="narrator"
        [/message]
        [message]
            message="Ese cristal es nuestro. Lo pagamos con un invierno de racionamiento; mis vecinos se turnan el agua desde entonces."
            speaker="CBM_iria_05_enemy"
        [/message]
        [message]
            message="Y si la ciudad cae sobre el pueblo, tus vecinos tendrán menos agua todavía. Piénsalo dos veces."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Lo he pensado doscientas. Barrio Alto lleva treinta días con un cubo por familia."
            speaker="CBM_iria_05_enemy"
        [/message]
        [message]
            message="No es codicia lo que la mueve. Es sed."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Con la sed se negocia con cifras. Con la codicia no se negocia."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Yo llevo el cristal. Solo necesito que alguien me diga qué esquina está minada."
            speaker="CBM_iria_05_protected"
        [/message]
        [message]
            message="Te lo diré yo. Voy delante con la cuerda y marco cada paso con una piedra."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El camino cruza la acequia tres veces. Cada cruce es un sitio donde os pueden cortar el paso."
            speaker="narrator"
        [/message]
        [message]
            message="Si la ciudad inclinada cae sobre el pueblo, dos mil vecinos del cielo dormirán en las eras, el acueducto compartido perderá presión y las fuentes bajarán a un cubo por familia."
            speaker="narrator"
        [/message]
        [message]
            message="La misma sed, arriba y abajo. Solo cambia quién la cuenta."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Entonces la contamos juntos y que salga una sola cifra."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Si salvas mi barrio, retiraré a mis recolectores. Te lo prometo por el pozo de mi madre."
            speaker="CBM_iria_05_enemy"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_iria_05_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Me han dado. Puedo seguir, pero el cristal pesa el doble."
            speaker="CBM_iria_05_protected"
        [/message]
        [message]
            message="Dámelo a mí un tramo. El cristal no distingue de quién es la espalda."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Asegurad la acequia. Si el anclaje falla, esta zanja es lo único que nos queda."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Mis recolectores han cortado el vado. Habrá que cruzar por el molino viejo."
            speaker="CBM_iria_05_enemy"
        [/message]
        [message]
            message="El molino viejo aguanta un solo carro. Barun tendrá que dejar el cristal y volver por él."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 9"
        [message]
            message="El anclaje ya se ve. Le queda una sola luz encendida de las tres."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Pues caminamos hacia esa luz y no miramos atrás."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Prometí retirarme si salvabas mi barrio. No he visto tu barrio, solo mi sed."
            speaker="CBM_iria_05_enemy"
        [/message]
        [message]
            message="Tu sed va a beber de este pozo mucho tiempo. Yo me encargo de que no se seque."
            speaker="CBM_iria_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_iria_05_protected"
            x="36"
            y="5"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_iria_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Prisma"
                    side="2"
                    x="36"
                    y="12"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_iria_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Velario Cantor"
                    side="2"
                    x="36"
                    y="12"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_iria_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_iria_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_iria_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_iria_05_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El anclaje está encendido. La ciudad ya no cruje."
            speaker="CBM_iria_05_protected"
        [/message]
        [message]
            message="Desde arriba bajan cuerdas. Traen agua y preguntan por el nombre del portador."
            speaker="CBM_iria_companion"
        [/message]
        [message]
            message="Los velarios del Barrio Alto bajaron cuerdas con agua y alimentos. Algunos habían visto quién los salvó, y lo dijeron en voz alta."
            speaker="narrator"
        [/message]
        [message]
            message="Apunta los nombres, Belis. Un mapa también sirve para saber a quién se le debe."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="Y mañana subo a cobrar la cuenta con cifras, no con lanzas."
            speaker="CBM_iria_hero"
        [/message]
        [message]
            message="El anclaje resistió. Desde las plataformas bajaron cuerdas con agua y alimentos: algunos velarios habían visto quién los había salvado. Iria anotó junto al anclaje los cubos que bajaron y los que faltaban, y dejó la resta escrita donde cualquiera pudiera leerla."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_iria_05_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_maura_03"
    name="El testigo incómodo"
    next_scenario="CBM_maura_04"
    map_file="maura_03.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Un notario había descubierto cómo romper los sellos funerarios. Para Maura, archivera de oficio, un método así era la peor de las deudas: quien lo tuviera podría vaciar su ejército en una tarde. Maura quería sacarlo de la custodia real y encerrarlo en un lugar donde solo ella pudiera hacer preguntas. Calven lo vigilaba en una casa de guardia, entre robles, y prefería juzgarlo antes de que hablara. El notario Kelm llevaba tres días sin dormir y una copia de su método escondida en el forro del abrigo. El detalle que lo cambiaba todo era ese forro: la copia viajaba cosida, y arrancarla a la fuerza era destruirla. El precio de la noche no se escribía en moneda: Maura cargaría con un testigo vivo que ya no volvería a confiar en nadie, y tendría que firmarlo como custodia, no como rescate. Y cerró el asiento con la próxima cuenta: las notas de Kelm saldrían de la torre por la calzada de la montaña, donde cada pueblo entierra a sus muertos con nombre y cuenta dos veces a los extraños."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Juez Calven."
            background="cbm/story/maura_03_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 22."
            background="cbm/story/maura_03_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Juez Calven"
        type="Lieutenant"
        id="CBM_maura_03_enemy"
        name="Juez Calven"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_maura_03_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_maura_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 18."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="29"
            y="18"
            image="items/gohere.png"
        [/item]
        [label]
            x="29"
            y="18"
            text="Destino"
        [/label]
        [item]
            x="26"
            y="10"
            image="items/cage.png"
        [/item]
        [label]
            x="26"
            y="10"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="18"
            y="22"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="18"
                    y="22"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="18"
            y="21"
        [/scroll_to]
        [message]
            message="Podrías dejar que publicara el método. Algunos de nosotros volveríamos a dormir."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Y yo perdería un ejército. No vuelvas a confundir tus deseos con mis intereses."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Kelm está en la casa de guardia, junto al vado. Alcanzadlo y llevadlo a la torre del sur."
            speaker="narrator"
        [/message]
        [message]
            message="Maura Vey, el notario está detenido por el reino. Si entras en el bosque, entrarás en un juicio."
            speaker="CBM_maura_03_enemy"
        [/message]
        [message]
            message="Traigo mi propia sentencia y doscientos testigos. Empieza cuando quieras."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El juez ha puesto arqueros en los robles. No dispararán a Kelm: dispararán a quien lo saque."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Entonces saldremos por el arroyo. La maleza tapa el agua y el agua no deja huella."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Lo que Kelm escribió libera a todos los muertos del reino. También a los tuyos."
            speaker="CBM_maura_03_enemy"
        [/message]
        [message]
            message="Ninguno de los míos firmó para esto. Esa es la parte que no pienso discutir."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="¿Y qué harás con él cuando lo tengas? ¿Preguntarle o enterrarlo?"
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Escucharé su método y quemaré sus notas. Un testigo vivo es útil; un testigo publicado es un problema."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="No me saques de aquí para encerrarme en otra sala. Ya conozco esa clase de libertad."
            speaker="CBM_maura_03_protected"
        [/message]
        [message]
            message="No te saco por ti. Te saco porque tu método todavía no tiene dueño."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Ha dicho la verdad delante de todos, y el precio es que la verdad se quedará sin copia."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="La verdad sin archivo se olvida en una generación. Yo trabajo a más largo plazo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Kelm caminará mientras tenga delante una puerta. Si cae herido, la escolta tendrá que cargarlo."
            speaker="narrator"
        [/message]
        [message]
            message="Si sale del bosque, juzgaré el caso desde la tumba. No tengo prisa: tengo toda la eternidad."
            speaker="CBM_maura_03_enemy"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_maura_03_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="No puedo seguir. Dejadme aquí y llevad la carpeta."
            speaker="CBM_maura_03_protected"
        [/message]
        [message]
            message="La carpeta pesa menos que tú. Y no discuto con quien va a resolverse el método."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Ese hombre tiene causa abierta y plazo de defensa. Si te lo llevas herido, le robas su derecho a hablar ante un juez."
            speaker="CBM_maura_03_enemy"
        [/message]
        [message]
            message="Yo le doy otro plazo: el de mi archivo. Empieza hoy y no prescribe."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La aldea del vado nos ha dejado pasar. No han cerrado ni las puertas."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Anota el nombre del alcalde. Se le devolverá el favor con intereses."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La aldea del vado ha dado paso a un secuestro. Su alcalde ha roto la ley del reino y su nombre irá el primero en el sumario."
            speaker="CBM_maura_03_enemy"
        [/message]
        [message]
            message="Los arqueros cubren el vado, no a Kelm: disparan a las piernas para tenerlo de pie ante el juez. Si cruzamos cargándolo, uno se queda detrás y no vuelve."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los arqueros tienen orden de disparar a las piernas. Quiero a Kelm de pie para el juicio."
            speaker="CBM_maura_03_enemy"
        [/message]
        [message]
            message="El juicio se celebra mañana al mediodía, en la plaza del mercado."
            speaker="narrator"
        [/message]
        [message]
            message="Los robles dan sombra a sus arqueros y la maleza corta vuestras cargas: por el bosque os ven primero y disparan seguro. El arroyo tapa el paso, pero solo admite uno en fila; elegid si entramos por el agua o rompemos el anillo."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Firmé tu condena hace diez años, archivera. No pienso firmar tu absolución."
            speaker="CBM_maura_03_enemy"
        [/message]
        [message]
            message="Nadie te la ha pedido. Con tu firma me basta."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="26"
            y="10"
        [/filter]
        [remove_item]
            x="26"
            y="10"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_maura_03_protected"
            name="Notario Kelm"
            side="1"
            x="26"
            y="11"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_maura_03_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_maura_03_protected"
            x="29"
            y="18"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [variable]
                name="turn_number"
                numerical_greater_than="18"
            [/variable]
            [then]
                [message]
                    message="Cumple el objetivo antes del turno 18. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="17"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="17"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_maura_03_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Puedo caminar solo. Guardad la carpeta y no me miréis como a un saco."
            speaker="CBM_maura_03_protected"
        [/message]
        [message]
            message="Llegó vivo. No sé si eso es una victoria tuya o una derrota mía."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Apúntalo en la columna de los gastos. Todo lo que hago entra en esa columna."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Quemarás mis notas y las recordarás de memoria. Eso también es una forma de cárcel."
            speaker="CBM_maura_03_protected"
        [/message]
        [message]
            message="Es exactamente una forma de cárcel. Bienvenido a mi archivo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La torre del sur tiene una ventana que no da al bosque. Kelm tardó dos días en darse cuenta."
            speaker="narrator"
        [/message]
        [message]
            message="El notario llegó vivo a la torre. Maura quemó sus notas después de aprenderlas de memoria. La aldea del vado no volvió a cerrar sus puertas, y por eso nadie recordó preguntar qué había sido de su alcalde. Kelm pidió papel y tinta, y Maura se lo concedió sin discutir: el papel se archiva, y todo lo archivado vuelve a ella cuando lo necesita. El coste lo llevaba Kelm en la cara: un testigo vivo que dormiría con el forro hacia el pecho y no volvería a firmar por nadie. Y el viaje siguiente ya estaba escrito: sus notas saldrían de la torre en un carro pequeño, por la calzada de la montaña."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_maura_03_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

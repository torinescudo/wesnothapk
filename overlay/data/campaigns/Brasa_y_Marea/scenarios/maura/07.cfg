[scenario]
    id="CBM_maura_07"
    name="El precio de una tregua"
    next_scenario="CBM_maura_08"
    map_file="maura_07.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Una liga de villas ofreció reconocer a Maura si liberaba a sus caídos. Ella acudió a la negociación con el ejército desplegado: aceptaría el reconocimiento, pero no devolvería nada. Para una archivera, aquel ofrecimiento era un título de propiedad mal escrito: las villas le vendían lo que ya estaba en sus estanterías. Nalis hablaba en nombre de catorce villas y traía dos escribas, un mapa y ninguna escolta digna de ese nombre. Maura aceptó la reunión en el claro, con la infantería visible entre los árboles. El detalle que lo cambiaba todo viajaba en ese mapa: catorce cruces negras marcaban las tumbas de los caídos que pedían de vuelta, y ninguna caía donde decía su inventario. El coste de la reunión era elegante y caro: firmar con las manos de los muertos sobre la mesa y deberles, por escrito, una devolución que nunca llegaría. Y cerró el asiento con la próxima cuenta: la capital no se rendiría por escrito, sino por debajo del río, por el túnel viejo que alguien tendría que cerrar a tiempo."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Embajadora Nalis."
            background="cbm/story/maura_07_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 38."
            background="cbm/story/maura_07_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="206"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Embajadora Nalis"
        type="Lieutenant"
        id="CBM_maura_07_enemy"
        name="Embajadora Nalis"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="142"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.8"
            caution="0.25"
            attack_depth="4"
            leader_value="6"
            village_value="3"
            recruitment_pattern="fighter,archer,fighter,scout"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_maura_07_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_maura_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 34."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="25"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="25"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="25"
            y="31"
        [/scroll_to]
        [message]
            message="Podrías ganar una paz duradera con una sola firma."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Una paz que dependa de mi generosidad termina cuando deje de ser generosa."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La liga acampa en el claro. Rodead la reunión y tomad el terreno antes de que firmen nada."
            speaker="narrator"
        [/message]
        [message]
            message="Traigo catorce firmas y una condición: devuelve a nuestros caídos y te reconoceremos."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="Acepto el reconocimiento. La devolución no está en el orden del día."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="¿Vamos a negociar con la infantería en el bosque? Esto no es una reunión, es una rendición con sillas."
            speaker="narrator"
            caption="Tera, delegada"
            image="cbm/portraits/tera-delegada.png"
        [/message]
        [message]
            message="Es una reunión con garantías. Las garantías son mías porque las pago yo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Nuestros muertos defienden tus filas. Firman tus formularios, cavan tus zanjas y no pueden negarse."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="Exacto. Y por eso valen más que una promesa tuya."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los delegados han traído a sus hijos y los han puesto delante, en la primera fila."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Entonces no disparéis primero. Quiero que la liga recuerde quién empezó."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Si te reconocen, será con las manos de sus muertos sobre la mesa."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="Me parece bien. Pondré una mesa más grande."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Nos han contado lo del molino y lo de las campanas. Nadie firmará sin garantías por escrito."
            speaker="narrator"
            caption="Tera, delegada"
            image="cbm/portraits/tera-delegada.png"
        [/message]
        [message]
            message="Aquí tienes el borrador. Solo hay una página y la letra pequeña la he escrito yo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Una página. En una página cabe la tregua, pero no cabe la libertad."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Cabe la palabra que necesito esta noche. Las demás las añadiré yo después."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La primera villa de la liga ha izado tu estandarte sin resistencia."
            speaker="narrator"
        [/message]
        [message]
            message="Han izado tu bandera porque tienen miedo, no porque te reconozcan."
            speaker="narrator"
            caption="Tera, delegada"
            image="cbm/portraits/tera-delegada.png"
        [/message]
        [message]
            message="Esa villa firmó la liga con sangre de su gente. Que ize tu bandera no borra la firma ni la deuda con sus caídos."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="No borro firmas: las copio y las archivo con fecha de recepción."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El claro está rodeado de bosque y vuestra infantería ocupa ya los troncos: la liga no tiene dónde retirarse. Cerrad el anillo antes de que los delegados se dispersen por las villas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="He mandado a los escribas quemar las copias. Si firmamos, firmamos con una sola página y sin archivo."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="Ya la tengo memorizada. Puedes quemar lo que quieras."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 9"
        [message]
            message="Los delegados discuten entre ellos. Dos quieren firmar y tres quieren luchar."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Deja que discutan. El ruido cansa más que el hierro."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Mis escribas guardan las actas de catorce villas. Si hoy firmamos bajo coacción, mañana esas actas declararán nulo todo lo que hayas ganado."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="Archivaré también las actas. La nulidad es un trámite y los trámites son mi oficio."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los hijos de los delegados están en la primera fila y embarran una carga limpia. Decide si cargamos de frente o cerramos el anillo por detrás."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="La luz se va y los delegados no se han movido. Mañana la liga se reunirá en otra provincia."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Firmé el reconocimiento de una reina que ya había decidido no devolver nada. Que conste en el acta."
            speaker="CBM_maura_07_enemy"
        [/message]
        [message]
            message="Constará, y con tu letra. Prefiero las pruebas que se firman solas."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="turn_number"
                numerical_greater_than="34"
            [/variable]
            [then]
                [message]
                    message="Cumple el objetivo antes del turno 34. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="23"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="23"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Firmaron todos. Ninguno te miró a los ojos."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="No hace falta que me miren. Hace falta que cumplan."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Nos dejas la tregua y te quedas con los muertos. ¿Sabes cómo llamamos a eso en mi aldea?"
            speaker="narrator"
            caption="Tera, delegada"
            image="cbm/portraits/tera-delegada.png"
        [/message]
        [message]
            message="Lo llamáis de muchas maneras. Yo lo llamo capítulo primero."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Lo llamamos deuda. Y nosotros también sabemos llevarla en libros."
            speaker="narrator"
            caption="Tera, delegada"
            image="cbm/portraits/tera-delegada.png"
        [/message]
        [message]
            message="La liga firmó bajo vigilancia y en el claro quedaron las sillas vacías de los delegados que no volvieron aquella noche a sus aldeas."
            speaker="narrator"
        [/message]
        [message]
            message="Las villas firmaron bajo vigilancia. Maura conservó el documento como prueba de su legitimidad. La página única se archivó junto a los contratos funerarios, y en la carpeta de la liga anotó a mano el nombre de cada delegado que había perdido la voz al firmar. El coste quedó en la única página: catorce villas con un rencor que no prescribía y un ejército que por fin tenía nombre de reino. Y guardó el mapa de Nalis en el cajón de las puertas, junto al plano del túnel viejo que abría la capital por debajo del río. Tera no volvió a su aldea; su hija sí, años después, a buscar el archivo y a preguntar por qué su madre no estaba en la lista de los muertos."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

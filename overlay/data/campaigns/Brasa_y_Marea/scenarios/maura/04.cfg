[scenario]
    id="CBM_maura_04"
    name="La calzada del tributo"
    next_scenario="CBM_maura_05"
    map_file="maura_04.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Un carro transportaba los sellos arrebatados al notario. Los pueblos de la calzada intentaron detenerlo antes de que Maura pudiera reclamar a sus antepasados."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="182"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Guardiana Derra"
        type="Lieutenant"
        id="CBM_maura_04_enemy"
        name="Guardiana Derra"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="124"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="20"
            y="16"
            image="items/gohere.png"
        [/item]
        [label]
            x="20"
            y="16"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="3"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="3"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_maura_companion"
            message="Nos arrojan piedras con los nombres de los que llevamos encadenados."
        [/message]
        [message]
            speaker="CBM_maura_hero"
            message="Recógelas. Facilitarán el próximo inventario."
        [/message]
        [unit]
            type="Peasant"
            id="CBM_maura_04_protected"
            name="Udren, conductor del carro"
            side="1"
            x="4"
            y="4"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_maura_04_protected"
            x="20"
            y="16"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="18"
                    y="12"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="18"
                    y="12"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_maura_04_protected"
        [/filter]
        [message]
            speaker="narrator"
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="El carro cruzó el paso. Detrás quedó una calzada donde ya nadie enterraba a sus muertos con nombre."
        [/message]
        [kill]
            id="CBM_maura_04_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

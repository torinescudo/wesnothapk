[scenario]
    id="CBM_maura_04"
    name="La calzada del tributo"
    next_scenario="CBM_maura_05"
    map_file="maura_04.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Un carro transportaba las notas que el notario había escrito en la torre. Los pueblos de la calzada intentaron detenerlo antes de que Maura pudiera reclamar a sus antepasados. El carro avanzaba despacio, con las ruedas hundidas y la escolta contada. Derra había jurado a los pueblos que ningún nombre saldría de la montaña sin permiso de su familia."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de montaña. Al frente: Guardiana Derra."
            background="cbm/story/maura_04_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 32."
            background="cbm/story/maura_04_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="182"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Guardiana Derra"
        type="Lieutenant"
        id="CBM_maura_04_enemy"
        name="Guardiana Derra"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="124"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="30"
            y="13"
            image="items/gohere.png"
        [/item]
        [label]
            x="30"
            y="13"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Peasant"
            id="CBM_maura_04_protected"
            name="Udren, conductor del carro"
            side="1"
            x="5"
            y="4"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Nos arrojan piedras con los nombres de los que llevamos encadenados."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Recógelas. Facilitarán el próximo inventario."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El carro debe cruzar el paso antes del anochecer. Si el conductor cae, la carga se queda en la calzada."
            speaker="narrator"
        [/message]
        [message]
            message="Ese carro lleva a mis abuelos. Ningún sello sale de esta montaña sin mi permiso."
            speaker="CBM_maura_04_enemy"
        [/message]
        [message]
            message="Puedes acompañarlo hasta el paso. Te dejaré ver la carga entera y contar los nombres."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Y después los devolverás a sus tumbas."
            speaker="CBM_maura_04_enemy"
        [/message]
        [message]
            message="Después seguirán trabajando. La diferencia es que tú lo habrás visto con tus ojos."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Guardiana, yo solo llevo las riendas. Me pagaron por el viaje, no por la guerra."
            speaker="CBM_maura_04_protected"
        [/message]
        [message]
            message="Cobra el doble y no hables. Eso es todo lo que te pido."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La calzada está cortada en dos curvas. Los pueblos han levantado muros de piedra seca."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Los muros son para el carro, no para mí. Subiremos por la ladera y el carro irá por el centro."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Mi gente entierra a sus muertos con nombre desde antes de que existiera tu tribunal."
            speaker="CBM_maura_04_enemy"
        [/message]
        [message]
            message="Lo sé. Yo redacté los contratos que se lo permitían y ahora los estoy ejecutando."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio de esta carga es que aquí nadie volverá a enterrar a los suyos por su nombre."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Escribe esa frase en el informe. Quiero leerla otra vez cuando la calzada sea mía."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Cada piedra del camino lleva un nombre grabado. Recogerlas es la lista de la próxima leva."
            speaker="narrator"
        [/message]
        [message]
            message="Si el carro cruza el paso, esta calzada dejará de ser un camino y será una frontera."
            speaker="CBM_maura_04_enemy"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="El pueblo de la curva baja ha cerrado sus puertas y ha sacado a los niños al monte."
            speaker="narrator"
        [/message]
        [message]
            message="Han escondido a los suyos. Eso lo hace quien espera volver."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He mandado soltar el alud sobre la calzada. El carro pasará, pero nadie podrá volver por donde vino."
            speaker="CBM_maura_04_enemy"
        [/message]
        [message]
            message="Las ruedas se hundirán en la grava. Si queréis que llegue, tendréis que despejar el paso con las manos."
            speaker="CBM_maura_04_protected"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_maura_04_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Me han dado en el hombro. Puedo seguir, pero llevaré las riendas con una mano."
            speaker="CBM_maura_04_protected"
        [/message]
        [message]
            message="Una mano basta. La otra guárdala para cobrar."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="La luz se va del paso y los muros se cierran al fondo. Mañana la calzada estará cortada."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Habéis derribado un muro de piedra seca. Se tarda una estación en levantarlo y una tarde en olvidar por qué estaba."
            speaker="CBM_maura_04_enemy"
        [/message]
        [message]
            message="Lo reconstruiré más alto y con tu nombre en la primera hilada."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_maura_04_protected"
            x="30"
            y="13"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="33"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="33"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_maura_04_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El carro cruzó el paso sin perder un saco. He cobrado el doble, como acordamos."
            speaker="CBM_maura_04_protected"
        [/message]
        [message]
            message="Mira la calzada. Ya nadie pone nombre a las piedras."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Pondrán nombres a las piedras nuevas. Es lo que hace la gente cuando no le queda otra cosa."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="¿Y tú qué harás cuando no te quede otra cosa?"
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Seguir contando. Es el único oficio que no se me ha dado mal."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="En el pueblo de la curva baja, la primera piedra nueva llevaba el nombre de la guardiana, y nadie la retiró."
            speaker="narrator"
        [/message]
        [message]
            message="El carro cruzó el paso. Detrás quedó una calzada donde ya nadie enterraba a sus muertos con nombre. Derra quedó bajo su propio muro de piedra seca, con la lista de sus abuelos en el bolsillo, y Maura ordenó copiarla antes de que la lluvia borrara la tinta. Udren cobró el doble y no volvió a conducir para nadie más. La montaña siguió siendo un paso, pero las familias de la ladera aprendieron a bautizar a sus muertos en voz baja."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_maura_04_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

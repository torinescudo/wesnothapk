[scenario]
    id="CBM_maura_09"
    name="Una corona sin herederos"
    next_scenario="null"
    map_file="maura_09.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Alther ofreció abdicar si Maura garantizaba la libertad de los muertos. Ella rechazó el trato ante ambos ejércitos. Quería una victoria que nadie pudiera confundir con un acuerdo. Alther había gobernado la ciudad durante treinta años y todavía le quedaban soldados leales y una guardia de palacio que no cobraba desde el invierno."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Regente Alther."
            background="cbm/portraits/maura.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 32."
            background="cbm/portraits/maura.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="222"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Regente Alther"
        type="Lieutenant"
        id="CBM_maura_09_enemy"
        name="Regente Alther"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="4"
            y="17"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="4"
                    y="17"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="16"
        [/scroll_to]
        [message]
            message="Cuando ya no quede nadie por conquistar, ¿nos dejarás descansar?"
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Un reino siempre necesita guardianes."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La guardia de palacio defiende la sala del trono. Tomadla y acabad con la regencia."
            speaker="narrator"
        [/message]
        [message]
            message="Abdico hoy mismo si garantizas la libertad de los muertos. Firmo donde quieras."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Rechazo el trato delante de los dos ejércitos. Quiero una victoria que nadie confunda con un acuerdo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los soldados de palacio llevan sin cobrar desde el invierno y siguen en la puerta."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Pues entremos por la puerta. Quien no cobra y se queda merece ver quién lo sustituye."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Treinta años he firmado treguas con gente peor que tú. Ninguna me ha durado una estación."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Las treguas duran lo que dura la firma. Yo no vengo a firmar."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="En el patio han encendido la campana de los entierros. Es la única que queda en la ciudad."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Que siga sonando. Necesito que la ciudad entera oiga lo que pasa hoy."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La guardia del trono no es un ejército. Son los hijos de esta ciudad con las ropas del padre."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Entonces que salgan los padres. Con los hijos no negocio."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio de esta tarde es que esa campana tocará por gente que aún está viva."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Tocará por todos. Es lo más justo que va a pasar hoy en esta ciudad."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La sala del trono tiene una sola entrada y veinte escalones. Cada escalón cuesta una vida."
            speaker="narrator"
        [/message]
        [message]
            message="Cuando termine esto, pide que te llamen lo que quieras. Yo pienso llamarte como te llamaba tu padre."
            speaker="CBM_maura_09_enemy"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="Los defensores han cerrado la puerta del ala oeste. La sala del trono queda al fondo."
            speaker="narrator"
        [/message]
        [message]
            message="Están cantando dentro. No sé qué himno es, pero no es de victoria."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 9"
        [message]
            message="He mandado fundir la corona vieja. Si ganas, te sentarás con una corona nueva y sin historia."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Perfecto. La historia la escribo yo y no necesito heredarla."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="La ciudad ha empezado a apagar las luces de las ventanas. La sala del trono queda sola."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Muero sin haber firmado tu legitimidad. Es lo único que he ganado esta tarde."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Levantadlo y ponedlo en la primera fila. Irá a la guardia del trono, como todos."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposicion se ha roto."
            speaker="narrator"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="37"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="37"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Ganamos. La ciudad no ha ardido y nadie ha saqueado las casas."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Nadie saquea lo que va a administrar."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Me has puesto en tu guardia. Ni el consuelo de caer entero me has dejado."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Un regente que conoce cada pasillo vale más que uno que muere limpio."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Cumplí el contrato. Ahora quiero pedirte una cosa como firmante, no como soldado."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Pide lo que quieras por escrito. Hoy no es día de cambios en el organigrama."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La campana de los entierros sonó toda la noche en el patio, sin que nadie la tocara: se movía con el aire que entraba por la puerta rota."
            speaker="narrator"
        [/message]
        [message]
            message="El regente cayó. Maura ordenó que lo incorporaran a la guardia del trono antes de limpiar la sala. Mandó fundir los badajos que quedaban, abrió un registro nuevo para los que llegaran vivos y en la primera página escribió su nombre. Debajo, con letra más pequeña, quedó el primer puesto vacante del reino: el de quien había pedido permiso para descansar y aún esperaba respuesta."
            speaker="narrator"
        [/message]
        [message]
            message="Maura ocupó el trono sin abolir un solo impuesto. Añadió uno: todo ciudadano debía legar su cuerpo al Estado. Sevrin pidió permiso para descansar. La reina guardó su petición en un archivo que nunca pensaba abrir."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_maura_09"
    name="Una corona sin herederos"
    next_scenario="null"
    map_file="maura_09.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Alther ofreció abdicar si Maura garantizaba la libertad de los muertos. Ella rechazó el trato ante ambos ejércitos. Quería una victoria que nadie pudiera confundir con un acuerdo."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="222"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Regente Alther"
        type="Lieutenant"
        id="CBM_maura_09_enemy"
        name="Regente Alther"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="3"
            y="9"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="3"
                    y="9"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_maura_companion"
            message="Cuando ya no quede nadie por conquistar, ¿nos dejarás descansar?"
        [/message]
        [message]
            speaker="CBM_maura_hero"
            message="Un reino siempre necesita guardianes."
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="20"
                    y="6"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="20"
                    y="6"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="El regente cayó. Maura ordenó que lo incorporaran a la guardia del trono antes de limpiar la sala."
        [/message]
        [message]
            speaker="narrator"
            message="Maura ocupó el trono sin abolir un solo impuesto. Añadió uno: todo ciudadano debía legar su cuerpo al Estado. Sevrin pidió permiso para descansar. La reina guardó su petición en un archivo que nunca pensaba abrir."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_maura_09"
    name="Una corona sin herederos"
    next_scenario="null"
    map_file="maura_09.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Alther ofreció abdicar si Maura garantizaba la libertad de los muertos. Ella rechazó el trato ante ambos ejércitos. Quería una victoria que nadie pudiera confundir con un acuerdo: para una archivera que había convertido la deuda en ejército, un trato así era un borrador sin cuña, y lo que se firma con un enemigo se archiva con dos copias. Alther había gobernado la ciudad durante treinta años y todavía le quedaban soldados leales y una guardia de palacio que no cobraba desde el invierno. El detalle que lo cambiaba todo estaba colgado del patio: la puerta de clavos, fundida con los badajos de las campanas del puerto, sonaba cada vez que el aire entraba por el muro roto, como si alguien la tocara. El coste de la tarde era la última línea de su inventario: subir veinte escalones contra los hijos de la ciudad y firmar, con sangre ajena, un reino que empezaba sin herederos."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Regente Alther."
            background="cbm/story/maura_09_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 38."
            background="cbm/story/maura_09_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="222"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Regente Alther"
        type="Lieutenant"
        id="CBM_maura_09_enemy"
        name="Regente Alther"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.8"
            caution="0.25"
            attack_depth="4"
            leader_value="6"
            village_value="3"
            recruitment_pattern="fighter,archer,fighter,scout"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_maura_09_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_maura_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name=turn 2
        [message]
            speaker=narrator
            message="¿Abrir el archivo al pueblo o guardarlo?"
    [option]
        message="archivo abierto"
        [command]
            {VARIABLE cbm_decide_maura_09_1 "archivo-abierto"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="archivo guardado"
        [command]
            {VARIABLE cbm_decide_maura_09_1 "archivo-guardado"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Skeleton"
                    x,y="49,18"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="4"
            y="19"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="4"
                    y="19"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="18"
        [/scroll_to]
        [message]
            message="Cuando ya no quede nadie por conquistar, ¿nos dejarás descansar?"
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Un reino siempre necesita guardianes."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La guardia de palacio defiende la sala del trono. Tomadla y acabad con la regencia."
            speaker="narrator"
        [/message]
        [message]
            message="Abdico hoy mismo si garantizas la libertad de los muertos. Firmo donde quieras."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Rechazo el trato delante de los dos ejércitos. Quiero una victoria que nadie confunda con un acuerdo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los soldados de palacio llevan sin cobrar desde el invierno y siguen en la puerta."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Pues entremos por la puerta. Quien no cobra y se queda merece ver quién lo sustituye."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Treinta años he firmado treguas con gente peor que tú. Ninguna me ha durado una estación."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Las treguas duran lo que dura la firma. Yo no vengo a firmar."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="En el patio golpean la puerta de clavos. Es todo lo que queda de la campana de los entierros."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Que siga sonando. Necesito que la ciudad entera oiga lo que pasa hoy."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La guardia del trono no es un ejército. Son los hijos de esta ciudad con las ropas del padre."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Entonces que salgan los padres. Con los hijos no negocio."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio de esta tarde es que esa puerta sonará por gente que aún está viva."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Sonará por todos. Es lo más justo que va a pasar hoy en esta ciudad."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La sala del trono tiene una sola entrada y veinte escalones. Cada escalón cuesta una vida."
            speaker="narrator"
        [/message]
        [message]
            message="Cuando termine esto, pide que te llamen lo que quieras. Yo pienso llamarte como te llamaba tu padre."
            speaker="CBM_maura_09_enemy"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="Los defensores han cerrado la puerta del ala oeste. La sala del trono queda al fondo."
            speaker="narrator"
        [/message]
        [message]
            message="Están cantando dentro. No sé qué himno es, pero no es de victoria."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="La sala guarda las actas de treinta años de regencia y la lista de los que cayeron por ella. No quemaré mi casa, pero no la entregaré firmada."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Yo tampoco quemo. Todo lo que hay en esa sala pasará a inventario, acta por acta."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La sala tiene una sola entrada y veinte escalones: arriba se defiende mejor y abajo solo podéis empujar. Elegid si subís de golpe por la puerta de clavos o esperáis a que se les acaben las flechas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 9"
        [message]
            message="He mandado fundir la corona vieja. Si ganas, te sentarás con una corona nueva y sin historia."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Perfecto. La historia la escribo yo y no necesito heredarla."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El ala oeste está clavada y el patio sin tapia: rodear obliga a subir por la escalera de servicio, estrecha y a oscuras. Por ahí la carga llega tarde y la puerta aguanta otra hora."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="La ciudad ha empezado a apagar las luces de las ventanas. La sala del trono queda sola."
            speaker="narrator"
        [/message]
        [message]
            message="Los de la puerta son hijos de artesanos del barrio de las tejas. Cada escalón que subas será un oficio sin aprendiz y una viuda con sueldo de guardia."
            speaker="CBM_maura_09_enemy"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Muero sin haber firmado tu legitimidad. Es lo único que he ganado esta tarde."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Levantadlo y ponedlo en la primera fila. Irá a la guardia del trono, como todos."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="48"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="48"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Ganamos. La ciudad no ha ardido y nadie ha saqueado las casas."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Nadie saquea lo que va a administrar."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Me has puesto en tu guardia. Ni el consuelo de caer entero me has dejado."
            speaker="CBM_maura_09_enemy"
        [/message]
        [message]
            message="Un regente que conoce cada pasillo vale más que uno que muere limpio."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Cumplí el contrato. Ahora quiero pedirte una cosa como firmante, no como soldado."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Pide lo que quieras por escrito. Hoy no es día de cambios en el organigrama."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La puerta de clavos sonó toda la noche en el patio, sin que nadie la tocara: se movía con el aire que entraba por la puerta rota."
            speaker="narrator"
        [/message]
        [message]
            message="El regente cayó. Maura ordenó que lo incorporaran a la guardia del trono antes de limpiar la sala. Mandó fundir los badajos que quedaban, abrió un registro nuevo para los que llegaran vivos y en la primera página escribió su nombre. Debajo, con letra más pequeña, quedó el primer puesto vacante del reino: el de quien había pedido permiso para descansar y aún esperaba respuesta. El coste del trono se firmó al día siguiente, en el primer decreto: todo ciudadano debía legar su cuerpo al Estado, y la petición de Sevrin quedó en un sobre que la reina no pensaba abrir. La tiranía ya tenía forma de formulario, y en la esquina superior derecha faltaba todavía el sello."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="cbm_decide_maura_09_1"
                equals="archivo-guardado"
            [/variable]
            [then]
                [message]
                    message="Las notas se quemaron y el notario se quedó sin oficio. Maura firmó, por primera vez, un registro que nadie leería: el de las personas a las que llamó por nombre antes de perderlas."
                    speaker="narrator"
                [/message]
            [/then]
            [else]
                [message]
                    message="Maura ocupó el trono sin abolir un solo impuesto. Añadió uno: todo ciudadano debía legar su cuerpo al Estado. Sevrin pidió permiso para descansar. La reina guardó su petición en un archivo que nunca pensaba abrir."
                    speaker="narrator"
                [/message]
            [/else]
        [/if]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_maura_05"
    name="La noche de los juramentos"
    next_scenario="CBM_maura_06"
    map_file="maura_05.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El general atacó mientras Maura vinculaba a su sello central los contratos robados. Romper el círculo antes del amanecer devolvería la libertad a miles de muertos. El campamento se levantaba sobre un cementerio antiguo y los veteranos de Vaust yacían a dos pasos del círculo. Maura, archivera incluso en la batalla, llevaba la nómina abierta sobre una losa y tachaba cada nombre vinculado con una raya fina. El detalle que lo cambiaba todo estaba en el borde del círculo: aquellas tumbas quedaban tan cerca que pisarlas era dar a Vaust la única colina donde lucharía sin contar. Maura tenía hasta la primera luz: después, la ciudad entera sabría que el sello funcionaba. El coste de la noche cabía en dos líneas: miles de hombres de pie trabajando sin turno, y un general al que habría que enterrar con sus propias manos. Y al pie del asiento escribió la próxima cuenta: en el puerto, tres campanas seguían repartiendo las horas de los muertos, y un ejército sin hora no entraba en la capital."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: General Vaust."
            background="cbm/story/maura_05_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/maura_05_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="190"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="General Vaust"
        type="Lieutenant"
        id="CBM_maura_05_enemy"
        name="General Vaust"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="130"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_maura_05_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_maura_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [if]
            [variable]
                name="cbm_decide_maura_04_1"
                equals="guardar-notas"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Viniste de ruins apostando por Guardaste las notas del notario y cargaste con los nombres que nadie viene a buscar.. Lo que dejaste atrás sigue donde lo dejaste, y pesa."
                [/message]
                [story]
                    [part]
                        [story]
                            text="Por Guardaste las notas del notario y cargaste con los nombres que nadie viene a buscar. llegaste tarde a lo otro. Aun así, lo que elegiste sostiene esta jornada."
                        [/story]
                    [/part]
                [/story]
                [gold]
                    side="1"
                    amount="-20"
                [/gold]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="Viniste de ruins apostando por Quemaste las notas y el notario se quedó sin oficio. Hay deudas que solo existen mientras están escritas.. Lo otro quedó sin quien lo defendiera."
                [/message]
                [story]
                    [part]
                        [story]
                            text="Por Quemaste las notas y el notario se quedó sin oficio. Hay deudas que solo existen mientras están escritas. ganaste terreno y perdiste lo otro. Aquí se empieza a notar."
                        [/story]
                    [/part]
                [/story]
                [gold]
                    side="1"
                    amount="60"
                [/gold]
            [/else]
        [/if]
    [/event]
    [event]
        name=turn 6
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Skeleton"
                    x,y="44,18"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="3"
            y="19"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="3"
                    y="19"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="3"
            y="18"
        [/scroll_to]
        [message]
            message="Aún puedes detener el ritual. Nadie te obligó a llegar hasta aquí."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Lo sé. Por eso esta corona será mía."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Resistid hasta el amanecer. El círculo se cierra al salir el sol y nadie debe tocarlo antes."
            speaker="narrator"
        [/message]
        [message]
            message="Archivera, tus muertos son deuda. Los míos son soldados. Hay una diferencia y voy a enseñártela."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Ninguna diferencia sobrevive a la contabilidad. Lo comprobarás en la primera fila."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El general ha traído a sus veteranos. Son viejos, pero conocen el cementerio mejor que nosotros."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Entonces no pisemos las tumbas. Vaust no atacará donde están enterrados los suyos."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Cobarde no: previsor. Sé exactamente lo que cuesta levantar a un hombre."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Yo también. Cuesta un contrato, un sello y la paciencia de su familia."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los nombres del círculo están saliendo en desorden. Alguno grita."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Que grite. Los que gritan se cuentan como presentes."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Si rompo el círculo antes del amanecer, devuelvo la libertad a miles. Es lo único que me queda."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Inténtalo. Te estaré esperando en el centro y no me moveré de ahí."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio es que miles de hombres que pidieron una tumba van a pasar la noche de pie."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Y la pasarán trabajando. Es más de lo que les habría dado su rey."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Vaust ataca desde tres lados. El círculo resiste solo hasta que alguien lo interrumpa."
            speaker="narrator"
        [/message]
        [message]
            message="Cuando esto acabe, quiero que alguien escriba que lo intenté."
            speaker="CBM_maura_05_enemy"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="El suelo del cementerio se ha movido dos palmos y el círculo sigue abierto."
            speaker="narrator"
        [/message]
        [message]
            message="Los muertos del general están saliendo por su cuenta. No los llama nadie."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Los que salen de esa fosa son míos: los enterré yo, con su nombre y su rango en la losa. No los cuentes entre tus legajos ni los pongas en fila."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Los doy de alta como auxiliares y les abro cuenta. Nadie trabaja para mí sin número de nómina."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Mis veteranos caen y vuelven a levantarse enfrente. Sois un ejército que no necesita carga."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Lo llamo logística."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El cementerio tiene tapias bajas y tres entradas, y Vaust presiona las tres: si adelgazáis un flanco, el círculo queda al aire. Elegid qué entrada tapáis con los vuestros y cuál dejáis descubierta."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Falta una hora para el amanecer. El círculo se cierra con la primera luz."
            speaker="narrator"
        [/message]
        [message]
            message="Que nadie se acerque. Ni tú, Sevrin."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="He sonado el cuerno de retirada y nadie se ha movido. Mis veteranos se quedan con sus muertos aunque tengáis que subir por encima de nosotros."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Las tumbas de los suyos cubren el flanco norte y por ahí no atacan: es el único corredor para sacar heridos. Ciérralo y perdemos la retirada; déjalo abierto y ellos también lo usan."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Escribe que lo intenté. Es lo único que te pido y ni eso me vas a conceder."
            speaker="CBM_maura_05_enemy"
        [/message]
        [message]
            message="Lo escribiré en la columna de los nombres útiles."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_maura_hero"
        [/message]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="43"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="43"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="No pude quedarme quieto. Me llamó y me moví."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Todos se movieron. Es lo que firmamos."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Yo firmé por una sepultura."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Y tienes una. Con lápida, con nombre y con turno de guardia."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Eso no es una sepultura. Es un puesto de trabajo."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Al amanecer, los veteranos de Vaust formaron detrás de los muertos de Maura sin que nadie les diera la orden."
            speaker="narrator"
        [/message]
        [message]
            message="Al amanecer, el ejército entero giró hacia Maura al mismo tiempo. Sevrin intentó quedarse quieto y no pudo. Vaust fue enterrado con sus veteranos en la misma fosa que había defendido toda la noche, y Maura copió la lápida para archivarla como prueba de propiedad. El coste de la nómina nueva cabía en una línea: miles de hombres de pie trabajando sin turno, y un general enterrado por ella misma con su nombre. Y antes de mediodía mandó parte al puerto: tres campanas seguían repartiendo las horas allí, y su ejército ya no las necesitaba. El círculo no volvió a abrirse hasta que la ciudad entera estuvo en silencio, y para entonces ya nadie recordaba quién había pedido descansar."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

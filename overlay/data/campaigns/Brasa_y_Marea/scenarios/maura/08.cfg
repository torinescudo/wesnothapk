[scenario]
    id="CBM_maura_08"
    name="La puerta sin retorno"
    next_scenario="CBM_maura_09"
    map_file="maura_08.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La última defensa de la capital derrumbó el túnel que Maura utilizaba para infiltrarse. La reina aspirante debía alcanzar la cisterna interior antes de que sus perseguidores sellaran la salida. Eron mandaba a los últimos defensores y conocía el túnel mejor que sus propios pasillos. El agua de la cisterna era la única salida que no estaba vigilada, y también la que alimentaba a media ciudad. Para una archivera, aquella agua era una puerta con horario: la compuerta se abría dos veces al día y la lista de quienes dependían de ella cabía en un pliego. El detalle que lo cambiaba todo estaba en el marco de la compuerta: los nombres de las familias del barrio alto, grabados en la piedra al pagarla, legibles con una antorcha. El coste de abrirla se escribía en verano, con las fuentes secas y las cocinas del barrio bajo pidiendo agua a la fuente pública. Y cerró el asiento con la próxima cuenta: al otro lado de la cisterna esperaba una sala del trono con treinta años de actas y un regente que aún ofrecía abdicar."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de caverna. Al frente: Paladín Eron."
            background="cbm/story/maura_08_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/maura_08_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="214"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Paladín Eron"
        type="Lieutenant"
        id="CBM_maura_08_enemy"
        name="Paladín Eron"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="148"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_maura_08_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_maura_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="No pierdas más de 5 unidades."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="23"
            y="20"
            image="items/gohere.png"
        [/item]
        [label]
            x="23"
            y="20"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Skeleton"
                    x,y="40,27"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="die"
        [filter]
            side="1"
        [/filter]
        {VARIABLE_OP cbm_losses add 1}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Arriba luchan por sus hijos. Aquí abajo, ¿por quién luchamos nosotros?"
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Tú luchas porque te lo ordeno. Yo, porque todavía hay alguien capaz de decirme que no."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La salida está sellada por el derrumbe. Alcanzad la cisterna interior antes de que Eron cierre también esa puerta."
            speaker="narrator"
        [/message]
        [message]
            message="Maura Vey, has entrado por donde entierro a mis muertos. Aquí no hay trono, solo agua."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="El agua es una puerta como cualquier otra. Solo hay que saber a qué hora abrirla."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Las galerías bajas están inundadas hasta la rodilla y arriba se oye el pico de los zapadores."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Nos quedan dos túneles. Uno lleva a la cisterna y el otro a la sala de guardia."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Conozco cada piedra de esta cueva. Los zapadores derribarán el segundo túnel cuando os vean entrar."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="Entonces iremos despacio. El que corre elige por mí."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los defensores han dejado antorchas encendidas en las hornacinas. No son trampas: son señales para los suyos."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Apágalas al pasar. Que el que venga detrás no sepa cuánto hemos avanzado."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La cisterna alimenta a media ciudad. Si abres la compuerta, las fuentes se secarán en verano."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="Lo sé. Por eso la abriré ahora y no en verano."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio lo pagarán las cocinas, los lavaderos y los enfermos que no pueden bajar al río."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Anota sus nombres. Cuando sea reina les pondré una fuente en la plaza."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La compuerta tiene una sola palanca y dos guardianes. La palanca pesa más que una persona."
            speaker="narrator"
        [/message]
        [message]
            message="Cuando salgas de aquí te estaré esperando con lo que me quede. Que sea poco, será mío."
            speaker="CBM_maura_08_enemy"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Los zapadores han derribado el túnel del medio. Solo queda la galería del agua."
            speaker="narrator"
        [/message]
        [message]
            message="La galería es estrecha. Si nos atacan aquí no cabe ni la orden de retirada."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="He derrumbado el túnel del medio sobre las tumbas de mis antepasados. No entraréis por donde entierro a los míos, ni con permiso ni sin él."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="Anoto la exhumación como gasto de guerra. La factura irá a nombre de la ciudad."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La galería del agua tiene el techo bajo y un solo ancho de hombre: dentro no hay flancos ni retirada. Avanzad en pelotón corto y dejad la retaguardia en la boca del túnel."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="He mandado encender las bombas. Si no llegas a la cisterna, te ahogarás con tus propios soldados."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="Anota: bombas encendidas antes de mi llegada. Eso lo pagará la ciudad."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El agua sube un palmo por turno y la galería no admite repliegue: empuja hacia la compuerta. Decide si forzamos la palanca con dos o cubrimos al que la empuje."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="El agua sube un palmo por turno. La cisterna queda al fondo, detrás de la compuerta."
            speaker="narrator"
        [/message]
        [message]
            message="En el marco de la compuerta están grabados los nombres de las familias del barrio alto. Si la abrís, firmáis vosotros su verano."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="Firmo con fecha y sello. El agua pasa a administración real y habrá horario."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Mis hijos beben de esa agua. Lo sabías cuando has entrado."
            speaker="CBM_maura_08_enemy"
        [/message]
        [message]
            message="Lo sabía. Y he entrado igual, que es la única respuesta que tengo."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_maura_hero"
            x="23"
            y="20"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [variable]
                name="cbm_losses"
                numerical_greater_than="5"
            [/variable]
            [then]
                [message]
                    message="No pierdas más de 5 unidades. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_08_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="39"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_08_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="39"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Salimos. El agua entra por el túnel como una columna más."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Cuenta los soldados que salen y compáralos con los que entraron. Esa es la factura."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="No has contado la de la ciudad."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="La contaré cuando pidan cuentas. Traerán un papel y yo tendré otro mejor."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Aquella noche, en el barrio alto, alguien abrió el grifo de la fuente pública y no salió nada."
            speaker="narrator"
        [/message]
        [message]
            message="Maura emergió en la cisterna y abrió las compuertas para su ejército. El agua de la ciudad dejó de correr. Eron murió defendiendo la palanca, con el nombre de sus hijos grabado en el escudo, y los zapadores se rindieron sin que nadie se lo pidiera. Maura anotó las fuentes que se secarían en verano y las incluyó en el presupuesto del año siguiente, con una partida para pozos nuevos que nunca llegó a ejecutarse. El coste quedó en el pliego de las fuentes: un barrio entero cocinando con agua de pozo y un verano medido en cubos. Y en la última línea archivó el mapa del túnel con una nota para sí misma: la sala del trono tenía un dueño viejo que todavía ofrecía firmar, y las ofertas baratas se cobran caras."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

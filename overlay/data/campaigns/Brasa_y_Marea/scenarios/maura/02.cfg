[scenario]
    id="CBM_maura_02"
    name="Pan para los obedientes"
    next_scenario="CBM_maura_03"
    map_file="maura_02.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los graneros alimentaban a la ciudad que había expulsado a Maura. Tomarlos le permitiría comprar soldados vivos y condenar al hambre a quienes no aceptaran su protección. La capitana Arel los defendía con milicianos que comían de ellos. Maura calculó la ración mínima que compraría cada juramento y la anotó antes de dar la orden."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de llanura. Al frente: Capitana Arel."
            background="cbm/story/maura_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 32."
            background="cbm/story/maura_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="166"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Capitana Arel"
        type="Lieutenant"
        id="CBM_maura_02_enemy"
        name="Capitana Arel"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="4"
            y="26"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="4"
                    y="26"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="25"
        [/scroll_to]
        [message]
            message="Hay familias dentro. Puedo romper las puertas sin prender los sacos."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Conserva el grano. Necesito que sepan exactamente quién decide cuándo comen."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Cuatro graneros rodean el mercado. Tomadlos antes de que la milicia forme en la plaza."
            speaker="narrator"
        [/message]
        [message]
            message="Esos sacos son la ración de invierno de tres mil personas. No vais a tocar ni uno."
            speaker="CBM_maura_02_enemy"
        [/message]
        [message]
            message="Voy a tocar todos. La diferencia es que después repartiré yo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Capitana, si se llevan el grano del molino, los niños de la calle del río no comen hasta la siega."
            speaker="narrator"
            caption="Hanna, molinera"
            image="cbm/portraits/hanna-molinera.png"
        [/message]
        [message]
            message="Ya lo sé, Hanna. Por eso estoy aquí y no en el cuartel."
            speaker="CBM_maura_02_enemy"
        [/message]
        [message]
            message="Nadie te ha pedido que te quedes. Puedes irte a casa con tus molinos y tus milicianos."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Y tú puedes irte de esta provincia. Ninguna de las dos lo va a hacer."
            speaker="CBM_maura_02_enemy"
        [/message]
        [message]
            message="Sus hombres están flacos. Llevan semanas con media ración para dársela a los suyos."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Perfecto. Un hambre conocida negocia mejor que una promesa."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="¿Y qué pondrás en los sacos cuando los vacíes? ¿A tus muertos?"
            speaker="narrator"
            caption="Hanna, molinera"
            image="cbm/portraits/hanna-molinera.png"
        [/message]
        [message]
            message="Pondré formularios. Cada familia que firme su lealtad recibirá su ración con nombre y apellido."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio es que este invierno nadie comerá sin firmar. Lo digo para que conste en tu libro."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Que conste. Un reino se administra con constancias."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La milicia duerme junto a los sacos. Cada granero tomado es una columna menos en la plaza."
            speaker="narrator"
        [/message]
        [message]
            message="Si llego a saber que la archivera volvería con un ejército, habría quemado el grano en otoño."
            speaker="CBM_maura_02_enemy"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="El primer granero cambia de dueño sin que se derrame un solo saco."
            speaker="narrator"
        [/message]
        [message]
            message="Están escribiendo nuestros nombres en una lista. ¿Para qué es la lista?"
            speaker="narrator"
            caption="Hanna, molinera"
            image="cbm/portraits/hanna-molinera.png"
        [/message]
        [message]
            message="Para saber a quién no habrá que volver a pedirle nada."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="Mis milicianos racionan lo que les queda. Si aguantáis dos días más, se rendirán solos."
            speaker="CBM_maura_02_enemy"
        [/message]
        [message]
            message="Está contando en voz alta la comida que le queda. Eso no lo hace un cobarde."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Desde el otro lado del río la ciudad ya raciona. Mañana no quedará nada que tomar."
            speaker="narrator"
        [/message]
        [message]
            message="Entonces firmamos esta noche."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Hanna tiene razón. Los que se rindan comerán y los demás aprenderán lo que es un invierno sin archivo."
            speaker="CBM_maura_02_enemy"
        [/message]
        [message]
            message="Tu molino sigue en pie. Es más de lo que habrías dejado tú."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="38"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="38"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los sacos salieron contados. Hanna se quedó en la puerta del molino mirando la lista."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Que la lea. Quiero que memoricen la letra de quien reparte."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="No has vaciado el granero. Has vaciado la palabra reparto."
            speaker="narrator"
            caption="Hanna, molinera"
            image="cbm/portraits/hanna-molinera.png"
        [/message]
        [message]
            message="Exactamente. A partir de ahora se llama ración, y la firmo yo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="En la calle del río los niños contaron los carros que se iban, sin que nadie les explicara que aquel pan era el último que llegaba sin condiciones."
            speaker="narrator"
        [/message]
        [message]
            message="Maura repartió raciones junto a formularios de lealtad. Los escribas registraron cada negativa. El primer invierno sin deuda fue también el primero en que un pan tuvo nombre y apellido. Hanna guardó el formulario de su familia sin firmar, y Maura lo archivó igualmente, en la carpeta de los que aún debían una respuesta. El granero siguió en pie; lo que se cerró fue la puerta por la que antes se entraba sin preguntar."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

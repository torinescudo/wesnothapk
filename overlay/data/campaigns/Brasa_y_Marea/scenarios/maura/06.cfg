[scenario]
    id="CBM_maura_06"
    name="Las tres campanas"
    next_scenario="CBM_maura_07"
    map_file="maura_06.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Las campanas del santuario liberaban a los muertos que oían su repique. Maura ordenó silenciarlas antes de entrar en la capital. Para una archivera acostumbrada a que los muertos esperaran su turno, aquellas campanas eran una puerta sin llave: bastaba una hora exacta para devolver a cada uno lo suyo. Los defensores dejaron abiertas las puertas para quienes huyeran de ella. El santuario daba pan y sal a quien lo pidiera y por eso era el único edificio del puerto con la puerta abierta de noche. El detalle que lo cambiaba todo estaba en la campana grande: doscientos años de bronce con el nombre del fundidor grabado en el ala, legible desde el muelle. El coste de silenciarlas se escribía con tres rayas: la campana del alba, la de los entierros y la de las tormentas, y un puerto entero a oscuras de horas. Y al cierre del asiento anotó la próxima cuenta: en el claro de la ribera, catorce villas pedían audiencia y llevaban a sus caídos como moneda."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Abadesa Ysol."
            background="cbm/story/maura_06_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/maura_06_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="198"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Abadesa Ysol"
        type="Lieutenant"
        id="CBM_maura_06_enemy"
        name="Abadesa Ysol"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="136"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_maura_06_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_maura_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="41"
            y="12"
            image="items/brazier.png"
        [/item]
        [label]
            x="41"
            y="12"
            text="Punto 1"
        [/label]
        [item]
            x="21"
            y="6"
            image="items/brazier.png"
        [/item]
        [label]
            x="21"
            y="6"
            text="Punto 2"
        [/label]
        [item]
            x="33"
            y="10"
            image="items/brazier.png"
        [/item]
        [label]
            x="33"
            y="10"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_maura_companion"
            x="3"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_maura_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Deathblade"
                    id="CBM_maura_companion"
                    name="Sevrin"
                    side="1"
                    x="3"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="3"
            y="31"
        [/scroll_to]
        [message]
            message="Incluso ahora nos ofrecen refugio."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Ofrecen deserción. Desmonta las campanas y funde sus badajos."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Tres campanas repican en el santuario. Silenciadlas todas antes de que amanezca."
            speaker="narrator"
        [/message]
        [message]
            message="Esta puerta está abierta para quien huya de ti. No la cierro ni aunque me lo pidas con un ejército."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="No te la voy a cerrar. Voy a quitar el badajo para que nadie la oiga desde el agua."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Abadesa, si callamos las campanas, los muertos del puerto se quedarán sin su hora."
            speaker="narrator"
            caption="Ondra, sacristana"
            image="cbm/portraits/ondra-sacristana.png"
        [/message]
        [message]
            message="Tendrán la mía. Todo trabajo tiene horario."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Las campanas no llaman a los muertos. Avisan a los vivos de que alguien ha muerto y hay que ir a su casa."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="Pues entraré yo primero y con la puerta abierta, para que se ahorren el duelo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Hay refugiados en el claustro. Familias que llegaron huyendo de nosotras."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Que no se toquen. Necesito testigos, no bajas."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El bronce de la campana grande tiene doscientos años y el nombre de su fundidor grabado."
            speaker="narrator"
            caption="Ondra, sacristana"
            image="cbm/portraits/ondra-sacristana.png"
        [/message]
        [message]
            message="Fundidor y fecha. Todo lo que tiene nombre se puede inventariar."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio es que una ciudad entera perderá la hora exacta en que muere su gente."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Yo misma redactaré el horario nuevo y lo pegaré en la puerta."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Cuando entres en la capital no te abrirán las puertas: te las dejarán abiertas para que salgas."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="El santuario tiene tres torres. Cada campana silenciada deja una parte del puerto a oscuras."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los refugiados del claustro han salido a la playa. Uno lleva la campana pequeña a cuestas."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Dejadlo llegar al agua. La marea se encargará del sonido."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="En el claustro hay un niño pequeño que aprende las horas con las campanas. Si las fundes, le dejas sin maestra y sin mañana."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="Le daré un horario impreso y una ración con su nombre. Es más de lo que le daba el bronce."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los defensores no guardan las campanas: guardan la retirada de los suyos por la playa. Si cerráis la puerta abierta, los refugiados se quedan dentro con nosotros y el asalto se decide en el claustro."
            speaker="CBM_maura_companion"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No has silenciado una campana. Has silenciado la costumbre de enterrar con nombre."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="La costumbre la escribo de nuevo. Con sello y con fecha."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="41"
            y="12"
        [/filter]
        [remove_item]
            x="41"
            y="12"
        [/remove_item]
        [item]
            x="41"
            y="12"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="41"
            y="12"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La campana del alba cae muda. Media bahía deja de oír el repique."
            speaker="narrator"
        [/message]
        [message]
            message="La campana del alba la pagaron las viudas del puerto con sus anillos. No es de la abadesa: es de quien la tocaba y de quien la oía."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="Lo anoto como donación con cargos. Las viudas pasan a la lista de acreedoras y cobrarán en raciones."
            speaker="CBM_maura_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="21"
            y="6"
        [/filter]
        [remove_item]
            x="21"
            y="6"
        [/remove_item]
        [item]
            x="21"
            y="6"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="21"
            y="6"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La segunda era la de los entierros. Yo la tocaba desde los once años."
            speaker="narrator"
            caption="Ondra, sacristana"
            image="cbm/portraits/ondra-sacristana.png"
        [/message]
        [message]
            message="Aprenderás a tocar el cambio de turno. Se paga mejor y no despierta a nadie."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Las tres torres están separadas por el tejado del claustro: de una a otra hay que bajar y cruzar el patio, y cada campana caída deja un barrio del puerto sin luz. Tomadlas de fuera hacia dentro o os cortarán entre torres."
            speaker="narrator"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="33"
            y="10"
        [/filter]
        [remove_item]
            x="33"
            y="10"
        [/remove_item]
        [item]
            x="33"
            y="10"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="33"
            y="10"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Has apagado la voz del santuario. Ahora tendrás que oír los nombres uno por uno."
            speaker="CBM_maura_06_enemy"
        [/message]
        [message]
            message="Los oigo desde el archivo. Es mi trabajo."
            speaker="CBM_maura_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [have_unit]
                        id="CBM_maura_hero"
                        formula="hitpoints * 2 < max_hitpoints"
                    [/have_unit]
                    [then]
                        [message]
                            message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="46"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="46"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las tres torres están mudas. Los barcos navegan a ciegas."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="La campana de los entierros se ha convertido en clavos. Lo he visto con mis ojos."
            speaker="narrator"
            caption="Ondra, sacristana"
            image="cbm/portraits/ondra-sacristana.png"
        [/message]
        [message]
            message="Clavos para la puerta nueva. Así todos los que pasen sabrán lo que hizo la vieja."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Nadie oye los clavos, Maura."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Los oiré yo cada mañana, cuando abra esa puerta."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="A la mañana siguiente el puerto amaneció sin repique y la panadería del muelle fue la primera en echar el cerrojo."
            speaker="narrator"
        [/message]
        [message]
            message="El bronce del santuario se convirtió en clavos para la puerta del palacio. Ysol se quedó en el claustro, con las manos vacías de badajos y la puerta abierta a quien llamara. Nadie llamó: el puerto había aprendido a no hacer ruido. El coste quedó escrito en el cuaderno del santuario: un puerto entero que aprendió a despedir a sus muertos sin hora exacta. Y esa noche entraron en el registro de Maura catorce firmas de la ribera, ofreciendo reconocimiento a cambio de sus caídos, con la reunión ya citada en un claro. Ondra siguió tocando una campana de madera, tan pequeña que solo la oían los que ya estaban dentro, y anotó en un cuaderno la hora de cada entierro que nadie pudo anunciar."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

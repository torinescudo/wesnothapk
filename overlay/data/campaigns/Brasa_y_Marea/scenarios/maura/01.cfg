[scenario]
    id="CBM_maura_01"
    name="El archivo prohibido"
    next_scenario="CBM_maura_02"
    map_file="maura_01.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/maura-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/maura-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Maura descubrió que los contratos funerarios conservaban los nombres necesarios para llamar a los muertos. El magistrado ordenó quemar el archivo. Ella decidió apropiarse de sus tres sellos antes de que llegaran los alguaciles. El archivo ocupaba tres salas húmedas bajo el tribunal y cada sello cerraba una lista: los que murieron debiendo y nunca pudieron pagar. Maura había escrito muchas de esas listas con su propia letra, y Helmor lo ignoraba. Esa ignorancia era la primera ventaja de la noche."
            background="cbm/portraits/maura.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Magistrado Helmor."
            background="cbm/story/maura_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 22."
            background="cbm/story/maura_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Maura Vey"
        id="CBM_maura_hero"
        name="Maura Vey"
        type="CBM Hero maura"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_maura_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Magistrado Helmor"
        type="Lieutenant"
        id="CBM_maura_01_enemy"
        name="Magistrado Helmor"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Maura Vey"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Sevrin"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Skeleton,Skeleton Archer,Dark Adept,Ghoul,Vampire Bat"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="16"
            y="13"
            image="items/brazier.png"
        [/item]
        [label]
            x="16"
            y="13"
            text="Punto 1"
        [/label]
        [item]
            x="7"
            y="4"
            image="items/brazier.png"
        [/item]
        [label]
            x="7"
            y="4"
            text="Punto 2"
        [/label]
        [item]
            x="13"
            y="20"
            image="items/brazier.png"
        [/item]
        [label]
            x="13"
            y="20"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="Deathblade"
            id="CBM_maura_companion"
            name="Sevrin"
            side="1"
            x="4"
            y="14"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="13"
        [/scroll_to]
        [message]
            message="Soy Sevrin. Firmé por una sepultura, no por otra guerra."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Firmaste obediencia a quien custodiara el sello. Ahora lo custodio yo."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Tres sellos, tres braseros en la sala del archivo. Encendedlos antes de que lleguen los alguaciles."
            speaker="narrator"
        [/message]
        [message]
            message="Maura Vey, dejaste el archivo con una copia y vuelves con una tropa. Eso lo llamo robo."
            speaker="CBM_maura_01_enemy"
        [/message]
        [message]
            message="Yo lo llamo inventario. Los contratos funerarios son deuda vencida y la deuda vencida se ejecuta."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Magistrado, la sala está llena de papeles mojados. Si prendemos fuego, la ciudad pierde cien años de registros."
            speaker="narrator"
            caption="Dolm, escribano"
            image="cbm/portraits/dolm-escribano.png"
        [/message]
        [message]
            message="Que se pierdan. Prefiero una ciudad sin memoria que una ciudad sin dueño."
            speaker="CBM_maura_01_enemy"
        [/message]
        [message]
            message="Guarda esa frase. La citaré cuando firmes tu rendición."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los alguaciles vienen por el pasillo largo. Puedo cerrar la puerta, pero no los dos patios."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="No cierres nada. Necesito que me vean trabajar."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Los nombres de los muertos no son piedras. Cada uno era alguien que pidió ser enterrado y no devuelto."
            speaker="narrator"
            caption="Dolm, escribano"
            image="cbm/portraits/dolm-escribano.png"
        [/message]
        [message]
            message="Lo sé. Yo redacté muchos de esos contratos y conozco la letra pequeña mejor que sus familias."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="El precio de esta noche es que ya no podrás distinguir a un soldado de un vecino."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Ese precio lo pago yo, y lo pago en la columna de los gastos."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Si enciendes el tercer sello, los nombres saldrán solos. No hacen falta tambores ni plegarias."
            speaker="narrator"
            caption="Dolm, escribano"
            image="cbm/portraits/dolm-escribano.png"
        [/message]
        [message]
            message="Mejor. Odio el teatro."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="La puerta principal resiste dos turnos. Los tres braseros arden de dentro hacia fuera."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="Han roto la puerta del patio. Los oigo contar en voz alta, como si les sobrara gente."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Déjalos contar. Los números son lo único que respeto de un enemigo."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Los alguaciles han traído antorchas y la sala ya huele a aceite. Queda poco archivo que salvar."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Quemé lo que pude. El resto te lo dejo por escrito, para que alguien te lo reclame."
            speaker="CBM_maura_01_enemy"
        [/message]
        [message]
            message="Recojo la reclamación. Todo lo que se escribe vuelve a mí."
            speaker="CBM_maura_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="16"
            y="13"
        [/filter]
        [remove_item]
            x="16"
            y="13"
        [/remove_item]
        [item]
            x="16"
            y="13"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="16"
            y="13"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primer sello abierto. Los nombres salen en orden alfabético y se colocan solos en la fila."
            speaker="narrator"
        [/message]
        [message]
            message="Ese de la primera fila era mi padre. Lo enterramos con su nombre y su deuda."
            speaker="narrator"
            caption="Dolm, escribano"
            image="cbm/portraits/dolm-escribano.png"
        [/message]
        [message]
            message="Ahora trabaja ordenado y ya no debe nada. Anótalo en la columna de las mejoras."
            speaker="CBM_maura_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="7"
            y="4"
        [/filter]
        [remove_item]
            x="7"
            y="4"
        [/remove_item]
        [item]
            x="7"
            y="4"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="7"
            y="4"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Estáis robando cuerpos que ya pagaron su entierro."
            speaker="CBM_maura_01_enemy"
        [/message]
        [message]
            message="Pagaron un entierro, no una propiedad. Lee tu propio contrato antes de discutir conmigo."
            speaker="CBM_maura_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="13"
            y="20"
        [/filter]
        [remove_item]
            x="13"
            y="20"
        [/remove_item]
        [item]
            x="13"
            y="20"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="13"
            y="20"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_maura_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_maura_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_maura_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_maura_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_maura_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los tres sellos están abiertos y la sala sigue en pie. No hemos quemado nada."
            speaker="CBM_maura_companion"
        [/message]
        [message]
            message="Quemar habría sido más barato. Conservar es lo que me hace reina."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="Me habéis dejado sin archivo y con trabajo. No sé si daros las gracias."
            speaker="narrator"
            caption="Dolm, escribano"
            image="cbm/portraits/dolm-escribano.png"
        [/message]
        [message]
            message="Fírmame un contrato nuevo y podrás decidirlo con calma."
            speaker="CBM_maura_hero"
        [/message]
        [message]
            message="En el patio del tribunal quedaron tres alguaciles y un montón de ceniza que ya nadie necesitaba."
            speaker="narrator"
        [/message]
        [message]
            message="Los muertos salieron en orden alfabético. Maura anotó la primera ventaja de su ejército: nadie preguntaba por la paga. Dolm, el escribano, siguió en nómina para copiar lo que se salvó del fuego, y en la primera página nueva escribió el nombre de su padre, tachado con una raya fina. Maura no le pidió que lo borrara. Un archivo con tachones es un archivo que alguien todavía recuerda."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_sira_02"
    name="Nombres bajo el martillo"
    next_scenario="CBM_sira_03"
    map_file="sira_02.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los extractores habían numerado a los litarios cautivos según la pureza de sus vetas. Entre ellos estaba el guardián que recordaba el nombre de la montaña antes de que existieran los reinos humanos."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="166"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Inspectora Nes"
        type="Lieutenant"
        id="CBM_sira_02_enemy"
        name="Inspectora Nes"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="24"
            y="3"
            image="items/gohere.png"
        [/item]
        [label]
            x="24"
            y="3"
            text="Destino"
        [/label]
        [item]
            x="13"
            y="4"
            image="items/cage.png"
        [/item]
        [label]
            x="13"
            y="4"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_sira_companion"
            x="3"
            y="17"
        [/recall]
        [if]
            [have_unit]
                id="CBM_sira_companion"
            [/have_unit]
            [else]
                [unit]
                    type="CBM Litario Resonador"
                    id="CBM_sira_companion"
                    name="Tarek del Eco"
                    side="1"
                    x="3"
                    y="17"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_sira_companion"
            message="En la lista no aparece mi maestro. Solo una pieza de cuarenta arrobas."
        [/message]
        [message]
            speaker="CBM_sira_hero"
            message="Lo llamaremos por su nombre hasta que estas paredes lo recuerden."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="13"
            y="4"
        [/filter]
        [remove_item]
            x="13"
            y="4"
        [/remove_item]
        [unit]
            type="CBM Litario Explorador"
            id="CBM_sira_02_protected"
            name="Varon de la Raíz"
            side="1"
            x="13"
            y="5"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [message]
            speaker="CBM_sira_02_protected"
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_sira_02_protected"
            x="24"
            y="3"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_sira_02_protected"
        [/filter]
        [message]
            speaker="narrator"
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="El guardián explicó que el consejo había autorizado la extracción a cambio de herramientas. Los contratos no distinguían la piedra dormida de la que soñaba."
        [/message]
        [kill]
            id="CBM_sira_02_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_sira_02"
    name="Nombres bajo el martillo"
    next_scenario="CBM_sira_03"
    map_file="sira_02.map"
    turns="30"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los extractores habían numerado a los litarios cautivos según la pureza de sus vetas. Entre ellos estaba el guardián que recordaba el nombre de la montaña antes de que existieran los reinos humanos. La cantera de Piedra Partida lleva dos meses abierta y ya tiene catastro: cada prisionero lleva un número pintado en el hombro. El guardián se llama Varon de la Raíz y guarda ese nombre antiguo. Si lo cortan en bloques, el nombre se pierde para siempre y el catastro queda como la única memoria del pueblo. La inspectora Nes firma cada partida y cree que sus cifras no mienten. Bajo la caseta, el catastro espera bajo llave, firmado por una autoridad que ni la inspectora nombra en voz alta. Cuando salga el último bloque, ese libro decidirá qué nombre puede quedarse en la montaña. Sira peina sus siete memorias en busca de la letra de aquella rúbrica: para eso está su oficio, y hoy le cuesta dormir."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de cantera. Al frente: Inspectora Nes."
            background="cbm/story/sira_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 30."
            background="cbm/story/sira_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="166"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Inspectora Nes"
        type="Lieutenant"
        id="CBM_sira_02_enemy"
        name="Inspectora Nes"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_sira_02_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_sira_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="25"
            y="6"
            image="items/gohere.png"
        [/item]
        [label]
            x="25"
            y="6"
            text="Destino"
        [/label]
        [item]
            x="17"
            y="28"
            image="items/cage.png"
        [/item]
        [label]
            x="17"
            y="28"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name=turn 15
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="CBM Litario Guardian"
                    x,y="43,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_sira_companion"
            x="4"
            y="28"
        [/recall]
        [if]
            [have_unit]
                id="CBM_sira_companion"
            [/have_unit]
            [else]
                [unit]
                    type="CBM Litario Resonador"
                    id="CBM_sira_companion"
                    name="Tarek del Eco"
                    side="1"
                    x="4"
                    y="28"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="27"
        [/scroll_to]
        [message]
            message="En la lista no aparece mi maestro. Solo una pieza de cuarenta arrobas."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Lo llamaremos por su nombre hasta que estas paredes lo recuerden."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Varon de la Raíz está enjaulado al norte. Liberadlo y llevadlo a la marca de salida en menos de treinta y dos turnos; si muere, su nombre se pierde con él."
            speaker="narrator"
        [/message]
        [message]
            message="Soy Nes, inspectora de la Casa. Cuarenta y una piezas, peso exacto, ninguna merma. Las cifras no tienen opinión, por eso las prefiero."
            speaker="CBM_sira_02_enemy"
        [/message]
        [message]
            message="Una cifra no distingue a un durmiente de un bloque. Esa es tu merma, inspectora."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El maestro cantaba cuando lo sacaron. Ahora solo lo oigo contar hasta cuarenta."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Nadie ha matado a nadie. Hay un contrato, hay una nómina y hay una cuenta que cuadra. Enseñadme la ley que rompí."
            speaker="CBM_sira_02_enemy"
        [/message]
        [message]
            message="La ley que no está escrita: no se vende a quien no ha dicho que sí. Ese es todo el pliego."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los guardianes de Nes vigilan las grúas. La jaula no tiene puerta, tiene cerrojo: hay que abrirla desde dentro."
            speaker="narrator"
        [/message]
        [message]
            message="Puedo resonar el cerrojo, pero me oirán. Tú decides cuándo."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Cuando el maestro esté a diez pasos. Ni antes ni después."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="No me saquéis por la grúa. Bajadme por la rampa, aunque tardemos; quiero sentir el suelo bajo los pies."
            speaker="CBM_sira_02_protected"
        [/message]
        [message]
            message="Vas por delante. Si te hieren, paramos la extracción y no seguimos hasta curarte."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Si sacáis esa pieza, el catastro queda incompleto. Un catastro incompleto cierra la cantera, y la cantera da de comer a dos pueblos."
            speaker="CBM_sira_02_enemy"
        [/message]
        [message]
            message="Pues que la cierren con los nombres completos. Prefiero un pueblo con memoria que dos con nómina."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="El primer puesto de control es nuestro. Las listas siguen colgadas en la caseta, con los números todavía frescos."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Arrancadlas. Que cada guardián se lleve su número a casa."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El catastro es la única balanza que no discute: piedra por herramientas, peso por sal. Quitadlo y solo queda la ley del que empuña el pico más grande."
            speaker="CBM_sira_02_enemy"
        [/message]
        [message]
            message="La cantera está descubierta donde giran las grúas: ninguna sombra cubre la marcha y cada cuerda delata el paso. Los guardias de Nes cortan la rampa; decidid si la forzáis o engañáis al peso por el foso."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_sira_02_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Me han alcanzado el hombro donde pintaron el cuatro. Que no me lo tachen."
            speaker="CBM_sira_02_protected"
        [/message]
        [message]
            message="Nadie va a tachar nada. Tarek, no lo dejes solo ni un turno."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="He cuadrado las cuentas con las piezas que quedan. Si falta una, el descuadre es vuestro."
            speaker="CBM_sira_02_enemy"
        [/message]
        [message]
            message="Las grúas giran hacia la jaula. Nes no manda cerrar: manda pesar."
            speaker="narrator"
        [/message]
        [message]
            message="La rampa da paso ancho pero pasa bajo las grúas; el foso da sombra y se inunda con el primer temporal. Nes gana si dudamos; decidid por dónde sale el maestro."
            speaker="CBM_sira_companion"
        [/message]
    [/event]
    [event]
        name="turn 28"
        [message]
            message="El plazo se agota. La siguiente partida sale al amanecer y Varon está en ella."
            speaker="narrator"
        [/message]
        [message]
            message="Entonces salimos antes. Nadie cobra un amanecer ajeno."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="La partida del amanecer ya está firmada. Un contrato no espera al que discute su letra: por eso la letra manda."
            speaker="CBM_sira_02_enemy"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Los números eran neutrales. Yo también. ¿Y ahora quién carga con la cuenta?"
            speaker="CBM_sira_02_enemy"
        [/message]
        [message]
            message="La Casa que te la encargó. Empieza por devolver el anticipo."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="17"
            y="28"
        [/filter]
        [remove_item]
            x="17"
            y="28"
        [/remove_item]
        [unit]
            type="CBM Litario Explorador"
            id="CBM_sira_02_protected"
            name="Varon de la Raíz"
            side="1"
            x="17"
            y="29"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_sira_02_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_sira_02_protected"
            x="25"
            y="6"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [have_unit]
                id="CBM_sira_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="42"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="42"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 15"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_sira_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_sira_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_sira_02_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El nombre de la montaña es un río que todavía no ha bajado. Lo llevo yo y lo digo entero cada noche."
            speaker="CBM_sira_02_protected"
        [/message]
        [message]
            message="Mi maestro ha vuelto a cantar. Desafina, pero canta."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Que lo canten los dos. Dos voces aguantan más que una, aunque se contradigan."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Varon cruza la marca de salida por la rampa, con el número cuatro todavía pintado en el hombro."
            speaker="narrator"
        [/message]
        [message]
            message="El catastro venía firmado. Si Nes lo firmó, alguien lo autorizó más arriba. Seguiremos esa rúbrica."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El guardián explicó que el consejo había autorizado la extracción a cambio de herramientas. Los contratos no distinguían la piedra dormida de la que soñaba. Varon guardó el número pintado en el hombro como prueba. Sira comparó la rúbrica del catastro con la séptima de sus memorias y no pudo dormir: la letra era la del consejero que había portado esas memorias antes que ella. Antes del alba, Varon señaló tres cámaras selladas con cera en la Veta Única: los archivos públicos donde dormía el pacto entero. Hasta que no ardieran, aquella firma seguiría mandando más que todas las voces que la habían sufrido."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_sira_02_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_sira_05"
    name="Una montaña, muchas voces"
    next_scenario="null"
    map_file="sira_05.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El mariscal llegó para confiscar las minas. Sira distribuyó los resonadores entre las cámaras: debían mantenerlos cantando hasta que la montaña cerrara sus accesos militares, dejando libres los caminos de intercambio. La orden viene firmada en la capital y no admite dudas: toda veta con memoria es un recurso militar. Si los resonadores se apagan, los ingenieros fundirán las cámaras en una sola y la montaña cantará la marcha que le impongan. Sira reparte un resonador por cámara: siete voces distintas, ninguna obediente y ninguna sola. Hay que mantenerlas cantando doce turnos, hasta que la piedra cierre los pasos estrechos del ejército. Abajo, los carros del diezmo descargan balanzas y cadenas junto a la puerta del valle, y el mariscal anota cada boca de chimenea en un pliego sin márgenes. Sira ya no pide para sí ni una noche quieta: hoy sostiene siete voces a la vez y lo que le cuesta cada una lo decidirán las cámaras. Si la montaña oye una sola voz, mañana repetirá una marcha que no eligió."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de caverna. Al frente: Mariscal del Diezmo."
            background="cbm/story/sira_05_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/sira_05_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="190"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Mariscal del Diezmo"
        type="Lieutenant"
        id="CBM_sira_05_enemy"
        name="Mariscal del Diezmo"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="130"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_sira_05_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_sira_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name=turn 2
        [message]
            speaker=narrator
            message="¿Hablar con una voz o con siete?"
    [option]
        message="una voz"
        [command]
            {VARIABLE cbm_decide_sira_05_1 "una-voz"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="siete voces"
        [command]
            {VARIABLE cbm_decide_sira_05_1 "siete-voces"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name=turn 6
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="CBM Litario Guardian"
                    x,y="44,18"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_sira_companion"
            x="4"
            y="19"
        [/recall]
        [if]
            [have_unit]
                id="CBM_sira_companion"
            [/have_unit]
            [else]
                [unit]
                    type="CBM Litario Resonador"
                    id="CBM_sira_companion"
                    name="Tarek del Eco"
                    side="1"
                    x="4"
                    y="19"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="18"
        [/scroll_to]
        [message]
            message="Podrías ordenar un solo canto. Sería más fuerte."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Sería más fácil de romper. Que cada cámara conserve su voz."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Objetivo: mantener las siete cámaras cantando doce turnos. Si Sira o Tarek caen, el canto se corta y el mariscal toma la montaña."
            speaker="narrator"
        [/message]
        [message]
            message="La capital me dio cuarenta días y un diezmo que cuadrar. No me pidió que os entendiera: me pidió que os contara."
            speaker="CBM_sira_05_enemy"
        [/message]
        [message]
            message="Cuéntanos como recurso y te responderemos como vecinos. Empieza por la palabra diezmo."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Un diezmo es lo que se entrega sin discutir. Si discutís, deja de ser diezmo y empieza a ser rebelión. Yo solo sirvo a la primera palabra."
            speaker="CBM_sira_05_enemy"
        [/message]
        [message]
            message="Yo sirvo a siete que no dicen lo mismo. Ninguna manda sobre las otras."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Las cámaras discuten entre ellas. Una quiere pactar y otra quiere cerrar los caminos para siempre."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Que discutan y que se oigan. Ese ruido es la única prueba de que seguimos vivos."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los ingenieros miden los pasos estrechos para volarlos. Si la piedra se cierra antes, el ejército no puede subir."
            speaker="narrator"
        [/message]
        [message]
            message="Puedo esperar. Tengo víveres y tengo órdenes. Vosotros tenéis canciones y una montaña que se cansa de cantarlas."
            speaker="CBM_sira_05_enemy"
        [/message]
        [message]
            message="Entonces no cantaremos igual toda la noche. Cambiaremos de voz cuando una se rinda."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="¿Y si alguna cámara decide pactar a solas?"
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Pactará con su voz y responderá con ella. No la obligaremos a callar ni la dejaremos sola."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="En la puerta pequeña del valle esperan visitantes sin cadenas. Nadie debe cerrarla, aunque la batalla empuje hacia allí."
            speaker="narrator"
        [/message]
        [message]
            message="La puerta del valle queda abierta. Si hay que elegir entre una muralla y una puerta, elegimos la puerta."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Los ingenieros han marcado el primer paso. Si lo vuelan, subiré con carros y no quedará canción que oír."
            speaker="CBM_sira_05_enemy"
        [/message]
        [message]
            message="La cámara del pozo desafina. Le queda cuerda para dos turnos más."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Los pasos estrechos son la muralla: los carros y las máquinas no caben, pero los zapadores sí. El mariscal manda volar los repechos para ensancharlos; decidid qué aproximación cubrís y cuál dejáis a la piedra."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Primer puesto del diezmo desmantelado. En su registro no hay nombres, solo tonelajes."
            speaker="narrator"
        [/message]
        [message]
            message="Escribid los nombres en el reverso. Que el próximo auditor lea a quién contaba."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Un puesto del diezmo no es un campamento: es una cuenta viva. Cada tonelaje que dejéis de pagar lo adelanta un pueblo que ni ha oído el nombre de esta montaña."
            speaker="CBM_sira_05_enemy"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Las siete cámaras se han turnado para no callar. La más joven ya no canta: tararea."
            speaker="narrator"
        [/message]
        [message]
            message="Que tararee. Mientras alguien tararee, la montaña sigue despierta."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Últimos turnos. El ejército empuja hacia la puerta pequeña del valle."
            speaker="narrator"
        [/message]
        [message]
            message="Cerrad todo menos esa puerta. La dejamos abierta a propósito."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Las rampas anchas favorecen sus lanzas y dejan las cámaras a la intemperie. Elegid dónde canta cada cámara: dentro, o a la boca del paso."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="La capital no os quiere mal: os quiere contados. Una voz para la montaña y habrá trato firmado; siete voces y solo habrá expedientes."
            speaker="CBM_sira_05_enemy"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="La capital me pedirá cuentas por cuarenta días perdidos. Diré la verdad: la montaña no era un recurso."
            speaker="CBM_sira_05_enemy"
        [/message]
        [message]
            message="Di que era muchas voces. Con eso tu informe ya sirve para algo."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_sira_hero"
        [/message]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="43"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="43"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_sira_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_sira_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La piedra ha cerrado los pasos militares. Siguen abiertos los caminos de intercambio, estrechos pero libres."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Contad las cámaras. Que cada una diga en qué voz terminó el día."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Siete respuestas distintas, ninguna idéntica. El mariscal escucha desde el valle sin entender el idioma."
            speaker="narrator"
        [/message]
        [message]
            message="Podrías haber cantado tú sola. Te habría salido más fuerte."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Habría salido más fuerte y más corta. Prefiero siete voces que se contradigan y duren."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El ejército se retiró cuando sus máquinas quedaron encajadas en pasos demasiado estrechos. En el valle, una puerta pequeña siguió abierta para los visitantes sin cadenas. Sira no volvió a firmar en nombre de nadie. Guardó la rúbrica de su séptima memoria junto al contrato del consejo, y cada cámara eligió a su portavoz sin que ninguna veta fuera cerrada por disentir. Por la puerta pequeña entró un viajero sin cadenas que preguntó por el precio del basalto, y nadie le respondió con una cifra sino con siete nombres. Sira pudo por fin pasar una noche sin que ninguna memoria le contara cómo terminaba el día: la montaña siguió recordando, pero ya no para un solo dueño."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="cbm_decide_sira_05_1"
                equals="siete-voces"
            [/variable]
            [then]
                [message]
                    message="Sira habló con una sola voz y las otras seis se quedaron mudas. Las cámaras cerraron con ella dentro de una memoria: la suya, la única que ya no podía prestar."
                    speaker="narrator"
                [/message]
            [/then]
            [else]
                [message]
                    message="El consejo dejó de hablar desde un solo pedestal. Cada cámara eligió a su portavoz y ninguna veta fue cerrada por disentir. Sira no fundó una dinastía: enseñó a escuchar el silencio entre dos respuestas."
                    speaker="narrator"
                [/message]
            [/else]
        [/if]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

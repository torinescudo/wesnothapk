[scenario]
    id="CBM_sira_01"
    name="La primera grieta"
    next_scenario="CBM_sira_02"
    map_file="sira_01.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La perforadora abrió una grieta en la cámara donde Sira despertaba. Los mineros creyeron haber encontrado estatuas. Solo cambiaron de opinión cuando una de ellas apartó del derrumbe a un niño humano."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Capataz Edran"
        type="Lieutenant"
        id="CBM_sira_01_enemy"
        name="Capataz Edran"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="22"
            y="14"
            image="items/gohere.png"
        [/item]
        [label]
            x="22"
            y="14"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="CBM Litario Resonador"
            id="CBM_sira_companion"
            name="Tarek del Eco"
            side="1"
            x="3"
            y="10"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [message]
            speaker="CBM_sira_companion"
            message="Si golpeamos sus herramientas, oirán una amenaza. Si no lo hacemos, no volveremos a oír a los nuestros."
        [/message]
        [message]
            speaker="CBM_sira_hero"
            message="Abriremos un camino hasta la cámara del eco. Quien baje el pico podrá marcharse."
        [/message]
        [message]
            speaker="narrator"
            message="Crónicas de la Brasa y la Marea. Historia original en español. Las decisiones tácticas, las bajas y la experiencia se conservan entre escenarios. Puedes guardar la partida en cualquier turno."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_sira_hero"
            x="22"
            y="14"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Tras la puerta de basalto, Sira oyó cientos de voces muy débiles. Los nacimientos se estaban apagando."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_sira_01"
    name="La primera grieta"
    next_scenario="CBM_sira_02"
    map_file="sira_01.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La perforadora abrió una grieta en la cámara donde Sira despertaba. Los mineros creyeron haber encontrado estatuas. Solo cambiaron de opinión cuando una de ellas apartó del derrumbe a un niño humano. Esa estatua era Sira de las Siete Vetas, memorista de la cámara Séptima: su oficio es sostener siete recuerdos que discuten entre ellos y devolver cada uno con su nombre. Acaba de despertar con su casa rajada y necesita sacar a los que duermen debajo por el paso viejo antes de que la puerta de basalto se cierre. Actuar le sale caro: cada palabra suya despierta guardianes y mineros asustados, y un grito mal dado convierte la fuga en estampida. Quiere una cosa concreta: pasar una noche entera sin que ninguna de sus memorias le cuente cómo termina el día. La mina se llama Vena Hundida y lleva tres generaciones arrancando basalto de sus galerías. Bajo la Séptima duerme la cámara del eco: si la perforadora llega antes, los litarios que aún no han despertado saldrán en bloques y nadie volverá a oír sus nombres. Sira tiene hasta que se cierre la puerta de basalto para sacarlos por el paso viejo. Un solo error y la montaña queda en silencio para siempre. Desde la boca del pozo, Sira ve a Edran repartir fichas de jornal sin alzar la vista mientras la cuadrilla acompasa los picos a la perforadora. Cuando la puerta se cierre, la Casa del Diezmo llevará su cuenta a la cantera, y todo lo que no salga hoy por el paso viejo saldrá mañana con un número pintado en el hombro."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de caverna. Al frente: Capataz Edran."
            background="cbm/story/sira_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/sira_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Capataz Edran"
        type="Lieutenant"
        id="CBM_sira_01_enemy"
        name="Capataz Edran"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_sira_01_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_sira_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="8"
            y="10"
            image="items/gohere.png"
        [/item]
        [label]
            x="8"
            y="10"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="CBM Litario Guardian"
                    x,y="32,13"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [unit]
            type="CBM Litario Resonador"
            id="CBM_sira_companion"
            name="Tarek del Eco"
            side="1"
            x="4"
            y="14"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="13"
        [/scroll_to]
        [message]
            message="Si golpeamos sus herramientas, oirán una amenaza. Si no lo hacemos, no volveremos a oír a los nuestros."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Abriremos un camino hasta la cámara del eco. Quien baje el pico podrá marcharse."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Me llamo Edran, capataz de Vena Hundida. Tengo un contrato con la Casa del Diezmo y una cuadrilla que cobra por bloque, no por preguntas."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="Yo soy Sira, portadora de siete memorias. Ninguna dice que un contrato pueda comprar a quien todavía duerme."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Habla bajo. Cada palabra tuya despierta a tres guardianes y a diez mineros asustados."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="La puerta de basalto está al este. Sira debe alcanzarla en menos de treinta y dos turnos; si cae o vence el plazo, la cámara del eco se pierde."
            speaker="narrator"
        [/message]
        [message]
            message="Yo bajé con mi padre. Él dice que las estatuas no sangran, pero tú me apartaste del derrumbe."
            speaker="narrator"
            caption="Nilo, el niño"
            image="cbm/portraits/nilo-el-nino.png"
        [/message]
        [message]
            message="Sangramos poco y recordamos mucho. Quédate detrás de mí y no toques la piedra que canta."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El niño humano seguirá a Sira hasta la salida. Si lo dejan atrás, el capataz lo usará de rehén en la puerta."
            speaker="narrator"
        [/message]
        [message]
            message="Si esa puerta no se abre a mi manera, la Casa manda inspectores y cierra la mina. Cientos de familias se quedan sin jornal."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="Entonces ábrela tú. Nadie te ha pedido que la cierres."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los mineros no son el enemigo. Tienen picos, tienen miedo y tienen hambre, y las tres cosas aconsejan mal."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Que nadie golpee primero. Si un pico baja, apartadlo y seguid andando."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Podéis iros. Dejadme los bloques ya cortados y no os seguiré. La Casa solo quiere su peso en piedra."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="La piedra que pesa es la que duerme. La que despierta no se deja cargar."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Faltan dos voces en la Séptima. Cuéntalas cuando lleguemos, Tarek, y no me digas que soy yo."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Almacén de la cuadrilla tomado. Los mineros que lo custodiaban dejan los picos y retroceden."
            speaker="narrator"
        [/message]
        [message]
            message="Que se retiren. No hemos venido a contar bajas."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Ese almacén lo pagó la Casa con sal y con clavos. Todo lo que movéis pesa en un libro, y el libro no perdona deudas."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="El paso viejo corre pegado al vacío: ancho para correr e imposible de defender en fila. Edran empuja la cuadrilla hacia la boca; decidid si cerráis la retaguardia o ganáis turnos hacia la puerta."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Cierro las compuertas de ventilación. Si queréis aire, abrid la puerta a mi manera."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="El humo sube por el pozo viejo. Nos quedan dos rutas y una se estrecha."
            speaker="CBM_sira_companion"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Mitad del plazo. La perforadora sigue mordiendo la Séptima y las voces de dentro se oyen más débiles."
            speaker="narrator"
        [/message]
        [message]
            message="Aunque no lleguemos a todas, llegaremos a la puerta."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Cada bloque que sale de Vena Hundida paga el pan del invierno en tres pueblos. No firmé un contrato: firmé la lista de lo que se debe y de lo que se cobra."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="La galería ancha da ventaja a sus picos y estorba nuestras lanzas. Si partimos la columna cubrimos las dos rutas; si vamos juntos, llegamos enteros pero más tarde."
            speaker="CBM_sira_companion"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Últimos turnos. La puerta de basalto empieza a cerrarse sola."
            speaker="narrator"
        [/message]
        [message]
            message="Corred. Yo sostengo la piedra hasta que pase el último."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No era mi montaña, era mi jornal. Que la Casa mande a otro y le explique la diferencia."
            speaker="CBM_sira_01_enemy"
        [/message]
        [message]
            message="Se la explicaremos nosotros, con la puerta abierta."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_sira_hero"
            x="8"
            y="10"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Bowman"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Heavy Infantryman"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_sira_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_sira_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La puerta deja pasar el aire. Nunca había oído respirar a una piedra."
            speaker="narrator"
            caption="Nilo, el niño"
            image="cbm/portraits/nilo-el-nino.png"
        [/message]
        [message]
            message="Cientos de voces. Muy débiles, pero cuentan y se responden."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Que cada una salga por su propio paso. No las apretéis en fila, se ahogan."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los nacidos cruzan la galería vieja mientras la perforadora se apaga detrás."
            speaker="narrator"
        [/message]
        [message]
            message="Edran tenía razón en una cosa: alguien tendrá que explicar esto a la Casa del Diezmo."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Tras la puerta de basalto, Sira oyó cientos de voces muy débiles. Los nacimientos se estaban apagando. Contó las que respondían y le faltaron dos: la perforadora había sellado la Séptima antes de detenerse. En la lista de la cuadrilla figuraban litarios que nadie había visto despertar, y la Casa del Diezmo la había firmado con una rúbrica que Sira reconocería más adelante. Al amanecer, la cuadrilla colgó en la caseta una hoja con números donde debían ir nombres, y la firmó la inspectora que llevaba el catastro de Piedra Partida. Sira guardó junto a ella el recuento de las dos voces que faltaban y cenó de pie, temiendo cada recuerdo que se le acercaba: todavía no sabía cuánto pesaba aquella firma."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

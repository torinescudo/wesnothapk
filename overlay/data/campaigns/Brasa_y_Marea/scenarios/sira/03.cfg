[scenario]
    id="CBM_sira_03"
    name="El consejo inmóvil"
    next_scenario="CBM_sira_04"
    map_file="sira_03.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El consejo selló los resonadores para que nadie escuchara sus pactos. Sira necesitaba despertar los tres archivos públicos. Sus custodios juraban que la obediencia era la única forma de conservar la memoria."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Custodio de la Veta Única"
        type="CBM Litario Bastion"
        id="CBM_sira_03_enemy"
        name="Custodio de la Veta Única"
        canrecruit="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador,CBM Litario Bastion"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="9"
            y="4"
            image="items/brazier.png"
        [/item]
        [label]
            x="9"
            y="4"
            text="Punto 1"
        [/label]
        [item]
            x="23"
            y="8"
            image="items/brazier.png"
        [/item]
        [label]
            x="23"
            y="8"
            text="Punto 2"
        [/label]
        [item]
            x="5"
            y="8"
            image="items/brazier.png"
        [/item]
        [label]
            x="5"
            y="8"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_sira_companion"
            x="14"
            y="14"
        [/recall]
        [if]
            [have_unit]
                id="CBM_sira_companion"
            [/have_unit]
            [else]
                [unit]
                    type="CBM Litario Resonador"
                    id="CBM_sira_companion"
                    name="Tarek del Eco"
                    side="1"
                    x="14"
                    y="14"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_sira_companion"
            message="Uno de tus siete recuerdos pertenece al consejero que firmó. ¿Cómo lucharás contra ti misma?"
        [/message]
        [message]
            speaker="CBM_sira_hero"
            message="Recordar un error no me obliga a repetirlo."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="9"
            y="4"
        [/filter]
        [remove_item]
            x="9"
            y="4"
        [/remove_item]
        [item]
            x="9"
            y="4"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="23"
            y="8"
        [/filter]
        [remove_item]
            x="23"
            y="8"
        [/remove_item]
        [item]
            x="23"
            y="8"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="5"
            y="8"
        [/filter]
        [remove_item]
            x="5"
            y="8"
        [/remove_item]
        [item]
            x="5"
            y="8"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Litario Bastion"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Litario Explorador"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Las cámaras oyeron el contrato completo. Algunas voces pidieron venganza; otras, ayuda para sacar a los humanos atrapados en las galerías."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_sira_03"
    name="El consejo inmóvil"
    next_scenario="CBM_sira_04"
    map_file="sira_03.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El consejo selló los resonadores para que nadie escuchara sus pactos. Sira necesitaba despertar los tres archivos públicos. Sus custodios juraban que la obediencia era la única forma de conservar la memoria. La sala del consejo ocupa tres terrazas sobre la Veta Única y huele a aceite de lámpara. Los archivos están sellados con cera y con juramento: si Sira no los abre, el pacto que autorizó la extracción seguirá siendo secreto. El custodio de guardia la conoce desde niña y le enseñó a resonar; cree de verdad que una sola voz evita la guerra. Si Sira fracasa, el consejo fundirá las siete cámaras en una y nadie volverá a discrepar en la montaña."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de caverna. Al frente: Custodio de la Veta Única."
            background="cbm/portraits/sira.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 32."
            background="cbm/portraits/sira.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Custodio de la Veta Única"
        type="CBM Litario Bastion"
        id="CBM_sira_03_enemy"
        name="Custodio de la Veta Única"
        canrecruit="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador,CBM Litario Bastion"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="14"
            y="22"
            image="items/brazier.png"
        [/item]
        [label]
            x="14"
            y="22"
            text="Punto 1"
        [/label]
        [item]
            x="27"
            y="12"
            image="items/brazier.png"
        [/item]
        [label]
            x="27"
            y="12"
            text="Punto 2"
        [/label]
        [item]
            x="22"
            y="14"
            image="items/brazier.png"
        [/item]
        [label]
            x="22"
            y="14"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_sira_companion"
            x="23"
            y="31"
        [/recall]
        [if]
            [have_unit]
                id="CBM_sira_companion"
            [/have_unit]
            [else]
                [unit]
                    type="CBM Litario Resonador"
                    id="CBM_sira_companion"
                    name="Tarek del Eco"
                    side="1"
                    x="23"
                    y="31"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="23"
            y="30"
        [/scroll_to]
        [message]
            message="Uno de tus siete recuerdos pertenece al consejero que firmó. ¿Cómo lucharás contra ti misma?"
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Recordar un error no me obliga a repetirlo."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Objetivo: encender los tres archivos de la Veta Única en treinta y dos turnos. Cada archivo iluminado revela una parte del pacto; si el plazo vence, el consejo vuelve a sellarlos."
            speaker="narrator"
        [/message]
        [message]
            message="Sira, yo te enseñé a sostener una nota sin romperla. No te enseñé a romper el consejo que te dio la nota."
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="No vengo a romperlo, maestro. Vengo a que se le oiga firmar."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Una voz única negocia. Siete voces se pelean y los humanos escuchan la pelea. La obediencia ha salvado más cámaras que la razón."
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="Y ha vendido más nacimientos. La obediencia no distingue lo que salva de lo que calla."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los custodios son tres. Conozco a dos: uno te abre la puerta y el otro te denuncia."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="El primer archivo está en la terraza baja, el segundo junto al pozo y el tercero en la sala sellada. Hacen falta los tres."
            speaker="narrator"
        [/message]
        [message]
            message="Ese contrato lo firmé yo, no la montaña. Si lo publicas, la culpa es mía y el castigo de todos."
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="Por eso hay que publicarlo. La culpa de uno no puede costar la memoria de todos."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Tu séptima memoria es ese contrato. Cuando arda el tercer archivo, la vas a recordar entera."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Ya la recuerdo entera. Lo que no recuerdo es haber dicho que sí."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Si enciendes esos fuegos, el consejo te nombrará enemiga y yo tendré que firmar la orden."
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="Fírmala. Yo firmé algo peor sin saberlo; al menos tú lo harás con los ojos abiertos."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="En las galerías bajas siguen atrapados mineros humanos. El eco de los archivos puede guiarlos o sepultarlos; la decisión es de Sira."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Los custodios apagan lámparas para que los archivos no se lean desde fuera. La sala se queda a oscuras por tramos."
            speaker="narrator"
        [/message]
        [message]
            message="Encended con lo que tengáis. El pacto no necesita luz para ser cierto."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Últimos turnos. El consejo prepara la fusión de las siete cámaras en una sola voz."
            speaker="narrator"
        [/message]
        [message]
            message="Todavía no. Falta el eco del pozo."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Una voz sola no discute. Yo quería eso: que nadie tuviera que elegir."
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="Elegir es lo único que nos hace libres. Empieza tú."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="14"
            y="22"
        [/filter]
        [remove_item]
            x="14"
            y="22"
        [/remove_item]
        [item]
            x="14"
            y="22"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="14"
            y="22"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primer archivo encendido. La terraza baja repite el nombre de la Casa del Diezmo y la cifra de su anticipo."
            speaker="narrator"
        [/message]
        [message]
            message="No sabes lo que has encendido. Ese nombre sostiene el techo que nos cubre."
            speaker="CBM_sira_03_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="27"
            y="12"
        [/filter]
        [remove_item]
            x="27"
            y="12"
        [/remove_item]
        [item]
            x="27"
            y="12"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="27"
            y="12"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Segundo archivo. El pacto menciona herramientas, sal y un pasillo abierto para los carros humanos."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Un pasillo, no una caravana. Que lo oiga quien lo negoció."
            speaker="CBM_sira_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="22"
            y="14"
        [/filter]
        [remove_item]
            x="22"
            y="14"
        [/remove_item]
        [item]
            x="22"
            y="14"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="22"
            y="14"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Está entero. Ahora todos saben que fui yo quien firmó. ¿Contento?"
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="No. Ahora todos saben qué firmaste, que no es lo mismo."
            speaker="CBM_sira_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Litario Bastion"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="CBM Litario Explorador"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_sira_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_sira_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los tres archivos arden a la vez. La montaña entera está repitiendo tu contrato."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Que lo oigan las cámaras y decidan si quieren seguir llamándome enemiga."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="He firmado la orden. Que conste que la firmé sabiendo lo que hacía, por primera vez en treinta años."
            speaker="CBM_sira_03_enemy"
        [/message]
        [message]
            message="El consejo no se disuelve: se queda quieto, con las siete cámaras escuchándose entre sí."
            speaker="narrator"
        [/message]
        [message]
            message="Quieto no es lo mismo que sordo. Esperaremos a que aprendan a oírse."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Las cámaras oyeron el contrato completo. Algunas voces pidieron venganza; otras, ayuda para sacar a los humanos atrapados en las galerías. Sira abrió la galería baja antes de responder a ninguna de las dos. Cuando volvió a la terraza, el consejo seguía inmóvil, pero ya nadie fingía que el pacto no existía. En su séptima memoria, la rúbrica del consejero tenía ahora fecha, testigos y una voz que la leía en alto."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

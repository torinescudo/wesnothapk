[scenario]
    id="CBM_sira_04"
    name="El peso de los vivos"
    next_scenario="CBM_sira_05"
    map_file="sira_04.map"
    turns="30"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/sira-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/sira-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Voss intentó inundar las minas para borrar sus cuentas. Una aprendiz humana conocía la válvula de emergencia. Transportarla por las galerías abiertas dividió a los litarios que acababan de liberarse. La Cantera Alta baja en espiral hasta el nivel del río y Voss ya ha abierto dos compuertas. La aprendiz Leth lleva la llave de la válvula grabada en la piel de tanto usarla. Si el agua llega a la Séptima, se ahogan por igual los liberados y los mineros que siguen abajo. Voss dice que solo cumple una orden de la Casa: borrar los libros antes de que un auditor los lea. En el rellano, Leth se pasa la llave de mano en mano y el metal brilla donde los dedos han borrado el hierro. Sira vuelve a cargar con su oficio completo: siete memorias que ya saben cómo pesa cada puerta, y ni una sola noche sin que le cuenten el final del día. Cuando baje el agua, la Casa del Diezmo no mandará un capataz ni una inspectora: mandará un mariscal con cuarenta días de ración y una lista para confiscarlo todo."
            background="cbm/portraits/sira.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de cantera. Al frente: Ingeniero Voss."
            background="cbm/story/sira_04_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 30."
            background="cbm/story/sira_04_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Sira de las Siete Vetas"
        id="CBM_sira_hero"
        name="Sira de las Siete Vetas"
        type="CBM Hero sira"
        canrecruit="yes"
        unrenamable="yes"
        recruit="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        gold="182"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_sira_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Ingeniero Voss"
        type="Lieutenant"
        id="CBM_sira_04_enemy"
        name="Ingeniero Voss"
        canrecruit="yes"
        recruit="Spearman,Bowman,Heavy Infantryman,Swordsman"
        gold="124"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_sira_04_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_sira_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Sira de las Siete Vetas"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Tarek del Eco"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="No pierdas más de 4 unidades."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="CBM Litario Guardian,CBM Litario Resonador,CBM Litario Tejedor,CBM Litario Explorador"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="3"
            y="9"
            image="items/gohere.png"
        [/item]
        [label]
            x="3"
            y="9"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 15
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="CBM Litario Guardian"
                    x,y="42,27"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="die"
        [filter]
            side="1"
        [/filter]
        {VARIABLE_OP cbm_losses add 1}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_sira_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_sira_companion"
            [/have_unit]
            [else]
                [unit]
                    type="CBM Litario Resonador"
                    id="CBM_sira_companion"
                    name="Tarek del Eco"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Peasant"
            id="CBM_sira_04_protected"
            name="Leth, aprendiz de ingeniería"
            side="1"
            x="5"
            y="4"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Nos han vendido por peso. Ahora arriesgamos las vetas por alguien que apenas pesa nada."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="El peso nunca fue la medida correcta."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Leth debe llegar a la válvula, al oeste, dentro de treinta y dos turnos. Si cae o el plazo vence, el agua sube hasta la cámara del eco."
            speaker="narrator"
        [/message]
        [message]
            message="Sé dónde está la válvula. La cerré dos veces cuando era aprendiz, una por cada turno de castigo."
            speaker="CBM_sira_04_protected"
        [/message]
        [message]
            message="Irás en medio de la columna. Ni delante ni detrás: donde puedas caer y alguien te recoja."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="No inundo nada por gusto. Tengo dos compuertas abiertas y una orden firmada para vaciar los libros."
            speaker="CBM_sira_04_enemy"
        [/message]
        [message]
            message="Hay libros y hay gente abajo. Ordena tus papeles por peso, a ver cuál se hunde primero."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los libros son la prueba de lo que pagamos. Si se pierden, vuestras liberaciones no valen nada ante un tribunal."
            speaker="CBM_sira_04_enemy"
        [/message]
        [message]
            message="Un tribunal que necesita ahogar testigos no es un tribunal. Es una compuerta más."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Los liberados discuten si escoltarla. Dicen que una humana no puede valer una veta."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Puedo llegar sola hasta la válvula. Solo necesito que alguien cierre la puerta detrás de mí."
            speaker="CBM_sira_04_protected"
        [/message]
        [message]
            message="Vas acompañada. El que no quiera caminar a tu lado puede volver a su cámara y esperar el agua."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El agua sube dos tramos de escalera por hora. Si llegamos tarde, habrá que subir a los rezagados a pulso."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Subiremos a quien quepa y volveremos por quien no. Nadie decide hoy quién se queda."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Si cierras la válvula, el agua se queda dentro y la Casa me pedirá cuentas por cada bloque no extraído."
            speaker="CBM_sira_04_enemy"
        [/message]
        [message]
            message="Que te las pida. Nosotros ya hemos pagado la nuestra."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Primer relevo de la cantera tomado. En la caseta hay planos mojados: Voss lleva contando compuertas desde el invierno."
            speaker="narrator"
        [/message]
        [message]
            message="Guardadlos. Todo lo que cuente se lo devolveremos firmado."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Un plano mojado no borra una cuenta. Lo que la Casa pagó por cada veta sigue escrito en tinta, y la tinta es lo único que un auditor respeta."
            speaker="CBM_sira_04_enemy"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_sira_04_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Me he torcido el tobillo en la escalera. Dadme la pared y sigo; no pienso ser el peso que os retrase."
            speaker="CBM_sira_04_protected"
        [/message]
        [message]
            message="Tú marcas el paso. El que se retrase, se retrasa con nosotros."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="La escalera ancha baja recta hacia la válvula, pero el agua la sube por delante; la estrecha da un rodeo seco y gana media hora. Voss corta el paso por donde vea luces: decidid por dónde baja la columna."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="He abierto la tercera compuerta. Ya no manda el ingeniero sobre el agua: manda el río."
            speaker="CBM_sira_04_enemy"
        [/message]
        [message]
            message="Se oye subir por el pozo. Nos quedan dos escaleras secas."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="El pozo central sube el agua de golpe y las galerías laterales la reparten lenta. Si abrimos las traseras ganamos salida y perdemos presión; si las cerramos, aguantamos y nos quedamos sin marcha atrás."
            speaker="CBM_sira_companion"
        [/message]
    [/event]
    [event]
        name="turn 28"
        [message]
            message="El agua alcanza el segundo tramo. La válvula está al final de la galería oeste."
            speaker="narrator"
        [/message]
        [message]
            message="Corred hacia la válvula. Yo cierro las puertas que vayan quedando atrás."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="El mundo lleva sus cuentas con tinta y con peso. Yo solo elijo qué se borra primero: los libros o la mina."
            speaker="CBM_sira_04_enemy"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Los libros se mojan igual conmigo vivo que muerto. ¿De qué me sirvió cumplir la orden?"
            speaker="CBM_sira_04_enemy"
        [/message]
        [message]
            message="De nada. Pero la aprendiz conoce la válvula, y eso sí sirve."
            speaker="CBM_sira_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_sira_04_protected"
            x="3"
            y="9"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [variable]
                name="cbm_losses"
                numerical_greater_than="4"
            [/variable]
            [then]
                [message]
                    message="No pierdas más de 4 unidades. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_sira_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="41"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_sira_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Spearman"
                    side="2"
                    x="41"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 15"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_sira_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_sira_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_sira_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_sira_04_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La válvula gira. El agua deja de subir a media escalera y se queda quieta, como si escuchara."
            speaker="CBM_sira_04_protected"
        [/message]
        [message]
            message="Hay mineros humanos en el tercer tramo. Suben agarrados a la misma cuerda que nosotros."
            speaker="CBM_sira_companion"
        [/message]
        [message]
            message="Que suban. La cuerda aguanta si no soltamos todos a la vez."
            speaker="CBM_sira_hero"
        [/message]
        [message]
            message="Voss tenía razón en una cosa: los planos pesaban. Yo peso menos y he cerrado la puerta que iba a borrarlos."
            speaker="CBM_sira_04_protected"
        [/message]
        [message]
            message="Cada cámara recibe una copia de los planos, todavía húmeda. Abrir o cerrar una puerta ya no tiene un solo dueño."
            speaker="narrator"
        [/message]
        [message]
            message="La aprendiz cerró la válvula y entregó a cada cámara una copia de los planos. Por primera vez, los litarios pudieron decidir qué puertas abrir. Sira guardó el plano con la firma de Voss y lo puso junto a la rúbrica de su séptima memoria: la misma mano, la misma prisa por borrar. Leth se quedó en la Séptima, enseñando a leer los niveles del agua a quien nunca había visto un río. Los planos que secaban las siete cámaras eran también el mapa por el que subiría quien viniera a confiscarlas. Sira repartió los resonadores antes de que en el valle se viera la primera bandera del diezmo, y esa noche ninguna de sus memorias se atrevió a contarle el final del día."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_sira_04_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

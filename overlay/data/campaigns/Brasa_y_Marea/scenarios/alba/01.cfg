[scenario]
    id="CBM_alba_01"
    name="Las barcas vacías"
    next_scenario="CBM_alba_02"
    map_file="alba_01.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/alba-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/alba-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La campana del faro sonó a mediodía, aunque Alba había retirado su badajo. En la playa aparecieron barcas vacías y, en sus bancos, nombres de vecinos todavía vivos. Alba era la farera de Valdara: encendía la torre al anochecer y cobraba de un concejo que llevaba dos meses sin pagarle. Los hombres de Sarel cerraron el embarcadero para cobrar por la huida. Nadie las había visto llegar: la marea las dejó de costado, como si alguien las hubiera empujado desde dentro. Alba contó once nombres escritos con una tinta que no era de la ciudad, y reconoció la letra de su madre en el primero. Antes de la pleamar quería escuchar esos once nombres fuera del agua, contados uno por uno. Pero cada vecino que sacara de la aduana Sarel lo apuntaría en su libro de deudas, y la primera cuenta del libro era el faro. La vela del primer banco aún olía a brea, como si la barca acabara de salir del astillero. Al anochecer midió el aceite que quedaba en la torre: apenas tres fuegos, y en el concejo no quedaba nadie a quien pedir más."
            background="cbm/portraits/alba.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Sarel, el cobrador."
            background="cbm/story/alba_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 22."
            background="cbm/story/alba_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Alba"
        id="CBM_alba_hero"
        name="Alba"
        type="CBM Hero alba"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_alba_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Sarel, el cobrador"
        type="Outlaw"
        id="CBM_alba_01_enemy"
        name="Sarel, el cobrador"
        canrecruit="yes"
        recruit="Thug,Poacher,Footpad"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_alba_01_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_alba_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Alba"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Oren"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="14"
            y="6"
            image="items/gohere.png"
        [/item]
        [label]
            x="14"
            y="6"
            text="Destino"
        [/label]
        [item]
            x="12"
            y="17"
            image="items/cage.png"
        [/item]
        [label]
            x="12"
            y="17"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="32,13"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [unit]
            type="Merman Fighter"
            id="CBM_alba_companion"
            name="Oren"
            side="1"
            x="4"
            y="14"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="13"
        [/scroll_to]
        [message]
            message="Mi hermana está encerrada en la aduana. Dice Sarel que una deuda pesa más que una vida."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Abriremos esa puerta. Después discutiremos cuánto pesa su libro de cuentas."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="La marea sube dos palmos por hora. La aduana tiene una sola puerta y Sarel ha puesto dos hombres en ella."
            speaker="narrator"
        [/message]
        [message]
            message="Nadie sale del embarcadero sin pagar su fianza. Firmé con el concejo, no con la marea."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="Enséñame esa firma y te la firmo yo delante de todo el muelle."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Puedes derribar la puerta. Yo firmo el destrozo y se lo cobro a los encerrados en la aduana."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="Hay tres familias dentro. Si entramos con violencia, las usarán de escudo."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Entonces entraremos por el agua. El embarcadero tiene muelles bajos que nadie vigila, y tú sabes nadar mejor que ellos."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Conozco el paso. Pero la escalera de servicio cruje, y si nos oyen tendremos que salir corriendo hacia la bandera."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Nima, la hermana de Oren, está en la celda del fondo. Escoltadla hasta la bandera de salida antes de la pleamar."
            speaker="narrator"
        [/message]
        [message]
            message="Ha estado tres días sin ver el mar. No la dejéis sola en la primera esquina."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Va delante de nosotros. Siempre. Aunque grite que la dejemos."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Sé lo que escribieron en esas barcas. Si me quitáis la puerta, la ciudad se ahogará contando deudas."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="La ciudad lleva contando deudas desde antes de que yo aprendiera a nadar."
            speaker="CBM_alba_companion"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Once nombres en la arena y once fianzas sin pagar. Una ciudad que no puede pagar ya está perdida, y yo llevo sus cuentas."
            speaker="CBM_alba_01_enemy"
        [/message]
        [message]
            message="La ciudad está viva y subiendo a las barcas. Apunta eso en tu libro, junto a la fecha."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Todo lo que salga por esta playa queda escrito a vuestra cuenta. Mañana el concejo leerá mi libro y sabrá quién huyó sin pagar."
            speaker="CBM_alba_01_enemy"
        [/message]
        [message]
            message="La marea cubre la senda de las dunas y solo queda seco el muelle estrecho. Sarel lo cierra con sus últimos hombres: decidid si lo forzáis o rodeáis por el agua."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He mandado abrir las compuertas del arrecife. Si no me pagáis, el agua hará mi trabajo."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="La pleamar llegará antes del amanecer. El tiempo corre."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_alba_01_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Se me doblan las piernas. Volved por mí cuando baje la marea."
            speaker="CBM_alba_01_protected"
        [/message]
        [message]
            message="La bandera está a un tiro de piedra. Apóyate en mi hombro y la alcanzamos."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Sin mi libro esta plaza sería una pelea por los bancos de las barcas. El orden que os molesta es lo único que frena al más fuerte."
            speaker="CBM_alba_01_enemy"
        [/message]
        [message]
            message="Ese orden encerró a mi hermana tres días sin ver el mar."
            speaker="CBM_alba_companion"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Mis hombres no cobran por gusto. Cobran porque alguien tiene que decidir quién queda."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="Decide tú, entonces. Yo solo voy a sacar a los que quepan."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Cobraré la salida de cada nombre, aunque tenga que seguirla mar adentro. La deuda viaja con el deudor."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="La pleamar ha borrado los muelles bajos y el agua llega ya a la cintura junto a la aduana. Sarel gana esperando: decidid si forzáis la bandera ahora o arriesgáis la subida completa."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El libro de cuentas quedó abierto en el suelo del muelle. Nadie se detuvo a recogerlo."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="12"
            y="17"
        [/filter]
        [remove_item]
            x="12"
            y="17"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_alba_01_protected"
            name="Nima"
            side="1"
            x="12"
            y="18"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_alba_01_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_alba_01_protected"
            x="14"
            y="6"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_alba_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Poacher"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_alba_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Footpad"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_alba_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_alba_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_alba_01_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La tablilla dice que la marea subirá antes del amanecer. No es una profecía: alguien abrió las compuertas del arrecife."
            speaker="CBM_alba_01_protected"
        [/message]
        [message]
            message="Velkan vendió el aceite del faro y ahora persigue a quien lo vio hacerlo."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Pues que persiga. Nosotros ya sabemos dónde está la puerta."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="En la playa, las barcas vacías seguían esperando con sus nombres a bordo."
            speaker="narrator"
        [/message]
        [message]
            message="La cautiva llevaba una tablilla robada: la marea subiría antes del amanecer. No era una profecía; alguien había abierto las compuertas del arrecife. Alba mandó encender el faro sin badajo y comprendió que ya no defendía una muralla, sino una lista de nombres. El libro de Sarel se quedó abierto en el muelle y la marea lo firmó hoja por hoja. Bajo la lámpara de la torre, la tinta de la tablilla era la misma que Alba había visto en los bancos de las barcas. Antes del alba, la niebla subió desde el agua y dejó mar adentro familias remando a ciegas: solo tres luces juntas les enseñarían el camino de vuelta."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_alba_01_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

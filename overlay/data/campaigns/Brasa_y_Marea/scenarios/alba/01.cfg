[scenario]
    id="CBM_alba_01"
    name="Las barcas vacías"
    next_scenario="CBM_alba_02"
    map_file="alba_01.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/alba-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/alba-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La campana del faro sonó a mediodía, aunque Alba había retirado su badajo. En la playa aparecieron barcas vacías y, en sus bancos, nombres de vecinos todavía vivos. Los hombres de Sarel cerraron el embarcadero para cobrar por la huida. Nadie las había visto llegar: la marea las dejó de costado, como si alguien las hubiera empujado desde dentro. Alba contó once nombres escritos con una tinta que no era de la ciudad, y reconoció la letra de su madre en el primero."
            background="cbm/portraits/alba.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Sarel, el cobrador."
            background="cbm/story/alba_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 32."
            background="cbm/story/alba_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Alba"
        id="CBM_alba_hero"
        name="Alba"
        type="CBM Hero alba"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_alba_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Sarel, el cobrador"
        type="Outlaw"
        id="CBM_alba_01_enemy"
        name="Sarel, el cobrador"
        canrecruit="yes"
        recruit="Thug,Poacher,Footpad"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Alba"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Oren"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="32"
            y="6"
            image="items/gohere.png"
        [/item]
        [label]
            x="32"
            y="6"
            text="Destino"
        [/label]
        [item]
            x="19"
            y="23"
            image="items/cage.png"
        [/item]
        [label]
            x="19"
            y="23"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="Merman Fighter"
            id="CBM_alba_companion"
            name="Oren"
            side="1"
            x="4"
            y="17"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="16"
        [/scroll_to]
        [message]
            message="Mi hermana está encerrada en la aduana. Dice Sarel que una deuda pesa más que una vida."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Abriremos esa puerta. Después discutiremos cuánto pesa su libro de cuentas."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="La marea sube dos palmos por hora. La aduana tiene una sola puerta y Sarel ha puesto dos hombres en ella."
            speaker="narrator"
        [/message]
        [message]
            message="Nadie sale del embarcadero sin pagar su fianza. Firmé con el concejo, no con la marea."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="Enséñame esa firma y te la firmo yo delante de todo el muelle."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Puedes derribar la puerta. Yo firmo el destrozo y se lo cobro a los encerrados en la aduana."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="Hay tres familias dentro. Si entramos con violencia, las usarán de escudo."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Entonces entraremos por el agua. El embarcadero tiene muelles bajos que nadie vigila, y tú sabes nadar mejor que ellos."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Conozco el paso. Pero la escalera de servicio cruje, y si nos oyen tendremos que salir corriendo hacia la bandera."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Nima, la hermana de Oren, está en la celda del fondo. Escoltadla hasta la bandera de salida antes de la pleamar."
            speaker="narrator"
        [/message]
        [message]
            message="Ha estado tres días sin ver el mar. No la dejéis sola en la primera esquina."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Va delante de nosotros. Siempre. Aunque grite que la dejemos."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Sé lo que escribieron en esas barcas. Si me quitáis la puerta, la ciudad se ahogará contando deudas."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="La ciudad lleva contando deudas desde antes de que yo aprendiera a nadar."
            speaker="CBM_alba_companion"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He mandado abrir las compuertas del arrecife. Si no me pagáis, el agua hará mi trabajo."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="La pleamar llegará antes del amanecer. El tiempo corre."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_alba_01_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Se me doblan las piernas. Volved por mí cuando baje la marea."
            speaker="CBM_alba_01_protected"
        [/message]
        [message]
            message="La bandera está a un tiro de piedra. Apóyate en mi hombro y la alcanzamos."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Mis hombres no cobran por gusto. Cobran porque alguien tiene que decidir quién queda."
            speaker="narrator"
            caption="Sarel, el cobrador"
            image="cbm/portraits/sarel-el-cobrador.png"
        [/message]
        [message]
            message="Decide tú, entonces. Yo solo voy a sacar a los que quepan."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El libro de cuentas quedó abierto en el suelo del muelle. Nadie se detuvo a recogerlo."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="19"
            y="23"
        [/filter]
        [remove_item]
            x="19"
            y="23"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_alba_01_protected"
            name="Nima"
            side="1"
            x="19"
            y="24"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_alba_01_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_alba_01_protected"
            x="32"
            y="6"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_alba_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Poacher"
                    side="2"
                    x="35"
                    y="13"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_alba_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Footpad"
                    side="2"
                    x="35"
                    y="13"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_alba_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_alba_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_alba_01_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La tablilla dice que la marea subirá antes del amanecer. No es una profecía: alguien abrió las compuertas del arrecife."
            speaker="CBM_alba_01_protected"
        [/message]
        [message]
            message="Velkan vendió el aceite del faro y ahora persigue a quien lo vio hacerlo."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Pues que persiga. Nosotros ya sabemos dónde está la puerta."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="En la playa, las barcas vacías seguían esperando con sus nombres a bordo."
            speaker="narrator"
        [/message]
        [message]
            message="La cautiva llevaba una tablilla robada: la marea subiría antes del amanecer. No era una profecía; alguien había abierto las compuertas del arrecife. Alba mandó encender el faro sin badajo y comprendió que ya no defendía una muralla, sino una lista de nombres."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_alba_01_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

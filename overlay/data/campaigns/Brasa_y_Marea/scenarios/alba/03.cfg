[scenario]
    id="CBM_alba_03"
    name="El amanecer prestado"
    next_scenario="null"
    map_file="alba_03.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/alba-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/alba-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El agua lamía los peldaños de la plaza. Sarel regresó con mercenarios: pretendía recuperar sus pagarés antes de que la ciudad se hundiera. Alba instaló su última defensa junto a las barcas cargadas. No había muralla que sostener, solo una fila de embarcaciones, doscientos vecinos cargando cofres y una lámpara grande que ya nadie tenía fuerzas para subir al acantilado. Alba seguía siendo la farera de Valdara, aunque ya no quedara torre que encender: esta vez la luz tendría que flotar. El badajo que había quitado de la campana colgaba del asa de la lámpara, y con él tocaba la llamada cada vez que una barca quedaba cargada. Antes del amanecer había que decidir qué se quedaba en la plaza: las piedras o la última luz."
            background="cbm/portraits/alba.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Sarel, sin puerto."
            background="cbm/story/alba_03_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/alba_03_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Alba"
        id="CBM_alba_hero"
        name="Alba"
        type="CBM Hero alba"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        gold="174"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_alba_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Sarel, sin puerto"
        type="Outlaw"
        id="CBM_alba_03_enemy"
        name="Sarel, sin puerto"
        canrecruit="yes"
        recruit="Thug,Poacher,Footpad,Trapper"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_alba_03_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_alba_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Alba"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Oren"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 8."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name=turn 2
        [message]
            speaker=narrator
            message="¿Salvar las piedras o la gente?"
    [option]
        message="salvar gente"
        [command]
            {VARIABLE cbm_decide_alba_03_1 "salvar-gente"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="salvar piedras"
        [command]
            {VARIABLE cbm_decide_alba_03_1 "salvar-piedras"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name=turn 3
        [message]
            speaker=narrator
            message="¿Quemar el aceite en la plaza o en el faro?"
    [option]
        message="aceite plaza"
        [command]
            {VARIABLE cbm_decide_alba_03_2 "aceite-plaza"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="aceite faro"
        [command]
            {VARIABLE cbm_decide_alba_03_2 "aceite-faro"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name=turn 6
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="25,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_alba_companion"
            x="24"
            y="31"
        [/recall]
        [if]
            [have_unit]
                id="CBM_alba_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Fighter"
                    id="CBM_alba_companion"
                    name="Oren"
                    side="1"
                    x="24"
                    y="31"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="24"
            y="30"
        [/scroll_to]
        [message]
            message="Ya no queda sitio para la lámpara grande. Si la llevamos, alguien tendrá que quedarse."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Entonces la dejamos encendida. Que la ciudad haga una última cosa buena."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Sarel ataca al amanecer. Resistid hasta que la última barca esté cargada."
            speaker="narrator"
        [/message]
        [message]
            message="Me quitasteis la puerta y con ella mi oficio. Ahora todos pagaréis la mitad de lo que me debéis."
            speaker="narrator"
            caption="Sarel, sin puerto"
            image="cbm/portraits/sarel-sin-puerto.png"
        [/message]
        [message]
            message="Nadie te debe nada. Y el agua no cobra intereses."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="El agua no, pero mis mercenarios sí. Y son de fuera, así que no tienen familia en esta plaza."
            speaker="narrator"
            caption="Sarel, sin puerto"
            image="cbm/portraits/sarel-sin-puerto.png"
        [/message]
        [message]
            message="Los veo desde aquí. Vienen por la rampa del mercado y por el callejón de las redes."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Dos entradas y una lámpara. Pon a los niños a cargar y a los viejos a gritar. Yo me quedo donde se rompa la fila."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Hay una barca más de las que contamos. Es la de la aduana."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Pues la cargamos. Y si hay que elegir, elegimos siempre la barca que flota."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Cada ronda ganada carga una barca. La plaza se hunde un peldaño cada dos turnos."
            speaker="narrator"
        [/message]
        [message]
            message="Podéis salvar las piedras. Nadie os lo impide. Solo tendréis que quedaros dentro."
            speaker="narrator"
            caption="Sarel, sin puerto"
            image="cbm/portraits/sarel-sin-puerto.png"
        [/message]
        [message]
            message="Las piedras ya están salvadas. Se llaman vecinos y van en esas barcas."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="No vengo por vuestras cabezas, vengo por mis pagarés. Una ciudad que no puede pagar ya está perdida, y vosotros la estáis cargando sin cerrar la cuenta."
            speaker="CBM_alba_03_enemy"
        [/message]
        [message]
            message="La rampa del mercado admite cuatro hombres de frente y el callejón de las redes solo uno. Sarel empuja por ambos para llegar a las barcas: decidid cuál tapáis y a cuál dais la espalda."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="La mitad de las barcas están cargadas. La plaza ha perdido dos peldaños."
            speaker="narrator"
        [/message]
        [message]
            message="Los mercenarios han encontrado el almacén de sal. Si lo prenden, arderá la rampa."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Mi libro era lo único que esta plaza hacía por orden. Ahora cada cofre se carga por quien grita más alto, y eso también se apunta."
            speaker="CBM_alba_03_enemy"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Cuando el agua llegue al arca, el mar se come mis pagarés y esta ciudad se queda debiendo para siempre. Llegaré antes que el agua."
            speaker="narrator"
            caption="Sarel, sin puerto"
            image="cbm/portraits/sarel-sin-puerto.png"
        [/message]
        [message]
            message="La plaza ha perdido tres peldaños y la última barca se carga en marea alta. Sarel ataca donde la fila se rompe, buscando el arca de la aduana: decidid si tapáis el muelle o cubrís los últimos cofres."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Mis pagarés están en el arca de la aduana. Devolvedme el arca y dejaré las barcas."
            speaker="narrator"
            caption="Sarel, sin puerto"
            image="cbm/portraits/sarel-sin-puerto.png"
        [/message]
        [message]
            message="El arca se fue en la primera barca. Pregúntale al agua."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Última barca en el muelle. Los que se queden no volverán a pisar tierra firme."
            speaker="narrator"
        [/message]
        [message]
            message="Nima cuenta las cabezas. Todavía falta una familia."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Os dejo las barcas y me llevo la cuenta entera. Mañana esta ciudad flotará, pero deberá cada luz que hoy regala."
            speaker="CBM_alba_03_enemy"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Sin puerto no hay deuda. Sin deuda no hay ciudad. Eso es lo que me habéis enseñado."
            speaker="narrator"
            caption="Sarel, sin puerto"
            image="cbm/portraits/sarel-sin-puerto.png"
        [/message]
        [message]
            message="Entonces aprende algo nuevo antes de que suba el agua."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_alba_hero"
        [/message]
        [if]
            [variable]
                name="turn_number"
                numerical_greater_than="8"
            [/variable]
            [then]
                [message]
                    message="Cumple el objetivo antes del turno 8. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_alba_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="24"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_alba_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="24"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_alba_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_alba_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Todas las barcas están fuera. La lámpara grande sigue encendida en la plaza."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Que arda hasta que el agua la apague. Es lo último que le pedimos a esta ciudad."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Nadie le pidió a Alba que salvara las piedras. Ella apagó la lámpara con agua de mar y subió a la última barca."
            speaker="narrator"
        [/message]
        [message]
            message="Cuando lleguemos a la otra costa, ¿qué encendemos?"
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Otra lámpara. Y una por cada persona que venga detrás."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Cuando la última barca salió, Alba apagó la lámpara con agua de mar. Nadie le pidió que salvara las piedras. En la costa nueva nadie conocía su nombre, y eso, por primera vez en su vida, no le pareció una derrota. El badajo de la campana volvió al bolsillo de Alba: era lo único que la torre había dejado salir. En la arena encendieron una lámpara por cada persona que bajaba de una barca, y Alba las contó despacio, una por una, hasta que la costa parecía una constelación a ras del agua. Su oficio seguía siendo el mismo: encender una luz para que alguien encontrara tierra."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="cbm_decide_alba_03_1"
                equals="salvar-piedras"
            [/variable]
            [then]
                [message]
                    message="El faro se quedó sin aceite y la playa sin piedras. Alba bajó la escalera contando a quién no llegó a salvar y juró que la próxima campana sonaría a tiempo, aunque fuera la última luz."
                    speaker="narrator"
                [/message]
            [/then]
            [else]
                [message]
                    message="Valdara desapareció bajo el agua. Sus habitantes fundaron un puerto sin murallas y encendieron una lámpara por cada persona rescatada. Alba conservó su oficio: guiar a otros hacia una costa que aún no conocían."
                    speaker="narrator"
                [/message]
            [/else]
        [/if]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_alba_02"
    name="Tres fuegos en la niebla"
    next_scenario="CBM_alba_03"
    map_file="alba_02.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/alba-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/alba-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Para que los pescadores encontraran a las familias evacuadas, había que encender tres señales sobre los acantilados. Velkan había vendido el aceite del faro y ahora perseguía a los testigos de su trato. Las tres hogueras debían arder a la vez: una sola luz se confunde con un reflejo, y dos parecen un incendio. Los barcos esperaban mar adentro, remando a ciegas, guiándose por el ruido de la resaca. Alba subió al primer acantilado con la última jarra de aceite y Oren contó los pasos en la niebla: al vigésimo dejaron de verse las manos. La mecha del primer brasero estaba cortada en seco, con hoja de cuchillo, no gastada por la humedad. Si Velkan vendía la luz que nadie le había pagado, Alba iba a encender la que la ciudad todavía debía a los suyos. Al pie del acantilado el agua lamía ya el primer escalón de la plaza, y por la calzada del norte venían antorchas a caballo: alguien iba a cobrar antes de que la ciudad se hundiera."
            background="cbm/portraits/alba.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Velkan, guardacostas."
            background="cbm/story/alba_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/alba_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Alba"
        id="CBM_alba_hero"
        name="Alba"
        type="CBM Hero alba"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        gold="166"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_alba_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Velkan, guardacostas"
        type="Outlaw"
        id="CBM_alba_02_enemy"
        name="Velkan, guardacostas"
        canrecruit="yes"
        recruit="Thug,Poacher,Footpad,Trapper"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_alba_02_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_alba_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Alba"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Oren"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="10"
            y="9"
            image="items/brazier.png"
        [/item]
        [label]
            x="10"
            y="9"
            text="Punto 1"
        [/label]
        [item]
            x="26"
            y="4"
            image="items/brazier.png"
        [/item]
        [label]
            x="26"
            y="4"
            text="Punto 2"
        [/label]
        [item]
            x="40"
            y="3"
            image="items/brazier.png"
        [/item]
        [label]
            x="40"
            y="3"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="49,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_alba_companion"
            x="4"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_alba_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Fighter"
                    id="CBM_alba_companion"
                    name="Oren"
                    side="1"
                    x="4"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="31"
        [/scroll_to]
        [message]
            message="El aceite alcanza para tres fuegos pequeños. No para una hoguera que vean los señores desde sus torres."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Las señales son para las barcas, Oren. Nunca fueron para los señores."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Tres puntos marcados en los acantilados. Llevad una unidad a cada brasero antes de que la niebla cierre el puerto."
            speaker="narrator"
        [/message]
        [message]
            message="La niebla sube del agua y no del cielo. Esta noche nos verán desde el mar y desde ningún otro sitio."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="El aceite era mío. Vendí lo que sobraba después de cumplir con el faro."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Y el faro estuvo cuatro noches apagado hasta que lo encendimos. Explícame qué cumpliste."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Explícame tú quién paga a los guardacostas cuando no hay barcos que cobren."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Nadie. Esa es la respuesta, y por eso hiciste mal el trabajo."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Sus hombres vigilan el sendero alto. Podemos subir por la cala, pero tendremos que separarnos."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Nos separamos. Si uno no llega, los otros dos siguen encendiendo fuegos."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Si enciendo una hoguera más, mañana no habrá guardacostas y los contrabandistas harán lo que quieran con el puerto."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Mañana habrá vecinos. Empieza por ahí y el resto sale solo."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="La niebla borra la costa a media altura. Los braseros se encienden de dentro hacia fuera."
            speaker="narrator"
        [/message]
        [message]
            message="Oigo remos. No son de pesca: van muy despacio, para no perderse."
            speaker="CBM_alba_companion"
        [/message]
    [/event]
    [event]
        name="turn 2"
        [message]
            message="Nadie pagó nunca por esa luz que vendí al mar: ni el concejo, ni los pescadores, ni vosotros. El aceite era lo único mío que quedaba dentro del faro."
            speaker="CBM_alba_02_enemy"
        [/message]
        [message]
            message="Esta noche la luz se paga con vecinos. Apúntalo en tu cuaderno."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los guardacostas han cortado el sendero alto. Habrá que volver a bajar por la cala."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="La cala queda a la vista del acantilado y el sendero alto ya no existe. Velkan os quiere separados para apagar un fuego cada vez: decidid si bajáis juntos o repartís unidades."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Cuando se levante la niebla recorreré las tres calas con mi cuaderno. Quien haya tocado el aceite firmará un pago, porque esta luz por fin se cobra."
            speaker="CBM_alba_02_enemy"
        [/message]
        [message]
            message="El tercer acantilado solo se sube por una escalera estrecha y la niebla la borra a media altura. Velkan la defiende con sus últimos guardacostas: decidid quién sube y quién cubre la retirada."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="La niebla empieza a cerrarse sobre el tercer acantilado. Queda poco para que el puerto quede ciego."
            speaker="narrator"
        [/message]
        [message]
            message="El faro ardió catorce años con mi aceite y mi sueldo. ¿Cuántas barcas se habrían salvado si alguien me hubiera pagado por encenderlo?"
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No vendí el aceite para huir. Lo vendí para comer, como todos."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Nadie te ha pedido que te mueras de hambre. Te hemos pedido que no apagues la luz."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="10"
            y="9"
        [/filter]
        [remove_item]
            x="10"
            y="9"
        [/remove_item]
        [item]
            x="10"
            y="9"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="10"
            y="9"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primer fuego encendido. La niebla se tiñe de naranja y alguien responde desde el agua con dos golpes de remo."
            speaker="narrator"
        [/message]
        [message]
            message="Apagad ese primer fuego y todavía podemos hablar. Puedo jurar que fue un incendio y ahorraros la cuenta del aceite."
            speaker="CBM_alba_02_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="26"
            y="4"
        [/filter]
        [remove_item]
            x="26"
            y="4"
        [/remove_item]
        [item]
            x="26"
            y="4"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="26"
            y="4"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Dos luces son un incendio. Los señores mandarán gente a apagarlas."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Que vengan a apagarlas con las manos."
            speaker="CBM_alba_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="40"
            y="3"
        [/filter]
        [remove_item]
            x="40"
            y="3"
        [/remove_item]
        [item]
            x="40"
            y="3"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="40"
            y="3"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [have_unit]
                        id="CBM_alba_hero"
                        formula="hitpoints * 2 < max_hitpoints"
                    [/have_unit]
                    [then]
                        [message]
                            message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_alba_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="48"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_alba_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="48"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_alba_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_alba_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Tres luces respondieron desde el mar. Reconozco los golpes de remo de mi familia."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Cuéntalos otra vez. Quiero saber cuántas barcas quedan fuera."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Cuatro barcas y una que va vacía, remolcada."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Oren reconoció el ritmo de los golpes de remo de su familia. Quedaba una última noche que comprarles."
            speaker="narrator"
        [/message]
        [message]
            message="Tres luces respondieron desde el mar. Oren reconoció el ritmo de los golpes de remo de su familia. Quedaba una última noche que comprarles, y Alba ya había decidido con qué iba a pagarla: con la única cosa que la ciudad no había vendido todavía, su faro apagado. En la arena del tercer acantilado apareció el cuaderno de guardacostas de Velkan, con cada servicio anotado y ni un pago firmado. Los braseros se consumieron antes del alba y la niebla se los tragó sin dejar rescoldo. Antes de bajar a la plaza, Alba vio antorchas avanzando por la calzada del norte: alguien venía a cobrar lo suyo antes de que el agua cubriera el último escalón."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

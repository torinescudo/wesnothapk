[scenario]
    id="CBM_alba_02"
    name="Tres fuegos en la niebla"
    next_scenario="CBM_alba_03"
    map_file="alba_02.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/alba-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/alba-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Para que los pescadores encontraran a las familias evacuadas, había que encender tres señales sobre los acantilados. Velkan había vendido el aceite del faro y ahora perseguía a los testigos de su trato."
            background="cbm/portraits/alba.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Alba"
        id="CBM_alba_hero"
        name="Alba"
        type="CBM Hero alba"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        gold="166"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_alba_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Velkan, guardacostas"
        type="Outlaw"
        id="CBM_alba_02_enemy"
        name="Velkan, guardacostas"
        canrecruit="yes"
        recruit="Thug,Poacher,Footpad,Trapper"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Alba"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Oren"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="8"
            y="4"
            image="items/brazier.png"
        [/item]
        [label]
            x="8"
            y="4"
            text="Punto 1"
        [/label]
        [item]
            x="13"
            y="16"
            image="items/brazier.png"
        [/item]
        [label]
            x="13"
            y="16"
            text="Punto 2"
        [/label]
        [item]
            x="21"
            y="5"
            image="items/brazier.png"
        [/item]
        [label]
            x="21"
            y="5"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_alba_companion"
            x="3"
            y="17"
        [/recall]
        [if]
            [have_unit]
                id="CBM_alba_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Fighter"
                    id="CBM_alba_companion"
                    name="Oren"
                    side="1"
                    x="3"
                    y="17"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_alba_companion"
            message="El aceite alcanza para tres fuegos pequeños. No para una hoguera que vean los señores desde sus torres."
        [/message]
        [message]
            speaker="CBM_alba_hero"
            message="Las señales son para las barcas, Oren. Nunca fueron para los señores."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="8"
            y="4"
        [/filter]
        [remove_item]
            x="8"
            y="4"
        [/remove_item]
        [item]
            x="8"
            y="4"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="13"
            y="16"
        [/filter]
        [remove_item]
            x="13"
            y="16"
        [/remove_item]
        [item]
            x="13"
            y="16"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="21"
            y="5"
        [/filter]
        [remove_item]
            x="21"
            y="5"
        [/remove_item]
        [item]
            x="21"
            y="5"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_alba_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_alba_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Tres luces respondieron desde el mar. Oren reconoció el ritmo de los golpes de remo de su familia. Quedaba una última noche que comprarles."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

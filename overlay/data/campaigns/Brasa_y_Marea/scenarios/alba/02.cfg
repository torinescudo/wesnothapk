[scenario]
    id="CBM_alba_02"
    name="Tres fuegos en la niebla"
    next_scenario="CBM_alba_03"
    map_file="alba_02.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/alba-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/alba-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Para que los pescadores encontraran a las familias evacuadas, había que encender tres señales sobre los acantilados. Velkan había vendido el aceite del faro y ahora perseguía a los testigos de su trato. Las tres hogueras debían arder a la vez: una sola luz se confunde con un reflejo, y dos parecen un incendio. Los barcos esperaban mar adentro, remando a ciegas, guiándose por el ruido de la resaca."
            background="cbm/portraits/alba.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Velkan, guardacostas."
            background="cbm/story/alba_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/alba_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Alba"
        id="CBM_alba_hero"
        name="Alba"
        type="CBM Hero alba"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        gold="166"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_alba_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Velkan, guardacostas"
        type="Outlaw"
        id="CBM_alba_02_enemy"
        name="Velkan, guardacostas"
        canrecruit="yes"
        recruit="Thug,Poacher,Footpad,Trapper"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Alba"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Oren"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Footpad,Merman Fighter,Mage"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="24"
            y="31"
            image="items/brazier.png"
        [/item]
        [label]
            x="24"
            y="31"
            text="Punto 1"
        [/label]
        [item]
            x="17"
            y="13"
            image="items/brazier.png"
        [/item]
        [label]
            x="17"
            y="13"
            text="Punto 2"
        [/label]
        [item]
            x="24"
            y="14"
            image="items/brazier.png"
        [/item]
        [label]
            x="24"
            y="14"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_alba_companion"
            x="4"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_alba_companion"
            [/have_unit]
            [else]
                [unit]
                    type="Merman Fighter"
                    id="CBM_alba_companion"
                    name="Oren"
                    side="1"
                    x="4"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="31"
        [/scroll_to]
        [message]
            message="El aceite alcanza para tres fuegos pequeños. No para una hoguera que vean los señores desde sus torres."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Las señales son para las barcas, Oren. Nunca fueron para los señores."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Tres puntos marcados en los acantilados. Llevad una unidad a cada brasero antes de que la niebla cierre el puerto."
            speaker="narrator"
        [/message]
        [message]
            message="La niebla sube del agua y no del cielo. Esta noche nos verán desde el mar y desde ningún otro sitio."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="El aceite era mío. Vendí lo que sobraba después de cumplir con el faro."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Y el faro estuvo cuatro noches apagado hasta que lo encendimos. Explícame qué cumpliste."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Explícame tú quién paga a los guardacostas cuando no hay barcos que cobren."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Nadie. Esa es la respuesta, y por eso hiciste mal el trabajo."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Sus hombres vigilan el sendero alto. Podemos subir por la cala, pero tendremos que separarnos."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Nos separamos. Si uno no llega, los otros dos siguen encendiendo fuegos."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Si enciendo una hoguera más, mañana no habrá guardacostas y los contrabandistas harán lo que quieran con el puerto."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Mañana habrá vecinos. Empieza por ahí y el resto sale solo."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="La niebla borra la costa a media altura. Los braseros se encienden de dentro hacia fuera."
            speaker="narrator"
        [/message]
        [message]
            message="Oigo remos. No son de pesca: van muy despacio, para no perderse."
            speaker="CBM_alba_companion"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los guardacostas han cortado el sendero alto. Habrá que volver a bajar por la cala."
            speaker="CBM_alba_companion"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="La niebla empieza a cerrarse sobre el tercer acantilado. Queda poco para que el puerto quede ciego."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No vendí el aceite para huir. Lo vendí para comer, como todos."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Nadie te ha pedido que te mueras de hambre. Te hemos pedido que no apagues la luz."
            speaker="CBM_alba_hero"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="24"
            y="31"
        [/filter]
        [remove_item]
            x="24"
            y="31"
        [/remove_item]
        [item]
            x="24"
            y="31"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="24"
            y="31"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Primer fuego encendido. La niebla se tiñe de naranja y alguien responde desde el agua con dos golpes de remo."
            speaker="narrator"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="17"
            y="13"
        [/filter]
        [remove_item]
            x="17"
            y="13"
        [/remove_item]
        [item]
            x="17"
            y="13"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="17"
            y="13"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Dos luces son un incendio. Los señores mandarán gente a apagarlas."
            speaker="narrator"
            caption="Velkan, guardacostas"
            image="cbm/portraits/velkan-guardacostas.png"
        [/message]
        [message]
            message="Que vengan a apagarlas con las manos."
            speaker="CBM_alba_hero"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="24"
            y="14"
        [/filter]
        [remove_item]
            x="24"
            y="14"
        [/remove_item]
        [item]
            x="24"
            y="14"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="24"
            y="14"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_alba_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="48"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_alba_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Thug"
                    side="2"
                    x="48"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_alba_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_alba_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_alba_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Tres luces respondieron desde el mar. Reconozco los golpes de remo de mi familia."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Cuéntalos otra vez. Quiero saber cuántas barcas quedan fuera."
            speaker="CBM_alba_hero"
        [/message]
        [message]
            message="Cuatro barcas y una que va vacía, remolcada."
            speaker="CBM_alba_companion"
        [/message]
        [message]
            message="Oren reconoció el ritmo de los golpes de remo de su familia. Quedaba una última noche que comprarles."
            speaker="narrator"
        [/message]
        [message]
            message="Tres luces respondieron desde el mar. Oren reconoció el ritmo de los golpes de remo de su familia. Quedaba una última noche que comprarles, y Alba ya había decidido con qué iba a pagarla: con la única cosa que la ciudad no había vendido todavía, su faro apagado."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

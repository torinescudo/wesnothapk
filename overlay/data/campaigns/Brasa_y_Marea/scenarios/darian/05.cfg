[scenario]
    id="CBM_darian_05"
    name="El puente de los agravios"
    next_scenario="CBM_darian_06"
    map_file="darian_05.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Una delegada campesina aceptó cruzar el antiguo frente para negociar con los velarios. Rusk, enriquecido con la guerra, anunció que cualquier acuerdo sería una traición a los muertos. El puente de los agravios unía dos orillas que llevaban veinte años llamándose enemigas, y Rusk cobraba peaje por cada carro que lo cruzaba. Rella llevaba en la mano una lista de daños escrita por su propia aldea. Darian no podía negociar por ella: solo podía conseguir que llegara viva al otro lado. La lista de daños de Rella traía una hoja en blanco al final, para los muertos que aún no se habían contado del otro lado. Llegar viva al puente era la única forma de que esa hoja se llenara con nombres en vez de con rencores. Y en la otra orilla, un capitán cobraba peaje hasta por mirar el tablazón."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Capitán Rusk."
            background="cbm/story/darian_05_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 22."
            background="cbm/story/darian_05_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor"
        gold="190"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Capitán Rusk"
        type="Dark Sorcerer"
        id="CBM_darian_05_enemy"
        name="Capitán Rusk"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="130"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_05_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="24"
            y="16"
            image="items/gohere.png"
        [/item]
        [label]
            x="24"
            y="16"
            text="Destino"
        [/label]
        [story]
            [part]
                [story]
                    text="Los campos de brasa, donde la tierra todavía guarda el calor de la primera de las siete brasas."
                [/story]
            [/part]
        [/story]
    [/event]
    [event]
        name=turn 2
        [message]
            speaker=narrator
            message="¿Firmar las reparaciones o solo el alto el fuego?"
    [option]
        message="firmar reparaciones"
        [command]
            {VARIABLE cbm_decide_darian_05_1 "firmar-reparaciones"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="firmar tregua"
        [command]
            {VARIABLE cbm_decide_darian_05_1 "firmar-tregua"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="14"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="14"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Peasant"
            id="CBM_darian_05_protected"
            name="Rella, delegada de los campos"
            side="1"
            x="5"
            y="13"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="13"
        [/scroll_to]
        [message]
            message="La delegada perdió a dos hermanos durante la oscuridad."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Por eso es ella quien decide cruzar. Nosotros haremos que llegue."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Cruzo con dos condiciones: nadie de mi comitiva llevará armas velarias y la primera palabra del otro lado será para las familias, no para los generales."
            speaker="CBM_darian_05_protected"
        [/message]
        [message]
            message="Pactado. Tus condiciones van delante de nuestra escolta."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Un acuerdo con quienes os arrancaron los ojos es una traición a los muertos. El puente está cerrado."
            speaker="CBM_darian_05_enemy"
        [/message]
        [message]
            message="Objetivo: escoltad a la delegada hasta la bandera al otro lado del puente sin que muera."
            speaker="narrator"
        [/message]
        [message]
            message="Rusk no defiende el puente: lo alquila. Cada carro que pasa paga peaje."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entonces tomaremos los dos extremos y dejaremos el centro libre para Rella."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Si mi pueblo decide no firmar, lo diréis sin castigarlo. Esa es la parte que más me cuesta creer."
            speaker="CBM_darian_05_protected"
        [/message]
        [message]
            message="Puedes comprobarlo hoy mismo. Si dices no, te devolvemos al otro lado sin un reproche."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="He visto tres treguas firmarse sobre este tablero. Todas acabaron con los mismos nombres en las mismas tumbas."
            speaker="CBM_darian_05_enemy"
        [/message]
        [message]
            message="Por eso esta vez no firmamos tregua. Escribimos un calendario."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los veteranos de Rusk cobran por semana. Si dejáis de darles trabajo, se dispersan solos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="El puente tiene dos torres y un solo camino. Rusk ha apostado ballesteros en la torre del sur."
            speaker="narrator"
        [/message]
        [message]
            message="Los míos esperan al otro lado. No me hagáis cruzar delante de sus ojos como un trofeo."
            speaker="CBM_darian_05_protected"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He mandado cargar el puente de brea. Si cruzáis, arderá con vosotros dentro."
            speaker="CBM_darian_05_enemy"
        [/message]
        [message]
            message="El centro del puente está seco. Las torres todavía no."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_darian_05_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="No es grave. Seguid andando; las listas no esperan a nadie."
            speaker="CBM_darian_05_protected"
        [/message]
        [message]
            message="Las listas pueden esperar. Ena, dos pasos y sigues."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La aldea del vado izó la bandera de los campos. Los carros de Rusk ya no pueden cobrar peaje aquí."
            speaker="narrator"
        [/message]
        [message]
            message="Mantengo este puente en pie desde antes de que supierais firmar. Quitadme el peaje y la próxima oscuridad se encontrará un barranco sin tablas y a vosotros sin paso."
            speaker="CBM_darian_05_enemy"
        [/message]
        [message]
            message="El barranco no se vadea ni en seco y el tablazón es de un solo carro: aquí una escolta cerrada estorba más de lo que cubre."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Rusk cayó junto al tablero donde firmaba sus treguas. Nadie recogió su libro de peajes."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Quedan dos turnos para cruzar. La bandera está al final del puente."
            speaker="narrator"
        [/message]
        [message]
            message="He subido la brea a las dos torres. Cruzad ahora y quemaréis la única tabla que os queda hacia el este."
            speaker="CBM_darian_05_enemy"
        [/message]
        [message]
            message="Rusk guarda la torre del sur con ballesteros y carga la del norte con brea: quiere detener a la comitiva en el centro y cobrarla entera. Elegid quién toma las torres y quién cruza sin parar con Rella."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_05_protected"
            x="24"
            y="16"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="29"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_05_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="29"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_05_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="He cruzado sin que nadie me llamara embajadora. Gracias por dejar que lo hiciera a pie."
            speaker="CBM_darian_05_protected"
        [/message]
        [message]
            message="Las condiciones eran tuyas. Nosotros solo hemos pagado el peaje con tiempo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La negociación empezará con una lista de daños. No prometo perdón."
            speaker="CBM_darian_05_protected"
        [/message]
        [message]
            message="Nosotros no lo hemos pedido. Solo pedimos que la lista se lea en voz alta."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="En la torre sur quedó una bandera de los campos. Alguien escribió debajo: aquí no se cobra peaje."
            speaker="narrator"
        [/message]
        [message]
            message="La negociación comenzó con una lista de daños y terminó con un calendario de reparaciones. Nadie lo llamó perdón. Rella hizo copiar el calendario en las dos orillas, y sobre el puente quedó una tercera copia clavada para que cualquiera pudiera añadir lo que faltaba. La copia clavada sobre el puente amaneció con una línea nueva, escrita por otra mano: una capitana pedía barcos y ponía una sola condición. La cuarta brasa se encendería en un faro pequeño, si alguien conseguía abrir un estrecho que un almirante cerraba con una cadena."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_darian_05_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

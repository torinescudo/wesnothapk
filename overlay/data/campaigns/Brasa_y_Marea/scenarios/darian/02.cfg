[scenario]
    id="CBM_darian_02"
    name="La luz que emigró"
    next_scenario="CBM_darian_03"
    map_file="darian_02.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los supervivientes de Valdara habían construido un puerto nuevo. Alba aceptó leer la carta si Darian ayudaba a defender a los recién llegados de los cobradores de cuerpos del imperio. El puerto se levantaba sobre pilotes, sin murallas, con una lámpara encendida por cada familia que el mar había devuelto. El Teniente del Tributo llamaba a eso una ciudad sin dueño y traía listas para demostrarlo. Cada barca que atracaba añadía un nombre a sus registros y una razón más para cobrar. Darian seguía sin caballo y sin nombramiento, con dos cartas de siete todavía cerradas en la alforja. Al caer la tarde, una de las lámparas del puerto se apagó sola: una familia había vuelto a la barca a buscar a un abuelo que faltaba. Que ninguna lámpara se apagara otra vez antes del turno doce era todo lo que Alba pedía para escuchar la carta."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Teniente del Tributo."
            background="cbm/story/darian_02_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/darian_02_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        gold="166"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Teniente del Tributo"
        type="Dark Sorcerer"
        id="CBM_darian_02_enemy"
        name="Teniente del Tributo"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="112"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_02_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [story]
            [part]
                [story]
                    text="El mismo puerto, otro año: Darian cruza el agua con la firma a medio hacer y los velarios ya se llevan las piedras."
                [/story]
            [/part]
        [/story]
    [/event]
    [event]
        name=turn 6
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="35,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="22"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="22"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="21"
        [/scroll_to]
        [message]
            message="Alba no necesita promesas. Necesita tiempo para desembarcar familias."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entonces nuestra primera firma se ganará aquí, junto a las barcas."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La carta dice que el pacto defenderá a los puertos libres. Yo pregunto cómo vais a defender un puerto sin murallas."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Con barcos y con camas. Si el precio de la alianza es una muralla, hoy no firmamos nada."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Firmaré cuando cumpláis dos condiciones: que ningún cobrador toque a quien ya ha desembarcado y que no levantéis un muro alrededor de mi puerto."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Aceptadas las dos. Las escribiréis con vuestra letra en la carta."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: mantened a Darian y a Ena con vida hasta el comienzo del turno 12, mientras las familias terminan de desembarcar."
            speaker="narrator"
        [/message]
        [message]
            message="El imperio reclama a los muertos de Valdara y a los vivos que los enterraron. Pagad la tasa o entregadme diez barcas."
            speaker="CBM_darian_02_enemy"
        [/message]
        [message]
            message="El mar se llevó la ciudad entera. ¿Vais a cobrarme también por el agua?"
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Cada barca que atracamos se convierte en una familia que el imperio querrá registrar."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Y si digo que no a vuestra alianza, ¿qué haréis? ¿Incendiar mi puerto?"
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Nos iremos con las barcas vacías. El pacto solo sirve si cada pueblo puede seguir diciendo no."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Hay tres muelles. El del faro está libre porque los cobradores le tienen miedo a la luz."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Entonces defenderemos el muelle del faro. Que traigan sus listas y las lean a la vista de todos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Puedo encender lámparas, no romper contratos. Las heridas se curan; las deudas, no."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="El Teniente avanza por el muelle largo. Sus hombres llevan cadenas vacías, medidas para cuerpos que aún respiran."
            speaker="narrator"
        [/message]
        [message]
            message="Oren y yo aprendimos a contar barcas antes que deudas. Si sobrevivimos al turno doce, la carta tendrá respuesta."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He comprado el muelle corto. Cada familia que baje por él queda registrada como propiedad del imperio."
            speaker="CBM_darian_02_enemy"
        [/message]
        [message]
            message="Los desembarcos siguen por el muelle del faro. El corto está cortado por cadenas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los recién llegados no saben remar. Dadme dos turnos y pondré a los suyos en los remos."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Tómalos. Defenderemos tu muelle mientras enseñas a tu gente."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Apuntad a esas familias en mi libro y el imperio responderá por ellas cuando la marea traiga de vuelta lo suyo. Lo que nadie cuenta no existe, y lo que no existe se lo queda la oscuridad."
            speaker="CBM_darian_02_enemy"
        [/message]
        [message]
            message="El puerto está sobre pilotes y el agua pasa por debajo de todo: nadie puede cerrarlo entero, pero tampoco nadie defiende los tres muelles a la vez."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La primera casa del puerto izó una lámpara encendida. Esa lámpara marca a los vuestros como refugiados, no como carga."
            speaker="narrator"
        [/message]
        [message]
            message="Esa lámpara encendida me dice dónde queda una familia más que reclamar. La tasa no es dinero: es que nadie de esta costa amanezca sin un nombre en un registro."
            speaker="CBM_darian_02_enemy"
        [/message]
        [message]
            message="El Teniente avanza por el muelle largo y deja el corto encadenado: quiere empujaros contra el faro y agotaros entre las pasarelas. Elegid qué muelle sostenéis antes de que las familias queden en medio de las cadenas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="No era una tasa. Era un registro para saber a quién llamar cuando llegue la reina."
            speaker="CBM_darian_02_enemy"
        [/message]
        [message]
            message="El libro de registros quedó abierto sobre la pasarela, con las hojas mojadas y los nombres ilegibles."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Quedan dos turnos para completar el desembarco. Mantened la posición junto a los muelles."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_darian_hero"
        [/message]
        [if]
            [have_unit]
                id="CBM_darian_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="34"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_02_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="34"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las familias están en tierra. No he firmado nada todavía."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Lo sé. La carta espera en tu mesa y la respuesta es tuya."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Mi condición se mantiene: barcos y camas, ninguna muralla."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="La anotamos con tu letra y no con la nuestra, para que se lea igual dentro de cien años."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Alba encendió una lámpara sobre la carta antes de guardarla. La segunda entrega quedó marcada con luz, no con sello."
            speaker="narrator"
        [/message]
        [message]
            message="Alba encendió una lámpara sobre la carta: el puerto aportaría barcos y refugio, pero no aceptaría volver a ser un muro que encerrara a su gente. Esa misma noche los recién llegados preguntaron si podían devolver el favor remando. El Teniente había anotado sus nombres en un registro; el puerto respondió escribiéndolos en una lista de vecinos, que cualquiera podía leer y tachar. En el cuaderno de correo, Darian anotó la segunda entrega y, al lado, la única condición de Alba: barcos y camas. La tercera carta olía a piedra mojada y llevaba una dirección que solo se abría a una petición repetida tres veces."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

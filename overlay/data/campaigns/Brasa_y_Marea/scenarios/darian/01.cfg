[scenario]
    id="CBM_darian_01"
    name="Siete cartas, ningún rey"
    next_scenario="CBM_darian_02"
    map_file="darian_01.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Darian salió de Linde con siete cartas y un caballo que perdió en el primer control imperial. Las cartas proponían reunir a quienes Maura todavía no había sometido. Ninguna llevaba un sello real."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recaudador de Ceniza"
        type="Dark Sorcerer"
        id="CBM_darian_01_enemy"
        name="Recaudador de Ceniza"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="22"
            y="14"
            image="items/gohere.png"
        [/item]
        [label]
            x="22"
            y="14"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="White Mage"
            id="CBM_darian_companion"
            name="Ena"
            side="1"
            x="3"
            y="10"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [message]
            speaker="CBM_darian_companion"
            message="Sin un rey detrás, dirán que no representamos a nadie."
        [/message]
        [message]
            speaker="CBM_darian_hero"
            message="Representamos a quienes todavía pueden responder que no."
        [/message]
        [message]
            speaker="narrator"
            message="Crónicas de la Brasa y la Marea. Historia original en español. Las decisiones tácticas, las bajas y la experiencia se conservan entre escenarios. Puedes guardar la partida en cualquier turno."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_hero"
            x="22"
            y="14"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="20"
                    y="7"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Ena salvó las cartas de una acequia. La primera estaba dirigida a una ciudad que el mar ya se había llevado."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

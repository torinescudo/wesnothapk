[scenario]
    id="CBM_darian_01"
    name="Siete cartas, ningún rey"
    next_scenario="CBM_darian_02"
    map_file="darian_01.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Darian salió de Linde con siete cartas y un caballo que perdió en el primer control imperial. Las cartas proponían reunir a quienes Maura todavía no había sometido. Ninguna llevaba un sello real. El control estaba en el bosque de Alda, donde los alguaciles del Recaudador de Ceniza registraban hasta las sillas de montar. Bastaba una carta sin sello para declarar espía a quien la llevara. Ena contó los puestos de guardia y Darian eligió un paso que nadie vigilaba. Ninguno de los dos sabía todavía que aquellas siete cartas iban a ser contestadas por siete pueblos distintos."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Recaudador de Ceniza."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 32."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recaudador de Ceniza"
        type="Dark Sorcerer"
        id="CBM_darian_01_enemy"
        name="Recaudador de Ceniza"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="29"
            y="10"
            image="items/gohere.png"
        [/item]
        [label]
            x="29"
            y="10"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [unit]
            type="White Mage"
            id="CBM_darian_companion"
            name="Ena"
            side="1"
            x="4"
            y="17"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="16"
        [/scroll_to]
        [message]
            message="Sin un rey detrás, dirán que no representamos a nadie."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Representamos a quienes todavía pueden responder que no."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: cruzad el bosque de Alda y llevad a Darian y a Ena hasta la bandera del arroyo, al este."
            speaker="narrator"
        [/message]
        [message]
            message="Toda carta sin sello imperial es contrabando. Entregadla y os dejaré seguir con el caballo que os queda."
            speaker="CBM_darian_01_enemy"
        [/message]
        [message]
            message="No llevamos caballos ni sellos. Solo preguntas que nadie ha querido leer."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Puedo guiaros por el paso del arroyo, con una condición: nada de fuegos en el bosque. La última columna imperial quemó dos aldeas para no dejar testigos."
            speaker="narrator"
            caption="Sela"
        [/message]
        [message]
            message="Aceptada. Si alguien enciende una antorcha, será para devolverla apagada."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="¿Y si respondo que no a vuestro pacto? No he jurado nada a nadie."
            speaker="narrator"
            caption="Sela"
        [/message]
        [message]
            message="Entonces os dejamos las cartas y seguimos camino. Un pacto que no se puede rechazar es una leva con otro nombre."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Siete cartas, siete puertas. La primera persona que las lea decidirá si somos correos o culpables."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="El Recaudador ha apostado ballesteros en los tres vados. El paso del arroyo sigue libre porque nadie lo cree transitable."
            speaker="narrator"
        [/message]
        [message]
            message="Los imperiales cobran por cada carta requisada. Mi hermano trabaja en su registro y volvió a casa con las manos manchadas de tinta."
            speaker="narrator"
            caption="Sela"
        [/message]
        [message]
            message="Cuando salgamos del bosque, escribirás tú la respuesta. La firmamos los dos o no la firma nadie."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Puedo curar heridas, no silencios. Si disparan primero, no prometas clemencia a los ballesteros."
            speaker="CBM_darian_companion"
        [/message]
    [/event]
    [event]
        name="turn 3"
        [message]
            message="Cerrad el paso. Prefiero un correo muerto a una provincia que aprenda a escribir."
            speaker="CBM_darian_01_enemy"
        [/message]
        [message]
            message="Los ballesteros avanzan hacia el arroyo. La salida queda al este de la bandera."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Ese molino es lo único que queda en pie. Si lo usáis de fortaleza, sus dueños perderán la cosecha."
            speaker="narrator"
            caption="Sela"
        [/message]
        [message]
            message="Lo usaremos como puesto de agua y nada más. Anotadlo en la carta de Sela."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Las cartas pesan menos que un herido. Dadme dos turnos para vendarlos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Tómalos. Si el Recaudador llega antes, negociaré con él hasta que termines."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El registro de cartas requisadas cayó al arroyo. La corriente se llevó los nombres antes de que nadie pudiera leerlos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que el cerco se cierre del todo. La bandera del arroyo sigue al este."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_hero"
            x="29"
            y="10"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="35"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="35"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Conozco el paso desde niña. Ningún imperial lo ha cruzado nunca."
            speaker="narrator"
            caption="Sela"
        [/message]
        [message]
            message="Entonces serás la primera persona que reciba su carta en mano."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No prometo firmar. Prometo leerla delante de mi aldea."
            speaker="narrator"
            caption="Sela"
        [/message]
        [message]
            message="No pedimos más. La respuesta también puede ser no."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="En el margen del mapa, Darian escribió una sola línea: primera entrega, sin firma."
            speaker="narrator"
        [/message]
        [message]
            message="Ena salvó las cartas de una acequia. La primera estaba dirigida a una ciudad que el mar ya se había llevado, y su destinatario había muerto antes de abrirla. Darian no la reescribió: anotó al dorso que el pacto debía alcanzar también a quienes ya no podían contestar. Sela guardó el pliego en un zurrón de cuero y prometió leerlo en voz alta ante su aldea."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

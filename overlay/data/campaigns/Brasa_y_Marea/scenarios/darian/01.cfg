[scenario]
    id="CBM_darian_01"
    name="Siete cartas, ningún rey"
    next_scenario="CBM_darian_02"
    map_file="darian_01.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Darian salió de Linde con siete cartas y un caballo que perdió en el primer control imperial. Era correo de oficio y llevaba nueve años repartiendo cartas ajenas por la ruta de Linde. Lo que Darian quería cabía en una línea de nombramiento: plaza de titular, con sueldo fijo y un catre que no fuera de la posada. Necesitaba cruzar Alda con las siete cartas y sin un nombre nuevo en el registro, porque un correo declarado espía no vuelve a llevar cartas, ni ajenas ni propias. Las cartas proponían reunir a quienes Maura todavía no había sometido. Ninguna llevaba un sello real. El control estaba en el bosque de Alda, donde los alguaciles del Recaudador de Ceniza registraban hasta las sillas de montar. Bastaba una carta sin sello para declarar espía a quien la llevara. Ena contó los puestos de guardia y Darian eligió un paso que nadie vigilaba. Ninguno de los dos sabía todavía que aquellas siete cartas iban a ser contestadas por siete pueblos distintos. Junto al control, el libro de requisas quedó abierto sobre un banco: la primera línea estaba en blanco y la tinta todavía fresca, esperando un nombre. Cruzar el bosque de Alda ya no era solo entregar siete cartas: era salir de allí antes de que aquella línea en blanco se llenara."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Recaudador de Ceniza."
            background="cbm/story/darian_01_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/darian_01_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        gold="158"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Recaudador de Ceniza"
        type="Dark Sorcerer"
        id="CBM_darian_01_enemy"
        name="Recaudador de Ceniza"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="106"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_01_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="3"
            y="3"
            image="items/gohere.png"
        [/item]
        [label]
            x="3"
            y="3"
            text="Destino"
        [/label]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="32,13"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [unit]
            type="White Mage"
            id="CBM_darian_companion"
            name="Ena"
            side="1"
            x="4"
            y="14"
            unrenamable="yes"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="13"
        [/scroll_to]
        [message]
            message="Sin un rey detrás, dirán que no representamos a nadie."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Representamos a quienes todavía pueden responder que no."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: cruzad el bosque de Alda y llevad a Darian y a Ena hasta la bandera del arroyo, al este."
            speaker="narrator"
        [/message]
        [message]
            message="Toda carta sin sello imperial es contrabando. Entregadla y os dejaré seguir con el caballo que os queda."
            speaker="CBM_darian_01_enemy"
        [/message]
        [message]
            message="No llevamos caballos ni sellos. Solo preguntas que nadie ha querido leer."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Puedo guiaros por el paso del arroyo, con una condición: nada de fuegos en el bosque. La última columna imperial quemó dos aldeas para no dejar testigos."
            speaker="narrator"
            caption="Sela"
            image="cbm/portraits/sela.png"
        [/message]
        [message]
            message="Aceptada. Si alguien enciende una antorcha, será para devolverla apagada."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="¿Y si respondo que no a vuestro pacto? No he jurado nada a nadie."
            speaker="narrator"
            caption="Sela"
            image="cbm/portraits/sela.png"
        [/message]
        [message]
            message="Entonces os dejamos las cartas y seguimos camino. Un pacto que no se puede rechazar es una leva con otro nombre."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Siete cartas, siete puertas. La primera persona que las lea decidirá si somos correos o culpables."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="El Recaudador ha apostado ballesteros en los tres vados. El paso del arroyo sigue libre porque nadie lo cree transitable."
            speaker="narrator"
        [/message]
        [message]
            message="Los imperiales cobran por cada carta requisada. Mi hermano trabaja en su registro y volvió a casa con las manos manchadas de tinta."
            speaker="narrator"
            caption="Sela"
            image="cbm/portraits/sela.png"
        [/message]
        [message]
            message="Cuando salgamos del bosque, escribirás tú la respuesta. La firmamos los dos o no la firma nadie."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Puedo curar heridas, no silencios. Si disparan primero, no prometas clemencia a los ballesteros."
            speaker="CBM_darian_companion"
        [/message]
    [/event]
    [event]
        name="turn 3"
        [message]
            message="Cerrad el paso. Prefiero un correo muerto a una provincia que aprenda a escribir."
            speaker="CBM_darian_01_enemy"
        [/message]
        [message]
            message="Los ballesteros avanzan hacia el arroyo. La salida queda al este de la bandera."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Ese molino es lo único que queda en pie. Si lo usáis de fortaleza, sus dueños perderán la cosecha."
            speaker="narrator"
            caption="Sela"
            image="cbm/portraits/sela.png"
        [/message]
        [message]
            message="Lo usaremos como puesto de agua y nada más. Anotadlo en la carta de Sela."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El registro imperial ya tiene una línea para cada aldea de este bosque. Sin ese orden, la oscuridad vuelve a Alda cada generación y se lleva hasta los nombres."
            speaker="CBM_darian_01_enemy"
        [/message]
        [message]
            message="El bosque de Alda cierra la vista a diez pasos y deja los tres vados a la vista del mismo mirador. Por la maleza se va a media velocidad, pero los ballesteros valen allí la mitad."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Las cartas pesan menos que un herido. Dadme dos turnos para vendarlos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Tómalos. Si el Recaudador llega antes, negociaré con él hasta que termines."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El registro de cartas requisadas cayó al arroyo. La corriente se llevó los nombres antes de que nadie pudiera leerlos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Quedan dos turnos antes de que el cerco se cierre del todo. La bandera del arroyo sigue al este."
            speaker="narrator"
        [/message]
        [message]
            message="Al amanecer entrarán mis alguaciles en la primera aldea con el libro abierto. Cada carta que no aparezca se cobrará en vecinos: así funciona el orden que os sobra."
            speaker="CBM_darian_01_enemy"
        [/message]
        [message]
            message="El cerco se cierra por el norte y la salida sigue al este. Decidid si cruzáis ya por el paso de Sela o si sostenéis el molino una hora más mientras Ena venda a los heridos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_hero"
            x="3"
            y="3"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [store_locations]
                terrain="*^V*"
                owner="1"
                variable="cbm_villages"
            [/store_locations]
            [variable]
                name="cbm_villages.length"
                numerical_less_than="3"
            [/variable]
            [then]
                [message]
                    message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_01_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="31"
                    y="11"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Conozco el paso desde niña. Ningún imperial lo ha cruzado nunca."
            speaker="narrator"
            caption="Sela"
            image="cbm/portraits/sela.png"
        [/message]
        [message]
            message="Entonces serás la primera persona que reciba su carta en mano."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No prometo firmar. Prometo leerla delante de mi aldea."
            speaker="narrator"
            caption="Sela"
            image="cbm/portraits/sela.png"
        [/message]
        [message]
            message="No pedimos más. La respuesta también puede ser no."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="En el margen del mapa, Darian escribió una sola línea: primera entrega, sin firma."
            speaker="narrator"
        [/message]
        [message]
            message="Ena salvó las cartas de una acequia. La primera estaba dirigida a una ciudad que el mar ya se había llevado, y su destinatario había muerto antes de abrirla. Darian no la reescribió: anotó al dorso que el pacto debía alcanzar también a quienes ya no podían contestar. Sela guardó el pliego en un zurrón de cuero y prometió leerlo en voz alta ante su aldea. La segunda carta olía a salitre aunque nunca había visto el mar, y su dirección era un puerto nuevo levantado sobre pilotes, sin murallas. La siguiente entrega se jugaría allí contra un Teniente que medía a las familias con cadenas vacías."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

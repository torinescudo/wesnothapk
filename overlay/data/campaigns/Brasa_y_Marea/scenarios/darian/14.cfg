[scenario]
    id="CBM_darian_14"
    name="La ciudad que abrió sus puertas"
    next_scenario="CBM_darian_15"
    map_file="darian_14.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los barrios se alzaron, pero el gobernador tomó rehenes en la aduana. Liberar a su portavoz permitiría abrir las puertas interiores sin arrasar la ciudad que la alianza decía venir a salvar. La ceniza cubría las calles y las lámparas apagadas señalaban casa abierta y sin armas. Los arietes imperiales ya estaban en la puerta norte, y un correo tardaba menos en llegar que una orden. Irena llevaba dos días hablando con los rehenes para que no perdieran la calma."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Gobernador de las Cenizas."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 32."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="250"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Gobernador de las Cenizas"
        type="Dark Sorcerer"
        id="CBM_darian_14_enemy"
        name="Gobernador de las Cenizas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="184"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="24"
            y="23"
            image="items/gohere.png"
        [/item]
        [label]
            x="24"
            y="23"
            text="Destino"
        [/label]
        [item]
            x="5"
            y="24"
            image="items/cage.png"
        [/item]
        [label]
            x="5"
            y="24"
            text="Prision"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="30"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="30"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="29"
        [/scroll_to]
        [message]
            message="Los arietes llegarán antes que nosotros si tomamos el camino largo."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Envía un correo para detenerlos. No hemos cruzado medio mundo para entrar sobre sus casas."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los barrios aguantan desde dentro, pero la aduana tiene rehenes y el gobernador tiene los arietes."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Objetivo: llegad a la aduana, sacad a Irena y llevadla a la bandera. Los arietes se quedan fuera."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: alcanzad la prisión, liberad a la portavoz y escoltadla hasta la salida."
            speaker="narrator"
        [/message]
        [message]
            message="Si la ciudad se alza, la reduzco a ceniza. Ya lo hice en dos provincias y nadie me lo reprochó."
            speaker="CBM_darian_14_enemy"
        [/message]
        [message]
            message="Salgo con una condición: ninguna unidad de la alianza entra en un barrio con la antorcha encendida."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Aceptada. Que el correo detenga los arietes y que nadie encienda nada."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y los barrios que no quieran abrir, no abrirán. Nos quedaremos fuera con ellos dentro."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Exacto. Entrarán por la puerta que ellos elijan."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La aduana tiene el patio lleno de rehenes. Si atacáis la puerta principal, morirán los primeros."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Hay una escalera de servicio junto a las lámparas apagadas. Nadie la vigila porque no lleva a ningún sitio, salvo al archivo."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Por ahí. Ena, prepara dos vendajes para los rehenes que encontremos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Cuando abramos las puertas interiores, que nadie corra. La ciudad se asusta con las prisas."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Las calles están cubiertas de ceniza. Los arietes imperiales ya están en la puerta norte."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He dado la orden: si la portavoz sale, la aduana arde con todo lo que quede dentro."
            speaker="CBM_darian_14_enemy"
        [/message]
        [message]
            message="Los arietes avanzan un tramo por turno. La escalera de servicio sigue sin guardia."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_darian_14_protected"
            hitpoints_percentage_less="50"
        [/filter]
        [message]
            message="Puedo andar. No carguéis conmigo delante de los rehenes: lo tomarían por una rendición."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Andas tú, pero yo voy a tu lado. Nadie va a malinterpretar eso."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="El primer barrio izó una lámpara apagada. Es la señal de los vecinos: casa abierta, sin armas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El gobernador huyó por el muelle. Las puertas interiores se abrieron desde dentro, una por una."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que los arietes lleguen a la aduana."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="5"
            y="24"
        [/filter]
        [remove_item]
            x="5"
            y="24"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_darian_14_protected"
            name="Irena, portavoz de los barrios"
            side="1"
            x="5"
            y="25"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta esta abierta. Acompanadme hasta la bandera; no podre llegar sin ayuda."
            speaker="CBM_darian_14_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_14_protected"
            x="24"
            y="23"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_14_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="41"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_14_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="41"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_14_protected"
        [/filter]
        [message]
            message="La persona que debias proteger ha muerto. La mision ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Abro las puertas interiores. Que entren sin correr y sin antorchas."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Los arietes se detienen fuera de las murallas. El correo llegó a tiempo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los barrios no juramentarán hoy. Solo han accedido a dejar pasar el agua y el grano."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Con eso ya es una ciudad más abierta que antes."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="En la ceniza quedó una huella de sandalias, desde las puertas interiores hasta el mercado."
            speaker="narrator"
        [/message]
        [message]
            message="La portavoz abrió las puertas desde dentro. Los vecinos guiaron a la alianza por calles donde todavía ardían las lámparas. Nadie apagó ninguna: eran las señales de los barrios, y esa noche indicaban camino libre."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_darian_14_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

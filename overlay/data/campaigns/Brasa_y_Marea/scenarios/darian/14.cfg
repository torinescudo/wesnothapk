[scenario]
    id="CBM_darian_14"
    name="La ciudad que abrió sus puertas"
    next_scenario="CBM_darian_15"
    map_file="darian_14.map"
    turns="30"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Los barrios se alzaron, pero el gobernador tomó rehenes en la aduana. Liberar a su portavoz permitiría abrir las puertas interiores sin arrasar la ciudad que la alianza decía venir a salvar. La ceniza cubría las calles y las lámparas apagadas señalaban casa abierta y sin armas. Los arietes imperiales ya estaban en la puerta norte, y un correo tardaba menos en llegar que una orden. Irena llevaba dos días hablando con los rehenes para que no perdieran la calma. Para un correo, una ciudad con rehenes es un envío con la dirección tachada: hay que escribirla otra vez entera. De las lámparas apagadas de la calle mayor, una estaba todavía tibia: alguien había salido de casa esa misma noche y volvería a por ella. Llegar a la aduana antes que los arietes decidiría si las puertas interiores se abrían con una voz o con un fuego."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de puerto. Al frente: Gobernador de las Cenizas."
            background="cbm/story/darian_14_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 30."
            background="cbm/story/darian_14_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="250"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Gobernador de las Cenizas"
        type="Dark Sorcerer"
        id="CBM_darian_14_enemy"
        name="Gobernador de las Cenizas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="184"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.6"
            attack_depth="2"
            leader_value="4"
            village_value="4"
            recruitment_pattern="scout,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_14_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="9"
            y="27"
            image="items/gohere.png"
        [/item]
        [label]
            x="9"
            y="27"
            text="Destino"
        [/label]
        [item]
            x="3"
            y="22"
            image="items/cage.png"
        [/item]
        [label]
            x="3"
            y="22"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name=turn 15
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="37,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="28"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="28"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="27"
        [/scroll_to]
        [message]
            message="Los arietes llegarán antes que nosotros si tomamos el camino largo."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Envía un correo para detenerlos. No hemos cruzado medio mundo para entrar sobre sus casas."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los barrios aguantan desde dentro, pero la aduana tiene rehenes y el gobernador tiene los arietes."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Objetivo: llegad a la aduana, sacad a Irena y llevadla a la bandera. Los arietes se quedan fuera."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: alcanzad la prisión, liberad a la portavoz y escoltadla hasta la salida."
            speaker="narrator"
        [/message]
        [message]
            message="Si la ciudad se alza, la reduzco a ceniza. Ya lo hice en dos provincias y nadie me lo reprochó."
            speaker="CBM_darian_14_enemy"
        [/message]
        [message]
            message="Salgo con una condición: ninguna unidad de la alianza entra en un barrio con la antorcha encendida."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Aceptada. Que el correo detenga los arietes y que nadie encienda nada."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y los barrios que no quieran abrir, no abrirán. Nos quedaremos fuera con ellos dentro."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Exacto. Entrarán por la puerta que ellos elijan."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La aduana tiene el patio lleno de rehenes. Si atacáis la puerta principal, morirán los primeros."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Hay una escalera de servicio junto a las lámparas apagadas. Nadie la vigila porque no lleva a ningún sitio, salvo al archivo."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Por ahí. Ena, prepara dos vendajes para los rehenes que encontremos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Cuando abramos las puertas interiores, que nadie corra. La ciudad se asusta con las prisas."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Las calles están cubiertas de ceniza. Los arietes imperiales ya están en la puerta norte."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He dado la orden: si la portavoz sale, la aduana arde con todo lo que quede dentro."
            speaker="CBM_darian_14_enemy"
        [/message]
        [message]
            message="Los arietes avanzan un tramo por turno. La escalera de servicio sigue sin guardia."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_darian_14_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Puedo andar. No carguéis conmigo delante de los rehenes: lo tomarían por una rendición."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Andas tú, pero yo voy a tu lado. Nadie va a malinterpretar eso."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="El primer barrio izó una lámpara apagada. Es la señal de los vecinos: casa abierta, sin armas."
            speaker="narrator"
        [/message]
        [message]
            message="Dos provincias arden en paz porque nadie discutió mis órdenes. Una ciudad que se gobierna a sí misma es un fuego sin dueño, y la oscuridad se acerca a lo que arde."
            speaker="CBM_darian_14_enemy"
        [/message]
        [message]
            message="Las calles de la aduana son angostas y la ceniza resbala bajo las sandalias: aquí dentro los arietes no corren, pero tampoco cabe una formación cerrada."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El gobernador huyó por el muelle. Las puertas interiores se abrieron desde dentro, una por una."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 28"
        [message]
            message="Quedan dos turnos antes de que los arietes lleguen a la aduana."
            speaker="narrator"
        [/message]
        [message]
            message="Los arietes llegan a la aduana en dos turnos y he untado la puerta de sebo. Salid con las manos visibles o entrarán buscando carbón."
            speaker="CBM_darian_14_enemy"
        [/message]
        [message]
            message="El patio de la aduana está lleno de rehenes y su ariete solo defiende la puerta principal; la escalera de servicio sube junto a las lámparas apagadas. Decidid por dónde entráis, porque por la puerta grande pagan los rehenes."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="3"
            y="22"
        [/filter]
        [remove_item]
            x="3"
            y="22"
        [/remove_item]
        [unit]
            type="Peasant"
            id="CBM_darian_14_protected"
            name="Irena, portavoz de los barrios"
            side="1"
            x="3"
            y="23"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_darian_14_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_14_protected"
            x="9"
            y="27"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [if]
            [have_unit]
                id="CBM_darian_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_14_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="36"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_14_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="36"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 15"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_14_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Abro las puertas interiores. Que entren sin correr y sin antorchas."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Los arietes se detienen fuera de las murallas. El correo llegó a tiempo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los barrios no juramentarán hoy. Solo han accedido a dejar pasar el agua y el grano."
            speaker="CBM_darian_14_protected"
        [/message]
        [message]
            message="Con eso ya es una ciudad más abierta que antes."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="En la ceniza quedó una huella de sandalias, desde las puertas interiores hasta el mercado."
            speaker="narrator"
        [/message]
        [message]
            message="La portavoz abrió las puertas desde dentro. Los vecinos guiaron a la alianza por calles donde colgaban las lámparas apagadas. Nadie encendió ninguna: eran las señales de los barrios, y esa noche indicaban camino libre. La huella de sandalias amaneció doblada por otra huella más pequeña: la de un niño que había ido a por agua sin pedir permiso a nadie. En el palacio en ruinas, la reina que no dormía tenía ya escritos siete tratados y una silla vacía para cada pueblo de la alianza."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_darian_14_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

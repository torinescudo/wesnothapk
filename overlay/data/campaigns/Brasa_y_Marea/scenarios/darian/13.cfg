[scenario]
    id="CBM_darian_13"
    name="El nombre del sello"
    next_scenario="CBM_darian_14"
    map_file="darian_13.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El nombre del sello estaba repartido entre tres archivos para que ningún servidor pudiera destruirlo. Sevrin recordaba sus ubicaciones. Darian debía reunir las inscripciones antes de entrar en palacio. Una estaba en un muro vivo, otra bajo un sello de cera y la tercera en una sala que ya no figuraba en los planos. Nadie había leído el nombre entero desde que Maura lo partió, y los escribientes del Notario Inmortal copiaban los mismos fragmentos desde hacía doscientos años. Sevrin trazó las tres ubicaciones de memoria y tachó la tercera antes de escribirla: la sala había dejado de existir en los planos, no en las piernas de quien la había recorrido. Reunir las tres inscripciones antes de que los escribientes las copiaran para siempre decidiría si el nombre del sello se leía una vez o se repetía otros doscientos años. Y el Notario Inmortal no corre nunca: el papel espera más que la piedra."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Notario Inmortal."
            background="cbm/story/darian_13_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/darian_13_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="250"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Notario Inmortal"
        type="Dark Sorcerer"
        id="CBM_darian_13_enemy"
        name="Notario Inmortal"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="178"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_13_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="41"
            y="28"
            image="items/brazier.png"
        [/item]
        [label]
            x="41"
            y="28"
            text="Punto 1"
        [/label]
        [item]
            x="37"
            y="32"
            image="items/brazier.png"
        [/item]
        [label]
            x="37"
            y="32"
            text="Punto 2"
        [/label]
        [item]
            x="9"
            y="28"
            image="items/brazier.png"
        [/item]
        [label]
            x="9"
            y="28"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="fighter"
                    x,y="47,18"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="18"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="18"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="17"
        [/scroll_to]
        [message]
            message="Al romperlo, algunos de nuestros combatientes caerán. Luchan unidos a esos mismos contratos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Se lo diremos antes. Esta vez nadie decidirá por ellos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El nombre está repartido entre tres archivos: uno vivo, uno sellado y uno que ya no existe. Lo que queda son tres inscripciones."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Objetivo: llevad una unidad a cada inscripción y activad los tres puntos."
            speaker="narrator"
        [/message]
        [message]
            message="Un nombre repartido no puede destruirse. Solo reescribirse, y eso es cosa de notarios, no de correos."
            speaker="CBM_darian_13_enemy"
        [/message]
        [message]
            message="Entonces no vamos a reescribirlo. Vamos a leerlo entero por primera vez."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Os doy las ubicaciones con una condición: diréis a los nuestros qué se rompe cuando se rompa el sello. Ellos deciden si siguen."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Se lo diremos antes de tocar la primera piedra."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Soy uno de esos combatientes. Si lo rompéis, yo también puedo caer. Lo digo ahora, no después."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Anotadlo. Si Sevrin quiere retirarse, se retira con el nombre a medio leer."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Las tres inscripciones están en muros distintos. La del oeste tiene guardia; la del norte, hielo."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="El Notario Inmortal no duerme. Sus escribientes copian el mismo párrafo desde hace doscientos años."
            speaker="narrator"
        [/message]
        [message]
            message="Cuando el nombre esté completo, decidlo en voz alta. Quiero oírlo yo también."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Y que lo oigan los que aún sostienen los contratos. Ellos decidirán qué hacen con la noticia."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Los escribientes han empezado a borrar la tercera inscripción. Si la tocan, no se recupera."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Corred hacia el muro del norte. Yo cubro la escalera."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El notario firmó su última hoja y el nombre completo quedó legible sobre tres muros distintos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="Quedan dos turnos antes de que llegue la guardia del archivo."
            speaker="narrator"
        [/message]
        [message]
            message="Llamo a la guardia del archivo con mi último folio. Lo que no se haya sellado hoy se archivará con vosotros dentro."
            speaker="CBM_darian_13_enemy"
        [/message]
        [message]
            message="El Notario no ataca: copia y borra, y cada hoja que pega sobre una inscripción la vuelve ilegible para siempre. Decidid qué muro rompéis primero, porque a los tres no llegaremos antes de la guardia."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="41"
            y="28"
        [/filter]
        [remove_item]
            x="41"
            y="28"
        [/remove_item]
        [item]
            x="41"
            y="28"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="41"
            y="28"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La primera parte dice 'Vey'. Quedan dos, y ya sé lo que significa."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Dos inscripciones siguen cerradas. Los escribientes no han dejado de copiar."
            speaker="narrator"
        [/message]
        [message]
            message="Copiamos el mismo párrafo desde hace doscientos años porque un nombre escrito no se pierde ni se subleva. Ahora lo leéis en voz alta: la oscuridad también sabe leer."
            speaker="CBM_darian_13_enemy"
        [/message]
        [message]
            message="Los tres muros no se ven entre sí: el del oeste tiene escalera estrecha y guardia, el del norte hielo que ralentiza el paso, y el del sur se llega por una sala que no figura en los planos."
            speaker="narrator"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="37"
            y="32"
        [/filter]
        [remove_item]
            x="37"
            y="32"
        [/remove_item]
        [item]
            x="37"
            y="32"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="37"
            y="32"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Habéis leído dos tercios. Con eso ya no podéis fingir que no sabíais nada."
            speaker="CBM_darian_13_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="9"
            y="28"
        [/filter]
        [remove_item]
            x="9"
            y="28"
        [/remove_item]
        [item]
            x="9"
            y="28"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="9"
            y="28"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [store_locations]
                        terrain="*^V*"
                        owner="1"
                        variable="cbm_villages"
                    [/store_locations]
                    [variable]
                        name="cbm_villages.length"
                        numerical_less_than="3"
                    [/variable]
                    [then]
                        [message]
                            message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_13_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="46"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_13_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="46"
                    y="16"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Maura Vey. Ese era el nombre del sello: el de la reina. No un objeto, una persona."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Un nombre se puede leer sin destruir a nadie."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="O se puede preguntar antes. Los muertos de la alianza merecen saber qué se juega."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Yo elegí sostener la última marcha. No todos elegirán lo mismo, y ninguno será un traidor."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Los muertos de la alianza escucharon el nombre completo y pidieron tiempo para decidir."
            speaker="narrator"
        [/message]
        [message]
            message="Los muertos de la alianza eligieron sostener la última marcha. Cada uno pidió algo distinto para después. Sevrin anotó cada petición en una hoja aparte, y Darian prohibió que ninguna se resumiera en una sola frase. La última petición pedía un plazo, y Darian la copió con la fecha en blanco. La carta de la capital ya estaba en camino: los barrios se habían alzado y el gobernador guardaba rehenes en la aduana, con los arietes ya en la puerta norte."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_12"
    name="La noche de las dos órdenes"
    next_scenario="CBM_darian_13"
    map_file="darian_12.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La inquisidora difundió órdenes falsas para dividir a la alianza. Darian reunió a los delegados alrededor de las brasas mientras las patrullas enemigas intentaban capturarlos por separado."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="246"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Inquisidora Vael"
        type="Dark Sorcerer"
        id="CBM_darian_12_enemy"
        name="Inquisidora Vael"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="172"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="3"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="3"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_darian_companion"
            message="Si cada contingente obedece su propia carta, no resistiremos."
        [/message]
        [message]
            speaker="CBM_darian_hero"
            message="Que vengan y pregunten. Una orden que no admite preguntas ya nos ha hecho bastante daño."
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            speaker="CBM_darian_hero"
            message="¡Se ha cumplido el plazo! Podemos completar la retirada."
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="18"
                    y="10"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="18"
                    y="10"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Las falsificaciones fallaron porque los delegados se conocían. La séptima brasa fue una regla: ninguna voz hablaría por todas sin poder ser contradicha."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_12"
    name="La noche de las dos órdenes"
    next_scenario="CBM_darian_13"
    map_file="darian_12.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La inquisidora difundió órdenes falsas para dividir a la alianza. Darian reunió a los delegados alrededor de las brasas mientras las patrullas enemigas intentaban capturarlos por separado. Cada contingente había recibido una carta distinta, y todas parecían escritas por un mando legítimo. Vael no buscaba matarlos: buscaba que se acusaran entre ellos antes del amanecer. La séptima brasa iba a decidirse alrededor de un fuego, no en un campo de batalla."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de bosque. Al frente: Inquisidora Vael."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="246"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Inquisidora Vael"
        type="Dark Sorcerer"
        id="CBM_darian_12_enemy"
        name="Inquisidora Vael"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="172"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Si cada contingente obedece su propia carta, no resistiremos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que vengan y pregunten. Una orden que no admite preguntas ya nos ha hecho bastante daño."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="He enviado dos órdenes a cada contingente. Una es verdadera. Que discutan cuál."
            speaker="CBM_darian_12_enemy"
        [/message]
        [message]
            message="Que traigan ambas y las lean delante de todos. Objetivo: aguantar hasta el turno doce sin que la alianza se parta."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: mantened a Darian con vida hasta el comienzo del turno 12."
            speaker="narrator"
        [/message]
        [message]
            message="He recibido una orden con mi propio sello. Nunca escribí esa orden."
            speaker="narrator"
            caption="Vesh"
        [/message]
        [message]
            message="Guárdala. Mañana la leeremos en la asamblea y que responda quien la escribió."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Exijo que cualquier delegado pueda levantarse y decir no. Sin eso, firmo la retirada mañana mismo."
            speaker="narrator"
            caption="Neth"
        [/message]
        [message]
            message="Esa es exactamente la séptima brasa: ninguna voz hablará por todas sin poder ser contradicha."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Las patrullas de los campos saldrán con una condición: no se separarán de los velarios, ni de día ni de noche."
            speaker="narrator"
            caption="Rella"
        [/message]
        [message]
            message="Aceptada. Nadie vigila a nadie: caminan juntos o no caminan."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Las órdenes falsas funcionan porque todos tenéis razón en algo. Eso es lo que os pierde."
            speaker="CBM_darian_12_enemy"
        [/message]
        [message]
            message="Las patrullas enemigas vienen por tres caminos. Las brasas están en el claro."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Rodead las brasas y no las apaguéis por nada. Mientras ardan, todos sabrán dónde está el centro."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La noche es cerrada en el bosque. Las antorchas enemigas se cuentan de dos en dos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Segunda orden enviada: los litarios cruzarán el río y los velarios cubrirán la retirada. Ninguno osará preguntar."
            speaker="CBM_darian_12_enemy"
        [/message]
        [message]
            message="Dos contingentes se miran desde orillas opuestas. Ninguno se mueve todavía."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La aldea nos ha dado mantas sin pedir juramento. Devolvedlas lavadas al amanecer."
            speaker="narrator"
            caption="Vesh"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Han cortado el camino del este. Los contingentes tendrán que pasar por el claro o no pasar."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entonces pasarán por el claro. Que vean las brasas encendidas."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Las copias falsas quedaron en el barro. Alguien las pisó hasta que la tinta dejó de leerse."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Quedan dos turnos hasta el amanecer. El claro sigue iluminado."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="35"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_12_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="35"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Hemos discutido toda la noche y ninguno ha desenfundado. Es la primera vez que lo veo."
            speaker="narrator"
            caption="Neth"
        [/message]
        [message]
            message="Las falsificaciones fallaron porque os conocíais. La séptima brasa no es un juramento: es una regla."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Ninguna voz hablará por todas sin poder ser contradicha. Que se escriba así, con esas palabras."
            speaker="narrator"
            caption="Vesh"
        [/message]
        [message]
            message="Mañana volveré a los campos y diré que aquí se puede decir no delante de todos."
            speaker="narrator"
            caption="Rella"
        [/message]
        [message]
            message="La inquisidora huyó hacia el norte. Su orden falsa quedó clavada en un árbol, con las firmas tachadas una por una."
            speaker="narrator"
        [/message]
        [message]
            message="Las falsificaciones fallaron porque los delegados se conocían. La séptima brasa fue una regla: ninguna voz hablaría por todas sin poder ser contradicha. Darian hizo grabar la regla en las siete copias del pacto, y la inquisidora no volvió a enviar dos órdenes al mismo campamento."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

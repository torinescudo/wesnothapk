[scenario]
    id="CBM_darian_10"
    name="La sexta respuesta"
    next_scenario="CBM_darian_11"
    map_file="darian_10.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Una escribana de la capital traía un registro de ciudadanos condenados al servicio después de morir. Debía cruzar las galerías litarias para que cada familia pudiera impugnar su contrato."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="230"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Cazador de Deudas"
        type="Dark Sorcerer"
        id="CBM_darian_10_enemy"
        name="Cazador de Deudas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="160"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="24"
            y="3"
            image="items/gohere.png"
        [/item]
        [label]
            x="24"
            y="3"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="3"
            y="15"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="3"
                    y="15"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_darian_companion"
            message="El registro pesa más que nuestras siete cartas juntas."
        [/message]
        [message]
            speaker="CBM_darian_hero"
            message="Entonces lo llevaremos entre todos."
        [/message]
        [unit]
            type="Peasant"
            id="CBM_darian_10_protected"
            name="Myr, escribana de la capital"
            side="1"
            x="4"
            y="14"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_10_protected"
            x="24"
            y="3"
        [/filter]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_10_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_10_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="22"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_10_protected"
        [/filter]
        [message]
            speaker="narrator"
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="La sexta brasa perteneció a los barrios de la capital. Su respuesta no llevaba nombres: publicarlos habría condenado a quienes seguían dentro."
        [/message]
        [kill]
            id="CBM_darian_10_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

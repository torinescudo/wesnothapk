[scenario]
    id="CBM_darian_10"
    name="La sexta respuesta"
    next_scenario="CBM_darian_11"
    map_file="darian_10.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Una escribana de la capital traía un registro de ciudadanos condenados al servicio después de morir. Debía cruzar las galerías litarias para que cada familia pudiera impugnar su contrato. El registro tenía once mil nombres, y Myr lo había copiado hoja por hoja sin dormir. Los litarios cobraban peaje en piedra y dejaban pasar sin mirar; el Cazador de Deudas cobraba en personas. La sexta brasa pertenecía a los barrios de la capital, y su respuesta iba a llegar sin un solo nombre."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de caverna. Al frente: Cazador de Deudas."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Escolta a la persona protegida hasta la bandera de salida. Turnos disponibles: 32."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="230"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Cazador de Deudas"
        type="Dark Sorcerer"
        id="CBM_darian_10_enemy"
        name="Cazador de Deudas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="160"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Escolta a la persona protegida hasta la bandera de salida."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="19"
            y="15"
            image="items/gohere.png"
        [/item]
        [label]
            x="19"
            y="15"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="26"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="26"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [unit]
            type="Peasant"
            id="CBM_darian_10_protected"
            name="Myr, escribana de la capital"
            side="1"
            x="5"
            y="25"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        [scroll_to]
            x="4"
            y="25"
        [/scroll_to]
        [message]
            message="El registro pesa más que nuestras siete cartas juntas."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entonces lo llevaremos entre todos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El registro tiene once mil nombres. Si se publica aquí dentro, las familias de la capital pagarán por cada hoja."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="Entonces saldrá sin nombres. La sexta brasa será de los barrios, no de un archivo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: escoltad a la escribana y su registro hasta la bandera al final de las galerías."
            speaker="narrator"
        [/message]
        [message]
            message="Las deudas no se perdonan, se cobran. Esa escribana ha robado la contabilidad del imperio."
            speaker="CBM_darian_10_enemy"
        [/message]
        [message]
            message="Os acompaño con una condición: el registro no se abre hasta que estemos fuera, y lo abre una familia, no un ejército."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="Aceptada. Nadie de la alianza leerá una sola página en las galerías."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y si los barrios deciden no responder, su silencio también será una respuesta válida."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Sí. Aquí nadie va a ser obligado a firmar ni a hablar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Las galerías litarias son las únicas que no vigilan. Cobran peaje en piedra, no en personas."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="El Cazador de Deudas conoce los túneles: los usaba para llevar contratos al norte."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Iremos por el ramal inundado. Ena, guarda la lámpara: si el agua sube, la tinta se pierde."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Si me alcanzan, cortad el registro y no a mí. Sabréis por qué cuando lleguemos."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="La bandera está al final de la galería larga. El Cazador ha apostado ballesteros en dos bocas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Cerrad las compuertas del ramal. Prefiero ahogar la contabilidad a perdonar una sola deuda."
            speaker="CBM_darian_10_enemy"
        [/message]
        [message]
            message="El agua sube por el ramal inundado. Quedan dos turnos antes de que cubra el paso."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_darian_10_protected"
            hitpoints_percentage_less="50"
        [/filter]
        [message]
            message="No he perdido el registro. Perdedme a mí, pero no lo abráis aquí."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="Nadie se pierde. Ena, tapa esa herida y seguimos."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La primera cámara litarias les deja beber y nada más. El peaje fue de piedra, como habían dicho."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El Cazador murió con una lista de deudores en la mano. La lista no llevaba nombres, solo cantidades."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que inunden la galería larga."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_10_protected"
            x="19"
            y="15"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_10_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="40"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_10_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="40"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_10_protected"
        [/filter]
        [message]
            message="La persona que debias proteger ha muerto. La mision ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Estamos fuera. Abrid el registro por la última página."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="No. Lo abrirá una familia del barrio, como acordamos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La sexta brasa es vuestra, barrios. Responded sin nombres: publicarlos condenaría a quienes siguen dentro."
            speaker="CBM_darian_10_protected"
        [/message]
        [message]
            message="Once mil contratos, y ninguno se puede romper sin saber a quién pertenece."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="La respuesta llegó escrita en una hoja sin firmas: siete distritos, siete brasas y ninguna lista de culpables."
            speaker="narrator"
        [/message]
        [message]
            message="La sexta brasa perteneció a los barrios de la capital. Su respuesta no llevaba nombres: publicarlos habría condenado a quienes seguían dentro. Myr dejó el registro en manos de una familia y volvió a las galerías con una copia sin firmas, dispuesta a impugnar los contratos uno por uno."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_darian_10_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_15"
    name="La reina que no descansaba"
    next_scenario="CBM_darian_16"
    map_file="darian_15.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Maura ofreció entregar provincias a cada aliado si abandonaban a los demás. Había preparado siete documentos, convencida de que cualquier pacto era una colección de ambiciones comprables. Cada tratado estaba escrito para un pueblo concreto, con fronteras generosas y una cláusula que dejaba a los demás fuera de la mesa. La reina no había dormido desde el comienzo de la guerra y seguía firmando de memoria. Darian entró en el palacio en ruinas con las siete respuestas en la mano. Para un correo, siete tratados eran siete cartas sin remitente: la letra cambia, pero siempre se pide lo mismo. Los siete documentos estaban escritos con la misma tinta y fronteras distintas, y las cifras de trigo del de Valdara eran las mismas del de los campos. Entrar en la sala con las siete respuestas decidiría si la alianza salía de allí con una regla o con siete sobornos contados en voz alta."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Maura Vey."
            background="cbm/story/darian_15_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 38."
            background="cbm/story/darian_15_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="250"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Maura Vey"
        type="CBM Hero maura"
        id="CBM_darian_15_enemy"
        name="Maura Vey"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="190"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.8"
            caution="0.25"
            attack_depth="4"
            leader_value="6"
            village_value="3"
            recruitment_pattern="fighter,archer,fighter,scout"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_15_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 34."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name=turn 2
        [message]
            speaker=narrator
            message="¿Juzgar a Maura o desterrarla?"
    [option]
        message="juzgar maura"
        [command]
            {VARIABLE cbm_decide_darian_15_1 "juzgar-maura"}
            [gold]
                side=1
                amount="-20"
            [/gold]
        [/command]
    [/option]
    [option]
        message="desterrar maura"
        [command]
            {VARIABLE cbm_decide_darian_15_1 "desterrar-maura"}
            [gold]
                side=1
                amount="60"
            [/gold]
        [/command]
    [/option]
        [/message]
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="25,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="25"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="25"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="25"
            y="31"
        [/scroll_to]
        [message]
            message="Sus ofertas son reales. Algunos podrían salvar a su pueblo marchándose ahora."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Y condenar al siguiente. Hemos leído juntos la letra pequeña de demasiados contratos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="He preparado siete tratados, uno por pueblo. Cada uno recibe provincias si abandona a los demás. Firmad y marchaos."
            speaker="CBM_darian_15_enemy"
        [/message]
        [message]
            message="Siete tratados y ninguna pregunta: eso no es una oferta, es un despiece."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: derrotad al líder enemigo. Maura Vey manda desde el palacio en ruinas."
            speaker="narrator"
        [/message]
        [message]
            message="Valdara aceptará un tratado si el mar sigue siendo de todos. Que lo lea mi puerto, no tu notario."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Mi condición es más simple: ningún tratado menciona cautivos. Si aparece la palabra, lo rompo."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Yo firmé con la reina y sigo pagando esa firma. Aviso a quien vaya a leer: se puede decir no."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Esta vez se puede decir no dos veces: primero al tratado, y después a la guerra."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Ninguna alianza sobrevive a una mesa con siete sillas. Siempre hay una que se levanta."
            speaker="CBM_darian_15_enemy"
        [/message]
        [message]
            message="Entonces pondremos una silla de más, para quien quiera escuchar sin firmar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No creas que quiere negociar. Quiere que os peleéis por los documentos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que los lea la asamblea entera. Cada pueblo su tratado, en voz alta."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Y ninguna firma vale si alguien la leyó con una espada detrás. Que se retiren las armas de la sala."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El palacio conserva el archivo intacto. La reina no ha dormido desde que empezó la guerra."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="He quemado un tratado. El pueblo que lo recibió ya ha visto lo que cuesta esperar."
            speaker="CBM_darian_15_enemy"
        [/message]
        [message]
            message="Quedan seis documentos sobre la mesa, y ninguna firma al pie."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Ese patio tiene pozo. Dejadlo abierto a los vecinos y no lo uséis como puesto."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Todo pacto es un puñado de ambiciones atadas con un precio. El vuestro se romperá cuando uno de los siete encuentre una moneda más alta que su palabra."
            speaker="CBM_darian_15_enemy"
        [/message]
        [message]
            message="La sala del archivo conserva techo y las crujías están al aire: entre columnas la guardia real vale el doble, y en los patios abiertos la alianza es más que ellos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="La reina ofrece lo mismo que me ofreció a mí. Firmé por miedo y tardé veinte años en leer la letra pequeña."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Pues que se lea ahora, entera, delante de todos."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="La reina cayó sin firmar nada, y los siete tratados quedaron sobre la mesa, cada uno con su silla vacía."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="Quedan dos turnos antes de que la guardia real cierre la sala."
            speaker="narrator"
        [/message]
        [message]
            message="Quemaré un tratado por turno hasta que os peleéis por el que quede. A cada pueblo le duele lo suyo, y yo tengo siete dolores escritos."
            speaker="CBM_darian_15_enemy"
        [/message]
        [message]
            message="Maura manda desde el archivo intacto y ya ha quemado un tratado para probar que puede. Decidid si la sacáis de su sala o si sostenéis la mesa: si los documentos se pierden, se pierde lo que cada pueblo iba a poder rechazar."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="turn_number"
                numerical_greater_than="34"
            [/variable]
            [then]
                [message]
                    message="Cumple el objetivo antes del turno 34. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_15_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="24"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_15_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="24"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="He leído el tratado de Valdara. Lo rechazo y el puerto sigue en la alianza."
            speaker="narrator"
            caption="Alba"
            image="cbm/portraits/alba.png"
        [/message]
        [message]
            message="Anotadlo: rechazo sin consecuencias. Esa es la cláusula que la reina nunca entendió."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los otros seis siguen sobre la mesa. Que cada pueblo decida el suyo en su casa."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Yo no firmo nada más. Pero tampoco voy a impedir que otros lean."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Maura fue llevada ante representantes de sus víctimas. Darian prohibió que su nombre se añadiera a ningún contrato funerario."
            speaker="narrator"
        [/message]
        [message]
            message="Maura perdió el trono y fue llevada ante representantes de sus víctimas. Darian prohibió que su nombre se añadiera a ningún contrato funerario. Los siete tratados se archivaron sin firmas, y cada pueblo guardó el suyo como recordatorio de lo que había podido rechazar. En la mesa del consejo quedó una silla de más, y nadie se atrevió a quitarla. Quedaba el sello central, tallado en una montaña sin techo, y un guardián que seguía jurando por una reina que ya no mandaba."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_07"
    name="Quienes no firmaron"
    next_scenario="CBM_darian_08"
    map_file="darian_07.map"
    turns="12"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Las canteras albergaban a desertores de ambos bandos. No querían unirse a ningún ejército. El prefecto los declaró propiedad abandonada del Estado y marchó a recogerlos. En las galerías vivían mineros que habían dejado una lanza y no pensaban tomar otra, con herramientas propias y un censo que nadie había firmado. Arven traía cadenas contadas según su propio registro y piqueros para cobrarlas. Darian necesitaba aguantar la cantera sin convertirla en cuartel."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de cantera. Al frente: Prefecto Arven."
            background="cbm/story/darian_07_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Mantén con vida a tu protagonista hasta el comienzo del turno 12. Turnos disponibles: 12."
            background="cbm/story/darian_07_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="206"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Prefecto Arven"
        type="Dark Sorcerer"
        id="CBM_darian_07_enemy"
        name="Prefecto Arven"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="142"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Mantén con vida a tu protagonista hasta el comienzo del turno 12."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="24"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="24"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="24"
            y="31"
        [/scroll_to]
        [message]
            message="Si los defendemos, quizá se marchen sin darnos nada."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Ese es el derecho que decimos defender."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No hemos venido a alistarnos. Hemos venido a que nos dejéis cavar en paz."
            speaker="narrator"
            caption="Halen"
            image="cbm/portraits/halen.png"
        [/message]
        [message]
            message="Nadie os va a alistar. Ese es justamente el punto."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: mantened a Darian con vida hasta el comienzo del turno 12."
            speaker="narrator"
        [/message]
        [message]
            message="Los desertores son propiedad abandonada del Estado. Contarlos y devolverlos es mi trabajo."
            speaker="CBM_darian_07_enemy"
        [/message]
        [message]
            message="Aceptamos vuestro refugio con dos condiciones: ninguna leva en la cantera y ninguna lista escrita con nuestros nombres."
            speaker="narrator"
            caption="Halen"
            image="cbm/portraits/halen.png"
        [/message]
        [message]
            message="Concedidas. Las herramientas se apuntan a nombre de la cantera, no de las personas."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Si después de defendidos deciden marcharse, se marcharán sin que nadie los llame traidores."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Y sin escolta que los vigile. Eso también lo escribimos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El prefecto trae cadenas de dos clases: unas para las manos y otras para los papeles."
            speaker="narrator"
            caption="Halen"
            image="cbm/portraits/halen.png"
        [/message]
        [message]
            message="La cantera tiene tres bocas. La del norte es la única que no vigilan."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Defended el norte y el centro. Nosotros aguantaremos la plaza hasta que se cansen de subir."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El Prefecto ha apostado piqueros en la rampa. Sus cadenas esperan en carros, contadas y numeradas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He traído tantas cadenas como cabezas conté en el censo. Ni una más, ni una menos."
            speaker="CBM_darian_07_enemy"
        [/message]
        [message]
            message="Los carros de cadenas suben por la rampa. El censo viaja en el primero."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Esa casa de aperos tiene agua limpia. Dejadla para los heridos y no como puesto de mando."
            speaker="narrator"
            caption="Halen"
            image="cbm/portraits/halen.png"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Han empezado a contar en voz alta. Los nuestros ya no distinguen cuántos son."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que cuenten. Nosotros solo tenemos que seguir contando los turnos."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El censo quedó abierto bajo la rampa. Nadie puso su nombre en la lista."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 10"
        [message]
            message="Quedan dos turnos de asedio. La plaza de la cantera sigue en pie."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 12"
        [message]
            message="Se ha cumplido el plazo. Podemos completar la retirada."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="23"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_07_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="23"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 6"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="No hemos jurado nada. Ofrecemos herramientas, guías y un lugar donde dormir."
            speaker="narrator"
            caption="Halen"
            image="cbm/portraits/halen.png"
        [/message]
        [message]
            message="Lo tomo. Vuestra quinta brasa no llevará juramento."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Guías sí tenemos: conocemos cada galería del imperio, porque las cavamos nosotros."
            speaker="narrator"
            caption="Halen"
            image="cbm/portraits/halen.png"
        [/message]
        [message]
            message="Y si mañana queréis marcharos, la puerta estará abierta."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Darian anotó la brasa con una raya y ninguna firma. En el margen escribió: sin juramento, sin leva."
            speaker="narrator"
        [/message]
        [message]
            message="Los desertores no juraron lealtad. Ofrecieron herramientas, guías y un lugar donde descansar. Darian anotó la quinta brasa sin añadir un juramento. Halen mandó tallar en la pared de la cantera una sola frase: aquí nadie fue contado dos veces."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_04"
    name="Los hijos de la sombra"
    next_scenario="CBM_darian_05"
    map_file="darian_04.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="En una ciudad velaria recién asentada, el imperio capturaba a quienes no podían volar. Darian debía liberar a una intérprete antes de presentar la tercera carta. La ciudad se sostenía sobre las mismas acequias que regaban los campos de abajo, y sus consejos llevaban veinte años discutiendo por el agua. El carcelero encerraba a los que habían perdido las alas en la guerra, y llamaba carga a un pueblo entero. Iria Salcedo y Belis esperaban en el canal, contando lámparas encendidas."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de llanura. Al frente: Carcelero de las Alas."
            background="cbm/story/darian_04_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 32."
            background="cbm/story/darian_04_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor"
        gold="182"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Carcelero de las Alas"
        type="Dark Sorcerer"
        id="CBM_darian_04_enemy"
        name="Carcelero de las Alas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="124"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="17"
            y="6"
            image="items/gohere.png"
        [/item]
        [label]
            x="17"
            y="6"
            text="Destino"
        [/label]
        [item]
            x="6"
            y="10"
            image="items/cage.png"
        [/item]
        [label]
            x="6"
            y="10"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Los campesinos recuerdan los inviernos sin luz. No todos querrán ayudarlos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="No les pediremos que olviden. Les pediremos que nadie vuelva a pagar una deuda con su vida."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La ciudad velaria se asienta sobre las acequias que riegan vuestros campos. Si os vengáis de ella, el agua se va con vosotros."
            speaker="narrator"
            caption="Iria"
            image="cbm/portraits/iria.png"
        [/message]
        [message]
            message="Las raíces del sur ya sienten frío. Eso no es un presagio: es un calendario."
            speaker="narrator"
            caption="Belis"
            image="cbm/portraits/belis.png"
        [/message]
        [message]
            message="Quien no puede volar no es un pueblo, es carga. La intérprete seguirá en la jaula hasta que aprenda a hablar sin mentir."
            speaker="CBM_darian_04_enemy"
        [/message]
        [message]
            message="Objetivo: llegad con cualquier unidad a la prisión, liberad a la intérprete y escoltadla hasta la bandera."
            speaker="narrator"
        [/message]
        [message]
            message="Firmaré la carta cuando aceptéis dos condiciones: que nadie corte las alas de un prisionero y que la intérprete hable ante mi consejo sin cadenas."
            speaker="narrator"
            caption="Iria"
            image="cbm/portraits/iria.png"
        [/message]
        [message]
            message="Aceptadas las dos. Escribidlas vos y yo firmo debajo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y si el consejo la rechaza, ¿declararéis la guerra a los velarios?"
            speaker="narrator"
            caption="Belis"
            image="cbm/portraits/belis.png"
        [/message]
        [message]
            message="No. Rechazar una carta no es un crimen; encadenar a quien la trae, sí."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Hay una puerta de servicio bajo la acequia. Se abre con el peso de dos personas, no con llaves."
            speaker="narrator"
            caption="Iria"
            image="cbm/portraits/iria.png"
        [/message]
        [message]
            message="Entraremos por el agua. Ena, prepara tus vendas: la intérprete llevará grilletes."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No me llaméis por mi nombre delante de ellos. Si lo oyen, mis hermanos pagarán por cada letra."
            speaker="CBM_darian_04_protected"
        [/message]
        [message]
            message="El Carcelero ha apostado guardias en las pasarelas. La jaula está junto al canal, sobre suelo blando."
            speaker="narrator"
        [/message]
        [message]
            message="Un cantor herido se cura con luz, no con prisa. Sacadla entera o no la saquéis."
            speaker="CBM_darian_companion"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_darian_04_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Las alas… no, no son mis alas. Se llevaron las de mi hermano."
            speaker="CBM_darian_04_protected"
        [/message]
        [message]
            message="Nadie volará en esta ciudad hoy. Camina y deja que Ena trabaje."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="Cerrad las compuertas. Si el canal sube, la jaula se llena y nadie tendrá que decidir quién se ahoga primero."
            speaker="CBM_darian_04_enemy"
        [/message]
        [message]
            message="El agua sube un palmo por turno. La jaula está a dos palmos del suelo."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Los vecinos dejan lámparas en las ventanas. Son las mismas que encendían cuando vuestros abuelos llegaban al mercado."
            speaker="narrator"
            caption="Iria"
            image="cbm/portraits/iria.png"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Las llaves del carcelero quedaron dentro del canal, y el agua las llevó hacia las acequias de los campos."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que el canal cubra la jaula. La bandera está al otro lado de la pasarela."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="6"
            y="10"
        [/filter]
        [remove_item]
            x="6"
            y="10"
        [/remove_item]
        [unit]
            type="CBM Velario Cantor"
            id="CBM_darian_04_protected"
            name="Seyth, intérprete"
            side="1"
            x="6"
            y="11"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_darian_04_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_04_protected"
            x="17"
            y="6"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="33"
                    y="24"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_04_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="33"
                    y="24"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_04_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Firmo esta carta como intérprete, no como prisionera. Que se lea en las dos lenguas."
            speaker="CBM_darian_04_protected"
        [/message]
        [message]
            message="Mi consejo añadirá un mapa: campos y ciudades comparten las mismas acequias."
            speaker="narrator"
            caption="Iria"
            image="cbm/portraits/iria.png"
        [/message]
        [message]
            message="Nadie ha prometido perdonar. Solo hemos acordado quién habla y en qué orden."
            speaker="narrator"
            caption="Belis"
            image="cbm/portraits/belis.png"
        [/message]
        [message]
            message="Con eso me basta por hoy. La respuesta completa la escribís vosotros."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La cuarta carta viajó al norte con una lista de nombres alados y otra de nombres campesinos, unidas por la misma acequia."
            speaker="narrator"
        [/message]
        [message]
            message="La intérprete llevó la carta al consejo. Iria añadió un mapa donde los campos y las ciudades aladas compartían las mismas acequias. Belis hizo copiar el mapa en las dos lenguas, y Seyth exigió que su nombre apareciera escrito al pie, sin grilletes y sin traducción que lo suavizara."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_darian_04_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

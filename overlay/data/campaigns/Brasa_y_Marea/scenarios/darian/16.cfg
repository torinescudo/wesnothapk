[scenario]
    id="CBM_darian_16"
    name="La última entrega"
    next_scenario="null"
    map_file="darian_16.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El sello central debía destruirse en la montaña donde se había tallado. Sus últimos guardianes, incapaces de comprender que la reina ya no mandaba, persiguieron a Darian hasta la cámara abierta. El camino subía en cuatro revueltas, y en cada una esperaba una guardia que había jurado antes de que Maura naciera. Sevrin subía detrás, contando las cadenas que iban a romperse con el sello. La cima estaba cubierta de nieve y no tenía techo: allí no había archivo donde guardar nada."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de montaña. Al frente: Guardián del Sello Roto."
            background="cbm/story/darian_16_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Lleva a tu protagonista al destino señalado con una bandera. Turnos disponibles: 22."
            background="cbm/story/darian_16_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="250"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="yes"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Guardián del Sello Roto"
        type="Dark Sorcerer"
        id="CBM_darian_16_enemy"
        name="Guardián del Sello Roto"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="196"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Lleva a tu protagonista al destino señalado con una bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="9"
            y="15"
            image="items/gohere.png"
        [/item]
        [label]
            x="9"
            y="15"
            text="Destino"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="4"
        [/scroll_to]
        [message]
            message="Cuando lo destruyas, Sevrin podrá descansar. No habrá otra oportunidad de preguntarle nada."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Objetivo: llevad a Darian y el sello hasta la bandera de la cámara abierta, en la cima."
            speaker="narrator"
        [/message]
        [message]
            message="Antes de que subáis, decidme dónde vais a depositar los nombres."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="En las brasas, uno por pueblo. Ninguno irá a un archivo real."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El sello no se destruye: se entrega. Yo soy su último guardián y no reconozco otra reina."
            speaker="CBM_darian_16_enemy"
        [/message]
        [message]
            message="No te pido que reconozcas a nadie. Te pido que dejes pasar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los guardianes juramos antes de que naciera Maura. Un juramento no caduca porque cambie el nombre."
            speaker="CBM_darian_16_enemy"
        [/message]
        [message]
            message="Podemos romperlo delante de ti, para que lo veas. No hace falta que lo creas."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Os acompaño con una condición: si caigo en la subida, no me dejéis convertido en contrato. Devolvedme a la piedra."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Dicho queda. Nadie escribirá tu nombre en un registro."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y si un pueblo decide no recibir brasa, se queda sin ella y sin castigo. Ya lo he visto cumplirse."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="La cámara abierta está en la cima. El Guardián ha apostado esqueletos en cada revuelta del camino."
            speaker="narrator"
        [/message]
        [message]
            message="Subiremos en fila, con el sello delante. Ena, si alguien cae, no te quedes atrás sola."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He sellado el camino bajo. Ahora solo queda la subida, y arriba no hay sombra donde esconderse."
            speaker="CBM_darian_16_enemy"
        [/message]
        [message]
            message="La primera revuelta está cortada. Las otras tres siguen abiertas."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 7"
        [message]
            message="Los esqueletos del sello no atacan a quien no lleva el nombre. Sevrin, camina detrás de mí."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Detrás de ti o delante, da igual. Tampoco a mí me queda sombra."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Un refugio de pastores les deja pasar. No hay peaje: la montaña no pertenece a nadie, dicen."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El Guardián se quedó de pie hasta que el sello tocó la cámara. Entonces se sentó, muy despacio."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Quedan dos turnos antes de que la nieve cierre la cámara."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_hero"
            x="9"
            y="15"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_16_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="42"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_16_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="42"
                    y="25"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="He oído romperse las cadenas de todos los que firmaron como yo. No todas eran de la reina."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Las de la alianza también. Lo escribimos así."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Ya dio su testimonio. No nos debe una eternidad."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="No os debo nada. Pero quiero dejar una última hoja: la lista de los que quedan por liberar."
            speaker="narrator"
            caption="Sevrin"
            image="cbm/portraits/sevrin.png"
        [/message]
        [message]
            message="Darian depositó el sello entre las brasas y la nieve lo cubrió antes del amanecer."
            speaker="narrator"
        [/message]
        [message]
            message="Darian depositó el sello entre las brasas. El último correo de la guerra fue una lista de nombres liberados, enviada a todos los pueblos sin exigir respuesta. Sevrin eligió quedarse en la cámara hasta que la nieve borró el camino, y nadie escribió su nombre en ningún registro."
            speaker="narrator"
        [/message]
        [message]
            message="Las siete brasas no se fundieron en una corona. Cada pueblo conservó una, y el pacto exigía que cualquier decisión pudiera ser rechazada. Darian volvió al camino con una bolsa más ligera: por primera vez llevaba respuestas en vez de ultimátums."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

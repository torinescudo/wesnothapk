[scenario]
    id="CBM_darian_06"
    name="La cuarta brasa"
    next_scenario="CBM_darian_07"
    map_file="darian_06.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Nerea había reunido una flota de puertos libres, pero un almirante imperial cerraba la salida al estrecho. Darian necesitaba despejarlo antes de que llegaran los refugiados del interior. El Almirante del Sello tendía una cadena entre dos fragatas y cobraba un registro de almas por cada bodega. Nerea Vado no prestaba un solo barco sin una cláusula escrita: ninguna nave de la alianza transportaría cautivos, ni vivos ni muertos. La cuarta brasa iba a encenderse en un faro pequeño, con aceite de puerto libre. Para un correo, una flota entera era solo un sobre muy grande: lo que importaba seguía siendo la cláusula escrita dentro. La cadena del estrecho estaba forjada con eslabones de dos tamaños, y los grandes llevaban nombre grabado. Despejar el paso antes del anochecer decidiría si los refugiados del interior entraban en la rada o esperaban otra noche al otro lado del metal."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de costa. Al frente: Almirante del Sello."
            background="cbm/story/darian_06_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 32."
            background="cbm/story/darian_06_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="198"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Almirante del Sello"
        type="Dark Sorcerer"
        id="CBM_darian_06_enemy"
        name="Almirante del Sello"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="136"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.8"
            caution="0.25"
            attack_depth="4"
            leader_value="6"
            village_value="3"
            recruitment_pattern="fighter,archer,fighter,scout"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_06_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Mantén a tu protagonista por encima de la mitad de vida."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [if]
            [variable]
                name="cbm_decide_darian_05_1"
                equals="firmar-reparaciones"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Viniste de coast apostando por Firmaste las reparaciones y cargaste con el plazo de todos. A cambio, el territorio empezó a arreglarse.. Lo que dejaste atrás sigue donde lo dejaste, y pesa."
                [/message]
                [story]
                    [part]
                        [story]
                            text="Por Firmaste las reparaciones y cargaste con el plazo de todos. A cambio, el territorio empezó a arreglarse. llegaste tarde a lo otro. Aun así, lo que elegiste sostiene esta jornada."
                        [/story]
                    [/part]
                [/story]
                [gold]
                    side="1"
                    amount="-20"
                [/gold]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="Viniste de coast apostando por Solo firmaste la tregua y las reparaciones se quedaron en el aire. La paz llegó a medias y se nota.. Lo otro quedó sin quien lo defendiera."
                [/message]
                [story]
                    [part]
                        [story]
                            text="Por Solo firmaste la tregua y las reparaciones se quedaron en el aire. La paz llegó a medias y se nota. ganaste terreno y perdiste lo otro. Aquí se empieza a notar."
                        [/story]
                    [/part]
                [/story]
                [gold]
                    side="1"
                    amount="60"
                [/gold]
            [/else]
        [/if]
    [/event]
    [event]
        name=turn 16
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="fighter"
                    x,y="41,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="28"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="28"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="27"
        [/scroll_to]
        [message]
            message="La capitana exige que ninguna nave de la alianza transporte cautivos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Escribámoslo antes de pedirle un solo barco."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Cada barco de puerto libre navega con el nombre de su capitán y sin registro de carga. Si la alianza transporta cautivos, pierdo la flota entera."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Escribamos esa condición antes de pedir un solo barco."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: derrotad al líder enemigo y abrid la salida al estrecho."
            speaker="narrator"
        [/message]
        [message]
            message="El sello imperial cierra el estrecho. Ningún barco sale sin pagar el registro de almas."
            speaker="CBM_darian_06_enemy"
        [/message]
        [message]
            message="Firmaré la brasa cuando la cláusula figure en la carta: ninguna nave de la alianza lleva cautivos, ni vivos ni muertos."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Los registros de almas se cuentan por familias. Si una nave los transporta, en tierra quedarán los nombres de quienes los esperaban."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Y si un puerto decide no firmar, seguirá siendo puerto libre. Nuestras cartas no bloquean puertos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="He navegado veinte años y nunca vi un convoy sin registro. Enseñadme uno y os creeré."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Empezaremos por tus barcos. Revisa tú misma cada bodega antes de zarpar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El Almirante tiene dos fragatas en la boca del estrecho y una cadena tendida entre ambas."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="La cadena se ancla al faro pequeño. Quien lo apague abre el paso."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="El estrecho es estrecho de verdad: dos barcos de frente y ninguna maniobra. El líder enemigo manda desde la fragata norte."
            speaker="narrator"
        [/message]
        [message]
            message="Si tomamos su nave, el sello cae. Si solo matamos marineros, otro almirante heredará el puesto."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="Cerrad la cadena. Los que no paguen esperarán a la marea, y la marea tarda."
            speaker="CBM_darian_06_enemy"
        [/message]
        [message]
            message="La cadena sube entre las dos fragatas. El paso queda cortado al norte del faro."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Ese muelle era de mi padre. Que nadie lo queme: si arde, la alianza no tendrá dónde descargar."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="El registro de almas mantiene a los muertos de Valdara remando con dueño. Sin registro, la marea devuelve cuerpos sin nombre, y eso es lo que llamáis oscuridad."
            speaker="CBM_darian_06_enemy"
        [/message]
        [message]
            message="El estrecho deja pasar dos barcos de frente y niega toda maniobra: aquí una flota grande estorba más de lo que ayuda."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 7"
        [message]
            message="Las fragatas están separadas. Si atacamos la del norte, la del sur no llegará a tiempo."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entonces atacamos hoy. Mañana estarán unidas otra vez."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="La cadena se iza sola al morir su custodio. Recordadlo cuando otro almirante la tienda."
            speaker="CBM_darian_06_enemy"
        [/message]
        [message]
            message="La cadena cayó al agua y el estrecho quedó abierto de una orilla a otra."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que llegue el convoy de refugiados."
            speaker="narrator"
        [/message]
        [message]
            message="Alzo la cadena antes de la marea. Quien no haya pagado su alma se quedará fuera, y la noche del estrecho no perdona a los que flotan sin nombre."
            speaker="CBM_darian_06_enemy"
        [/message]
        [message]
            message="La cadena se ancla al faro pequeño y el Almirante manda desde la fragata norte. Decidid si soltáis la cadena en el faro o si forzáis la fragata antes de que la del sur cierre el paso."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [have_unit]
                id="CBM_darian_hero"
                formula="hitpoints * 2 < max_hitpoints"
            [/have_unit]
            [then]
                [message]
                    message="Mantén a tu protagonista por encima de la mitad de vida. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="40"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_06_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="40"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El estrecho está abierto. Firmo con tinta común, para que cualquiera pueda leer las condiciones."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Tinta común y copia en cada puerto. Nadie firmará la parte que no haya leído."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La cláusula de los cautivos queda escrita con las palabras de mi padre. Cambiarla exigirá tres puertos, no uno."
            speaker="narrator"
            caption="Nerea"
            image="cbm/portraits/nerea.png"
        [/message]
        [message]
            message="Los refugiados entran en la rada. Ninguna bodega lleva un nombre que no esté en la lista."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="La cuarta brasa se encendió en el faro pequeño, con aceite de puerto libre y una mecha que cualquiera podía apagar."
            speaker="narrator"
        [/message]
        [message]
            message="El estrecho quedó abierto. Nerea firmó con tinta común, para que cualquiera pudiera leer las condiciones. Antes de zarpar hizo revisar cada bodega delante de dos testigos de la alianza, y la cláusula de los cautivos quedó grabada en la piedra del faro pequeño, a la vista de quien llegara a apagarlo. Al amanecer, la cláusula estaba rodeada de nombres que los marineros habían escrito al pie, uno por uno. La quinta brasa no se encendería en ningún puerto: esperaba bajo tierra, en las canteras donde se habían escondido los que no querían volver a empuñar una lanza."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

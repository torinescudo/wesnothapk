[scenario]
    id="CBM_darian_03"
    name="La puerta que escucha"
    next_scenario="CBM_darian_04"
    map_file="darian_03.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La entrada de los litarios solo se abría cuando tres resonadores repetían una petición sin órdenes. Los tasadores imperiales rodeaban el valle para apropiarse de sus cámaras de nacimiento."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Tasador de las Vetas"
        type="Dark Sorcerer"
        id="CBM_darian_03_enemy"
        name="Tasador de las Vetas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="9"
            y="4"
            image="items/brazier.png"
        [/item]
        [label]
            x="9"
            y="4"
            text="Punto 1"
        [/label]
        [item]
            x="23"
            y="8"
            image="items/brazier.png"
        [/item]
        [label]
            x="23"
            y="8"
            text="Punto 2"
        [/label]
        [item]
            x="5"
            y="8"
            image="items/brazier.png"
        [/item]
        [label]
            x="5"
            y="8"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="14"
            y="14"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="14"
                    y="14"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [message]
            speaker="CBM_darian_companion"
            message="Podrías exigir entrada en nombre de la alianza."
        [/message]
        [message]
            speaker="CBM_darian_hero"
            message="Todavía no existe una alianza. Empecemos por pedir permiso."
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="9"
            y="4"
        [/filter]
        [remove_item]
            x="9"
            y="4"
        [/remove_item]
        [item]
            x="9"
            y="4"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="23"
            y="8"
        [/filter]
        [remove_item]
            x="23"
            y="8"
        [/remove_item]
        [item]
            x="23"
            y="8"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="5"
            y="8"
        [/filter]
        [remove_item]
            x="5"
            y="8"
        [/remove_item]
        [item]
            x="5"
            y="8"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [message]
            speaker="narrator"
            message="Punto activado. Progreso: $cbm_points|/3."
        [/message]
        [if]
            [variable]
                name="cbm_points"
                equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="13"
                    y="1"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            speaker="unit"
            message="No podré terminar este camino…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            speaker="unit"
            message="Hasta aquí puedo acompañarte…"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            speaker="narrator"
            message="El plazo se ha agotado antes de completar la misión."
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            speaker="narrator"
            message="Sira abrió la puerta pequeña. Los litarios enviarían guardianes si el pacto reconocía que una montaña podía pertenecer a sus habitantes."
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_03"
    name="La puerta que escucha"
    next_scenario="CBM_darian_04"
    map_file="darian_03.map"
    turns="22"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="La entrada de los litarios solo se abría cuando tres resonadores repetían una petición sin órdenes. Los tasadores imperiales rodeaban el valle para apropiarse de sus cámaras de nacimiento. Sira de las Siete Vetas vigilaba la puerta desde dentro y Tarek del Eco contaba las columnas enemigas desde la ladera. El imperio había tasado la montaña veta por veta y había clavado postes con precios hasta la nieve. Los litarios no pedían ejército: pedían que alguien escuchara tres veces la misma pregunta. Cuando Darian golpeó la puerta, la piedra repitió su pregunta con otra voz, como si la montaña la tradujera antes de contestar. Pedir tres veces lo mismo costaba un tiempo que los postes con precios no iban a devolver, y el Tasador ya subía por el desfiladero con su libro de cifras."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de montaña. Al frente: Tasador de las Vetas."
            background="cbm/story/darian_03_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 22."
            background="cbm/story/darian_03_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        gold="174"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Tasador de las Vetas"
        type="Dark Sorcerer"
        id="CBM_darian_03_enemy"
        name="Tasador de las Vetas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="118"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.5"
            caution="0.4"
            attack_depth="2"
            leader_value="6"
            village_value="2"
            recruitment_pattern="fighter,archer,fighter"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_03_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 18."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="14"
            y="9"
            image="items/brazier.png"
        [/item]
        [label]
            x="14"
            y="9"
            text="Punto 1"
        [/label]
        [item]
            x="26"
            y="13"
            image="items/brazier.png"
        [/item]
        [label]
            x="26"
            y="13"
            text="Punto 2"
        [/label]
        [item]
            x="29"
            y="21"
            image="items/brazier.png"
        [/item]
        [label]
            x="29"
            y="21"
            text="Punto 3"
        [/label]
        [story]
            [part]
                [story]
                    text="La misma puerta desde el otro lado: Darian trae un recado que nadie quiere oír y un plazo que nadie cumplirá."
                [/story]
            [/part]
        [/story]
    [/event]
    [event]
        name=turn 11
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="Spearman"
                    x,y="18,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="18"
            y="22"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="18"
                    y="22"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="18"
            y="21"
        [/scroll_to]
        [message]
            message="Podrías exigir entrada en nombre de la alianza."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Todavía no existe una alianza. Empecemos por pedir permiso."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La puerta repite lo que oye. Si le habláis de ejércitos, os responderá con piedra."
            speaker="narrator"
            caption="Sira"
            image="cbm/portraits/sira.png"
        [/message]
        [message]
            message="Los tres resonadores deben repetir una petición sin órdenes. Si uno solo manda, la puerta se cierra durante un siglo."
            speaker="narrator"
            caption="Tarek"
            image="cbm/portraits/tarek.png"
        [/message]
        [message]
            message="Objetivo: llevad una unidad a cada resonador del valle y activad los tres puntos."
            speaker="narrator"
        [/message]
        [message]
            message="El imperio tasa las vetas de esta montaña. Las cámaras de nacimiento son un yacimiento, y sus habitantes, mineral."
            speaker="CBM_darian_03_enemy"
        [/message]
        [message]
            message="Os dejo pasar con una condición: ninguna de vuestras cartas se leerá dentro de las cámaras. Lo que allí se dice no viaja."
            speaker="narrator"
            caption="Sira"
            image="cbm/portraits/sira.png"
        [/message]
        [message]
            message="Aceptado. Y si alguno de los míos lo olvida, lo atará Sira, no yo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y si mi consejo responde que no a vuestro pacto, ¿volveréis con espadas?"
            speaker="narrator"
            caption="Tarek"
            image="cbm/portraits/tarek.png"
        [/message]
        [message]
            message="Volveré con la misma pregunta. El pacto incluye el derecho a rechazarlo."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los tasadores traen cadenas de medir, no de portar. Aun así vienen armados."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los resonadores están en las laderas. El del este tiene guardia; los otros dos llevan años apagados."
            speaker="narrator"
            caption="Sira"
            image="cbm/portraits/sira.png"
        [/message]
        [message]
            message="Cuando la puerta oiga tres veces la misma petición se abrirá un paso pequeño. No esperéis un ejército: solo cabe una fila."
            speaker="narrator"
            caption="Tarek"
            image="cbm/portraits/tarek.png"
        [/message]
        [message]
            message="El Tasador de las Vetas ya ha clavado sus postes en el valle. Cada poste lleva un número y un precio."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 5"
        [message]
            message="La guardia del este baja hacia el segundo punto. Si llega antes, lo apagará con agua."
            speaker="narrator"
            caption="Tarek"
            image="cbm/portraits/tarek.png"
        [/message]
        [message]
            message="Que llegue tarde. Nosotros vamos por la ladera alta."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="Los postes cayeron y las cadenas de medir quedaron tendidas en la nieve, señalando un valle sin precio."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 20"
        [message]
            message="Quedan dos turnos antes de que el tasador cierre el desfiladero. El último resonador sigue en la ladera."
            speaker="narrator"
        [/message]
        [message]
            message="Cierro el desfiladero con la piedra que os he tasado. Lo que quede dentro del valle se pagará en mineral, como siempre, y el resto será cuestión de contabilidad."
            speaker="CBM_darian_03_enemy"
        [/message]
        [message]
            message="Los tres resonadores están en laderas que no se ven entre sí y el desfiladero se cierra en dos turnos. Decidid quién despierta el del este, con su guardia, y quién reúne los dos que faltan."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="14"
            y="9"
        [/filter]
        [remove_item]
            x="14"
            y="9"
        [/remove_item]
        [item]
            x="14"
            y="9"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="14"
            y="9"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="El primer resonador repite vuestra voz. Ahora la montaña ya sabe que habéis venido."
            speaker="narrator"
            caption="Sira"
            image="cbm/portraits/sira.png"
        [/message]
        [message]
            message="Dos puntos siguen apagados en las laderas del norte y del este."
            speaker="narrator"
        [/message]
        [message]
            message="Cada veta de esta montaña está apuntada con su precio, y por eso la oscuridad no sube de las galerías. Lo que se tasó una vez no se discute dos."
            speaker="CBM_darian_03_enemy"
        [/message]
        [message]
            message="La nieve borra los senderos hasta las rodillas: por la ladera alta se va a medio paso y la guardia del este baja por pista dura."
            speaker="narrator"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="26"
            y="13"
        [/filter]
        [remove_item]
            x="26"
            y="13"
        [/remove_item]
        [item]
            x="26"
            y="13"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="26"
            y="13"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Seguid encendiendo piedras. Cada una que activéis me dice cuánto vale."
            speaker="CBM_darian_03_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="29"
            y="21"
        [/filter]
        [remove_item]
            x="29"
            y="21"
        [/remove_item]
        [item]
            x="29"
            y="21"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="29"
            y="21"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [variable]
                        name="turn_number"
                        numerical_greater_than="18"
                    [/variable]
                    [then]
                        [message]
                            message="Cumple el objetivo antes del turno 18. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="17"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_03_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="17"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 11"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="La puerta pequeña está abierta. Nadie ha tenido que dar una orden."
            speaker="narrator"
            caption="Sira"
            image="cbm/portraits/sira.png"
        [/message]
        [message]
            message="Guardad la carta y contestadla cuando queráis."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los litarios enviarán guardianes si el pacto reconoce que una montaña puede pertenecer a sus habitantes."
            speaker="narrator"
            caption="Sira"
            image="cbm/portraits/sira.png"
        [/message]
        [message]
            message="No hemos jurado nada. Solo hemos escuchado tres veces lo mismo."
            speaker="narrator"
            caption="Tarek"
            image="cbm/portraits/tarek.png"
        [/message]
        [message]
            message="La primera respuesta del valle fue una piedra que repitió, sin cambiar una palabra, la petición de Darian."
            speaker="narrator"
        [/message]
        [message]
            message="Sira abrió la puerta pequeña. Los litarios enviarían guardianes si el pacto reconocía que una montaña podía pertenecer a sus habitantes. Antes de cerrarla, la puerta repitió la petición en la lengua de las vetas, y ninguna de las siete cartas volvió a sonar igual cuando se leyó en voz alta. La cuarta carta esperaba en una ciudad velaria sostenida sobre las mismas acequias de los campos, y su intérprete llevaba días en una jaula junto al canal. Iria no firmaría nada hasta oírla hablar sin cadenas."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

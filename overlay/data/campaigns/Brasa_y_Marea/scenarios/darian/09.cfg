[scenario]
    id="CBM_darian_09"
    name="La sal de los juramentos"
    next_scenario="CBM_darian_10"
    map_file="darian_09.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Tres altares costeros guardaban copias de los contratos funerarios. Disolverlas en agua salada debilitaría la red de Maura. Los guardianes intentaron trasladarlas antes de la llegada de la flota. Cada copia era una lista de nombres atados a un remo, y las tres se repartían entre la isla del faro, la de las aves y la que no tenía nombre. Luar conocía el arrecife mejor que las cartas del imperio, y no guiaba a nadie sin un testigo del agua. El agua entre las piedras del primer altar era clara hasta el fondo, y en el fondo se veía la copia, con los nombres atados a un remo de plomo. Disolver las tres antes de que la niebla cerrara el arrecife decidiría cuántos muertos volvían a llamarse por su nombre. Luar marcó los tres puntos sobre el mapa y no dijo nada más."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de archipiélago. Al frente: Vigía de las Cadenas."
            background="cbm/story/darian_09_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 38."
            background="cbm/story/darian_09_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="222"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Vigía de las Cadenas"
        type="Dark Sorcerer"
        id="CBM_darian_09_enemy"
        name="Vigía de las Cadenas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.35"
            caution="0.55"
            attack_depth="2"
            leader_value="9"
            village_value="2"
            recruitment_pattern="fighter,fighter,archer"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_09_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Conserva al menos 3 aldeas."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
        [item]
            x="18"
            y="16"
            image="items/brazier.png"
        [/item]
        [label]
            x="18"
            y="16"
            text="Punto 1"
        [/label]
        [item]
            x="14"
            y="32"
            image="items/brazier.png"
        [/item]
        [label]
            x="14"
            y="32"
            text="Punto 2"
        [/label]
        [item]
            x="40"
            y="26"
            image="items/brazier.png"
        [/item]
        [label]
            x="40"
            y="26"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="fighter"
                    x,y="49,19"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="5"
            y="18"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="5"
                    y="18"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="5"
            y="17"
        [/scroll_to]
        [message]
            message="Cada sello roto libera una voz. También avisa a la reina de dónde estamos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que escuche cuántas voces ha intentado callar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Las copias están bajo el agua clara. Quien las toque con hierro avisa a la reina."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="Entonces las tocaremos con sal. Luar, marca los tres altares desde el arrecife."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: llevad una unidad a cada uno de los tres altares y activad los tres puntos."
            speaker="narrator"
        [/message]
        [message]
            message="Los contratos funerarios sostienen la flota. Si los disolvéis, los muertos dejarán de remar."
            speaker="CBM_darian_09_enemy"
        [/message]
        [message]
            message="Os guío con una condición: ningún altar se toca sin que un buceador del arrecife lo vea. No quiero otra deuda en mi nombre."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="Aceptada. Iremos con testigos, aunque tardemos más."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Si Luar decide retirarse a mitad de camino, volvemos sin altar y sin reproche."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Sí. La marea no obedece a los pactos, y nosotros tampoco obligamos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los altares están en tres islas: la del faro, la de las aves y la que no tiene nombre."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="La barca del Vigía es ligera y rema en silencio. Ena puede apagar antorchas, no remos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Iremos de isla en isla sin encender nada. Que la sal trabaje de noche."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El Vigía de las Cadenas patrulla en dos barcas ligeras. Los altares se apagan con agua, no con fuego."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Las barcas ligeras se acercan remando en silencio. Si nos ven, no habrá tercera isla."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que remen. Nosotros bajamos al agua y dejamos la barca vacía."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El Vigía cayó entre sus cadenas, y el agua salada terminó de disolver la última copia."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="Quedan dos turnos antes de que suba la niebla. El tercer altar está al este."
            speaker="narrator"
        [/message]
        [message]
            message="Mando mis dos barcas al paso del medio. Sin remos no cruzaréis de noche, y la sal no saca a nadie de un arrecife."
            speaker="CBM_darian_09_enemy"
        [/message]
        [message]
            message="Los altares se tocan con sal, nunca con hierro, y solo uno de los tres tiene refugio si la niebla sube. Elegid qué isla atacáis primero antes de que las barcas del Vigía cierren el paso."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="18"
            y="16"
        [/filter]
        [remove_item]
            x="18"
            y="16"
        [/remove_item]
        [item]
            x="18"
            y="16"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="18"
            y="16"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La primera copia se ha disuelto. He oído a un barquero cantar su propio nombre."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="Dos altares siguen intactos. La niebla se cierra sobre el arrecife."
            speaker="narrator"
        [/message]
        [message]
            message="Los muertos que reman en mis barcas no reman para mí: reman para que la costa tenga flota cuando la oscuridad vuelva del mar."
            speaker="CBM_darian_09_enemy"
        [/message]
        [message]
            message="Entre islas solo hay dos pasos navegables y la marea los cierra dos veces al día: de noche el agua baja y las barcas rozan la roca."
            speaker="narrator"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="14"
            y="32"
        [/filter]
        [remove_item]
            x="14"
            y="32"
        [/remove_item]
        [item]
            x="14"
            y="32"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="14"
            y="32"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Habéis liberado dos. Ahora la reina ya sabe cuántos os quedan."
            speaker="CBM_darian_09_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="40"
            y="26"
        [/filter]
        [remove_item]
            x="40"
            y="26"
        [/remove_item]
        [item]
            x="40"
            y="26"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="40"
            y="26"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [if]
                    [store_locations]
                        terrain="*^V*"
                        owner="1"
                        variable="cbm_villages"
                    [/store_locations]
                    [variable]
                        name="cbm_villages.length"
                        numerical_less_than="3"
                    [/variable]
                    [then]
                        [message]
                            message="Conserva al menos 3 aldeas. La condición se ha incumplido."
                            speaker="narrator"
                        [/message]
                        [endlevel]
                            result="defeat"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/then]
                    [else]
                        [endlevel]
                            result="victory"
                            bonus="yes"
                            carryover_percentage="40"
                            carryover_add="yes"
                        [/endlevel]
                    [/else]
                [/if]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="48"
                    y="17"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="48"
                    y="17"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las tres copias están rotas. Los muertos han señalado caminos que no conocíamos."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="¿Caminos hacia dónde?"
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Hacia los puertos donde cargan a los nuevos cautivos. Los dibujo en tu mapa con tinta de arrecife."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="La reina ya sabe dónde estamos. Lo sabía desde el primer sello."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los liberados no pidieron venganza. Pidieron que sus nombres se escribieran en la lista de los vivos."
            speaker="narrator"
        [/message]
        [message]
            message="Los muertos liberados señalaron los caminos por los que eran transportados los nuevos cautivos. Darian los copió en su mapa antes de que la sal borrara las rutas, y Luar exigió que cada trazo llevara el nombre del buceador que lo había visto. Dos de los trazos quedaron sin nombre porque nadie había bajado hasta ellos, y Luar los dejó en blanco. La siguiente entrega pesaba más que las siete cartas juntas: un registro de once mil condenados, copiado a mano por una escribana que no dormía."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

[scenario]
    id="CBM_darian_09"
    name="La sal de los juramentos"
    next_scenario="CBM_darian_10"
    map_file="darian_09.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Tres altares costeros guardaban copias de los contratos funerarios. Disolverlas en agua salada debilitaría la red de Maura. Los guardianes intentaron trasladarlas antes de la llegada de la flota. Cada copia era una lista de nombres atados a un remo, y las tres se repartían entre la isla del faro, la de las aves y la que no tenía nombre. Luar conocía el arrecife mejor que las cartas del imperio, y no guiaba a nadie sin un testigo del agua."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de archipiélago. Al frente: Vigía de las Cadenas."
            background="cbm/story/darian_09_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Activa los tres puntos señalados llevando una unidad a cada uno. Turnos disponibles: 32."
            background="cbm/story/darian_09_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="222"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Vigía de las Cadenas"
        type="Dark Sorcerer"
        id="CBM_darian_09_enemy"
        name="Vigía de las Cadenas"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="154"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="13"
            y="9"
            image="items/brazier.png"
        [/item]
        [label]
            x="13"
            y="9"
            text="Punto 1"
        [/label]
        [item]
            x="28"
            y="24"
            image="items/brazier.png"
        [/item]
        [label]
            x="28"
            y="24"
            text="Punto 2"
        [/label]
        [item]
            x="32"
            y="19"
            image="items/brazier.png"
        [/item]
        [label]
            x="32"
            y="19"
            text="Punto 3"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="4"
            y="16"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="4"
                    y="16"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="4"
            y="15"
        [/scroll_to]
        [message]
            message="Cada sello roto libera una voz. También avisa a la reina de dónde estamos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que escuche cuántas voces ha intentado callar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Las copias están bajo el agua clara. Quien las toque con hierro avisa a la reina."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="Entonces las tocaremos con sal. Luar, marca los tres altares desde el arrecife."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: llevad una unidad a cada uno de los tres altares y activad los tres puntos."
            speaker="narrator"
        [/message]
        [message]
            message="Los contratos funerarios sostienen la flota. Si los disolvéis, los muertos dejarán de remar."
            speaker="CBM_darian_09_enemy"
        [/message]
        [message]
            message="Os guío con una condición: ningún altar se toca sin que un buceador del arrecife lo vea. No quiero otra deuda en mi nombre."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="Aceptada. Iremos con testigos, aunque tardemos más."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Si Luar decide retirarse a mitad de camino, volvemos sin altar y sin reproche."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Sí. La marea no obedece a los pactos, y nosotros tampoco obligamos."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los altares están en tres islas: la del faro, la de las aves y la que no tiene nombre."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="La barca del Vigía es ligera y rema en silencio. Ena puede apagar antorchas, no remos."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Iremos de isla en isla sin encender nada. Que la sal trabaje de noche."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El Vigía de las Cadenas patrulla en dos barcas ligeras. Los altares se apagan con agua, no con fuego."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 6"
        [message]
            message="Las barcas ligeras se acercan remando en silencio. Si nos ven, no habrá tercera isla."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que remen. Nosotros bajamos al agua y dejamos la barca vacía."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El Vigía cayó entre sus cadenas, y el agua salada terminó de disolver la última copia."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que suba la niebla. El tercer altar está al este."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="13"
            y="9"
        [/filter]
        [remove_item]
            x="13"
            y="9"
        [/remove_item]
        [item]
            x="13"
            y="9"
            image="items/brazier-lit1.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="13"
            y="9"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="La primera copia se ha disuelto. He oído a un barquero cantar su propio nombre."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="Dos altares siguen intactos. La niebla se cierra sobre el arrecife."
            speaker="narrator"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="28"
            y="24"
        [/filter]
        [remove_item]
            x="28"
            y="24"
        [/remove_item]
        [item]
            x="28"
            y="24"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="28"
            y="24"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [message]
            message="Habéis liberado dos. Ahora la reina ya sabe cuántos os quedan."
            speaker="CBM_darian_09_enemy"
        [/message]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="32"
            y="19"
        [/filter]
        [remove_item]
            x="32"
            y="19"
        [/remove_item]
        [item]
            x="32"
            y="19"
            image="items/brazier-lit2.png"
        [/item]
        {VARIABLE_OP cbm_points add 1}
        [scroll_to]
            x="32"
            y="19"
        [/scroll_to]
        [sound]
            name="fire.wav"
        [/sound]
        [objectives]
            side="1"
            [objective]
                description="Activa los tres puntos señalados llevando una unidad a cada uno."
                condition="win"
            [/objective]
            [note]
                description="Puntos activados: $cbm_points|/3."
            [/note]
        [/objectives]
        [if]
            [variable]
                name="cbm_points"
                numerical_equals="3"
            [/variable]
            [then]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="36"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_09_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="36"
                    y="14"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Las tres copias están rotas. Los muertos han señalado caminos que no conocíamos."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="¿Caminos hacia dónde?"
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Hacia los puertos donde cargan a los nuevos cautivos. Los dibujo en tu mapa con tinta de arrecife."
            speaker="narrator"
            caption="Luar"
            image="cbm/portraits/luar.png"
        [/message]
        [message]
            message="La reina ya sabe dónde estamos. Lo sabía desde el primer sello."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los liberados no pidieron venganza. Pidieron que sus nombres se escribieran en la lista de los vivos."
            speaker="narrator"
        [/message]
        [message]
            message="Los muertos liberados señalaron los caminos por los que eran transportados los nuevos cautivos. Darian los copió en su mapa antes de que la sal borrara las rutas, y Luar exigió que cada trazo llevara el nombre del buceador que lo había visto."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

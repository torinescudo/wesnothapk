[scenario]
    id="CBM_darian_08"
    name="El mensajero de hueso"
    next_scenario="CBM_darian_09"
    map_file="darian_08.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="Sevrin había logrado enviar una petición de auxilio desde los archivos de Maura. La guardia lo encadenó a su propio contrato para impedir otra fuga. Liberarlo revelaría cómo romper el sello central. El archivo guardaba los contratos funerarios por orden de firma, y el suyo era el número doscientos. El Custodio lo llamaba prisionero voluntario y repetía que un contrato firmado no se rompe, se cumple. Darian necesitaba su testimonio, no su arrepentimiento."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de ruinas. Al frente: Custodio del Archivo."
            background="cbm/story/darian_08_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera. Turnos disponibles: 32."
            background="cbm/story/darian_08_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="214"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Custodio del Archivo"
        type="Dark Sorcerer"
        id="CBM_darian_08_enemy"
        name="Custodio del Archivo"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat"
        gold="148"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Llega con cualquier unidad a la prisión y escolta a la persona liberada hasta la bandera."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de la persona protegida"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        [item]
            x="18"
            y="19"
            image="items/gohere.png"
        [/item]
        [label]
            x="18"
            y="19"
            text="Destino"
        [/label]
        [item]
            x="3"
            y="16"
            image="items/cage.png"
        [/item]
        [label]
            x="3"
            y="16"
            text="Prisión"
        [/label]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="3"
            y="5"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="3"
                    y="5"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="3"
            y="4"
        [/scroll_to]
        [message]
            message="Ha dirigido ejércitos contra todos nuestros aliados."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Tendrá que responder por ello. Primero debe poder elegir sus respuestas."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: alcanzad la prisión del archivo, liberad a Sevrin y escoltadlo hasta la bandera."
            speaker="narrator"
        [/message]
        [message]
            message="El prisionero firmó un contrato voluntario. Un contrato voluntario no se rompe: se cumple."
            speaker="CBM_darian_08_enemy"
        [/message]
        [message]
            message="Enséñame su letra. Si firmó voluntariamente, no le costará reconocerla."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No os acerquéis a la reja sin mirar las cadenas. Están atadas a un libro, no a la pared."
            speaker="CBM_darian_08_protected"
        [/message]
        [message]
            message="Entonces liberaremos libro y prisionero a la vez."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Acepto salir con vosotros con una condición: si el archivo os pide algo a cambio, podéis negaros. Esa es la única regla del pacto, y también me protege a mí."
            speaker="CBM_darian_08_protected"
        [/message]
        [message]
            message="Las cadenas funerarias tiran del contrato. Cortar el contrato no corta la cadena."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="El archivo tiene tres salas. Sevrin está en la tercera, encadenado al armario de los registros."
            speaker="narrator"
        [/message]
        [message]
            message="Entra por el sur con dos hombres. Yo distraeré a los custodios con preguntas que no pueden contestar."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Si tardo en andar, no me dejéis atrás sin cortar antes el libro."
            speaker="CBM_darian_08_protected"
        [/message]
        [message]
            message="Los custodios no llevan armas de filo: llevan sellos, tinta y llaves de hierro viejo."
            speaker="narrator"
        [/message]
        [message]
            message="Que nadie queme un solo legajo. Los nombres que hay aquí también son pruebas."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="attack end"
        [filter]
            id="CBM_darian_08_protected"
            formula="hitpoints * 2 < max_hitpoints"
        [/filter]
        [message]
            message="Corta el libro, no la cadena. La cadena me sostiene de pie."
            speaker="CBM_darian_08_protected"
        [/message]
        [message]
            message="Ena, cúralo. Yo corto el libro con la mano libre."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He quemado el índice. Ahora nadie sabrá nunca cuántos nombres faltan."
            speaker="CBM_darian_08_enemy"
        [/message]
        [message]
            message="El humo sale por la ventana del sur. Los contratos del fondo se salvaron."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="La primera sala tomada conserva los anaqueles intactos. Los guardianes huyen de la tinta, no del fuego."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El contrato se partió en el suelo del archivo. La cadena cayó con él, sin arrastrar a nadie."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que sellen la tercera sala. La bandera está en el patio exterior."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            side="1"
            x="3"
            y="16"
        [/filter]
        [remove_item]
            x="3"
            y="16"
        [/remove_item]
        [unit]
            type="Deathblade"
            id="CBM_darian_08_protected"
            name="Sevrin"
            side="1"
            x="3"
            y="17"
            random_traits="no"
            max_hitpoints="36"
            hitpoints="36"
            max_moves="5"
            moves="5"
            {IS_LOYAL}
        [/unit]
        {VARIABLE cbm_rescued yes}
        [sound]
            name="rumble.ogg"
        [/sound]
        [message]
            message="La puerta está abierta. Acompañadme hasta la bandera; no podré llegar sin ayuda."
            speaker="CBM_darian_08_protected"
        [/message]
    [/event]
    [event]
        name="moveto"
        [filter]
            id="CBM_darian_08_protected"
            x="18"
            y="19"
        [/filter]
        [sound]
            name="gold.ogg"
        [/sound]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_08_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="34"
                    y="21"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_08_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Skeleton"
                    side="2"
                    x="34"
                    y="21"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="die"
        [filter]
            id="CBM_darian_08_protected"
        [/filter]
        [message]
            message="La persona que debías proteger ha muerto. La misión ha fracasado."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="El nombre verdadero del sello lo escribiré yo, y lo firmo aquí mismo."
            speaker="CBM_darian_08_protected"
        [/message]
        [message]
            message="Lo escribiremos. Y no pediremos absolución por ti."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="No la quiero. Quiero que mi testimonio incluya todo lo que hice, no solo lo que sirve."
            speaker="CBM_darian_08_protected"
        [/message]
        [message]
            message="La venganza era fácil. Escucharle está siendo peor."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Sevrin escribió dos páginas: una con lo que sabía del sello y otra con su propia lista de muertos."
            speaker="narrator"
        [/message]
        [message]
            message="Sevrin entregó el nombre verdadero del sello. No pidió absolución; pidió que su testimonio incluyera todo lo que había hecho. Darian guardó las dos páginas en la misma funda, para que nadie pudiera leer la primera sin la segunda."
            speaker="narrator"
        [/message]
        [kill]
            id="CBM_darian_08_protected"
            animate="no"
            fire_event="no"
        [/kill]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

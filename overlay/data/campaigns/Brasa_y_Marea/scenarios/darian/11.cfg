[scenario]
    id="CBM_darian_11"
    name="Un ejército de vecinos"
    next_scenario="CBM_darian_12"
    map_file="darian_11.map"
    turns="32"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El mariscal concentró sus tropas en el granero central. La alianza debía tomarlo para alimentar a los barrios rebeldes, manteniendo abiertas las rutas de quienes no participaban en la guerra. Cuatrocientas familias habían traído carros y ochenta lanzas; el mariscal tenía veteranos pagados y las llaves del grano. Los delegados discutían todavía quién repartiría la primera ración. Darian necesitaba una victoria que nadie pudiera cobrar en nombre de otro."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de llanura. Al frente: Mariscal de Ceniza."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 32."
            background="cbm/portraits/darian.png~SCALE(1024,512)"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="238"
        income="3"
        village_gold="2"
        fog="no"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Mariscal de Ceniza"
        type="Dark Sorcerer"
        id="CBM_darian_11_enemy"
        name="Mariscal de Ceniza"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="166"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.6"
            caution="0.25"
            passive_leader="yes"
        [/ai]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Mas."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="19"
            y="31"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="19"
                    y="31"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="19"
            y="30"
        [/scroll_to]
        [message]
            message="Tenemos soldados de pueblos que hace un año se atacaban entre sí."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Hoy comparten una tarea. La confianza vendrá de cumplirla."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Tenemos cuatrocientos vecinos y ochenta lanzas. Los cuatrocientos saben dónde está el grano."
            speaker="narrator"
            caption="Osk"
        [/message]
        [message]
            message="Entonces manda el grano. Objetivo claro: tomad el granero central y derribad al mariscal."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: derrotad al líder enemigo. El granero central es su puesto de mando."
            speaker="narrator"
        [/message]
        [message]
            message="Este granero alimenta tres provincias. Si lo tomáis, las tres se morirán de hambre por vuestra culpa."
            speaker="CBM_darian_11_enemy"
        [/message]
        [message]
            message="Marchamos con una condición: ninguna aldea decide la ración de otra. Ni la vuestra."
            speaker="narrator"
            caption="Vesh"
        [/message]
        [message]
            message="Escrito queda. El reparto lo fija una asamblea de aldeas, con o sin nosotros."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y la aldea que no quiera dar carros, no los dará. Iremos más despacio, nada más."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los mariscales cuentan con la deserción. Cuando falta el grano, se van solos."
            speaker="narrator"
            caption="Osk"
        [/message]
        [message]
            message="Que se vayan. No vamos a perseguir a quien deje la lanza."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El mariscal tiene ballesteros en el tejado y un carro blindado junto a la puerta norte."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entramos por la puerta sur, que da al mercado. Allí no puede disparar sin matar a su propia gente."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los carros de grano esperan bajo el cobertizo. La bandera del mariscal ondea sobre el tejado."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He repartido el grano entre mis veteranos. Que los vecinos aprendan cuánto vale una ración."
            speaker="CBM_darian_11_enemy"
        [/message]
        [message]
            message="Los veteranos cobran en sacos. Los vecinos siguen esperando en la puerta sur."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Esa aldea nos ha dado agua sin pedir nada. Devolvedle el doble y anotadlo."
            speaker="narrator"
            caption="Vesh"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Los vecinos empiezan a reconocerse entre las filas enemigas. Algunos bajan las lanzas."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que bajen. Que nadie les pida explicaciones."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El mariscal cayó en el tejado del granero. Los carros siguieron cargados hasta el mediodía."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 30"
        [message]
            message="Quedan dos turnos antes de que el mariscal queme el granero."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposicion se ha roto."
            speaker="narrator"
        [/message]
        [endlevel]
            result="victory"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_11_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="18"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_11_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="18"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 16"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podre terminar este camino..."
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aqui puedo acompanarte..."
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la mision."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los carros están llenos y las escoltas son mixtas. Nadie ha recibido permiso para decidir la ración de otro."
            speaker="narrator"
            caption="Osk"
        [/message]
        [message]
            message="Que salgan de noche y por caminos distintos. Si alguien ataca un carro, no sabrá a quién pertenece."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La asamblea de aldeas se reúne mañana. Yo llevo la balanza, no la espada."
            speaker="narrator"
            caption="Vesh"
        [/message]
        [message]
            message="Hace un año estas mismas aldeas se atacaban entre sí."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los carros salieron al anochecer, cada uno con dos banderas y ninguna autoridad sobre los demás."
            speaker="narrator"
        [/message]
        [message]
            message="Los carros de grano salieron con escoltas mezcladas. Ningún pueblo recibió permiso para decidir la ración de otro. La asamblea se reunió bajo el cobertizo y acordó que la balanza viajara cada mes a una aldea distinta, para que nadie pesara siempre en su propia casa."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]

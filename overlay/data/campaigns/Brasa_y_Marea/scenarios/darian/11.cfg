[scenario]
    id="CBM_darian_11"
    name="Un ejército de vecinos"
    next_scenario="CBM_darian_12"
    map_file="darian_11.map"
    turns="38"
    victory_when_enemies_defeated="no"
    experience_modifier="85"
    {DEFAULT_SCHEDULE}
    [music]
        name="cbm/darian-journey.ogg"
        ms_after="2000"
    [/music]
    [music]
        name="cbm/darian-battle.ogg"
        append="yes"
        ms_after="2000"
    [/music]
    [story]
        [part]
            story="El mariscal concentró sus tropas en el granero central. La alianza debía tomarlo para alimentar a los barrios rebeldes, manteniendo abiertas las rutas de quienes no participaban en la guerra. Cuatrocientas familias habían traído carros y ochenta lanzas; el mariscal tenía veteranos pagados y las llaves del grano. Los delegados discutían todavía quién repartiría la primera ración. Darian necesitaba una victoria que nadie pudiera cobrar en nombre de otro. Para un correo, repartir no es dar: es llegar a cada puerta con lo suyo, y Darian llevaba nueve años aprendiéndolo en caminos peores. Bajo el cobertizo, la primera ración seguía sin repartirse: cuatrocientas familias miraban una balanza sin mano que la sostuviera. Tomar el granero antes del anochecer decidiría si la victoria acababa con otro dueño del hambre."
            background="cbm/portraits/darian.png~SCALE(540,810)"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Terreno de llanura. Al frente: Mariscal de Ceniza."
            background="cbm/story/darian_11_1.jpg"
            scale_background="no"
        [/part]
    [/story]
    [story]
        [part]
            story="Objetivo: Derrota al líder enemigo. Turnos disponibles: 38."
            background="cbm/story/darian_11_2.jpg"
            scale_background="no"
        [/part]
    [/story]
    [side]
        side="1"
        controller="human"
        team_name="pacto"
        user_team_name="Darian de Linde"
        id="CBM_darian_hero"
        name="Darian de Linde"
        type="CBM Hero darian"
        canrecruit="yes"
        unrenamable="yes"
        recruit="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        gold="238"
        income="3"
        village_gold="2"
        fog="yes"
        shroud="no"
        save_id="CBM_darian_army"
    [/side]
    [side]
        side="2"
        controller="ai"
        team_name="oposicion"
        user_team_name="Mariscal de Ceniza"
        type="Dark Sorcerer"
        id="CBM_darian_11_enemy"
        name="Mariscal de Ceniza"
        canrecruit="yes"
        recruit="Skeleton,Skeleton Archer,Ghoul,Vampire Bat,Revenant"
        gold="166"
        income="2"
        village_gold="2"
        [ai]
            aggression="0.8"
            caution="0.25"
            attack_depth="4"
            leader_value="6"
            village_value="3"
            recruitment_pattern="fighter,archer,fighter,scout"
        [/ai]
        [goal]
            name="Proteger al líder"
            value="100000"
            [criteria]
                id="CBM_darian_11_enemy"
            [/criteria]
        [/goal]
        [goal]
            name="Alcanzar al protagonista"
            value="20000"
            [criteria]
                id="CBM_darian_hero"
            [/criteria]
        [/goal]
    [/side]
    [event]
        name="prestart"
        [objectives]
            side="1"
            [objective]
                description="Derrota al líder enemigo."
                condition="win"
            [/objective]
            [objective]
                description="Muerte de Darian de Linde"
                condition="lose"
            [/objective]
            [objective]
                description="Muerte de Ena"
                condition="lose"
            [/objective]
            [objective]
                description="Se agotan los turnos"
                condition="lose"
            [/objective]
            [gold_carryover]
                bonus="yes"
                carryover_percentage="40"
            [/gold_carryover]
            [note]
                description="Cumple el objetivo antes del turno 34."
            [/note]
            [note]
                description="Toca una casilla para preparar el movimiento y pulsa Mover/atacar. Puedes revisar estos objetivos desde Más."
            [/note]
        [/objectives]
        [allow_recruit]
            side="1"
            type="Spearman,Bowman,Mage,Elvish Fighter,Elvish Shaman,CBM Litario Guardian,CBM Litario Tejedor,CBM Velario Lancero,CBM Velario Cantor"
        [/allow_recruit]
        {VARIABLE cbm_points 0}
        {VARIABLE cbm_rescued no}
        {VARIABLE cbm_losses 0}
    [/event]
    [event]
        name=turn 19
        [if]
            [variable]
                name="cbm_points"
                greater_than_equal_to="3"
            [/variable]
            [then]
                [message]
                    speaker="narrator"
                    message="Tu avance les ha llegado: el enemigo manda refuerzos hacia donde estás."
                [/message]
                [unit]
                    side="2"
                    type="fighter"
                    x,y="26,4"
                    placement="map"
                [/unit]
            [/then]
            [else]
                [message]
                    speaker="narrator"
                    message="No has movido el tablero y el enemigo lo aprovecha: se cierra y espera tu error."
                [/message]
            [/else]
        [/if]
    [/event]
    [event]
        name="start"
        [recall]
            id="CBM_darian_companion"
            x="26"
            y="32"
        [/recall]
        [if]
            [have_unit]
                id="CBM_darian_companion"
            [/have_unit]
            [else]
                [unit]
                    type="White Mage"
                    id="CBM_darian_companion"
                    name="Ena"
                    side="1"
                    x="26"
                    y="32"
                    unrenamable="yes"
                    {IS_LOYAL}
                [/unit]
            [/else]
        [/if]
        [scroll_to]
            x="26"
            y="31"
        [/scroll_to]
        [message]
            message="Tenemos soldados de pueblos que hace un año se atacaban entre sí."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Hoy comparten una tarea. La confianza vendrá de cumplirla."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Tenemos cuatrocientos vecinos y ochenta lanzas. Los cuatrocientos saben dónde está el grano."
            speaker="narrator"
            caption="Osk"
            image="cbm/portraits/osk.png"
        [/message]
        [message]
            message="Entonces manda el grano. Objetivo claro: tomad el granero central y derribad al mariscal."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Objetivo: derrotad al líder enemigo. El granero central es su puesto de mando."
            speaker="narrator"
        [/message]
        [message]
            message="Este granero alimenta tres provincias. Si lo tomáis, las tres se morirán de hambre por vuestra culpa."
            speaker="CBM_darian_11_enemy"
        [/message]
        [message]
            message="Marchamos con una condición: ninguna aldea decide la ración de otra. Ni la vuestra."
            speaker="narrator"
            caption="Vesh"
            image="cbm/portraits/vesh.png"
        [/message]
        [message]
            message="Escrito queda. El reparto lo fija una asamblea de aldeas, con o sin nosotros."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Y la aldea que no quiera dar carros, no los dará. Iremos más despacio, nada más."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los mariscales cuentan con la deserción. Cuando falta el grano, se van solos."
            speaker="narrator"
            caption="Osk"
            image="cbm/portraits/osk.png"
        [/message]
        [message]
            message="Que se vayan. No vamos a perseguir a quien deje la lanza."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="El mariscal tiene ballesteros en el tejado y un carro blindado junto a la puerta norte."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Entramos por la puerta sur, que da al mercado. Allí no puede disparar sin matar a su propia gente."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="Los carros de grano esperan bajo el cobertizo. La bandera del mariscal ondea sobre el tejado."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 4"
        [message]
            message="He repartido el grano entre mis veteranos. Que los vecinos aprendan cuánto vale una ración."
            speaker="CBM_darian_11_enemy"
        [/message]
        [message]
            message="Los veteranos cobran en sacos. Los vecinos siguen esperando en la puerta sur."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="capture"
        [filter]
            side="1"
        [/filter]
        [message]
            message="Esa aldea nos ha dado agua sin pedir nada. Devolvedle el doble y anotadlo."
            speaker="narrator"
            caption="Vesh"
            image="cbm/portraits/vesh.png"
        [/message]
        [message]
            message="Ordené este granero cuando las tres provincias comían raíces. Repartid el grano hoy y la oscuridad volverá a sentarse a vuestra mesa el invierno que viene."
            speaker="CBM_darian_11_enemy"
        [/message]
        [message]
            message="El granero se levanta sobre el mercado y su tejado manda sobre las cuatro calles: por la puerta del sur no se puede disparar sin barrer la plaza, pero subir cuesta una escalera estrecha."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 8"
        [message]
            message="Los vecinos empiezan a reconocerse entre las filas enemigas. Algunos bajan las lanzas."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Que bajen. Que nadie les pida explicaciones."
            speaker="CBM_darian_hero"
        [/message]
    [/event]
    [event]
        name="die"
        [filter]
            side="2"
            canrecruit="yes"
        [/filter]
        [message]
            message="El mariscal cayó en el tejado del granero. Los carros siguieron cargados hasta el mediodía."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="turn 36"
        [message]
            message="Quedan dos turnos antes de que el mariscal queme el granero."
            speaker="narrator"
        [/message]
        [message]
            message="He untado de pez los carros del cobertizo. Si sigo retrocediendo, quemaréis el grano defendiéndolo y vuestra asamblea cenará ceniza."
            speaker="CBM_darian_11_enemy"
        [/message]
        [message]
            message="Los ballesteros del tejado y el carro blindado de la puerta norte quieren empujaros al mercado para cobraros cara cada vara. Decidid si tomáis la escalera del tejado o la puerta antes de que suba la pez."
            speaker="narrator"
        [/message]
    [/event]
    [event]
        name="enemies defeated"
        [message]
            message="La oposición se ha roto."
            speaker="narrator"
        [/message]
        [if]
            [variable]
                name="turn_number"
                numerical_greater_than="34"
            [/variable]
            [then]
                [message]
                    message="Cumple el objetivo antes del turno 34. La condición se ha incumplido."
                    speaker="narrator"
                [/message]
                [endlevel]
                    result="defeat"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/then]
            [else]
                [endlevel]
                    result="victory"
                    bonus="yes"
                    carryover_percentage="40"
                    carryover_add="yes"
                [/endlevel]
            [/else]
        [/if]
    [/event]
    [event]
        name="turn 4"
        [if]
            [have_unit]
                id="CBM_darian_11_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Revenant"
                    side="2"
                    x="25"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 8"
        [if]
            [have_unit]
                id="CBM_darian_11_enemy"
            [/have_unit]
            [then]
                [unit]
                    type="Vampire Bat"
                    side="2"
                    x="25"
                    y="2"
                [/unit]
            [/then]
        [/if]
    [/event]
    [event]
        name="turn 19"
        [modify_side]
            side="2"
            income="4"
            [ai]
                aggression="0.8"
                caution="0.15"
            [/ai]
        [/modify_side]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_hero"
        [/filter]
        [message]
            message="No podré terminar este camino…"
            speaker="CBM_darian_hero"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="last breath"
        [filter]
            id="CBM_darian_companion"
        [/filter]
        [message]
            message="Hasta aquí puedo acompañarte…"
            speaker="CBM_darian_companion"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="time over"
        [message]
            message="El plazo se ha agotado antes de completar la misión."
            speaker="narrator"
        [/message]
        [endlevel]
            result="defeat"
            bonus="yes"
            carryover_percentage="40"
            carryover_add="yes"
        [/endlevel]
    [/event]
    [event]
        name="victory"
        [message]
            message="Los carros están llenos y las escoltas son mixtas. Nadie ha recibido permiso para decidir la ración de otro."
            speaker="narrator"
            caption="Osk"
            image="cbm/portraits/osk.png"
        [/message]
        [message]
            message="Que salgan de noche y por caminos distintos. Si alguien ataca un carro, no sabrá a quién pertenece."
            speaker="CBM_darian_hero"
        [/message]
        [message]
            message="La asamblea de aldeas se reúne mañana. Yo llevo la balanza, no la espada."
            speaker="narrator"
            caption="Vesh"
            image="cbm/portraits/vesh.png"
        [/message]
        [message]
            message="Hace un año estas mismas aldeas se atacaban entre sí."
            speaker="CBM_darian_companion"
        [/message]
        [message]
            message="Los carros salieron al anochecer, cada uno con dos banderas y ninguna autoridad sobre los demás."
            speaker="narrator"
        [/message]
        [message]
            message="Los carros de grano salieron con escoltas mezcladas. Ningún pueblo recibió permiso para decidir la ración de otro. La asamblea se reunió bajo el cobertizo y acordó que la balanza viajara cada mes a una aldea distinta, para que nadie pesara siempre en su propia casa. La balanza viajó esa misma noche en un carro sin bandera. Antes de que la séptima brasa se decidiera, llegaron al campamento dos órdenes distintas, cada una con un sello que parecía verdadero."
            speaker="narrator"
        [/message]
        {CLEAR_VARIABLE cbm_points,cbm_rescued}
    [/event]
[/scenario]
